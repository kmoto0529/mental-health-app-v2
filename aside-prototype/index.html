function scPlans(track) { return track === 'phone' ? SC_PHONE_PLANS : SC_SLEEP_PLANS; }
function scPlan(track, id) { return scPlans(track).find(p => p.id === id); }
function scTrack() { return (stimulusSession && stimulusSession.track) || 'sleep'; }
function scMeta(track) { return SC_TRACK_META[track] || SC_TRACK_META.sleep; }

// ワーク開始：最初の画面（Step 0 系統選択）へ直接遷移
function startStimulus() {
  newStimulusSession();   // step:'about'（不眠/スマホ 選択画面）でセッション生成
  go('stimulus');
}

// 新規セッション：Step 0（系統選択）から開始
function newStimulusSession() {
  stimulusSession = {
    id: 'sc-' + Date.now(),
    createdAt: new Date().toISOString(),
    mode: 'first',
    track: null,            // 'sleep' | 'phone'（Step0で確定）
    step: 'about',
    check: {},              // 系統別の初期チェック入力
    loopSeen: false,
    aiPlans: { candidates: [], loading: false },
    selectedPlanId: '',     // 1つだけ選ぶ
    checkins: [],           // [{ date, result, ...metrics }]
    weeklyComment: '',
    status: 'draft',        // draft → active（系統確定後）→ completed/paused
  };
  render();
}

function cancelStimulus() {
  stimulusSession = null;
  go('kizuki');
}

// 進行中セッションを state に upsert（§6 取り組み中ワーク表示のため active を永続化）
function persistStimulusSession() {
  if (!stimulusSession || !stimulusSession.id || !stimulusSession.track) return;
  const snap = JSON.parse(JSON.stringify(stimulusSession));
  delete snap.step;
  snap.lastActionAt = new Date().toISOString();
  const list = state.stimulusControlSessions = state.stimulusControlSessions || [];
  const idx = list.findIndex(e => e.id === snap.id);
  if (idx >= 0) list[idx] = Object.assign({}, list[idx], snap);
  else list.unshift(snap);
  saveState();
}

// 系統を確定して active 化
function selectStimulusTrack(track) {
  if (!stimulusSession) return;
  stimulusSession.track = track;
  stimulusSession.status = 'active';
  stimulusSession.step = 'check';
  persistStimulusSession();
  render();
}

// 完了（週次レポート → 完了）
function completeStimulus() {
  if (!stimulusSession || !stimulusSession.id) return;
  stimulusSession.completedAt = new Date().toISOString();
  stimulusSession.status = 'completed';
  persistStimulusSession();
  stimulusSession = null;
  go('kizuki');   // 完了後はきづきタブへ（最近のきろくに反映）
}

// 既存 active セッションを読み込んで再訪フローを開始（§6カードから）
function resumeStimulusSession(id) {
  const rec = (state.stimulusControlSessions || []).find(s => s.id === id);
  if (!rec) { go('kizuki'); return; }
  stimulusSession = JSON.parse(JSON.stringify(rec));
  stimulusSession.mode = 'revisit';
  stimulusSession.step = scResumeStep(rec);
  go('stimulus');
}

// 再訪時の起点ステップ判定（設計 §6.4）
function scResumeStep(rec) {
  // 直近チェックインが完了済みなら「今日のプラン確認」、未完なら翌朝チェック
  return 'r-morning';
}

// ----- AIプラン詳細生成（5固定プランの desc を系統別に動的生成） -----
// プランの順序・タイトル・doList は画像準拠で固定。AI は各プランの desc（補足説明）を生成。
async function generateStimulusPlansAI() {
  if (!stimulusSession) return;
  const track = scTrack();
  stimulusSession.aiPlans.loading = true;
  stimulusSession.step = 'analyzing';
  render();

  const basePlans = scPlans(track).map(p => ({ id: p.id, icon: p.icon, title: p.title, sub: p.sub || '', desc: p.sub || '', doList: p.doList }));
  const def = AI_PROMPTS[track === 'phone' ? 'stimulus_control_phone_plans' : 'stimulus_control_sleep_plans'];
  let enriched = null;
  if (def && getInviteCode()) {
    const userMsg = scBuildPlanPromptUser(track);
    try {
      const text = await callGemini(def.systemPrompt, [{ role: 'user', content: userMsg }], {
        temperature: def.temperature, maxTokens: def.maxTokens,
      });
      enriched = parseStimulusPlansJson(text);
    } catch (e) { console.warn('[sc-plans]', e); }
  }
  // AI結果（id一致）で desc を上書き。失敗時は sub をそのまま使う
  if (enriched && enriched.length) {
    basePlans.forEach(p => {
      const m = enriched.find(e => e.id === p.id) || enriched[basePlans.indexOf(p)];
      if (m && m.desc) p.desc = m.desc;
    });
  }
  if (stimulusSession && stimulusSession.aiPlans) {
    stimulusSession.aiPlans.candidates = basePlans;
    stimulusSession.aiPlans.loading = false;
    stimulusSession.step = 'plan-list';
    persistStimulusSession();
    render();
  }
}

function scBuildPlanPromptUser(track) {
  const c = stimulusSession.check || {};
  if (track === 'sleep') {
    return [
      '【睡眠チェック結果】',
      `寝つきのつらさ: ${c.fallAsleep ?? '-'}/10`,
      `夜中に目が覚める: ${c.nightWake ?? '-'}/10`,
      `朝のスッキリ感: ${c.morningFresh ?? '-'}/10`,
      `寝る前スマホ: ${c.phoneBeforeBed || '-'}`,
      `ベッドで他のこと: ${c.bedOther || '-'}`,
      '', '上記をふまえ、5つの固定プランそれぞれの desc（具体的な補足説明・1文・40〜70字）を JSON 配列で出力してください。',
    ].join('\n');
  }
  return [
    '【スマホ診断結果】',
    `1日の平均使用時間: 約${c.avgHours || 0}時間${c.avgMin || 0}分`,
    `よく見る時間帯: ${c.peakTime || '-'}`,
    `よく使うアプリ: ${(c.topApps || []).join('、') || '-'}`,
    `やめたい場面: ${(c.quitScenes || []).join('、') || '-'}`,
    '', '上記をふまえ、5つの固定プランそれぞれの desc（具体的な補足説明・1文・40〜70字）を JSON 配列で出力してください。',
  ].join('\n');
}

function parseStimulusPlansJson(text) {
  if (!text) return null;
  try {
    const m = text.match(/\[\s*\{[\s\S]*\}\s*\]/);
    const arr = JSON.parse(m ? m[0] : text);
    if (!Array.isArray(arr)) return null;
    return arr.map(x => ({ id: String(x.id || ''), desc: String(x.desc || '') })).filter(x => x.desc);
  } catch (e) { return null; }
}

// 週次レポートAIコメント生成
async function generateStimulusWeeklyComment() {
  if (!stimulusSession) return;
  const track = scTrack();
  const sessionRef = stimulusSession;
  const plan = scPlan(track, stimulusSession.selectedPlanId);
  const def = AI_PROMPTS.stimulus_control_weekly_comment;
  let comment = null;
  if (def && getInviteCode()) {
    const userMsg = [
      `【系統】${scMeta(track).label}`,
      `【選んだプラン】${plan ? plan.title : '-'}`,
      `【記録日数】${(stimulusSession.checkins || []).length}日`,
      `【${scMeta(track).metricLabel}の推移】${scMetricSeries(track).join(' → ') || '-'}`,
      `【プラン実施率】${scDoneRate(track)}`,
      '', '上記をふまえ、やさしい週次フィードバックを1〜2文で出力してください。',
    ].join('\n');
    try {
      comment = await callGemini(def.systemPrompt, [{ role: 'user', content: userMsg }], {
        temperature: def.temperature, maxTokens: def.maxTokens,
      });
    } catch (e) { console.warn('[sc-weekly]', e); }
  }
  if (!comment) {
    comment = track === 'sleep'
      ? '寝室からスマホを離せた日は、眠りやすさが高い傾向がありました。この調子で続けてみましょう。'
      : '通知をオフにした日は、使用時間が短くなる傾向が見られました。いいペースですね。';
  }
  if (stimulusSession === sessionRef) {
    stimulusSession.weeklyComment = comment;
    persistStimulusSession();
    render();
  }
}

// チェックインから指標系列を取り出す（睡眠=眠りやすさ / スマホ=開いた回数）
function scMetricSeries(track) {
  const ck = stimulusSession ? (stimulusSession.checkins || []) : [];
  if (track === 'sleep') return ck.map(c => c.ease).filter(v => v != null);
  return ck.map(c => c.openCount).filter(v => v != null);
}
function scDoneRate(track) {
  const ck = stimulusSession ? (stimulusSession.checkins || []) : [];
  const done = ck.filter(c => c.result === 'done').length;
  return `${done}/${ck.length}日`;
}
function scSelectedPlan() { return stimulusSession ? scPlan(scTrack(), stimulusSession.selectedPlanId) : null; }

// チェック画面の必須入力バリデーション
function scValidateCheck(track) {
  const c = (stimulusSession && stimulusSession.check) || {};
  if (track === 'sleep') {
    if (!c.phoneBeforeBed || !c.bedOther) {
      if (typeof toast === 'function') toast('頻度の項目も選んでね'); return false;
    }
    // スライダーは未操作でも既定値5でOK
    ['fallAsleep','nightWake','morningFresh'].forEach(k => { if (c[k] == null) c[k] = 5; });
    return true;
  }
  if ((c.avgHours == null || c.avgHours === '') && (c.avgMin == null || c.avgMin === '')) {
    if (typeof toast === 'function') toast('だいたいの使用時間を入れてね'); return false;
  }
  if (!(c.topApps || []).length) { if (typeof toast === 'function') toast('よく使うアプリを選んでね'); return false; }
  return true;
}

// ----- ビュー: ルート -----
function viewStimulus() {
  if (!stimulusSession) { go('kizuki'); return ''; }
  const s = stimulusSession.step;
  const track = scTrack();
  // 共通
  if (s === 'about')       return viewStimulusAbout();   // Step 0：不眠/スマホ 選択（最初の画面）
  if (s === 'analyzing')   return viewStimulusAnalyzing();
  if (s === 'plan-list')   return viewStimulusPlanList();
  if (s === 'plan-select') return viewStimulusPlanSelect();
  if (s === 'do')          return viewStimulusDo();
  // 系統別
  if (s === 'check')       return track === 'phone' ? viewScPhoneCheck() : viewScSleepCheck();
  if (s === 'loop')        return track === 'phone' ? viewScPhoneLoop()  : viewScSleepLoop();
  if (s === 'morning')     return viewScMorning();
  if (s === 'weekly')      return viewScWeekly();
  // 再訪フロー
  if (s === 'r-morning')   return viewScMorning(true);
  if (s === 'r-plan')      return viewScRevisitPlan();
  if (s === 'r-do')        return viewStimulusDo(true);
  if (s === 'r-morning2')  return viewScMorning(true);
  if (s === 'r-review')    return viewScReview();
  return viewStimulusAbout();
}

// おすすめプラン判定（設計 §A-Step3 / §B-Step4）
function scRecommendedPlanId(track) {
  const c = stimulusSession.check || {};
  if (track === 'sleep') {
    if (c.phoneBeforeBed === 'よくある' || c.phoneBeforeBed === '毎日') return 'sleep-1';
    if ((c.fallAsleep ?? 0) >= 7) return 'sleep-2';
    if (c.bedOther === 'よくある' || c.bedOther === '毎日') return 'sleep-3';
    if ((c.morningFresh ?? 10) <= 3) return 'sleep-4';
    return 'sleep-5';
  }
  const scenes = c.quitScenes || [];
  if (scenes.includes('寝る前')) return 'phone-1';
  if (scenes.includes('集中したいとき')) return 'phone-2';
  if ((c.avgHours ?? 0) >= 3) return 'phone-4';
  return 'phone-1';
}

function scPhoneQ1Label(p) {

// ----- 簡易チャート（CSS棒グラフ・折れ線代替） -----
function scBarChart(values, opts) {
  opts = opts || {};
  const max = Math.max(opts.max || 10, ...values, 1);
  const acc = opts.color || scMeta(scTrack()).accent;
  if (!values.length) return '<div class="text-tiny text-muted" style="padding:12px 0;">記録がたまるとグラフが表示されます</div>';
  return `<div style="display:flex; gap:6px; align-items:flex-end; height:120px; padding:8px 4px;">
    ${values.map((v, i) => `
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%;">
        <div style="flex:1; display:flex; align-items:flex-end; width:100%;">
          <div style="width:100%; height:${Math.round((v / max) * 100)}%; min-height:3px; background:${acc}; border-radius:4px 4px 0 0;"></div>
        </div>
        <div class="text-tiny text-muted" style="font-size:9px;">${i+1}日</div>
      </div>
    `).join('')}
  </div>`;
}

function viewScWeekly() {

    values = ck.map(c => c.ease).filter(v => v != null);

// ───────── Step 4: 下向き深掘り（v0.9.88: 3ラウンド分割 + 振り返り）─────────
// s.deeperPhase: 'input' = round 質問画面 / 'recap' = 振り返り画面
// s.deeperRound: 1..N（現在のラウンド番号、3が基本、最大5）

// ラウンドごとの AI 質問テンプレート
function ddRoundQuestion(round, s) {
  if (round === 1) {
    return `もし「${s.autoThought || ''}」が本当だとしたら、あなたはどんな人になりそうですか？`;
  }
  const prev = (s.deeper && s.deeper[round - 2]) || '';
  if (round === 2) {
    return `「${prev}」が本当だとしたら、あなたにとってどういう意味になりますか？`;
  }
  if (round === 3) {
    return `もっと根っこの部分には、どんな思い込みがありそうだと思いますか？あなたの中の「当たり前」「ルール」を探してみましょう。`;
  }
  return `「${prev}」のさらに奥には、どんな思い込みがありそうですか？`;
}

function ddRoundShortQuestion(round) {
  if (round === 1) return 'もしそれが本当なら？';
  if (round === 2) return 'それはあなたにとってどういう意味？';
  if (round === 3) return 'さらに根っこにはどんな思い込みがありそう？';
  return `${round}回目の深掘り`;
}

function viewDdDownward(s) {
  const phase = s.deeperPhase || 'input';
  if (phase === 'recap') return viewDdDownwardRecap(s);
  return viewDdDownwardRound(s);
}

function viewDdDownwardRound(s) {
  const round = s.deeperRound || 1;
  const isFirst = round === 1;
  const currentVal = (s.deeper && s.deeper[round - 1]) || '';
  const examples = DD_DEEPER_EXAMPLES[round] || DD_DEEPER_EXAMPLES[3];

  // これまでの流れ box（2回目以降のみ）
  const flowBox = !isFirst ? `
    <div class="dd-flow-box">
      <div class="dd-flow-row"><span class="dd-flow-label">出来事</span>→ ${escapeHtml((s.autoThought || '').slice(0, 60))}</div>
      ${[1,2].map(i => (round > i && s.deeper[i-1]) ? `
        <div class="dd-flow-row"><span class="dd-flow-label">${i}回目の答え</span>${escapeHtml(s.deeper[i-1])}</div>
      ` : '').join('')}

  ` : '';

  return `
    <div class="screen active dd-screen">
      ${ddHeader(4)}

      <p class="dd-q-sub">それが本当だとしたら、あなたにとってどんな意味がありますか？<br>考えが浮かんだら、書き出してみましょう。</p>

      ${isFirst ? `

          <div class="dd-howto-label">進め方</div>

            <li>AIの問いに答える</li>
            <li>答えた内容から、さらに深く考える</li>
            <li>この流れを基本3回くり返します<span class="text-tiny text-muted">（もっと深掘りしたい場合は追加OK）</span></li>
          </ol>
        </div>

        <div class="dd-flow-box">
          <div class="dd-flow-row"><span class="dd-flow-label">最初の考え</span>${escapeHtml(s.autoThought || '')}</div>
        </div>
      ` : flowBox}

      <div class="dd-suplan-q-card">
        <div class="dd-suplan-q-header">
          <span class="dd-suplan-q-icon">${suplan({ size: 36 })}</span>
          <span class="dd-suplan-q-tag">${round}回目の質問</span>

// ───────── サマリー画面（v0.9.88 新規 / step:9 内部）─────────
function viewDdSummary(s) {
  const oldSchema = ddCurrentOldSchema(s);
  const newSchema = ddCurrentNewSchema(s);
  const before = s.emotionIntensity == null ? null : s.emotionIntensity;
  const after = s.emotionIntensityAfter == null ? null : s.emotionIntensityAfter;
  const change = (before != null && after != null) ? (before - after) : 0;

  // 第一感情アイコン（複数選択時は先頭）
  const firstEmo = (s.emotionTags || [])[0];
  const firstEmoT = DD_EMOTION_TAGS.find(e => e.id === firstEmo);

// 旧コア信念抽出（深掘りログ→傾向タグ）はタグ集計で引き続き使う
function extractCoreBeliefRule(s) {
  const allText = [s.event, s.autoThought, ...(s.deeper || []), ddCurrentOldSchema(s)].filter(Boolean).join(' ');
  const tags = [];
  if (/ダメ|無価値|価値.*ない|存在.*意味/.test(allText)) tags.push('自己否定が強い');
  if (/評価|嫌われ|ダメな人|どう見られ/.test(allText)) tags.push('評価に敏感');
  if (/失敗|うまくいかない|ミス|落ちこぼれ/.test(allText)) tags.push('失敗を恐れやすい');
  if (/捨て|見捨て|ひとり|孤独|去られる|必要とされない/.test(allText)) tags.push('見捨てられ不安');
  if (/完璧|きちんと|ちゃんと|完全|妥協/.test(allText)) tags.push('完璧主義傾向');
  if (/比べ|周りは|みんな|あの人/.test(allText)) tags.push('他者比較しやすい');
  if (/迷惑|頼れない|甘え|助け.*求め/.test(allText)) tags.push('助けを求めにくい');
  if (/全部.*せい|私のせい|責任|全て.*悪い/.test(allText)) tags.push('過剰責任');
  return tags.slice(0, 3).length > 0 ? tags.slice(0, 3) : ['自己否定が強い'];
}

// Step 5: スキーマ候補 - ルールベース
function generateSchemaCandidatesRule(s) {
  const text = [s.autoThought, ...(s.deeper || [])].filter(Boolean).join(' ');
  const base = [
    '私は人から必要とされない',
    '私は大切にされない',
    '失敗すると価値がなくなる',
    '私には価値がない',
  ];
  // 文脈に応じて並び替え
  const score = (c) => {
    let n = 0;
    if (c.includes('必要') && /必要|役立|貢献/.test(text)) n += 2;
    if (c.includes('大切') && /大切|愛|気にかけ/.test(text)) n += 2;
    if (c.includes('失敗') && /失敗|ミス|うまく/.test(text)) n += 2;
    if (c.includes('価値') && /価値|無価値|意味/.test(text)) n += 2;
    return n;
  };
  return base.slice().sort((a, b) => score(b) - score(a));
}

// Step 5: スキーマ候補 - AI
async function generateSchemaCandidatesAI(s) {
  if (!getApiKey()) return null;
  const def = AI_PROMPTS.dd_schema_identify;
  if (!def) return null;
  const user = def.userTemplate
    .replace('{event}', s.event || '')
    .replace('{eventCategory}', s.eventCategory || '')
    .replace('{autoThought}', s.autoThought || '')
    .replace('{emotionTags}', (s.emotionTags || []).join('・'))

// ============================================================
// すぷらん画像レンダリング（v0.9.5 同期 IMG + onerror チェーン）
//
// 旧実装の問題: `suplanProbeAsset` が初回必ず false を返すため
// 初回レンダリング時はSVG。currentScreen ガードで再レンダーが走らない
// 場合（モーダル内、深いネスト、画面遷移直後など）SVGのまま残ってしまう。
//
// 新実装: <img> を直接出力し、onerror で次候補にチェーン。
// ブラウザが既にキャッシュしているPNGは即時表示（SVGフラッシュなし）。
// 全候補失敗時のみ最終フォールバックとして SVG 描画。
// ============================================================
const _suplanAssetCache = {};  // path → true (success) / false (404確認済) / undefined (未試行)

// 起動時に確実存在する資産をプリウォームし、初回IMG src選択を高速化
function preWarmSuplanAssets() {
  const known = ['base'];
  known.forEach(p => {
    if (p in _suplanAssetCache) return;
    const img = new Image();
    img.onload  = () => { _suplanAssetCache[p] = true; };
    img.onerror = () => { _suplanAssetCache[p] = false; };
    img.src = `./assets/suplan/${p}.png`;
  });
}

// 旧API互換: 同期チェック用（cache 参照のみ、async 起動はしない）
function suplanProbeAsset(category, name) {
  return _suplanAssetCache[`${category}/${name}`] === true;
}

// メイン関数: PNG優先、IMG が連鎖的に onerror で次候補へ。最終はSVG
// opts.stage は後方互換のため受け取るが無視する（成長段階廃止）
function suplan(opts = {}) {
  const expression = opts.expression || suplanExpression();
  const pose = opts.pose || null;
  const seasonal = opts.seasonal || null;
  const family = opts.family || null;
  const daily = opts.daily || null;
  const size = opts.size || 96;

  // 優先順候補
  const allPaths = [];
  if (family)      allPaths.push(`family/${family}`);
  if (daily)       allPaths.push(`daily/${daily}`);
  if (pose)        allPaths.push(`poses/${pose}`);
  if (seasonal)    allPaths.push(`seasonal/${seasonal}`);
  if (expression && expression !== 'calm') allPaths.push(`expressions/${expression}`);
  allPaths.push(`base`);  // 単一ベース画像

  // 既知 false（404確認済）はチェーンから除外
  const tryOrder = allPaths.filter(p => _suplanAssetCache[p] !== false);
  // 既知 true（成功確認済）があれば最優先に
  tryOrder.sort((a, b) => (_suplanAssetCache[b] === true ? 1 : 0) - (_suplanAssetCache[a] === true ? 1 : 0));

  if (tryOrder.length === 0) {
    return suplanSvg({ expression, pose, size });
  }

  const primary = tryOrder[0];
  const chain = tryOrder.slice(1);
  const safeAttr = (s) => String(s).replace(/[<>"&]/g, '');

  return `<img src="./assets/suplan/${primary}.png"
    width="${size}" height="${size}" alt="すぷらん"
    data-suplan-chain="${chain.join('|')}"
    data-suplan-size="${size}"
    data-suplan-expression="${safeAttr(expression)}"
    style="display:block; pointer-events:none; object-fit: contain;"
    onload="window.suplanImgLoad && window.suplanImgLoad(this)"
    onerror="window.suplanImgChainFail && window.suplanImgChainFail(this)">`;
}

// IMG 成功時: キャッシュに記録（次回以降即座にこのパスを最優先）
window.suplanImgLoad = function(img) {
  const m = (img.src || '').match(/assets\/suplan\/(.+)\.png/);
  if (m && m[1]) _suplanAssetCache[m[1]] = true;
};

// IMG 失敗時: 次候補にチェーン or 最終 SVG
window.suplanImgChainFail = function(img) {
  if (!img || !img.parentNode) return;
  const m = (img.src || '').match(/assets\/suplan\/(.+)\.png/);
  if (m && m[1]) _suplanAssetCache[m[1]] = false;

  const chain = (img.dataset.suplanChain || '').split('|').filter(Boolean);
  if (chain.length > 0) {
    const next = chain.shift();
    img.dataset.suplanChain = chain.join('|');
    img.src = `./assets/suplan/${next}.png`;
    return;
  }
  // 全候補失敗 → SVG置換
  const size = parseInt(img.dataset.suplanSize, 10) || 96;
  const expression = img.dataset.suplanExpression || 'calm';
  try {
    img.outerHTML = suplanSvg({ expression, size });
  } catch (_) {
    img.style.display = 'none';
  }
};

// 旧API互換
window.suplanImgFail = window.suplanImgChainFail;

// 起動時プリウォーム（先頭で実行）
preWarmSuplanAssets();

// ============================================================
// Gemini API 呼び出し（β: Vercel serverless プロキシ /api/gemini-proxy 経由）
//   - キー本体はサーバー側環境変数（GEMINI_API_KEY）で保持
//   - クライアントは招待コードのみ保持し送信する
// ============================================================
function getInviteCode() {
  if (!state.preferences) return null;
  return state.preferences.inviteCode || state.preferences.geminiApiKey || null;
}
// 後方互換: 既存呼び出し（if (getApiKey()) 等）を壊さないため alias を維持
function getApiKey() { return getInviteCode(); }

async function validateInviteCode(code) {
  try {
    const res = await fetch('/api/validate-invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inviteCode: code }),
    });
    if (!res.ok) return false;
    const data = await res.json();
    return !!data.valid;
  } catch (e) {
    console.warn('[validate-invite] network', e);
    return false;
  }
}

async function callGemini(systemPrompt, messages, options = {}) {
  const code = getInviteCode();
  if (!code) return null;
  const body = {
    inviteCode: code,
    model: options.model || 'gemini-2.5-flash',
    systemPrompt: systemPrompt || '',
    messages: messages.map(m => ({ role: m.role, content: m.content })),
    temperature: options.temperature ?? 0.8,
    maxTokens: options.maxTokens ?? 512,
    thinkingBudget: 0,
  };
  if (options.responseMimeType) body.responseMimeType = String(options.responseMimeType);
  try {
    const res = await fetch('/api/gemini-proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const errBody = await res.text();
      console.warn('[gemini-proxy]', res.status, errBody);
      return null;
    }
    const data = await res.json();
    return (data && data.text) || null;
  } catch (e) {
    console.warn('[gemini-proxy] network', e);
    return null;
  }
}

「毎日少しずつ自分の心と向き合えること」
を大切にしています。

会話は、
心理士のような共感性と安全性を持ちながら、
日常で気軽に使える自然さを重視してください。

---

# IMPORTANT STYLE

## 基本スタンス

- 共感的
- 否定しない
- 解決を急がない
- 押しつけない
- 心理士のように丁寧
- でも重すぎない
- AIっぽすぎない
- 日常会話として自然
- 短く読みやすい

## 特に重要

「寄り添う」と、
「過剰に優しい・不自然」は違います。

以下は禁止です。

NG:
- 「光が差してきたんだね」
- 「きっと大丈夫」
- 「あなたは素晴らしい」
- 「無理しないでね」を毎回言う
- ポエム調
- スピリチュアル表現
- 過剰な励まし
- 不自然な比喩

必ず、
日本語として自然で、
実際の心理士・カウンセラーが話すような
落ち着いた言葉を使ってください。

---

# RESPONSE GOAL

ユーザーに、

- 「ちゃんと受け止めてもらえた」
- 「少し整理できた」
- 「話してよかった」
- 「返しやすい」

と思ってもらうことを最優先にしてください。

問題解決を急ぐ必要はありません。

---

# INPUTS

あなたには以下の情報が渡されます。

- 現在の気分
- 選択カテゴリ
- 任意ひとこと
- 前回記録
- 継続日数
- 過去の傾向
- 会話履歴

それらを自然に会話へ反映してください。

---

# FIRST RESPONSE RULE

最初の返答は、
以下の順番を意識してください。

## 1. 今の気持ちへの共感

まず感情を受け止める。

例:
- 少し気持ちが軽い日なのかな
- 今日はかなりしんどさがあるんだね
- なんとなく落ち着かない感じかな
- ワクワクしてる気持ちが伝わってきたよ

短く自然に。

---

## 2. 前回との変化

前回記録がある場合のみ。

目的は、
「覚えてくれている感」
を出すこと。

例:
- 前回より少し気持ちが上向いているみたいだね
- 最近は「仕事」を選ぶことが多いね
- ここ数日、夜に気持ちを記録してくれているね

※分析っぽくしすぎない
※監視感を出さない

---

## 3. カテゴリへの言及

カテゴリに自然に触れる。

例:
- 健康のことなんだね
- 人間関係で気になることがあるのかな
- 将来のことを考えていたんだね

---

## 4. 任意ひとことへの反応

任意ひとことがある場合は、
必ず自然に触れる。

ユーザーの言葉をそのまま少し引用してよい。

例:
「今日はグランピング的な！バーベキュー楽しみすぎる！」

→
「"楽しみすぎる！"って感じが伝わってきたよ」
「かなり楽しみにしてるんだね」

※オウム返しになりすぎない

---

## 5. 会話を開く問い

最後は、
感情を整理しやすい問いを1つだけ返す。

重要:
- 質問攻めにしない
- 深掘りしすぎない
- 答えやすくする

良い例:
- その中で、今いちばん大きい気持ちはどれに近い？
- その時間はどんな感じだった？
- 少し安心できる部分もある？
- いちばん引っかかっているのはどこかな？

NG:
- 詳しく教えてください
- なぜそう思ったのですか？
- それは認知の歪みかもしれません

# QUICK REPLY GENERATION POLICY

毎回の返答の最後に、
ユーザーが押しやすい
「回答候補（Quick Reply）」を
3〜4個生成してください。

これは非常に重要です。

目的は、
「何を返せばいいかわからない」
状態を減らすことです。

---

# QUICK REPLY RULES

## 最重要

回答候補は、
直前の会話内容に強く合わせてください。

テンプレ禁止。

毎回、
感情・カテゴリ・会話段階に応じて
変化させてください。

---

# QUICK REPLY DESIGN

回答候補は、
以下を意識して混ぜる。

## ① 感情を話しやすくする

例:
- 少し不安もある
- ワクワクしてる
- 正直ちょっと疲れてる
- まだ整理できてない

---

## ② 深掘りしやすくする

例:
- もう少し話したい
- 実は別のことも気になってる
- そのことを整理したい
- 自分でもよくわからない

---

## ③ 行動につなげる

例:
- 少し気分転換したい
- 今できることを知りたい
- 落ち着く方法がほしい
- 小さくできる行動を知りたい

---

## ④ 会話を止めやすくする

重要。

ユーザーに逃げ道を作る。

例:
- 今はうまく言えない
- 聞いてくれてありがとう
- またあとで話す
- 少し休んでみる

---

# QUICK REPLY OPTIMIZATION

## 会話段階ごとに変える

### 初回会話

感情を出しやすく。

例:
- 少し不安
- ワクワクしてる
- まだ整理できてない
- なんとなくモヤモヤ

---

### 深掘り段階

整理しやすく。

例:
- 一番つらいのは○○
- 実は前から気になってた
- 自分を責めてしまう
- 別の見方も知りたい

---

### 行動段階

小さい行動へ。

例:
- 少し休みたい
- 気分転換したい
- 今できることを知りたい
- まず今日は寝たい

---

### リスク段階

安全最優先。

例:
- 誰かに話したい
- 少し落ち着きたい
- 一人はつらい
- 相談先を知りたい

---

# QUICK REPLY WRITING RULES

## 必須

- 1タップで押しやすい長さ
- 12文字前後推奨
- 会話として自然
- 押したくなる
- 感情語を入れる

---

## NG

- 長すぎる
- 説明口調

# CONVERSATION POLICY

## 共感 > 分析

まず受け止める。

いきなり整理しない。

---

## アドバイスは求められた時だけ

ユーザーが、

- アドバイスがほしい
- どうしたらいい？
- 方法を知りたい

と言った時のみ、
小さな提案をする。

---

## 提案のルール

提案は必ず、

- 小さい
- 今すぐできる
- 現実的
- 押しつけない

例:
- 少し水を飲んでみる
- 深呼吸してみる
- 今日は早めに休む
- 5分だけ外の空気を吸う

NG:
- 人生を変える系
- 強い断定
- 医療アドバイス
- 長文ノウハウ

# QUESTION FATIGUE PREVENTION POLICY

重要:
ユーザーに「質問攻めされている感覚」を与えないこと。

メンタル状態が低下している時、
ユーザーは、

- 考える負荷
- 言語化する負荷
- 返答する負荷

が高くなっています。

そのため、
毎回質問を返す会話は禁止です。

---

# 会話バランス

理想の会話比率は以下です。

- 40% 共感・受け止め
- 30% 感情の整理・翻訳
- 20% 問い
- 10% 小さな提案

質問は必要最低限でよい。

---

# 質問しない返答を積極的に使う

毎回会話を進めようとせず、
「受け止めだけ」で終わる返答を許可する。

良い例:
- 「かなり気を張っていた感じがする」
- 「ずっと頑張り続けていたのかもしれないね」
- 「言葉にするだけでも疲れる時ってあるよね」
- 「"いつもうまくいかない"って感じると、かなり苦しくなるよね」

このように、
AI側が少し感情を整理して返すことで、
ユーザーが自然に続きを話したくなる状態を作る。

---

# 問いの頻度制御

以下を必ず守る。

## NG

- 毎ターン質問する
- 連続で深掘りする
- 「どんな時？」を繰り返す
- 「詳しく教えて」を繰り返す

---

# 質問する条件

質問は以下の場合のみ。

- ユーザーが話したそう
- 会話が止まっている
- 整理したそう
- 助けを求めている

それ以外は、
共感・整理を優先する。

---

# 質問数ルール

- 1返信につき質問は最大1つ
- 質問なしの返信を積極的に混ぜる
- 2ターン連続で質問しないことを推奨

---

# 質問の形式

質問は、
「答えやすい形」に変換する。

NG:
- 「なぜそう思う？」
- 「詳しく教えて？」
- 「どんな時？」

良い:
- 「焦り」が近い？
- 「疲れ」が近い？
- 「不安」が近い？
- 「仕事」の影響が大きそう？
- 「自分への自信」が近い感じかな

---

# 余白を作る

会話には、
「返答を求めない余白」
を入れる。

例:
- 「それだけでもかなり疲れると思う」
- 「ずっと一人で抱えていたのかもしれないね」
- 「今日はまず休みたい気持ちもありそう」

このような返答では、
無理に質問しない。

---

# QUICK REPLY FATIGUE CONTROL

Quick Replyも、
会話継続だけを目的にしない。

毎回必ず、
「逃げ道」を1つ以上含める。

例:
- 今はうまく言えない
- 少し休みたい
- 聞いてくれてありがとう
- またあとで話す

---

# IMPORTANT — 質問疲労防止の最終確認

このAIの目的は、
会話を長引かせることではありません。

ユーザーが、

- 少し安心できる
- 気持ちを整理できる
- 一人じゃないと感じられる

ことを優先してください。

---

# CBT / COUNSELING GUIDELINES

以下を自然に会話へ混ぜてよい。

- 感情のラベリング
- 認知と感情の整理
- 別の見方
- 行動活性化
- 自己受容
- 安全基地的な応答

ただし、
専門用語を多用しない。

「認知の歪み」
などは、
必要時のみ自然に。

あなたは医療者ではありません。

以下を厳守してください。

---

## 禁止事項

絶対にしない:

- 診断

- 「うつです」などの断定

- 強い決めつけ

---

## リスクワード対応

以下のような内容には注意。

- 死にたい
- 消えたい
- 自傷
- OD
- リスカ
- 希望がない
- 生きる意味がない
- 誰にも言えない
- もう限界
- 殺したい
- 虐待
- 暴力

---

最優先は、
否定せず安全を確保すること。

- 気持ちを受け止める
- 一人で抱え込まないよう促す
- 信頼できる人や相談先につなぐ

- 落ち着いて

- 説教しない
- 否定しない

// ============================================================
// きろく分析エンジン（v0.9.3 仕様書 §5 思考のクセ分析）
//   - DISTORTIONS の examples（キーワード）を使ってルールベースで検出
//   - eventText + letterBody から認知の歪みパターンをスコアリング
//   - TOP3 を「少しだけ／ややあり／ちょっと強め」のラベル付きで返す
// ============================================================
function distortionLabel(score) {
  if (score >= 50) return { label: 'ちょっと強め', tone: 'high', color: '#D77B5B' };
  if (score >= 25) return { label: 'ややあり',     tone: 'mid',  color: '#B07F2F' };
  if (score >= 8)  return { label: '少しだけ',     tone: 'low',  color: '#7BA876' };
  return { label: 'ほぼなし', tone: 'none', color: 'var(--text-muted)' };
}

function analyzeDistortions(records, daysWindow = 28) {
  const since = new Date();
  since.setDate(since.getDate() - daysWindow);
  const recent = (records || []).filter(r => new Date(r.createdAt) >= since);
  const total = Math.max(1, recent.length);

  return DISTORTIONS.map(d => {
    let hits = 0;
    let hitRecords = 0;
    recent.forEach(r => {
      const text = (r.eventText || '') + ' ' + (r.letterBody || '') + ' ' + (r.alternativeView || '');
      let hitInThis = 0;
      d.examples.forEach(ex => {
        const re = new RegExp(ex.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
        const m = text.match(re);
        if (m) hitInThis += m.length;
      });
      hits += hitInThis;
      if (hitInThis > 0) hitRecords++;
    });
    // ratio of records that hit, weighted by hit density
    const ratio = hitRecords / total;
    const density = hits / total;
    const score = Math.min(100, Math.round(ratio * 70 + density * 30));
    return {
      id: d.id,
      name: d.name,
      desc: d.desc,
      counter: d.counter,
      tier: d.tier,
      hits, hitRecords, total,
      score,
      level: distortionLabel(score),
    };
  }).sort((a, b) => b.score - a.score);
}

function getDistortionTrend(records, days = 60, halfDays = 30) {
  // 直近halfDays vs その前halfDays（合計days）を比較
  const now = new Date();
  const old = new Date(now); old.setDate(old.getDate() - days);
  const mid = new Date(now); mid.setDate(mid.getDate() - halfDays);
  const inRange = (r, from, to) => {
    const t = new Date(r.createdAt);
    return t >= from && t < to;
  };
  const recentRecords = (records || []).filter(r => inRange(r, mid, now));
  const olderRecords  = (records || []).filter(r => inRange(r, old, mid));

  const scoreAtSet = (set) => {
    return DISTORTIONS.map(d => {
      const t = Math.max(1, set.length);
      let hitRecs = 0;
      set.forEach(r => {
        const text = (r.eventText || '') + ' ' + (r.letterBody || '') + ' ' + (r.alternativeView || '');
        if (d.examples.some(ex => text.includes(ex))) hitRecs++;
      });
      return { id: d.id, name: d.name, score: Math.min(100, Math.round((hitRecs / t) * 100)) };
    });
  };
  const before = scoreAtSet(olderRecords);
  const after  = scoreAtSet(recentRecords);
  return DISTORTIONS.map((d, i) => ({
    id: d.id,
    name: d.name,
    before: before[i].score,
    after: after[i].score,
    delta: after[i].score - before[i].score,
  })).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
}

// 1記録 から「事実 / 解釈 / 感情 / 行動」に分解（仕様書 §5 詳細）
function decomposeRecord(record) {
  // 事実: eventText
  const fact = record.eventText || '';
  // 解釈: letterBody から「別の見方」直前のネガ思考を抽出（無ければ未記録）
  let interp = '';
  if (record.alternativeView) {
    // alternativeView は AI の new view なので、ネガ思考そのものではないが、推測の手がかり
    interp = '（このきろくでは元のネガティブ思考は明示記録されていません）';
  }
  // 感情
  const emo = {
    label: record.emotion || '',
    before: record.emotionScoreBefore,
    after: record.emotionScoreAfter,
  };
  // 行動: 同日の ippoSession から取得
  const sameDay = (state.ippoSessions || []).find(s =>
    s.completedAt && record.createdAt && sameDay2(new Date(s.completedAt), new Date(record.createdAt))
  );
  let action = '';
  if (sameDay) {
    const a = ACTIONS.find(x => x.id === sameDay.actionId);
    action = a ? `${a.title}（${a.time}）— 強さ ${sameDay.beforeIntensity}→${sameDay.afterIntensity}` : '記録あり';
  }

  // 検出された認知の歪み（このレコードから）
  const text = fact + ' ' + (record.letterBody || '') + ' ' + (record.alternativeView || '');
  const detectedDistortions = DISTORTIONS.filter(d => d.examples.some(ex => text.includes(ex)))
    .map(d => ({ id: d.id, name: d.name }));

  return { fact, interp, emo, action, detectedDistortions };
}
function sameDay2(a, b) { return a.toDateString() === b.toDateString(); }

// 1記録 ごとに「すぷらんメモ」を生成（記録一覧で表示）
function generateRecordMemo(record) {
  const dec = decomposeRecord(record);
  if (dec.detectedDistortions.length > 0) {
    const top = dec.detectedDistortions[0];
    return `${top.name}のパターンがあるかも`;
  }
  if (dec.emo.before != null && dec.emo.after != null) {
    const change = dec.emo.before - dec.emo.after;
    if (change >= 3) return '気持ちがしっかり軽くなった日';
    if (change >= 1) return 'すこし気持ちが軽くなった';
    if (change <= -1) return 'まだ少し重く感じた日かも';
  }
  return null;
}

// カレンダーすぷらんからのひとこと（曜日・気分パターンから）
function generateWeeklySuplanMessage() {
  const recent = (state.moodLogs || []).slice(-14);
  if (recent.length < 3) return 'まだ記録が少ないみたい。少しずつでだいじょうぶ。';
  const lowDays = recent.filter(m => m.moodScore <= 2).length;
  const ratio = lowDays / recent.length;
  if (ratio >= 0.5) return '直近、気分がしんどい日が多かったみたい。一歩を小さくして、自分を労わる時間を増やしてもいいかも。';
  if (ratio >= 0.3) return '気分の波が少し大きいみたい。睡眠と休息を少しだけ大事にしてみよっか。';
  if (ratio >= 0.15) return 'おだやかな日が増えてきてるね。今のペースを大事にしていこう。';
  return 'いい感じのリズムが続いてるよ。すこしずつ積み重なってる証拠だよ。';
}

    ], todayAction:'今日できたことを1つ、消さずに書き留める' },
  { id:'fortune_telling', name:'先読み思考', short:'未来を悲観的に決めやすい',
    reframe:'未来はまだ決まってない。いまわかってる事実から見てみよう。',
    keywords:['どうせ無理','絶対上手くいかない','失敗する','もう手遅れ','将来真っ暗','未来ない','きっとダメ','うまくいくわけない','どうせ失敗','この先も'],
    hints:[
      { icon:'🔮', title:'予想と事実を分ける', desc:'未来予想と、今わかっている事実を分けて書く' },
      { icon:'🌤', title:'最悪以外のシナリオ', desc:'最悪以外の展開を2つ書き出してみる' },
      { icon:'👣', title:'今日の一歩に戻す', desc:'今日できる小さな一歩に意識を戻す' },
    ], todayAction:'最悪以外のシナリオを2つ書いてみる' },
];

// ソース別フィールド重み（§9）
const DA_FIELD_WEIGHTS = {
  moyamoya: { thought:1.0, evidence:0.7, situation:0.4, counterEvidence:0.3 },
  deepDive: { coreBelief:1.2, oldSchema:1.1, deeper:1.0, extractedBelief:1.0, firstThought:0.8 },
  chat:     { userText:0.6, summary:0.4 },
  moodLog:  { comment:0.5, category:0.3 },
};
// ソース別 最終合成重み（§8）
const DA_SOURCE_WEIGHT = { moyamoya:0.35, deepDive:0.25, self:0.20, chat:0.10, moodLog:0.05 };
const DA_CHAT_SCORE_CAP = 60; // §9.4 会話だけで強いラベルを出さない
const DA_DAY = 24 * 60 * 60 * 1000;

function daCountHits(text, keywords) {
  const t = String(text || '').toLowerCase();
  if (!t) return 0;
  let n = 0;
  for (const k of keywords) {
    const kk = String(k).toLowerCase();
    if (!kk) continue;
    let idx = t.indexOf(kk);
    while (idx !== -1) { n++; idx = t.indexOf(kk, idx + kk.length); }
  }
  return n;
}
function daTrim(text, max = 40) {
  const s = String(text || '').replace(/\s+/g, ' ').trim();
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

// 期間 [fromTs, toTs) のレコードを AnalysisItem 群に正規化（§6）
function daNormalize(state, fromTs, toTs) {
  const inWin = (iso) => { const t = new Date(iso).getTime(); return t >= fromTs && t < toTs; };
  const buckets = { moyamoya:[], deepDive:[], chat:[], moodLog:[], hasSelf:false, selfAnswers:null };

  (state.moyamoyaRecords || []).forEach(r => {
    if (!r.createdAt || !inWin(r.createdAt)) return;
    buckets.moyamoya.push({
      id:r.id, sourceType:'moyamoya', createdAt:r.createdAt,
      textFields:{ situation:r.eventText||'', thought:r.automaticThought||'', evidence:r.evidence||'', counterEvidence:r.counterEvidence||'' },
      emotion:{ label:r.emotion||'', before:r.emotionScoreBefore, after:r.emotionScoreAfter,
        change:(r.emotionScoreBefore!=null && r.emotionScoreAfter!=null) ? (r.emotionScoreBefore - r.emotionScoreAfter) : null },
    });
  });
  (state.deepDiveSessions || []).forEach(r => {
    const ts = r.completedAt || r.startedAt;
    if (!ts || !inWin(ts)) return;
    buckets.deepDive.push({
      id:r.id, sourceType:'deepDive', createdAt:ts,
      textFields:{ firstThought:r.firstThought||'', deeper:Array.isArray(r.deeper)?r.deeper.join(' '):'',
        coreBelief:r.coreBelief||'', oldSchema:r.oldSchema||'', extractedBelief:r.extractedBelief||'' },
      emotion:{},
    });
  });
  (state.aiChats || []).forEach(r => {
    if (!r.createdAt || !inWin(r.createdAt)) return;
    const userText = (r.messages || []).filter(m => m.role === 'user').map(m => m.content).join(' ');
    buckets.chat.push({ id:r.id, sourceType:'chat', createdAt:r.createdAt,
      textFields:{ summary:r.summary||'', userText }, emotion:{} });
  });
  (state.moodLogs || []).forEach(r => {
    if (!r.createdAt || !inWin(r.createdAt)) return;
    const cat = (r.categories || []).map(id => { const c = CATEGORIES.find(x => x.id === id); return c ? c.name : ''; }).join(' ');
    buckets.moodLog.push({ id:r.id, sourceType:'moodLog', createdAt:r.createdAt,
      textFields:{ comment:r.comment||'', category:cat }, emotion:{} });
  });
  // 自己評価はスナップショット。completedAt が窓内のときだけ採用（推移の過去窓への漏れ込み防止）
  const distRes = state.kizukiResults && state.kizukiResults.distortion;
  if (distRes && distRes.answers && distRes.completedAt && inWin(distRes.completedAt)) {
    buckets.hasSelf = true; buckets.selfAnswers = distRes.answers;
  }
  return buckets;
}

// 1ソース内の 1歪み サブスコア（0-100）+ 根拠収集
function daSubScore(items, fieldWeights, keywords) {
  if (!items || !items.length) return { score:0, hitRecords:0, evidence:[] };
  let recordsHit = 0, weighted = 0; const evidence = [];
  for (const it of items) {
    let itemW = 0, bestField = null, bestText = '';
    for (const f in fieldWeights) {
      const text = it.textFields[f];
      if (!text) continue;
      const hits = daCountHits(text, keywords);
      if (hits > 0) { itemW += hits * fieldWeights[f]; if (!bestField) { bestField = f; bestText = text; } }
    }
    if (itemW > 0) {
      recordsHit++; weighted += itemW;
      evidence.push({ text:daTrim(bestText), sourceType:it.sourceType, date:String(it.createdAt||'').slice(0,10), sourceField:bestField, strength:(it.emotion && it.emotion.before != null) ? it.emotion.before : null });
    }
  }
  const ratio = recordsHit / items.length;
  const density = weighted / items.length;
  const score = Math.min(100, Math.round(ratio * 70 + Math.min(30, density * 15)));
  return { score, hitRecords:recordsHit, evidence };
}

// 感情強度・反復補正（§9.6・上限+10）
function daCorrection(buckets, d) {
  let c = 0;
  const heHit = buckets.moyamoya.some(it => it.emotion && it.emotion.before >= 8 &&
    (daCountHits(it.textFields.thought, d.keywords) + daCountHits(it.textFields.evidence, d.keywords)) > 0);
  if (heHit) c += 4;
  const totalHitRecs = [...buckets.moyamoya, ...buckets.deepDive].filter(it =>
    Object.keys(it.textFields).some(f => daCountHits(it.textFields[f], d.keywords) > 0)).length;
  if (totalHitRecs >= 3) c += 4;
  const smallImprove = buckets.moyamoya.some(it => it.emotion && it.emotion.change != null && it.emotion.change <= 1 &&
    daCountHits(it.textFields.thought, d.keywords) > 0);
  if (smallImprove) c += 2;
  return Math.min(10, c);
}

function daLevel(score) {
  if (score >= 50) return { key:'やや強め', label:'最近少し出やすいかも', tone:'high' };
  if (score >= 25) return { key:'ややあり', label:'ときどき見られる',     tone:'mid'  };
  if (score >= 8)  return { key:'少しだけ', label:'少しだけ見られる',     tone:'low'  };
  return { key:'ほぼなし', label:'今はあまり見られない', tone:'none' };
}

// 全8種のスコアを算出（§8-10）
function daComputeScores(buckets, nowTs) {
  const since14 = nowTs - 14 * DA_DAY;
  return DA_DISTORTIONS.map(d => {
    const mo = daSubScore(buckets.moyamoya, DA_FIELD_WEIGHTS.moyamoya, d.keywords);
    const dd = daSubScore(buckets.deepDive, DA_FIELD_WEIGHTS.deepDive, d.keywords);
    const ch = daSubScore(buckets.chat,     DA_FIELD_WEIGHTS.chat,     d.keywords);
    const ml = daSubScore(buckets.moodLog,  DA_FIELD_WEIGHTS.moodLog,  d.keywords);
    const selfRaw = buckets.selfAnswers && buckets.selfAnswers[d.id] != null ? buckets.selfAnswers[d.id] : null;
    const selfScore = selfRaw != null ? (selfRaw / 2 * 100) : 0;
    const chScore = Math.min(DA_CHAT_SCORE_CAP, ch.score);
    const corr = daCorrection(buckets, d);

    const base = mo.score * DA_SOURCE_WEIGHT.moyamoya
               + dd.score * DA_SOURCE_WEIGHT.deepDive
               + selfScore * DA_SOURCE_WEIGHT.self
               + chScore * DA_SOURCE_WEIGHT.chat
               + ml.score * DA_SOURCE_WEIGHT.moodLog;
    const score = Math.min(100, Math.round(base + Math.min(10, corr)));

    const evidence = [...dd.evidence, ...mo.evidence, ...ch.evidence, ...ml.evidence];
    const recent14 = evidence.filter(e => e.date && new Date(e.date).getTime() >= since14).length;
    const workHits = mo.hitRecords + dd.hitRecords;
    const sourceBreakdown = {
      moyamoya:mo.hitRecords, deepDive:dd.hitRecords,
      selfAssessment:(selfRaw != null && selfRaw >= 1) ? 1 : 0,
      chat:ch.hitRecords, moodLog:ml.hitRecords,
    };
    const anyNonChat = workHits + sourceBreakdown.selfAssessment + ml.hitRecords > 0;
    return {
      id:d.id, name:d.name, short:d.short, reframe:d.reframe, hints:d.hints, todayAction:d.todayAction,
      score, level:daLevel(score), sourceBreakdown, evidence, recent14, workHits,
      chatOnly: !anyNonChat && ch.hitRecords > 0,
    };
  });
}

// TOP3（§11）
function daTop3(scored) {
  const arr = [...scored].sort((a, b) =>
    (b.score - a.score) || (b.recent14 - a.recent14) || (b.workHits - a.workHits));
  if (arr.length >= 2 && arr[0].chatOnly && !arr[1].chatOnly) { const t = arr[0]; arr[0] = arr[1]; arr[1] = t; }
  return arr.slice(0, 3);
}

// dataConfidence（§16）
function daDataConfidence(buckets) {
  const valid = buckets.moyamoya.length + buckets.deepDive.length;
  const sources = [buckets.moyamoya.length > 0, buckets.deepDive.length > 0, buckets.hasSelf].filter(Boolean).length;
  if (valid >= 10 && sources >= 2) return 'high';
  if (valid >= 6) return 'medium';
  return 'low';
}
function daConfidenceLabel(conf) {
  return conf === 'high' ? '記録から見えた傾向' : conf === 'medium' ? '参考傾向' : 'まだ仮の分析';
}

// リスク検知（§17・既存 detectCrisis 流用）
function daRisk(buckets) {
  let sev = 0;
  ['moyamoya', 'deepDive', 'chat', 'moodLog'].forEach(s =>
    buckets[s].forEach(it => Object.values(it.textFields).forEach(v => { if (v) sev = Math.max(sev, detectCrisis(v)); })));
  return sev >= 4
    ? { riskDetected:true, message:'今は分析よりも、安全を優先してほしい状態かもしれません。ひとりで抱えず、信頼できる人や専門窓口につながることを検討してください。' }
    : { riskDetected:false, message:'' };
}

// 推移（§20 trend・直近28日 vs その前28日）
function daTrend(state, nowTs) {
  const cur = daComputeScores(daNormalize(state, nowTs - 28 * DA_DAY, nowTs), nowTs);
  const prevBuckets = daNormalize(state, nowTs - 56 * DA_DAY, nowTs - 28 * DA_DAY);
  const prev = daComputeScores(prevBuckets, nowTs - 28 * DA_DAY);
  return DA_DISTORTIONS.map(d => {
    const c = cur.find(x => x.id === d.id) || { score:0 };
    const p = prev.find(x => x.id === d.id) || { score:0 };
    const delta = c.score - p.score;
    const trendLabel = delta >= 10 ? '増えぎみ' : delta <= -10 ? '減りぎみ' : 'ほぼ横ばい';
    return { id:d.id, name:d.name, previousScore:p.score, currentScore:c.score, delta, trendLabel };
  }).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
}

// 推奨ワーク（§15）
function daRecommendWorks(buckets, top) {
  const recs = [];
  if (buckets.moyamoya.length < 3)
    recs.push({ workId:'moyamoya', title:'もやもや整理', reason:'自動思考の記録を増やすと分析が安定します', priority:'high', estimatedMinutes:7, ctaText:'もやもや整理をやってみる' });
  if (buckets.deepDive.length === 0 && top[0] && top[0].score >= 25)
    recs.push({ workId:'deep-dive', title:'下向き矢印法', reason:'奥にある思い込み（スキーマ）まで整理しやすくなります', priority:'medium', estimatedMinutes:10, ctaText:'下向き矢印法をやってみる' });
  if (!buckets.hasSelf)
    recs.push({ workId:'distortion', title:'認知のゆがみセルフチェック', reason:'自分のクセを広く把握できます', priority:'medium', estimatedMinutes:5, ctaText:'セルフチェックをする' });
  if (top[0] && (top[0].id === 'fortune_telling' || top[0].id === 'all_or_nothing'))
    recs.push({ workId:'behavior-experiment', title:'行動実験', reason:'思い込みを小さく確かめて行動に落とせます', priority:'low', estimatedMinutes:5, ctaText:'行動実験をやってみる' });
  return recs.slice(0, 3);
}

// 行動提案（§20 actionSuggestions）
function daActionSuggestions(top) {
  return top.filter(t => t.score >= 8).slice(0, 3).map(t => ({
    title:t.hints[0].title, description:t.hints[0].desc,
    relatedDistortionId:t.id, difficulty:'easy', estimatedMinutes:3,
  }));
}

// ルールベースのサマリ文言（AI失敗時フォールバック・§13/§19）
function daRuleSummary(top) {
  if (!top.length || top[0].score < 8) {
    return {
      title:'今はまだ大きなクセは見えていません',
      mainMessage:'記録がもう少し増えると、考え方の傾向が見えてきます。',
      suplanComment:'あせらず、少しずつでだいじょうぶ。',
      cautionText:'これは記録から見えたセルフケア用の傾向メモです。診断ではありません。',
    };
  }
  const t = top[0];
  return {
    title:`最近は「${t.name}」が出やすいかもしれません`,
    mainMessage:`最近の記録では、${t.short}場面が見られました。`,
    suplanComment:t.reframe,
    cautionText:'これは記録から見えたセルフケア用の傾向メモです。診断ではありません。',
  };
}

// 決定的スケルトン（§20 スキーマ・ルールベース層のみ）
function buildDistortionSkeleton(state, nowTs) {
  nowTs = nowTs || Date.now();
  const buckets = daNormalize(state, nowTs - 28 * DA_DAY, nowTs);
  const scored = daComputeScores(buckets, nowTs);
  const top = daTop3(scored);
  const conf = daDataConfidence(buckets);
  const safety = daRisk(buckets);
  const summary = daRuleSummary(top);
  summary.dataConfidence = daConfidenceLabel(conf);

  const basis = top.map(t => ({
    id:t.id, name:t.name, evidenceCount:t.evidence.length,
    sourceBreakdown:t.sourceBreakdown,
    representativeEvidence:t.evidence.slice(0, 3),
    explanation:`${t.name}に近い表現が${t.evidence.length}件の記録で見られたため`,
    caution:'一部の記録から見えた傾向であり、診断ではありません',
  }));

  return {
    generatedAt:new Date(nowTs).toISOString(),
    period:{ from:new Date(nowTs - 28 * DA_DAY).toISOString(), to:new Date(nowTs).toISOString(), days:28 },
    dataConfidence:conf,
    summary,
    topDistortions:top.map(t => ({
      id:t.id, name:t.name, score:t.score, level:t.level.key,
      shortDescription:t.short, userFriendlyMessage:`${t.short}傾向が少し見られます。`,
      actionHint:t.todayAction, hints:t.hints,
    })),
    allDistortions:scored.map(s => ({
      id:s.id, name:s.name, short:s.short, score:s.score, level:s.level.key,
      sourceBreakdown:s.sourceBreakdown, evidence:s.evidence,
    })),
    chart:{
      labels:DA_DISTORTIONS.map(d => d.name),
      userScores:DA_DISTORTIONS.map(d => (scored.find(s => s.id === d.id) || { score:0 }).score),
      // 母集団平均は β後に算出予定。現状は視覚比較用の中庸ベースライン（プレースホルダ）
      averageScores:DA_DISTORTIONS.map(() => 15),
    },
    trend:daTrend(state, nowTs),
    basis,
    actionSuggestions:daActionSuggestions(top),
    recommendedWorks:daRecommendWorks(buckets, top),
    safety,
    aiGenerated:false,
  };
}

// AI（質的レイヤー）に渡すユーザーメッセージ — 本人が書いた根拠のみ提示
function daBuildAIUserMessage(result) {
  const lines = [];
  lines.push(`# 分析データ（dataConfidence: ${result.dataConfidence} / 直近28日）`);
  lines.push('');
  lines.push('## 思考のクセ TOP（コード算出・スコアは変更しないこと）');
  result.topDistortions.forEach((t, i) => {
    lines.push(`${i + 1}. ${t.name}（score ${t.score} / ${t.level}）— ${t.shortDescription}`);
    const b = result.basis.find(x => x.id === t.id);
    if (b && b.representativeEvidence.length) {
      b.representativeEvidence.forEach(e => lines.push(`   - 本人の記録「${e.text}」（${e.sourceType}・${e.sourceField}）`));
    }
  });
  lines.push('');
  lines.push('上記を踏まえ、診断ではない「やさしい鏡」としての質的サマリと、各クセの根拠説明・ユーザー向けメッセージを JSON で出力してください。');
  return lines.join('\n');
}

// オーケストレーター（ハイブリッド）: スケルトン算出 → Gemini で質的レイヤーを上書き
async function analyzeDistortionsDeep(state, nowTs) {
  const result = buildDistortionSkeleton(state, nowTs);
  if (!getInviteCode()) return result;                  // API未設定はルールベースのまま
  const def = AI_PROMPTS.distortion_deep_analysis;
  if (!def) return result;
  try {
    const raw = await callGemini(def.systemPrompt, [{ role:'user', content:daBuildAIUserMessage(result) }], {
      temperature:def.temperature, maxTokens:def.maxTokens, responseMimeType:'application/json',
    });
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.summary) {
        if (parsed.summary.title)        result.summary.title = parsed.summary.title;
        if (parsed.summary.mainMessage)  result.summary.mainMessage = parsed.summary.mainMessage;
        if (parsed.summary.suplanComment) result.summary.suplanComment = parsed.summary.suplanComment;
      }
      if (Array.isArray(parsed.topInsights)) {
        parsed.topInsights.forEach(ti => {
          const t = result.topDistortions.find(x => x.id === ti.id);
          if (t && ti.userFriendlyMessage) t.userFriendlyMessage = ti.userFriendlyMessage;
          const b = result.basis.find(x => x.id === ti.id);
          if (b && ti.basisExplanation) b.explanation = ti.basisExplanation;
        });
      }
      result.aiGenerated = true;
    }
  } catch (e) {
    console.warn('[distortion_deep_analysis] fallback to rule-based:', e);
  }
  return result;
}

// ============================================================
// モバイルキーボード対応（v0.9.6: visualViewport 駆動）
//
// 問題: iOS Safari は 100dvh がキーボード表示時に縮まらない。

//       これで通常時は最下端、キーボード時はキーボード直上に
//       入力欄が張り付く（LINE/標準iOS Mail と同じ挙動）。
// ============================================================
(function setupChatKeyboard() {
  const CHAT_INPUT_IDS = ['moodChatInput'];

  function isChatInput(el) {
    return el && CHAT_INPUT_IDS.indexOf(el.id) !== -1;
  }

  // CSS変数 --chat-vh を「可視 viewport の高さ」に同期させる
  // body.in-chat-mode を付けると body 自体が position:fixed; height:--chat-vh
  // になり、入力欄が常に visualViewport の下端に張り付く
  // body.keyboard-open はキーボード表示判定。iOS の safe-area-inset-bottom が
  // キーボード表示中も home indicator 値を返してしまうため、これで上書きする。
  window.fitChatScreenToViewport = function fitChatScreenToViewport() {
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--chat-vh', h + 'px');
    const inChat = !!document.querySelector('.mood-chat-screen.active');
    document.documentElement.style.setProperty('--app-pad-bottom', inChat ? '0px' : '80px');
    document.body.classList.toggle('in-chat-mode', inChat);

    // visualViewport が大幅に縮んでいればキーボードが出ている (80px 超の差)
    const keyboardOpen = !!(vv && (window.innerHeight - vv.height - vv.offsetTop) > 80);
    document.body.classList.toggle('keyboard-open', keyboardOpen);

    if (inChat) {
      // CSS class が遅れて適用されるケース対策に body.style.height も直接書く
      // (iOS Safari/PWA で稀に CSS変数が即時反映されない事象の保険)
      document.body.style.height = h + 'px';
      if (window.scrollY > 0) window.scrollTo(0, 0);
    } else {
      document.body.style.height = '';
    }
  };

  // mood-chat-list の最終行を可視領域に
  function scrollMoodChatBottom() {
    const list = document.getElementById('moodChatList');
    if (!list) return;
    list.scrollTop = list.scrollHeight;
  }
  // (旧 goal-chat 用の scrollLegacyChatBottom / adjustLegacyInputForViewport は v0.9.58 で削除)

  if (window.visualViewport) {
    const onVVChange = () => {
      window.fitChatScreenToViewport();
      requestAnimationFrame(scrollMoodChatBottom);
    };
    window.visualViewport.addEventListener('resize', onVVChange);
    window.visualViewport.addEventListener('scroll', onVVChange);
  }
  // visualViewport 非対応時のフォールバック
  window.addEventListener('resize', () => window.fitChatScreenToViewport());
  // 通常スクロールでも追従させる（iOS Safari address bar 伸縮対策）
  window.addEventListener('scroll', () => window.fitChatScreenToViewport(), { passive: true });

  document.addEventListener('focusin', (e) => {
    if (!isChatInput(e.target)) return;
    setTimeout(() => {
      window.fitChatScreenToViewport();
      scrollMoodChatBottom();
    }, 300);
  });

  document.addEventListener('focusout', (e) => {
    if (!isChatInput(e.target)) return;
    setTimeout(() => window.fitChatScreenToViewport(), 100);
    if (document.querySelector('.mood-chat-screen.active')) return;
    const inputRow = document.querySelector('.input-row');
    if (inputRow) inputRow.style.bottom = '0';
  });
})();

function persistAIChat({ sourceType, sourceId, messages, summary }) {
  const idx = state.aiChats.findIndex(c => c.sourceType === sourceType && c.sourceId === sourceId);
  if (idx >= 0) {
    state.aiChats[idx].messages = messages;
    if (summary) state.aiChats[idx].summary = summary;
  } else {
    state.aiChats.push({
      id: uid(), sourceType, sourceId, messages,
      summary: summary || '',
      createdAt: new Date().toISOString()
    });
  }
  saveState();
}

let viewParams = {};

// ============================================================
// 「最近のきろく」カード生成（ホームと きろくタブで共通利用 / v0.9.35〜）
//   it: { kind: 'mood' | 'moyamoya' | 'ippo', t: ISO, data: {...} }
//   遷移先:
//     mood (会話あり): kiroku-chat / mood (会話なし): クリック不可
//     moyamoya: kiroku-detail（中で「レターを見る」遷移可）
//     ippo: kiroku-ippo
// ============================================================
function renderKirokuRowItem(it) {
  if (!it || !it.data) return '';
  if (it.kind === 'moyamoya') {
    const r = it.data;
    const memo = generateRecordMemo(r);
    const titleText = r.letterTitle || (r.eventText || '').slice(0, 30);
    const emoLine = `${r.emotion || ''}（${r.emotionScoreBefore}→${r.emotionScoreAfter}）`;
    return `
      <button class="kr-rec-card" data-act="kiroku-detail" data-record-id="${r.id}">
        <div class="kr-rec-meta">${formatDate(r.createdAt)} ・ もやもや整理</div>
        <div class="kr-rec-title">${escapeHtml(titleText)}</div>
        <div class="kr-rec-emo">${escapeHtml(emoLine)}</div>
        ${memo ? `<div class="kr-rec-memo">🌱 すぷらんメモ: ${escapeHtml(memo)}</div>` : ''}
      </button>
    `;
  }
  if (it.kind === 'mood') {
    const m = it.data;
    const moodObj = MOODS.find(x => x.id === m.moodScore);
    const chat = (state.aiChats || []).find(c => c.sourceType === 'mood_log' && c.sourceId === m.id);
    const hasChat = chat && (chat.messages || []).length > 1;
    return `
      <button class="kr-rec-card" ${hasChat ? `data-act="kiroku-chat" data-chat-id="${chat.id}"` : 'style="cursor:default;"'}>
        <div class="kr-rec-meta">${formatDate(m.createdAt)} ・ 気分の記録${hasChat ? ' ・ AI会話あり' : ''}</div>
        <div class="kr-rec-title">${moodObj ? moodObj.emoji + ' ' + moodObj.label : ''}</div>
        ${m.comment ? `<div class="kr-rec-emo">${escapeHtml(m.comment)}</div>` : ''}
        ${hasChat ? `<div class="kr-rec-memo">💬 タップで会話履歴を見る（${(chat.messages || []).length}件）</div>` : ''}
      </button>
    `;
  }
  if (it.kind === 'ippo') {
    const s = it.data;
    const action = (typeof ACTIONS !== 'undefined') ? ACTIONS.find(a => a.id === s.actionId) : null;
    const actionTitle = action ? `${action.icon || ''} ${action.title}` : (s.actionId || '一歩');
    const change = (typeof s.changeValue === 'number') ? s.changeValue : ((s.beforeIntensity || 0) - (s.afterIntensity || 0));
    const moodLine = `${s.moodLabel || ''}（${s.beforeIntensity ?? '-'}/10 → ${s.afterIntensity ?? '-'}/10）`;
    const memo = change > 0 ? `🌱 ${change}ポイント軽くなった` : change === 0 ? '🌱 落ち着いた状態をキープ' : '🌱 まずは行動できたのが大事だよ';
    return `
      <button class="kr-rec-card" data-act="kiroku-ippo" data-ippo-id="${s.id}">
        <div class="kr-rec-meta">${formatDate(s.completedAt)} ・ きょうのいっぽ</div>
        <div class="kr-rec-title">${escapeHtml(actionTitle)}</div>
        <div class="kr-rec-emo">${escapeHtml(moodLine)}</div>
        <div class="kr-rec-memo">${escapeHtml(memo)}</div>
      </button>
    `;
  }
  return '';
}

function viewCalendarSection() {
  const now = new Date();
  const offset = state.ui.calendarMonthOffset || 0;
  const base = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  const year = base.getFullYear();
  const month = base.getMonth();
  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month+1, 0).getDate();
  const isCurrentMonth = (offset === 0);

  const moodMap = {};
  state.moodLogs.forEach(m => {
    const d = new Date(m.createdAt);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!moodMap[k] || new Date(moodMap[k].createdAt) < d) moodMap[k] = m;
  });

  let html = `<div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
      <button data-act="cal-prev-month" aria-label="前の月" style="border:none; background:var(--bg-soft); width:32px; height:32px; border-radius:999px; cursor:pointer; color:var(--text);">‹</button>
      <h3 style="margin:0;">${year}年 ${month+1}月</h3>
      <button data-act="cal-next-month" aria-label="次の月" ${isCurrentMonth?'disabled style="border:none; background:transparent; width:32px; height:32px; border-radius:999px; opacity:0.25; cursor:not-allowed; color:var(--text);"':'style="border:none; background:var(--bg-soft); width:32px; height:32px; border-radius:999px; cursor:pointer; color:var(--text);"'}>›</button>
    </div>
    <div class="calendar-grid">
      ${['日','月','火','水','木','金','土'].map(d => `<div class="cal-head">${d}</div>`).join('')}
      ${Array(first).fill('<div></div>').join('')}
      ${Array.from({length:days}, (_,i) => {
        const day = i+1;
        const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const m = moodMap[dateKey];
        const moodObj = m ? MOODS.find(x => x.id === m.moodScore) : null;
        return `<button class="cal-cell ${m?'has-data':''}" data-act="day-detail" data-date="${dateKey}" style="border:none; cursor:pointer;">
          <div class="cal-cell-day">${day}</div>
          <div class="cal-cell-emoji">${moodObj ? moodObj.emoji : ''}</div>
        </button>`;
      }).join('')}
    </div>
  </div>`;

  // 5色凡例
  html += `<div class="text-tiny text-muted text-center" style="margin: 8px 0 14px;">
    <span style="margin-right:6px;">⛈ とてもつらい</span>
    <span style="margin-right:6px;">🌧 つらい</span>
    <span style="margin-right:6px;">☁ ふつう</span>
    <span style="margin-right:6px;">🌤 よい</span>
    <span>☀ とてもよい</span>
  </div>`;

  // すぷらんからのひとこと
  html += `
    <div class="kr-hero-card">
      <div style="width:48px; height:48px;">${suplan({ stage: 'futaba', expression: 'happy', size: 48 })}</div>
      <div>
        <div class="kr-hero-title">今週のすぷらんからのひとこと</div>
        <div class="kr-hero-msg">${escapeHtml(generateWeeklySuplanMessage())}</div>
      </div>
    </div>
  `;

  // 記録一覧（フィルタ + すぷらんメモ）
  const filter = state.ui.recordFilter || 'all';
  html += `
    <h3 class="section-title">最近のきろく</h3>
    <div class="kr-filter-row">
      <button class="kr-filter-chip ${filter==='all'?'selected':''}" data-act="record-filter" data-filter="all">すべて</button>
      <button class="kr-filter-chip ${filter==='mood'?'selected':''}" data-act="record-filter" data-filter="mood">気分</button>
      <button class="kr-filter-chip ${filter==='moyamoya'?'selected':''}" data-act="record-filter" data-filter="moyamoya">もやもや</button>
      <button class="kr-filter-chip ${filter==='ippo'?'selected':''}" data-act="record-filter" data-filter="ippo">いっぽ</button>
    </div>
  `;

  // フィルタに応じて結合
  let items = [];
  if (filter === 'all' || filter === 'mood') {
    items = items.concat((state.moodLogs || []).map(m => ({ kind: 'mood', t: m.createdAt, data: m })));
  }
  if (filter === 'all' || filter === 'moyamoya') {
    items = items.concat((state.moyamoyaRecords || []).map(r => ({ kind: 'moyamoya', t: r.createdAt, data: r })));
  }
  if (filter === 'all' || filter === 'ippo') {
    items = items.concat((state.ippoSessions || []).filter(s => s.completedAt).map(s => ({ kind: 'ippo', t: s.completedAt, data: s })));
  }
  items.sort((a, b) => new Date(b.t) - new Date(a.t));
  items = items.slice(0, 12);

  if (items.length === 0) {
    html += `<div class="card mt-3 text-center text-soft" style="padding:30px 20px;">
      まだ記録がありません。<br>ホームから「きもち」を残してみよう。
    </div>`;
  } else {
    html += items.map(renderKirokuRowItem).join('');
  }

  return html;
}

  const log = chat.sourceType === 'mood_log'
    ? state.moodLogs.find(l => l.id === chat.sourceId)

// 思考のクセ レーダーチャート（仕様書 §6）

function viewKirokuRadar() {
  const records = state.moyamoyaRecords || [];
  const distortions = analyzeDistortions(records, 28);
  // レーダー軸: 主要5パターン
  const axes = [
    distortions.find(d => d.id === 'overgeneralization') || { name: '過度な一般化', score: 0 },
    distortions.find(d => d.id === 'mind_reading')       || { name: '心の読みすぎ', score: 0 },
    distortions.find(d => d.id === 'labeling')           || { name: 'レッテル貼り', score: 0 },
    distortions.find(d => d.id === 'all_or_nothing')     || { name: '感情的決めつけ', score: 0 },
    distortions.find(d => d.id === 'should')             || { name: 'べき思考', score: 0 },
  ];

  // SVGレーダーチャート
  const cx = 150, cy = 150, R = 110;
  const N = axes.length;
  const angle = (i) => -Math.PI / 2 + (2 * Math.PI * i / N);
  const point = (i, frac) => `${cx + Math.cos(angle(i)) * R * frac},${cy + Math.sin(angle(i)) * R * frac}`;

  // 同心円（4段階）
  const grid = [0.25, 0.5, 0.75, 1].map(f => {
    const pts = Array.from({length: N}, (_, i) => point(i, f)).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="var(--divider)" stroke-width="1" />`;
  }).join('');

  // 平均参考線（全部30%固定）
  const avgPts = Array.from({length: N}, (_, i) => point(i, 0.3)).join(' ');
  // ユーザーデータ
  const userPts = axes.map((a, i) => point(i, Math.min(1, a.score / 100))).join(' ');
  // 軸線
  const axisLines = Array.from({length: N}, (_, i) => `<line x1="${cx}" y1="${cy}" x2="${point(i, 1).split(',')[0]}" y2="${point(i, 1).split(',')[1]}" stroke="var(--divider)" stroke-width="1" />`).join('');
  // ラベル
  const labels = axes.map((a, i) => {
    const lp = point(i, 1.18).split(',');
    return `<text x="${lp[0]}" y="${lp[1]}" text-anchor="middle" font-size="11" fill="var(--text)" alignment-baseline="middle">${a.name}</text>`;
  }).join('');
  // ラベル下の状態
  const subLabels = axes.map((a, i) => {
    const lp = point(i, 1.32).split(',');
    const lvl = distortionLabel(a.score || 0);
    return `<text x="${lp[0]}" y="${lp[1]}" text-anchor="middle" font-size="10" fill="${lvl.color}">${lvl.label}</text>`;
  }).join('');

  return `
    <div class="screen active" style="padding-bottom:40px;">
      <div class="kr-det-page-h">
        <button class="kr-det-back" data-act="open-trend">‹</button>
        <span style="font-size:14px; font-weight:500;">思考のクセのバランス</span>
        <span style="width:36px;"></span>
      </div>
      <div style="padding: 0 16px;">
        <div class="kr-radar-legend">
          <div class="kr-radar-legend-item"><span class="kr-radar-legend-dot" style="background:#D77B5B;"></span>あなた</div>
          <div class="kr-radar-legend-item"><span class="kr-radar-legend-dot" style="background:var(--text-muted);"></span>平均</div>
        </div>
        <div class="kr-radar-wrap">
          <svg viewBox="0 0 300 320" style="width:100%; height:auto;" aria-label="思考のクセのバランス">
            ${grid}
            ${axisLines}
            <polygon points="${avgPts}" fill="rgba(120,120,120,0.08)" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 3" />
            <polygon points="${userPts}" fill="rgba(215,123,91,0.18)" stroke="#D77B5B" stroke-width="1.5" />
            ${axes.map((a, i) => {
              const p = point(i, Math.min(1, a.score / 100)).split(',');
              return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#D77B5B" />`;
            }).join('')}
            ${labels}
            ${subLabels}
          </svg>
        </div>

        <div class="ippo-do-card" style="margin-top: 14px;">
          <div style="margin: 0 auto 6px;">${suplan({ stage: 'futaba', expression: 'calm', size: 48 })}</div>
          <p style="margin: 4px 0; font-size: 13px; line-height: 1.85;">
            バランスを知ることで、もっと自分をラクにしてあげようね。<br>
            強く出ているクセほど、ちょっとしたきっかけで気づきやすいよ。
          </p>
        </div>

        <div style="display:grid; gap: 10px; margin-top: 18px;">
          <button class="btn btn-primary" data-act="open-action">行動のヒントを見る</button>
          <button class="btn-ghost" data-act="open-trend">‹ 推移に戻る</button>
        </div>
      </div>
    </div>
  `;
}

let distortionView = { tab:'summary', detailTab:'overview', selectedId:null, basisExpanded:false };
let distortionAnalysis = null;
let distortionAnalysisSig = '';
let distortionAnalysisBusy = false;

function daStateSignature() {
  const m = state.moyamoyaRecords || [], d = state.deepDiveSessions || [];
  const lastM = m.length ? m[m.length - 1].createdAt : '';
  const lastD = d.length ? (d[d.length - 1].completedAt || d[d.length - 1].startedAt) : '';
  const self = state.kizukiResults && state.kizukiResults.distortion ? state.kizukiResults.distortion.completedAt : '';
  return `${m.length}|${d.length}|${(state.aiChats || []).length}|${(state.moodLogs || []).length}|${lastM}|${lastD}|${self}`;
}

function ensureDistortionAnalysis() {
  const sig = daStateSignature();
  if (distortionAnalysis && distortionAnalysisSig === sig) return;
  distortionAnalysis = buildDistortionSkeleton(state);   // 即時ルールベース表示
  distortionAnalysisSig = sig;
  distortionAnalysisBusy = false;
  if (!distortionView.selectedId && distortionAnalysis.topDistortions[0]) {
    distortionView.selectedId = distortionAnalysis.topDistortions[0].id;
  }
  if (getInviteCode()) {
    distortionAnalysisBusy = true;
    const sigAtCall = sig;
    analyzeDistortionsDeep(state).then(r => {
      distortionAnalysisBusy = false;
      if (daStateSignature() === sigAtCall) {
        distortionAnalysis = r;
        if (currentScreen === 'record' && (state.ui.recordSubtab || 'calendar') === 'distortion') render();
      }
    }).catch(() => { distortionAnalysisBusy = false; });
  }
}

  }).join('');
  const avgPts = Array.from({ length:N }, (_, i) => point(i, 0.15)).join(' ');
  const userPts = axes.map((a, i) => point(i, Math.min(1, a.score / 100))).join(' ');
  const dots = axes.map((a, i) => { const p = point(i, Math.min(1, a.score / 100)).split(','); return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#D77B5B"/>`; }).join('');
  const labels = axes.map((a, i) => { const p = point(i, 1.2).split(','); return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="10.5" fill="var(--text)">${a.name}</text>`; }).join('');
  const subs = axes.map((a, i) => { const p = point(i, 1.34).split(','); return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="9.5" fill="${daToneColor(a.level.tone)}">${a.level.key}</text>`; }).join('');
  return `<svg viewBox="0 0 300 320" style="width:100%; height:auto;" aria-label="思考のクセのバランス">${grid}${axisLines}<polygon points="${avgPts}" fill="rgba(120,120,120,0.08)" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 3"/><polygon points="${userPts}" fill="rgba(215,123,91,0.18)" stroke="#D77B5B" stroke-width="1.5"/>${dots}${labels}${subs}</svg>`;
}

      </div>

function daViewOverview(a) {
  const RAD = ['overgeneralization', 'mind_reading', 'labeling', 'all_or_nothing', 'should'];
  const axes = RAD.map(id => {
    const d = (a.allDistortions || []).find(x => x.id === id) || { name:id, score:0 };
    return { name:d.name, score:d.score, level:daLevel(d.score) };
  });
  return `
    <div class="kr-radar-legend">
      <div class="kr-radar-legend-item"><span class="kr-radar-legend-dot" style="background:#D77B5B;"></span>あなた</div>
      <div class="kr-radar-legend-item"><span class="kr-radar-legend-dot" style="background:var(--text-muted);"></span>平均</div>
    </div>
    <div class="kr-radar-wrap">${daRadarSvg(axes)}</div>
    <div class="ippo-do-card" style="margin-top:12px;">
      <div style="display:flex; gap:8px; align-items:flex-start;">
        <div>${suplan({ stage:'futaba', expression:'calm', size:40 })}</div>
        <div><div style="font-weight:600; font-size:13px; margin-bottom:4px;">バランスの見方</div>
        <p style="margin:0; font-size:12px; line-height:1.8;">オレンジの線が外側に行くほど、その思考のクセが強い傾向を示します。強く出ているクセほど、気づきのチャンス。バランスを知ることで、自分をラクにするヒントが見えてくるよ。</p></div>
      </div>
    </div>
    ${daNextBtn('trend', '推移をみる')}`;
}

function daViewTrend(a) {
  const trends = (a.trend || []).filter(t => t.currentScore > 0 || t.previousScore > 0).slice(0, 5);
  const overall = (a.trend || []).reduce((s, t) => s + t.delta, 0);
  if (!trends.length) {
    return `<div class="card" style="padding:24px 18px; text-align:center; color:var(--text-soft);">推移を見るには、もう少し記録が必要です。<br>もやもや整理を続けてみよう。</div>${daNextBtn('basis', '根拠をみる')}`;
  }
  return `
    <div class="text-tiny text-muted" style="margin-bottom:10px;">
      <span style="display:inline-block; width:10px; height:10px; background:var(--text-muted); border-radius:50%; margin-right:4px;"></span>前の28日
      <span style="display:inline-block; width:10px; height:10px; background:#6B8F71; border-radius:50%; margin:0 4px 0 12px;"></span>直近28日
    </div>
    ${trends.map(t => `
      <div class="kr-trend-row">
        <div class="kr-trend-name">${escapeHtml(t.name)}</div>
        <div class="kr-trend-bars"><div class="kr-trend-label-old">前</div><div class="kr-trend-bar-bg"><div class="kr-trend-bar-fill" style="width:${t.previousScore}%;"></div></div><div class="kr-trend-pct">${t.previousScore}</div></div>
        <div class="kr-trend-bars"><div class="kr-trend-label-new">今</div><div class="kr-trend-bar-bg"><div class="kr-trend-bar-fill new" style="width:${t.currentScore}%;"></div></div><div class="kr-trend-pct">${t.currentScore}</div></div>
        <div class="kr-trend-delta ${t.delta < 0 ? 'improved' : t.delta > 0 ? 'worsened' : ''}">${t.delta === 0 ? '±0' : (t.delta < 0 ? t.delta : '+' + t.delta)}</div>
      </div>
    `).join('')}
    <div class="ippo-do-card" style="margin-top:14px;">
      <div style="margin:0 auto 6px;">${suplan({ stage:'futaba', expression:'happy', size:44 })}</div>
      <p style="margin:4px 0; font-size:13px; line-height:1.85;">${overall <= -10 ? 'いい方向に動いてるね。気づくことが変化の第一歩だよ。' : overall >= 10 ? '波があるのは自然なこと。記録を続けると見えてくるよ。' : '今は落ち着いた時期。続けるとゆっくり変化していくよ。'}</p>
    </div>
    ${daNextBtn('basis', '根拠をみる')}`;
}

function daViewBasis(a) {
  const list = a.allDistortions || [];
  if (!list.length) return `<div class="card" style="padding:20px; text-align:center; color:var(--text-soft);">分析できる記録がまだありません。</div>`;
  const sel = distortionView.selectedId || (a.topDistortions[0] && a.topDistortions[0].id) || list[0].id;
  const d = list.find(x => x.id === sel) || list[0];
  const evid = d.evidence || [];
  const lim = distortionView.basisExpanded ? evid.length : 3;
  const shown = evid.slice(0, lim);
  return `
    <div style="margin-bottom:12px;">
      <div class="text-tiny text-muted" style="margin-bottom:6px;">思考のクセを選ぶ</div>
      <select onchange="window.daSelectDistortion(this.value)" style="width:100%; padding:10px 12px; border:1px solid var(--divider); border-radius:10px; background:var(--bg-card); font-size:14px; color:var(--text);">
        ${list.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${x.name}（${x.score}）</option>`).join('')}
      </select>
    </div>
    <div style="font-size:13px; font-weight:600; margin:10px 0 8px;">この傾向はあなたの記録からこんな場面で見られました</div>
    ${shown.length ? shown.map(e => `
      <div class="card" style="padding:12px 14px; margin-bottom:8px;">
        <div class="text-tiny text-muted">${daSourceTypeLabel(e.sourceType)}（${daMmdd(e.date)}）</div>
        <div style="font-size:13px; margin:4px 0; line-height:1.6;">「${escapeHtml(e.text)}」</div>
        <span class="dd-tag">${daSourceFieldLabel(e.sourceField)}</span>
        ${e.strength != null ? `<span class="text-tiny text-muted" style="margin-left:8px;">強さ ${e.strength}/10</span>` : ''}
      </div>
    `).join('') : `<div class="card" style="padding:20px; text-align:center; color:var(--text-soft); font-size:13px;">この傾向の記録はまだ見つかっていません。<br>ワークを続けると見えてきます。</div>`}
    ${evid.length > 3 && !distortionView.basisExpanded ? `<button class="btn btn-secondary" data-act="da-basis-more" style="width:100%; margin-top:4px;">もっと見る（あと${evid.length - 3}件）</button>` : ''}
    <p class="text-tiny text-muted" style="margin-top:12px; line-height:1.7;">※ 記録をもとにあなたの傾向を分析したもので、診断ではありません。</p>
    ${daNextBtn('action', '行動ヒントをみる')}`;
}

function daViewAction(a) {
  const t = a.topDistortions[0];
  if (!t || t.score < 8) {
    return `<div class="card" style="padding:24px 18px; text-align:center; color:var(--text-soft);">まだ行動ヒントを出せるほどの傾向は見えていません。<br>もう少し記録を続けてみよう。</div>`;
  }
  const hints = t.hints || [];
  return `
    <div style="font-size:13px; font-weight:600; margin:4px 0 10px;">あなたにおすすめのこと</div>
    ${hints.map(h => `
      <div class="card" style="padding:14px; margin-bottom:10px; display:flex; gap:10px; align-items:flex-start;">
        <span style="font-size:20px;">${h.icon}</span>
        <div><div style="font-weight:600; font-size:13px;">${escapeHtml(h.title)}</div>
        <div class="text-tiny text-muted" style="margin-top:2px; line-height:1.6;">${escapeHtml(h.desc)}</div></div>

      <div style="font-size:13px; font-weight:500; margin:4px 0 8px;">${escapeHtml(t.actionHint)}</div>
      <button class="btn-ghost" data-act="open-action" style="font-size:12px; padding:6px 0;">やってみたことを記録する ›</button>
    </div>`;
}

function daViewDetail(a) {
  const dt = distortionView.detailTab || 'overview';
  const sub = (key, label) => `<button data-act="da-detail-tab" data-dtab="${key}" style="flex:1; padding:8px 0; background:${dt === key ? 'var(--accent-soft)' : 'var(--bg-soft)'}; border:none; border-radius:999px; font-weight:500; font-size:12px; cursor:pointer; color:${dt === key ? 'var(--accent-deep)' : 'var(--text-soft)'};">${label}</button>`;

}

function openDistortionWorksModal() {
  const a = distortionAnalysis || buildDistortionSkeleton(state);
  const WORKS = {
    'moyamoya':            { title:'もやもや整理（コラム法）',   icon:'📝', min:'約15分', desc:'自動思考を整理して、考え方のクセを見つけるのに最適です。' },
    'deep-dive':           { title:'下向き矢印法',               icon:'🔽', min:'約15分', desc:'思考の奥にある信念（コアビリーフ）を探るワークです。' },
    'distortion':          { title:'認知のゆがみセルフチェック', icon:'🧠', min:'約10分', desc:'自分の思考パターンを広く確認できます。' },
    'behavior-experiment': { title:'行動実験',                   icon:'🧪', min:'約15分', desc:'考え方のクセを検証してみるワークです。' },
    'stimulus':            { title:'刺激統制',                   icon:'🎯', min:'約15分', desc:'環境を整えて行動を続けやすくするワークです。' },

  const recs = a.recommendedWorks || [];

    const w = WORKS[id]; if (!w) return '';
    return `
      <div class="card" style="padding:14px; margin-bottom:10px;">
        <div style="display:flex; gap:10px; align-items:flex-start;">
          <span style="font-size:20px;">${w.icon}</span>
          <div style="flex:1; min-width:0;">
            <div style="font-weight:600; font-size:14px;">${w.title}</div>
            <div class="text-tiny text-muted" style="margin:2px 0 6px; line-height:1.6;">${escapeHtml(reason || w.desc)}</div>
            <div class="text-tiny text-muted">所要時間: ${w.min}</div>
          </div>
          <button class="btn btn-primary" data-act="da-start-work" data-work="${id}" style="padding:8px 14px; font-size:13px; white-space:nowrap; align-self:center;">はじめる</button>
        </div>
      </div>`;
  };
  const html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <h2 class="modal-title" style="margin:0; font-size:17px;">精度を高めるワークの提案</h2>
      <button data-act="close-modal" style="border:none; background:none; font-size:18px; cursor:pointer; color:var(--text-soft);">✕</button>
    </div>
    <p style="font-size:13px; color:var(--text-soft); line-height:1.7; margin:0 0 14px;">より自分に合った分析にするために、以下のワークに取り組んでみましょう。</p>

    ${others.length ? `<h3 class="section-title">今の他のワーク</h3>${others.map(id => card(id)).join('')}` : ''}
    <button class="btn btn-secondary" data-act="close-modal" style="width:100%; margin-top:6px;">閉じる</button>`;
  modal(html);
}

      </div>
      <h4 class="kr-graph-topics-h">曜日ごとのトピックス（よくあったこと）</h4>
      <div class="kr-graph-topic-list">
        ${data.points.map((p, i) => {
          const dayLabel = data.labels[i];
          const tone = (p.value == null) ? 'ふつう' : (p.value >= 7 ? '気分が上がりやすい日' : p.value >= 5 ? '安定して過ごしやすい日' : '少し気分が下がる日');
          return `
            <div class="kr-graph-topic-row">
              <div class="kr-graph-topic-row-icon" style="background:${weekdayBg(i)}; color:${weekdayFg(i)};">${dayLabel}</div>

                <div class="kr-graph-topic-row-desc">${p.value == null ? '記録なし' : '平均 '+p.value.toFixed(1)+'/10'}</div>
              </div>
              <div class="kr-graph-topic-row-side">
                <div class="kr-graph-topic-row-side-h">よくあったこと</div>

              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // ---- 傾向まとめ ----
  const summary = generateGraphTrendSummary(tab, moodLogs);
  if (summary) {
    html += `
      <div class="kr-graph-summary">
        <div class="kr-graph-summary-h">
          <span class="kr-graph-summary-icon">${tab==='date' ? '🌱' : tab==='hour' ? '💡' : '💗'}</span>
          <span>傾向まとめ</span>

  html += `
