// 行動タグの導出（既存フィールドからルールで推定）
function deriveActionTags(action) {
  const t = (action.title || '') + ' ' + (action.desc || '');
  const purpose = new Set();
  const means = new Set();

  // 目的タグ
  if (action.cat === 'cognitive') purpose.add('思考整理');
  if (action.technique === 'リラクセーション' || action.technique === 'マインドフルネス') purpose.add('リラックス');
  if (action.technique === '行動活性化') { purpose.add('行動を起こす'); purpose.add('気分転換'); }
  if (action.technique === '認知再構成' || action.technique === 'セルフコンパッション') purpose.add('自己否定を和らげる');
  if (action.technique === 'マインドフルネス' || /呼吸|不安/.test(t)) purpose.add('不安軽減');
  if (action.cat === 'physical' && /散歩|料理|片付|植物|風景|音楽/.test(t)) purpose.add('気分転換');
  if (action.cat === 'assertion') purpose.add('行動を起こす');
  if (purpose.size === 0) purpose.add('気分転換');

  // 手段タグ
  if (/書|紙|メモ|文/.test(t)) means.add('書く');
  if (/話|伝え|頼/.test(t)) means.add('話す');
  if (action.cat === 'physical' && /散歩|ストレッチ|肩|風呂|料理|片付/.test(t)) means.add('体を動かす');
  if (/呼吸|瞑想|スキャン|聴く|聞く/.test(t)) means.add('呼吸・瞑想');
  if (action.cat === 'cognitive') means.add('考え方を変える');

  // 時間タグ
  const time = action.time || '';
  if (/^1分$/.test(time) || /1分以内/.test(time)) means.add('1分以内');
  else if (/^[2-5]分$/.test(time) || /3-5|3〜5|5-10|3分|5分/.test(time)) means.add('3〜5分');

  // 屋内/屋外
  if (/散歩|日光/.test(t)) means.add('屋外');
  else means.add('屋内');

  // ひとり/誰か
  if (/話|伝え|頼/.test(t)) means.add('誰かとできる');
  else means.add('ひとりでできる');

  // 道具
  if (!/動画|スマホ|料理|風呂|アロマ|植物|お茶|温かい/.test(t)) means.add('道具不要');

  return { purpose: [...purpose], means: [...means] };
}

// 5要素加重スコア（仕様書 §4 基本方針）+ 方向ボーナス
// 感情との相性 ×0.30 + 過去の効果 ×0.30 + 実行しやすさ ×0.20
// + 傾向との相性 ×0.15 + 新しさ・偏り防止 ×0.05 = 100点満点
// + 方向との一致ボーナス（emotionAffinityに加算、上限維持）
function scoreAction(action, ctx) {
  const tags = deriveActionTags(action);
  const history = ctx.history || [];
  // v0.9.40 〜: directionIds (配列) を優先・既存 directionId は1要素配列として後方互換
  const ctxIds = Array.isArray(ctx.directionIds) ? ctx.directionIds
                : ctx.directionId ? [ctx.directionId]
                : getDirectionIds();
  const directions = ctxIds.map(getDirection).filter(Boolean);
  const direction = directions[0] || null;  // 既存の表示・reasons用

  // ① 感情との相性（最大30）+ 方向ボーナス
  const wantPriority = MOOD_PURPOSE_PRIORITY[ctx.moodLabel] || ['気分転換', '行動を起こす', 'リラックス'];
  let emotionAffinity = 0;
  for (let i = 0; i < wantPriority.length; i++) {
    if (tags.purpose.includes(wantPriority[i])) {
      emotionAffinity = 30 - i * 8;  // 30 / 22 / 14
      break;
    }
  }
  if (emotionAffinity === 0) emotionAffinity = 8;
  // 方向の希望purposesといずれかが一致 → +6（上限30）
  if (directions.some(d => d.purposes.some(p => tags.purpose.includes(p)))) {
    emotionAffinity = Math.min(30, emotionAffinity + 6);
  }

  // ② 過去の効果（最大30）— 同 actionId の changeValue 平均
  const past = history.filter(s => s.actionId === action.id && typeof s.changeValue === 'number');
  let pastEffect = 0;
  if (past.length > 0) {
    const avg = past.reduce((s, l) => s + l.changeValue, 0) / past.length;
    pastEffect = Math.max(0, Math.min(30, avg * 5));  // 6点改善で30点
  } else {
    pastEffect = 12;  // 未経験は中庸
  }

  // ③ 実行しやすさ（最大20）+ duration filter による調整
  let ease = 10;
  if (tags.means.includes('1分以内')) ease = 20;
  else if (tags.means.includes('3〜5分')) ease = 16;
  // duration filter: ユーザーが「もう少しできそう」を選んだら長めの行動にボーナス
  if (ctx.durationPref === '3min' && tags.means.includes('3〜5分')) ease = Math.min(20, ease + 4);
  if (ctx.durationPref === '5min' && !tags.means.includes('1分以内')) ease = Math.min(20, ease + 4);
  if (ctx.durationPref === '1min' && !tags.means.includes('1分以内')) ease = Math.max(0, ease - 6);

  // ④ 傾向との相性（最大15）— 過去に類似カテゴリで効果が出ていた回数 + 深掘りタグ
  const similar = history.filter(s => {
    const sa = ACTIONS.find(a => a.id === s.actionId);
    return sa && sa.cat === action.cat && (s.changeValue || 0) >= 1;
  });
  let trendMatch = Math.min(15, 5 + similar.length * 2);

  // ⑤ 新しさ・偏り防止（最大5）
  const recent5 = history.slice(-5);
  const usedRecently = recent5.some(s => s.actionId === action.id);
  let novelty = usedRecently ? 0 : 5;

  const total = Math.round(emotionAffinity + pastEffect + ease + trendMatch + novelty);
  return {
    total: Math.max(0, Math.min(100, total)),
    breakdown: { emotionAffinity, pastEffect, ease, trendMatch, novelty },
    tags,
  };
}

// 推薦理由の生成（テンプレ）
function generateActionReasons(action, score, ctx) {
  const reasons = [];
  const tags = score.tags;
  const past = (ctx.history || []).filter(s => s.actionId === action.id && (s.changeValue || 0) >= 1);

  if (past.length > 0) {
    const recent = past[past.length - 1];
    reasons.push(`${ctx.moodLabel}の時に、${action.title}で気持ちが${recent.beforeIntensity}→${recent.afterIntensity}に軽くなった実績があります`);
  } else if (score.breakdown.emotionAffinity >= 22) {
    const wantPriority = MOOD_PURPOSE_PRIORITY[ctx.moodLabel] || [];
    const matched = tags.purpose.find(p => wantPriority.includes(p));
    if (matched) reasons.push(`${ctx.moodLabel}が強い時に「${matched}」の効果が期待できる行動です`);
  }

  if (tags.means.includes('1分以内')) {
    reasons.push(`1分でできて、いつでも取り組みやすい行動です`);
  } else if (tags.means.includes('3〜5分')) {
    reasons.push(`${action.time}でできて、いつでも取り組みやすい行動です`);
  }

  if (tags.purpose.includes('自己否定を和らげる') && reasons.length < 3) {
    reasons.push(`自分への優しさを取り戻すきっかけになります`);
  }
  if (tags.purpose.includes('思考整理') && reasons.length < 3) {
    reasons.push(`頭の中のもやもやを言葉にして整理できます`);
  }

  return reasons.slice(0, 3);
}

// 上位 N 件の推薦
function getTopRecommendations(ctx, n = 5) {
  const allScored = ACTIONS.map(a => ({
    action: a,
    score: scoreAction(a, ctx),
  }));
  allScored.sort((x, y) => y.score.total - x.score.total);
  return allScored.slice(0, n).map(s => ({
    ...s,
    reasons: generateActionReasons(s.action, s.score, ctx),
  }));
}

// 次の一歩の推薦（Step 7 用）— 既に実施した行動を除外し、長めの行動を優先
function getNextStepRecommendations(ippoState, n = 3) {
  const usedAction = ACTIONS.find(a => a.id === ippoState.selectedActionId);
  const usedTags = usedAction ? deriveActionTags(usedAction) : null;
  const ctx = {
    moodLabel: ippoState.moodLabel || 'なんとなく',
    intensity: ippoState.afterIntensity,
    history: state.ippoSessions || [],
    directionIds: ippoState.directionIds || getDirectionIds(),
    // 短い行動を済ませたなら、次は少し長めの行動を勧める
    durationPref: usedTags && usedTags.means.includes('1分以内') ? '3min'
                : usedTags && usedTags.means.includes('3〜5分') ? '5min'
                : null,
  };
  const candidates = ACTIONS.filter(a => a.id !== ippoState.selectedActionId).map(a => ({
    action: a,
    score: scoreAction(a, ctx),
  }));
  candidates.sort((x, y) => y.score.total - x.score.total);
  return candidates.slice(0, n).map(s => ({
    ...s,
    reasons: generateActionReasons(s.action, s.score, ctx),
  }));
}

// 1ヶ月超の記録を自動クリーンアップ（v0.9.5 容量コントロール）
// ============================================================
function cleanupOldRecords() {
  const oneMonthAgo = new Date();
  oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
  const cutoff = oneMonthAgo.getTime();
  const isRecent = (iso) => iso && new Date(iso).getTime() >= cutoff;
  let removed = 0;
  const before = {
    moodLogs: (state.moodLogs || []).length,
    moyamoyaRecords: (state.moyamoyaRecords || []).length,
    aiChats: (state.aiChats || []).length,
    ippoSessions: (state.ippoSessions || []).length,
    deepDiveSessions: (state.deepDiveSessions || []).length,
  };
  state.moodLogs        = (state.moodLogs || []).filter(r => isRecent(r.createdAt));
  state.moyamoyaRecords = (state.moyamoyaRecords || []).filter(r => isRecent(r.createdAt));
  state.aiChats         = (state.aiChats || []).filter(r => isRecent(r.createdAt));
  state.ippoSessions    = (state.ippoSessions || []).filter(r => isRecent(r.completedAt || r.startedAt));
  state.deepDiveSessions = (state.deepDiveSessions || []).filter(r => isRecent(r.completedAt || r.startedAt));
  removed = (before.moodLogs - state.moodLogs.length)
          + (before.moyamoyaRecords - state.moyamoyaRecords.length)
          + (before.aiChats - state.aiChats.length)
          + (before.ippoSessions - state.ippoSessions.length)
          + (before.deepDiveSessions - state.deepDiveSessions.length);
  state.lastCleanup = Date.now();
  if (removed > 0) { try { saveState(); } catch (_) {} }
  return removed;
}

// 起動時 1日1回までクリーンアップ実行
(function maybeCleanupOnInit() {
  const last = state.lastCleanup || 0;
  const ONE_DAY = 24 * 60 * 60 * 1000;
  if (Date.now() - last > ONE_DAY) {
    try { cleanupOldRecords(); } catch (_) {}
  }
})();

function loadState() {
  try {
    // v3 を優先
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const loaded = JSON.parse(raw);
      return Object.assign(defaultState(), loaded);
    }
    // v3 が無ければ v2 から最低限を引き継ぐ
    const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
    if (rawV2) {
      const v2 = JSON.parse(rawV2);
      const s = defaultState();
      if (v2.consent) s.consent = v2.consent;
      if (v2.user) s.user = v2.user;
      s.initialDone = !!v2.initialDone;
      // todayMood + records → moodLogs に集約
      const list = [];
      if (Array.isArray(v2.records)) {
        v2.records.forEach(r => {
          if (r && r.score) list.push({
            id: 'mig_' + Math.random().toString(36).slice(2, 9),
            moodScore: r.score,
            moodLabel: '',
            categories: r.domain ? [mapV2DomainToCategory(r.domain)] : [],
            comment: r.comment || '',
            createdAt: r.date ? new Date(r.date).toISOString() : new Date().toISOString()
          });
        });
      }
      if (v2.todayMood && v2.todayMood.score) {
        list.push({
          id: 'mig_today',
          moodScore: v2.todayMood.score,
          moodLabel: '',
          categories: [],
          comment: v2.todayMood.comment || '',
          createdAt: v2.todayMood.date ? new Date(v2.todayMood.date).toISOString() : new Date().toISOString()
        });
      }
      s.moodLogs = list;
      return s;
    }
    return defaultState();
  } catch (e) {
    console.warn('state load error:', e);
    return defaultState();
  }
}

function mapV2DomainToCategory(domain) {
  const map = { work:'work', relationship:'friend', self:'self', sleep:'health', sns:'other', money:'money', future:'future', good:'other', later:'other' };
  return map[domain] || 'other';
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { console.warn('save error', e); }
}

function uid() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function todayKey(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function getMode() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'morning';
  if (h >= 19 || h < 3) return 'night';
  return 'day';
}

function getVisualTheme() {
  // 手動上書き対応
  if (state.preferences && state.preferences.themeOverride) {
    return state.preferences.themeOverride;   // 'light' | 'dark'
  }
  const h = new Date().getHours();
  return (h >= 18 || h < 5) ? 'dark' : 'light';
}
function applyVisualTheme() {
  const theme = getVisualTheme();
  document.documentElement.setAttribute('data-theme', theme);
  // theme-color メタタグも切替
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#1F2A2A' : '#6B8F71');
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function detectDistortion(text) {
  const lower = (text || '').toLowerCase();
  for (const d of DISTORTIONS) {
    for (const ex of d.examples) {
      if (lower.includes(ex.toLowerCase())) return d;
    }
  }
  return null;
}

function detectCrisis(text) {
  const lower = (text || '').toLowerCase();
  let max = 0;
  for (const c of CRISIS_WORDS) {
    if (lower.includes(c.word)) max = Math.max(max, c.sev);
  }
  return max;
}

// 論理ビューが切り替わった時にスクロール位置を最上部に戻すためのキー (v0.9.59 〜)
let _lastRenderKey = '';
function getRenderKey() {
  let k = currentScreen || '';
  if (typeof ippoToday !== 'undefined' && ippoToday) k += ':ippo' + ippoToday.step;
  if (typeof habitView !== 'undefined' && habitView) k += ':habit:' + habitView.habitId + ':' + (habitView.mode || '');
  if (typeof habitsCalView !== 'undefined' && habitsCalView) k += ':habitcal';
  if (typeof moyamoya !== 'undefined' && moyamoya && moyamoya.step) k += ':moya' + moyamoya.step;
  if (typeof deepDive !== 'undefined' && deepDive && deepDive.step) k += ':dd' + deepDive.step;
  if (typeof behaviorExpSession !== 'undefined' && behaviorExpSession && behaviorExpSession.step) k += ':bx' + behaviorExpSession.step;
  if (typeof stimulusSession !== 'undefined' && stimulusSession && stimulusSession.step) k += ':sc' + stimulusSession.step;
  return k;
}

function render() {
  // タブバー＆FAB の表示制御（v3.5 仕様: ホームには独自CTAがあるためFABは非表示）
  const showTabbar = ['home', 'action', 'kizuki', 'kizuki-list', 'record'].includes(currentScreen);
  const showFab = false;        // FAB全廃（ホームのきもち/もやもやCTAで代替）
  document.getElementById('tabbar').style.display = showTabbar ? 'flex' : 'none';
  document.getElementById('fab').classList.toggle('hidden', !showFab);

  // タブバー active 状態 (サブ画面でも親タブをハイライト)
  const activeTab = currentScreen === 'kizuki-list' ? 'kizuki' : currentScreen;
  document.querySelectorAll('.navbtn').forEach(el => {
    const tab = el.dataset.tab;
    el.classList.toggle('active', tab === activeTab);
  });

  let html = '';
  switch (currentScreen) {
    case 'welcome':         html = viewWelcome(); break;
    case 'consent':         html = viewConsent(); break;
    case 'nickname':        html = viewNickname(); break;
    case 'profile':         html = viewProfile(); break;
    case 'guide':           html = viewGuide(); break;
    case 'invite-code':     html = viewInviteCode(); break;
    case 'home':            html = viewHome(); break;
    case 'mood-full':       html = viewMoodFull(); break;
    case 'mood-chat':       html = viewMoodChat(); break;
    case 'moyamoya':        html = viewMoyamoya(); break;
    case 'deepdive':        html = viewDeepDive(); break;
    case 'action':          html = viewAction(); break;
    case 'kizuki':          html = viewKizuki(); break;
    case 'kizuki-list':     html = viewKizukiList(); break;
    case 'kizuki-work':     html = viewKizukiWork(); break;
    case 'kizuki-all-records': html = viewKizukiAllRecords(); break;
    case 'kizuki-record-detail': html = viewKizukiRecordDetail(); break;
    case 'behavior-exp':    html = viewBehaviorExp(); break;
    case 'stimulus':        html = viewStimulus(); break;
    case 'record':          html = viewRecord(); break;
    case 'day-detail':      html = viewDayDetail(); break;
    case 'kiroku-detail':       html = viewKirokuDetail(); break;
    case 'kiroku-letter':       html = viewKirokuLetter(); break;
    case 'kiroku-ippo':         html = viewKirokuIppo(); break;
    case 'kiroku-trend':        html = viewKirokuTrend(); break;
    case 'kiroku-radar':        html = viewKirokuRadar(); break;
    case 'kiroku-ai-analysis':  html = viewKirokuAiAnalysis(); break;
    case 'kiroku-chat':         html = viewKirokuChat(); break;
    default:                html = viewHome();
  }
  document.getElementById('main').innerHTML = html;

  // 論理ビューが切り替わった時にスクロールを最上部に戻す (v0.9.59 〜)
  // 同じビュー内の再描画 (タイマー一時停止トグル等) では維持。
  // mood-chat / kiroku-chat は visualViewport で独自管理するため除外。
  const newKey = getRenderKey();
  const isChatScreen = currentScreen === 'mood-chat' || currentScreen === 'kiroku-chat';
  if (newKey !== _lastRenderKey && !isChatScreen) {
    window.scrollTo(0, 0);
  }
  _lastRenderKey = newKey;

  // chat-screen をレンダー直後に viewport にフィットさせる
  if (typeof window.fitChatScreenToViewport === 'function') {
    requestAnimationFrame(window.fitChatScreenToViewport);
  }
}

// 「きもちログ + もやもや整理」を統合した活動指標

const HOME_STAT_MILESTONES = [3, 7, 10, 14, 30];

function calcHomeActiveDays() {
  const days = new Set();
  (state.moodLogs || []).forEach(m => { if (m.createdAt) days.add(dateKey(new Date(m.createdAt))); });
  (state.moyamoyaRecords || []).forEach(r => { if (r.createdAt) days.add(dateKey(new Date(r.createdAt))); });
  return days.size;
}
function calcHomeTotalCount() {
  return (state.moodLogs || []).length + (state.moyamoyaRecords || []).length;
}
function calcHomeStreak() {
  const days = new Set();
  (state.moodLogs || []).forEach(m => { if (m.createdAt) days.add(dateKey(new Date(m.createdAt))); });
  (state.moyamoyaRecords || []).forEach(r => { if (r.createdAt) days.add(dateKey(new Date(r.createdAt))); });
  if (days.size === 0) return 0;
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    if (days.has(dateKey(d))) streak++;
    else { if (i === 0) continue; break; }
  }
  return streak;
}
function calcNextMilestone(streak) {
  for (const m of HOME_STAT_MILESTONES) if (streak < m) return m;
  return Math.ceil((streak + 1) / 30) * 30;
}

function viewHome() {

  const target = calcNextMilestone(streak);
  const remaining = Math.max(0, target - streak);

let moodChatSession = null;

function viewMoodChat() {
  if (!moodChatSession) return '';
  const log = state.moodLogs.find(l => l.id === moodChatSession.logId);
  // 最後のAIメッセージとユーザーターン数を計算
  const msgs = moodChatSession.messages.filter(m => !m.typing);
  const lastAi = [...msgs].reverse().find(m => m.role === 'assistant');
  const userTurns = msgs.filter(m => m.role === 'user').length;
  const isAwaitingUser = lastAi && (msgs[msgs.length - 1] === lastAi);
  // AIが動的生成した quickReplies を優先。無ければ固定生成にフォールバック
  const replies = isAwaitingUser
    ? (Array.isArray(lastAi?.quickReplies) && lastAi.quickReplies.length
        ? lastAi.quickReplies
        : generateQuickReplies(log, lastAi?.content || '', userTurns))
    : [];

  return `
    <div class="screen active mood-chat-screen">
      <div class="mood-chat-header">
        <button class="page-back" data-act="end-mood-chat">‹</button>
        <span class="page-title">AIと話す</span>

function startMoodChat(log) {
  moodChatSession = { logId: log.id, messages: [] };
  const opening = generateMoodAIOpening(log);
  moodChatSession.messages.push({ role: 'assistant', content: opening, createdAt: new Date().toISOString() });
  go('mood-chat');
}

function generateMoodAIOpening(log) {
  const mood = MOODS.find(m => m.id === log.moodScore);
  const cats = log.categories.map(id => CATEGORIES.find(c => c.id === id)?.name).filter(Boolean);
  const intro = mood && mood.id <= 2
    ? `「${mood.label}」な感じだったんだね。${cats.length ? cats.join('・') + 'のことかな。' : ''}しんどかったね。`
    : mood && mood.id === 3
    ? `${cats.length ? cats.join('・') + 'のことなんだね。' : ''}今日はくもり気味なんだね。`
    : `${cats.length ? cats.join('・') + 'のことだね。' : ''}今日は気持ちが少し上向きみたいだね。`;

  // ひとこと（任意）に記載があれば、引用してそこから会話を開始
  if (log.comment && log.comment.trim()) {
    const c = log.comment.trim();
    const quoted = c.length > 80 ? c.slice(0, 78) + '…' : c;
    return `${intro}\n\n「${quoted}」\nって書いてくれたんだね。\nそのことを、もう少し聞かせてもらえる？`;
  }
  return `${intro}\n\nよかったら、もう少し聞かせてくれる？`;
}

// 4つのクイックリプライ（タップで会話できる）— v0.9.5 タスク2b
// AI 応答の文脈とユーザーターン数に応じて適切な選択肢を生成
function generateQuickReplies(log, lastAiMessage, userTurns) {
  // 初回ターン: ひとこと引用後 or 一般的な聞き出し
  if (userTurns === 0) {
    if (log && log.comment && log.comment.trim()) {
      return [
        'もう少し詳しく話したい',
        '実は別のことが気になってる',
        '今は言葉にならない',

    return [
      '仕事のことで…',
      '人間関係のことで…',
      '体調・睡眠のことで…',
      'うまく言葉にできない',
    ];
  }
  // ターン1-2: 深掘り段階
  if (userTurns <= 2) {
    return [
      'もう少し話す',

      '小さくできる行動を知りたい',
      '聞いてくれてありがとう',

  }

  return [

    'きろくに残しておく',
    '今日はここまで',

}

async function moodChatSend() {
  if (!moodChatSession) return;
  const input = document.getElementById('moodChatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  const crisis = detectCrisis(text);
  if (crisis && crisis.sev >= 4) { showCrisisModal(crisis.sev); return; }

  moodChatSession.messages.push({ role: 'user', content: text, createdAt: new Date().toISOString() });
  // タイピング表示
  moodChatSession.messages.push({ role: 'assistant', content: '…', typing: true, createdAt: new Date().toISOString() });
  document.getElementById('main').innerHTML = viewMoodChat();
  if (typeof window.fitChatScreenToViewport === 'function') requestAnimationFrame(window.fitChatScreenToViewport);
  setTimeout(scrollChatToBottom, 50);

  const log = state.moodLogs.find(l => l.id === moodChatSession.logId);
  let aiText = null;
  let aiReplies = null;
  if (getApiKey()) {
    // 実Gemini通信（mood_chat は JSON 出力: {message, quickReplies}）
    const moodLabel = MOODS.find(m => m.id === log?.moodScore)?.label || '';
    const cats = (log?.categories || []).map(id => CATEGORIES.find(c => c.id === id)?.name).filter(Boolean).join('・');
    const ctx = `ユーザーが記録した気持ち: ${moodLabel}${cats ? '、テーマ: ' + cats : ''}${log?.comment ? '、ひとこと: ' + log.comment : ''}`;
    const history = moodChatSession.messages.filter(m => !m.typing);
    const raw = await callGemini(AI_PROMPTS.mood_chat.systemPrompt + '\n\n' + ctx, history, {
      temperature: AI_PROMPTS.mood_chat.temperature,
      maxTokens: AI_PROMPTS.mood_chat.maxTokens,
      responseMimeType: 'application/json',
    });
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed.message === 'string' && parsed.message.trim()) {
          aiText = parsed.message.trim();
          if (Array.isArray(parsed.quickReplies)) {
            const cleaned = parsed.quickReplies
              .filter(s => typeof s === 'string' && s.trim())
              .map(s => s.trim())
              .slice(0, 4);
            if (cleaned.length) aiReplies = cleaned;
          }
        }
      } catch (e) {
        // JSONパース失敗時は raw を message として表示
        console.warn('[mood_chat] JSON parse failed, fallback to raw text');
        aiText = raw;
      }
      if (!aiText) aiText = raw;
    }
  }
  if (!aiText) {
    aiText = generateMoodAIReply(log, text, moodChatSession.messages.filter(m => !m.typing));
  }
  // タイピング消す
  moodChatSession.messages = moodChatSession.messages.filter(m => !m.typing);
  const aiMsg = { role: 'assistant', content: aiText, createdAt: new Date().toISOString() };
  if (aiReplies && aiReplies.length) aiMsg.quickReplies = aiReplies;
  moodChatSession.messages.push(aiMsg);
  persistAIChat({ sourceType: 'mood_log', sourceId: moodChatSession.logId, messages: moodChatSession.messages.slice() });
  document.getElementById('main').innerHTML = viewMoodChat();
  if (typeof window.fitChatScreenToViewport === 'function') requestAnimationFrame(window.fitChatScreenToViewport);
  setTimeout(scrollChatToBottom, 50);
}

function generateMoodAIReply(log, userText, history) {
  const turns = history.filter(m => m.role === 'user').length;
  if (turns === 1) {
    return 'そっか、教えてくれてありがとう。\n\nその気持ちの中で、いちばん近いのはどれだろう？\n（悲しい / 不安 / 怒り / 焦り / 恥ずかしい / 孤独 / 悔しい / 無力感 など）';
  }
  if (turns === 2) {
    return 'そう感じたんだね。\nその感情の強さを 0〜100 でいうと、どのくらい？\n\n（書いてくれてもいいし、感覚で大丈夫）';
  }
  if (turns === 3) {
    return 'わかった。その重さ、ちゃんと残しておくね。\n\n別の見方をすると、いまの状態だけが「あなた全部」じゃないんだ。\nもしよかったら、最後に「いま、ちょっとだけできそうなこと」を一つだけ、一緒に決めてみない？';
  }
  return '話してくれてありがとう。\n\n今日できそうな小さなこと：\n・3分だけ静かに呼吸する\n・湯船に5分つかる\n・誰かに「おつかれ」と送ってみる\n\nどれもしんどかったらスキップでOK。\n話したことは「きろく」に残しておいたよ。';
}

function endMoodChat() {
  if (moodChatSession && moodChatSession.messages.length > 1) {
    persistAIChat({ sourceType: 'mood_log', sourceId: moodChatSession.logId, messages: moodChatSession.messages.slice() });
  }
  moodChatSession = null;
  go('home');
}

    const PRIMARY_COUNT = 8;
    const showAll = !!s.showAllEmotions;
    const primaryNames = new Set(EMOTIONS.slice(0, PRIMARY_COUNT).map(e => e.name));
    const selectedOutsidePrimary = s.emotion && !primaryNames.has(s.emotion);
    const visibleEmotions = (showAll || selectedOutsidePrimary) ? EMOTIONS : EMOTIONS.slice(0, PRIMARY_COUNT);
    const hasMore = visibleEmotions.length < EMOTIONS.length;
    return moyamoyaScreen(stepLabel, 'どんな気持ちが一番近かった？', `

            <span class="moya-emo-name">${e.name}</span>
          </button>

      ${hasMore ? `
        <button class="btn-ghost" data-act="moya-step2-show-all" style="margin-top:12px; width:100%; font-size:13px; padding:10px 12px;">他の気持ちも見る（あと ${EMOTIONS.length - visibleEmotions.length} 個）</button>

        <button class="btn-ghost" data-act="moya-cancel">キャンセル</button>
      </div>
    `);
  }
  if (s.step === 3) {
    const v = s.emotionScoreBefore == null ? 5 : s.emotionScoreBefore;
    return moyamoyaScreen(stepLabel, 'その気持ちの強さはどのくらい？', `
      <div style="text-align:center; margin: 28px 0 18px;">
        <div id="moyaScoreNum" style="font-size:64px; font-weight:600; font-family:'Noto Serif JP', serif; color: var(--primary, #6B8F71); line-height:1;">${v}</div>
        <div class="text-tiny text-muted" style="margin-top:6px;">0=ほぼ感じない / 10=最大</div>
      </div>
      <div class="moya-scale-row">
        ${Array.from({length: 11}, (_, n) => `
          <button class="moya-scale-btn ${v === n ? 'selected' : ''}" data-act="moya-set-score" data-score="${n}">${n}</button>
        `).join('')}
      </div>
      <div style="margin-top:24px; display:grid; gap:10px;">
        <button class="btn btn-primary" data-act="moya-step3-next">つづける</button>
        <button class="btn-ghost" data-act="moya-cancel">キャンセル</button>
      </div>
    `);
  }
  // ─────── Step 4: 自動思考（NEW v0.9.80）───────
  if (s.step === 4) {
    return moyamoyaScreen(stepLabel, 'その時、頭にパッと浮かんだ考えは？', `
      <p class="text-soft mb-3">「どうせ〜だ」「〜に違いない」など、検証する前に自動的に浮かんだ考えをそのまま書いてみよう。</p>
      <textarea class="textarea-block" id="moyaAutoThoughtInput" placeholder="例：自分はこの仕事に向いていない／また怒られる" rows="4">${escapeHtml(s.automaticThought || '')}</textarea>
      <div style="margin-top:16px; display:grid; gap:10px;">
        <button class="btn btn-primary" data-act="moya-step4-next">つづける</button>
        <button class="btn-ghost" data-act="moya-cancel">キャンセル</button>
      </div>
    `);
  }

  // ─────── Step 5: 根拠（NEW v0.9.80）───────
  if (s.step === 5) {
    return moyamoyaScreen(stepLabel, 'なぜそう思える？事実だと思う理由', `
      <p class="text-soft mb-2">さっき書いた考え：</p>
      <div class="moya-context-quote">「${escapeHtml(s.automaticThought || '')}」</div>
      <p class="text-soft mb-3" style="margin-top:12px;">これを「事実」だと思える理由や、思い当たる証拠を書き出してみよう。</p>
      <textarea class="textarea-block" id="moyaEvidenceInput" placeholder="例：先週も同じミスをした／同期は問題なくこなしている" rows="4">${escapeHtml(s.evidence || '')}</textarea>
      <div style="margin-top:16px; display:grid; gap:10px;">
        <button class="btn btn-primary" data-act="moya-step5-next">つづける</button>
        <button class="btn-ghost" data-act="moya-cancel">キャンセル</button>
      </div>
    `);
  }

  // ─────── Step 6: 反証（NEW v0.9.80・AIヒント付き）───────
  if (s.step === 6) {
    const hintsLoading = s.counterEvidenceHintsLoading;
    const hints = s.counterEvidenceHints;
    return moyamoyaScreen(stepLabel, '事実じゃないかも？別の見方の証拠', `
      <p class="text-soft mb-2">さっきの考え：</p>
      <div class="moya-context-quote">「${escapeHtml(s.automaticThought || '')}」</div>
      <p class="text-soft mb-3" style="margin-top:12px;">この考えが「事実じゃないかもしれない」と思える別の証拠や、過去の例外を探してみよう。<br>難しければ、下のボタンでAIヒントを取れます。</p>
      <textarea class="textarea-block" id="moyaCounterEvidenceInput" placeholder="例：先月の資料は評価された／忙しいピーク時の指摘で口調が強くなっただけかも" rows="4">${escapeHtml(s.counterEvidence || '')}</textarea>

      ${hintsLoading ? `
        <div class="moya-hint-loading" style="margin-top:14px; padding:14px 16px; background: var(--bg-soft); border-radius:12px; text-align:center; color: var(--text-muted); font-size:13px;">
          💭 AIがヒントを考えています…
        </div>
      ` : ''}
      ${Array.isArray(hints) && hints.length ? `
        <div style="margin-top:14px; padding:14px 16px; background: var(--bg-soft); border-radius:12px;">
          <div class="text-tiny text-muted" style="margin-bottom:8px;">💡 AIからのヒント（参考）</div>

        <button class="btn-ghost" data-act="moya-step6-hint" ${hintsLoading ? 'disabled' : ''} style="width:100%;">

        <button class="btn btn-primary" data-act="moya-step6-next">つづける</button>

      </div>

  }

  // ─────── Step 7: 適応的思考 / 別の見方（旧 step 4）───────
  if (s.step === 7) {
    // 初回到達時に AI 生成を発火（既に生成済みなら何もしない）
    if (!s.alternativeViewsFetched) {
      s.alternativeViewsFetched = true;
      s.alternativeViewsLoading = true;
      const sessionRef = s;
      generateAlternativeViewsAI(s.eventText, s.emotion, s.emotionScoreBefore, s.automaticThought, s.evidence, s.counterEvidence).then(views => {
        if (moyamoya !== sessionRef) return; // 中断/離脱
        sessionRef.alternativeViews = views || generateAlternativeViewsTemplate(sessionRef.eventText, sessionRef.emotion);
        sessionRef.alternativeViewsRevealed = 3;
        sessionRef.alternativeViewsLoading = false;
        sessionRef.alternativeViewsAIUsed = !!views;
        render();
      }).catch(() => {
        if (moyamoya !== sessionRef) return;
        sessionRef.alternativeViews = generateAlternativeViewsTemplate(sessionRef.eventText, sessionRef.emotion);
        sessionRef.alternativeViewsRevealed = 3;
        sessionRef.alternativeViewsLoading = false;
        sessionRef.alternativeViewsAIUsed = false;
        render();
      });
    }

    if (s.alternativeViewsLoading || !s.alternativeViews) {
      return moyamoyaScreen(stepLabel, '別の見方を考えています...', `
        <div class="moya-loading">
          <div class="moya-loading-spinner"></div>

        <div style="margin-top:8px;">
          <button class="btn-ghost" data-act="moya-cancel" style="width:100%;">キャンセル</button>
        </div>
      `);
    }

    const visible = s.alternativeViews.slice(0, s.alternativeViewsRevealed);
    const canMore = s.alternativeViewsRevealed < s.alternativeViews.length;
    const selectedIdx = s.alternativeViewSelectedIndex;
    const hasSelection = typeof selectedIdx === 'number' && selectedIdx >= 0 && selectedIdx < s.alternativeViewsRevealed;
    return moyamoyaScreen(stepLabel, 'バランスのとれた別の見方', `
      <p class="text-tiny text-muted mb-3">⚠️ AIが推定した参考情報です。納得できるものを1つ選んでください。</p>
      <div style="display:flex; flex-direction:column; gap:10px;">
        ${visible.map((rawV, i) => {
          const v = normalizeAltView(rawV);
          return `
          <button class="moya-altview-card ${selectedIdx === i ? 'selected' : ''}" data-act="moya-step7-pick" data-index="${i}">

      ` : ''}

        <button class="btn btn-primary" data-act="moya-step7-next" ${!hasSelection ? 'disabled' : ''}>この見方で進む</button>
        <button class="btn-ghost" data-act="moya-cancel">キャンセル</button>
      </div>
    `);
  }

  // ─────── Step 8: 強さ再評価（旧 step 5）───────
  if (s.step === 8) {
    const v = s.emotionScoreAfter == null ? Math.max(0, (s.emotionScoreBefore || 5) - 2) : s.emotionScoreAfter;
    return moyamoyaScreen(stepLabel, 'いま、気持ちの強さはどのくらい？', `
      <p class="text-soft mb-2">さっきは <strong>${s.emotionScoreBefore}</strong> でした。</p>
      <div style="text-align:center; margin: 28px 0 18px;">
        <div id="moyaScoreNum" style="font-size:64px; font-weight:600; font-family:'Noto Serif JP', serif; color: var(--primary, #6B8F71); line-height:1;">${v}</div>
      </div>
      <div class="moya-scale-row">
        ${Array.from({length: 11}, (_, n) => `
          <button class="moya-scale-btn ${v === n ? 'selected' : ''}" data-act="moya-set-score-after" data-score="${n}">${n}</button>
        `).join('')}
      </div>
      <div style="margin-top:24px; display:grid; gap:10px;">
        <button class="btn btn-primary" data-act="moya-step8-next">レターを作る</button>
        <button class="btn-ghost" data-act="moya-cancel">キャンセル</button>
      </div>
    `);
  }

  // ─────── Step 9: レター（旧 step 6）───────
  if (s.step === 9) {
    if (!s.letterBody) {
      const letter = generateLetter(s);
      s.letterTitle = letter.title;
      s.letterBody = letter.body;
    }
    return renderMoyamoyaLetter(s);
  }
  return '';
}

//   生成時はこの中から1つ選んで各見方に付与する。
//   ラベル名は「パッと見て選びやすい」短さを優先し、説明はプロンプト側に持たせる。
const MOYA_ALTVIEW_LABELS = [
  { id: 'third_person',   name: '第三者視点',     hint: '友人や他者ならどう見るか' },
  { id: 'time_axis',      name: '時間軸',         hint: '1ヶ月後・1年後の自分はどう見るか' },

  { id: 'counter',        name: '反証',           hint: 'その思考の反対の証拠を探す' },
  { id: 'scope',          name: '状況の幅',       hint: '「全部」「いつも」を「一部」「今回は」に' },
  { id: 'self_compass',   name: '自分への声かけ', hint: '同じ状況の友達に何と言うか' },
  { id: 'small_facts',    name: '小さな事実',     hint: '見落としていた良い兆し・ポジ要素' },

];

// 後方互換ヘルパー：旧形式 string も受け取って {label, text} に正規化
function normalizeAltView(v, fallbackLabel) {
  if (v && typeof v === 'object' && typeof v.text === 'string') {
    return { label: typeof v.label === 'string' ? v.label : (fallbackLabel || ''), text: v.text };
  }
  if (typeof v === 'string') return { label: fallbackLabel || '', text: v };
  return { label: fallbackLabel || '', text: '' };
}

function generateAlternativeViewsTemplate(eventText, emotion) {
  const short = (eventText || '').slice(0, 28) + ((eventText || '').length > 28 ? '…' : '');
  const emo = emotion || 'つらさ';
  return [
    { label: '自分への声かけ', text: `「${short}」というできごと、${emo}を強く感じたんですね。感情はあなたを守るために働いているサイン。否定する必要はありません。` },
    { label: '状況の幅',       text: `「自分が全部悪い」と感じている部分があるかもしれません。でも別の見方をすると、「今回はうまくいかなかったけれど、あなたの全部が否定されたわけではない」とも考えられそうです。` },
    { label: '時間軸',         text: `今回のできごとは、永遠に続くものではなく、一時的なもの。明日になれば、感じ方が少し変わっているかもしれません。` },
    { label: '事実と解釈',     text: `「絶対こうあるべき」と自分にプレッシャーをかけている部分はありませんか？「できる範囲でいい」と自分に言ってあげるのも、ひとつの選択肢です。` },
    { label: '小さな事実',     text: `周りの人にも、よく似た経験は意外とよくあります。あなただけが特別に「ダメ」というわけではなく、誰もが感じる自然な感情です。` },
    { label: '第三者視点',     text: `「もし友達が同じ状況にいたら、何て言ってあげる？」その言葉を、今のあなた自身にも、優しくかけてみてもいいかもしれません。` },
  ];
}

// v0.7.5 CBT (認知行動療法) ベースのAI別の見方生成
// プロンプトは AI_PROMPTS.cbt_alternative_views を参照
// v0.9.80: 自動思考・根拠・反証も受け取る（コラム法準拠）
async function generateAlternativeViewsAI(eventText, emotion, score, automaticThought, evidence, counterEvidence) {
  if (!getApiKey()) return null;
  const def = AI_PROMPTS.cbt_alternative_views;
  const sys = def.systemPrompt;
  const user = def.userTemplate
    .replace('{eventText}', eventText || '')
    .replace('{emotion}', emotion || '')
    .replace('{score}', score == null ? 5 : score)
    .replace('{automaticThought}', automaticThought || '（未記入）')
    .replace('{evidence}', evidence || '（未記入）')
    .replace('{counterEvidence}', counterEvidence || '（未記入）');

  try {
    const text = await callGemini(sys, [{ role: 'user', content: user }], { temperature: def.temperature, maxTokens: def.maxTokens });
    if (!text) return null;
    const cleaned = text.trim()
      .replace(/^```(?:json)?\s*/i, '')
      .replace(/```\s*$/, '')
      .trim();
    // 先頭に余計な文字がある場合は最初の[から]までを抽出
    const start = cleaned.indexOf('[');
    const end = cleaned.lastIndexOf(']');
    if (start < 0 || end < 0 || end <= start) return null;
    const arr = JSON.parse(cleaned.slice(start, end + 1));
    if (!Array.isArray(arr)) return null;
    // 新形式 [{label, text}, ...] / 旧形式 [string, ...] の両方を受け入れる
    const validLabels = new Set(MOYA_ALTVIEW_LABELS.map(l => l.name));
    const views = arr.map(v => normalizeAltView(v))
      .filter(v => v.text && v.text.length > 0)
      .map(v => ({
        label: validLabels.has(v.label) ? v.label : '',
        text: v.text.trim()
      }));
    if (views.length < 3) return null;
    // 6個に揃える（不足分はテンプレ補填）
    const fb = generateAlternativeViewsTemplate(eventText, emotion);
    while (views.length < 6) views.push(fb[views.length]);
    return views.slice(0, 6);
  } catch (e) {
    console.warn('[CBT-AI] failed', e);
    return null;
  }
}

// 旧API互換（テンプレ）
function generateAlternativeViews(eventText, emotion) {
  return generateAlternativeViewsTemplate(eventText, emotion);
}
function generateAlternativeView(eventText, emotion) {
  return generateAlternativeViewsTemplate(eventText, emotion).join('\n\n');
}

// v0.9.80: 反証ステップ（コラム法⑤）の AI ヒント
//   ユーザーが書いた自動思考＋根拠を踏まえて、反証の観点を3〜5個提示する
async function generateCounterEvidenceHintsAI(eventText, emotion, automaticThought, evidence) {
  if (!getApiKey()) return null;
  const def = AI_PROMPTS.cbt_counter_evidence_hints;
  if (!def) return null;
  const user = def.userTemplate
    .replace('{eventText}', eventText || '')
    .replace('{emotion}', emotion || '')
    .replace('{automaticThought}', automaticThought || '')
    .replace('{evidence}', evidence || '（未記入）');
  try {
    const text = await callGemini(def.systemPrompt, [{ role: 'user', content: user }], {
      temperature: def.temperature,
      maxTokens: def.maxTokens,
    });
    if (!text) return null;
    const cleaned = text.trim()
      .replace(/^```(?:json)?\s*/i, '')
      .replace(/```\s*$/, '')
      .trim();
    const start = cleaned.indexOf('[');
    const end = cleaned.lastIndexOf(']');
    if (start < 0 || end < 0 || end <= start) return null;
    const arr = JSON.parse(cleaned.slice(start, end + 1));
    if (!Array.isArray(arr)) return null;
    return arr.map(x => String(x || '').trim()).filter(x => x).slice(0, 5);
  } catch (e) {
    console.warn('[counter-evidence-hints]', e);
    return null;
  }
}

function generateLetter(s) {
  const date = new Date();
  const dateStr = `${date.getMonth()+1}月${date.getDate()}日`;
  const eventShort = (s.eventText || '').slice(0, 20);
  const title = `${eventShort || '今日'}の整理（${dateStr}）`;
  // 10段階スケール: diff>=2 で「軽くなった」、>0 で「ほぐれていく」、それ以下は据え置き
  const diff = (s.emotionScoreBefore || 0) - (s.emotionScoreAfter || 0);
  const closing = diff >= 2
    ? '少しだけ心が軽くなったね。それで十分です。'
    : diff > 0
    ? '気持ちは少しずつほぐれていきます。今日は書けただけでも一歩。'
    : '今日はまだ重く感じるかもしれない。それでも書いてくれたこと、覚えておこう。';
  // alternativeView は step 7 で1つ選択された見方
  const altText = s.alternativeView || (Array.isArray(s.alternativeViews) ? s.alternativeViews.slice(0, s.alternativeViewsRevealed || 3).map((v, i) => `${i+1}. ${normalizeAltView(v).text}`).join('\n\n') : '');
  // v0.9.80: コラム法⑦本文（自動思考/根拠/反証も含めて整理）
  const parts = [
    `今日起きたこと\n${s.eventText || ''}`,
    `感じていたこと\n${s.emotion || ''}（強さ ${s.emotionScoreBefore == null ? '' : s.emotionScoreBefore} / 10）`,
  ];
  if (s.automaticThought) parts.push(`頭に浮かんだ考え\n${s.automaticThought}`);
  if (s.evidence)         parts.push(`そう思った理由\n${s.evidence}`);
  if (s.counterEvidence)  parts.push(`別の見方の証拠\n${s.counterEvidence}`);
  parts.push(`バランスの取れた別の見方\n${altText}`);
  parts.push(`少し楽になるための一言\n${closing}`);
  const body = parts.join('\n\n');
  return { title, body };
}

function getEmotionNeed(emotion) {
  return EMOTION_NEEDS_MAP[emotion] || '今のあなたが何を大切にしたいのか、もう少し丁寧に見つめてみてもいいかもしれません。';
}
function getScoreLabel(score) {
  const n = score == null ? 5 : score;
  if (n >= 8) return { text: 'つらい', emoji: '😨' };
  if (n >= 6) return { text: 'しんどい', emoji: '😣' };
  if (n >= 4) return { text: '重い', emoji: '😟' };
  if (n >= 2) return { text: '少し感じる', emoji: '😐' };
  return { text: 'ほぼ感じない', emoji: '😌' };
}
function getScoreAfterLabel(before, after) {
  const b = before == null ? 5 : before;
  const a = after == null ? b : after;
  const diff = b - a;
  if (diff >= 1) return { text: 'すこし楽になった', emoji: '😌' };
  if (diff === 0) return { text: 'いつも通り', emoji: '😐' };
  return { text: 'まだ重い', emoji: '😶' };
}
function formatLetterDate(d) {
  const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  return {
    full: `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`,
    year: d.getFullYear(),
    md: `${d.getMonth()+1}/${d.getDate()}`,
    day: days[d.getDay()] + '.'
  };
}

function sameDay(a, b) { return a.toDateString() === b.toDateString(); }
function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function dateKey(d) {
  const dt = d instanceof Date ? d : new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function getHabitItem(id) {
  if (!id) return null;
  const custom = (state.customHabits || []).find(h => h.id === id);
  if (custom) return {
    id: custom.id, title: custom.name, icon: custom.icon || '🌱',
    time: custom.duration || '', technique: '',
    timing: custom.timing || '', desc: '', isCustom: true,
  };
  const a = ACTIONS.find(x => x.id === id);
  if (a) return {
    id: a.id, title: a.title, icon: a.icon, time: a.time,
    technique: a.technique || '', desc: a.desc || '',
    timing: '', isCustom: false,
  };
  return null;
}

function getAllHabitIds() {
  const action = (state.user && state.user.habitActionIds) || [];
  const custom = (state.customHabits || []).map(h => h.id);
  // dedup, custom が action よりも後ろに来る
  return [...new Set([...action, ...custom])];
}

function isHabitDoneOn(habitId, date) {
  const k = dateKey(date);
  return (state.habitLogs || []).some(l => l.habitId === habitId && l.date === k);
}

function getHabitStreak(habitId) {
  let streak = 0;
  const d = new Date();
  for (let i = 0; i < 365; i++) {
    if (isHabitDoneOn(habitId, d)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return streak;
}

function getCurrentWeekDates() {
  // 月〜日 (週初めを月曜にする)
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const day = today.getDay(); // 0=Sun ... 6=Sat
  const monOffset = day === 0 ? -6 : 1 - day;
  const result = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + monOffset + i);
    result.push(d);
  }
  return result;
}

function markHabitDoneToday(habitId) {
  const today = dateKey(new Date());
  if (!Array.isArray(state.habitLogs)) state.habitLogs = [];
  if (state.habitLogs.some(l => l.habitId === habitId && l.date === today)) return false;
  state.habitLogs.push({
    id: 'hl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    habitId, date: today, completedAt: new Date().toISOString(),
  });
  return true;
}

function unmarkHabitToday(habitId) {
  const today = dateKey(new Date());
  state.habitLogs = (state.habitLogs || []).filter(l => !(l.habitId === habitId && l.date === today));
}

function deleteHabit(habitId) {
  if (Array.isArray(state.user.habitActionIds)) {
    state.user.habitActionIds = state.user.habitActionIds.filter(id => id !== habitId);
  }
  state.customHabits = (state.customHabits || []).filter(h => h.id !== habitId);
  state.habitLogs = (state.habitLogs || []).filter(l => l.habitId !== habitId);
}

// 月の日付配列 (1日 〜 月末)
function getMonthDates(year, month0) {
  const last = new Date(year, month0 + 1, 0).getDate();
  const result = [];
  for (let d = 1; d <= last; d++) result.push(new Date(year, month0, d));
  return result;
}

// ============================================================
// ベース画面 統計ヘルパー (P8.3 v0.9.49 〜)
// 「いっぽ」と「習慣」を統合した活動指標
// ============================================================
// 積み重ねた日: 累計のユニーク活動日数 (いっぽ実施 or 習慣達成のあった日)
function calcTotalActiveDays() {
  const days = new Set();
  (state.ippoSessions || []).forEach(s => {
    if (s.completedAt) days.add(dateKey(new Date(s.completedAt)));
  });
  (state.habitLogs || []).forEach(l => {
    if (l.date) days.add(l.date);
  });
  return days.size;
}

// やってみた回数: 累計の活動回数 (いっぽセッション + 習慣達成)
function calcTotalActivityCount() {
  const ippo = (state.ippoSessions || []).length;
  const habit = (state.habitLogs || []).length;
  return ippo + habit;
}

// 続いてる日: 連続活動日 (いっぽ or 習慣どちらか1つでもあった日が連続している長さ)
// 今日まだ何もしていなくても、昨日まで連続していれば継続中とカウント
function calcCurrentStreak() {
  const days = new Set();
  (state.ippoSessions || []).forEach(s => {
    if (s.completedAt) days.add(dateKey(new Date(s.completedAt)));
  });
  (state.habitLogs || []).forEach(l => {
    if (l.date) days.add(l.date);
  });
  if (days.size === 0) return 0;
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    if (days.has(dateKey(d))) streak++;
    else { if (i === 0) continue; break; }
  }
  return streak;
}

// kind: 'ring' (呼吸・瞑想) / 'countdown' (運動・日課・音楽など) / 'writing' (書く・セルフケア言葉)
// 一旦は画像ベース。今後行動ごとに細かく設計予定。
let ippoTimerIntervalId = null;

function ippoTimerKind(action) {
  if (!action) return 'countdown';
  const t = (action.title || '') + ' ' + (action.desc || '') + ' ' + (action.technique || '');
  if (action.cat === 'cognitive' || action.cat === 'assertion') return 'writing';
  if (/書|綴|手紙|メモ|3つ|3個|なぜなぜ|ホット|ラベリング|分配|割合|フレーズ|私メッセージ/.test(t)) return 'writing';
  if (action.cat === 'relax') return 'ring';
  if (/呼吸|瞑想|マインドフルネス|スキャン|身体スキャン|聴く|味わう|今、ここ|やさしさの言葉/.test(t)) return 'ring';
  return 'countdown';
}

function ippoTimerSeconds(action) {
  const time = action && action.time;
  if (!time) return 180;
  const m = String(time).match(/(\d+)/);
  const n = m ? parseInt(m[1], 10) : 3;
  return Math.max(30, n * 60);
}

function formatMmSs(sec) {
  const s = Math.max(0, Math.floor(sec));
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${mm}:${ss}`;
}

function startIppoTimerLoop() {
  if (ippoTimerIntervalId) clearInterval(ippoTimerIntervalId);
  ippoTimerIntervalId = setInterval(() => {
    if (!ippoToday || ippoToday.step !== 35) {
      stopIppoTimerLoop();
      return;
    }
    if (!ippoToday.timerStarted) return;
    if (ippoToday.timerPaused) return;
    if (typeof ippoToday.remainingSec !== 'number') return;
    if (ippoToday.remainingSec <= 0) return;
    ippoToday.remainingSec--;
    const numEl = document.getElementById('ippoTimerNum');
    if (numEl) numEl.textContent = formatMmSs(ippoToday.remainingSec);
    const ringEl = document.getElementById('ippoTimerRingFill');
    if (ringEl && ippoToday.targetSec > 0) {
      const r = parseFloat(ringEl.getAttribute('r')) || 70;
      const C = 2 * Math.PI * r;
      const ratio = ippoToday.remainingSec / ippoToday.targetSec;
      ringEl.setAttribute('stroke-dasharray', `${C}`);
      ringEl.setAttribute('stroke-dashoffset', `${C * (1 - ratio)}`);
    }
  }, 1000);
}

function stopIppoTimerLoop() {
  if (ippoTimerIntervalId) {
    clearInterval(ippoTimerIntervalId);
    ippoTimerIntervalId = null;
  }
}

window.ippoTimerSetNote = (v) => { if (ippoToday) ippoToday.notes = v; const cnt = document.getElementById('ippoTimerNoteCounter'); if (cnt) cnt.textContent = String((v || '').length); };

// Step 6: AIフィードバック + 次の一歩を提案（仕様書 §6 統合画面）
// ============================================================
// 行動後サマリー指標計算（v0.9.6 改善の可視化）
// ============================================================
// 連続日数: 直近で連続して ippoSession を完了した日数
function calcIppoStreakDays() {
  const sessions = (state.ippoSessions || []).slice().sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
  if (sessions.length === 0) return 0;
  const dayKey = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  const days = new Set(sessions.map(s => dayKey(new Date(s.completedAt))));
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    if (days.has(dayKey(d))) streak++;
    else { if (i === 0) continue; break; }  // 今日まだ未完了でも昨日まで連続なら継続
  }
  return streak;
}
// 平均マッチ度
function calcAvgMatchScore() {
  const sessions = (state.ippoSessions || []).filter(s => typeof s.score === 'number');
  if (sessions.length === 0) return null;
  return Math.round(sessions.reduce((a, s) => a + s.score, 0) / sessions.length);
}
// よく効く一歩（変化値の平均が最も高いアクション）
function calcMostEffectiveAction() {
  const map = {};
  (state.ippoSessions || []).forEach(s => {
    if (!s.actionId || typeof s.changeValue !== 'number') return;
    if (!map[s.actionId]) map[s.actionId] = { sum: 0, count: 0 };
    map[s.actionId].sum += s.changeValue;
    map[s.actionId].count++;
  });
  let best = null;
  for (const id in map) {
    const m = map[id];
    if (m.count < 1) continue;
    const avg = m.sum / m.count;
    if (!best || avg > best.avg) best = { id, avg, count: m.count };
  }
  if (!best) return null;
  const action = ACTIONS.find(a => a.id === best.id);
  return { action, avg: best.avg, count: best.count };
}
// 最近の傾向（直近5件のパターンから1行のインサイト）
function calcRecentTrendInsight() {
  const recent = (state.ippoSessions || []).slice(-5);
  if (recent.length < 2) return 'まずは1つ実施できたね。少しずつデータが溜まっていくよ';
  // 気分別の変化値平均から最も効きやすいパターンを抽出
  const byMood = {};
  recent.forEach(s => {
    if (!byMood[s.moodLabel]) byMood[s.moodLabel] = [];
    byMood[s.moodLabel].push(s.changeValue || 0);
  });
  let bestMood = null;
  for (const m in byMood) {
    const avg = byMood[m].reduce((a, b) => a + b, 0) / byMood[m].length;
    if (!bestMood || avg > bestMood.avg) bestMood = { label: m, avg };
  }
  // 短い時間の行動の方が効きやすいか
  const shortActs = recent.filter(s => {
    const a = ACTIONS.find(x => x.id === s.actionId);
    return a && /^[12]分|^1分|^2分/.test(a.time || '');
  });
  if (bestMood && bestMood.avg >= 2 && bestMood.label) {
    return `${bestMood.label}のときは、軽い行動が効きやすいようです`;
  }
  if (shortActs.length >= recent.length / 2) {
    return '短時間の行動が効果を出しているようです';
  }
  return '少しずつ、自分に合うパターンが見えてきています';
}

// 深掘りの発動条件（仕様書 §5 発動のきっかけ）
function shouldSuggestDeepDive() {
  const sessions = (state.ippoSessions || []).slice(-3);
  if (sessions.length < 2) return false;
  // 同じ気分が2日以上続く OR 強さ7以上が2日以上
  const sameMood = sessions.filter(s => s.moodLabel === sessions[sessions.length - 1].moodLabel).length >= 2;
  const highIntensity = sessions.filter(s => (s.moodIntensity || 0) >= 7).length >= 2;
  // 変化値が小さい
  const lowChange = sessions.filter(s => (s.changeValue || 0) < 1).length >= 2;
  return sameMood || highIntensity || lowChange;
}

// 完了済みの日（再来時の表示）
// 完了済みの日（再来時の表示）— Step 6 と同じ「改善の可視化」デザインを使用
// ベース画面 (P8 〜) — いっぽタブの正面玄関
//   実施済 / 未実施 で文言を可変

    .filter(id => !usedActionIds.has(id))

// ============================================================
// いっぽ 行動を選ぶ画面 (P7・v0.9.45 〜)

// 進入: ベース画面「他の行動を見る →」 / pendingモードの「別の一歩を見る」
// 行動選択 → preselectedActionId を持って Step 0 (方向選択) から開始
// ============================================================
function viewIppoActionPicker(s) {
  const tab = s.pickerTab || 'recommend';
  const sessions = state.ippoSessions || [];
  const habitMode = !!s.habitMode;
  const cardOpts = habitMode ? { habitMode: true } : {};

  let body = '';
  if (tab === 'recommend') {
    const recs = getTopRecommendations({
      moodLabel: 'なんとなく',
      intensity: 5,
      directionIds: getDirectionIds(),
      durationPref: '1min',
      history: sessions,
    }, 8);
    body = recs.length === 0
      ? `<div class="ippo-picker-empty">おすすめが見つかりませんでした<br>カテゴリから選ぶをお試しください</div>`
      : recs.map(r => renderActionPickerCard(r.action, { ...cardOpts, meta: `おすすめ度 ${r.score.total}%・${r.action.technique}` })).join('');
  } else if (tab === 'category') {
    body = ACTION_CATEGORIES.map(cat => {
      const items = ACTIONS.filter(a => a.cat === cat.id);
      if (items.length === 0) return '';
      return `
        <div class="ippo-picker-cat-h"><span>${cat.icon}</span><span>${escapeHtml(cat.name)}</span><span style="color:var(--text-muted); font-weight:400; font-size:11px; margin-left:auto;">${items.length}件</span></div>
        <div class="ippo-picker-cat-list">
          ${items.map(a => renderActionPickerCard(a, { ...cardOpts, meta: a.technique })).join('')}
        </div>
      `;
    }).join('');
  } else if (tab === 'history') {
    const hist = getIppoActionHistory();
    body = hist.length === 0
      ? `<div class="ippo-picker-empty">まだ実施した記録がありません<br>「おすすめ」または「カテゴリから選ぶ」から始めましょう</div>`
      : hist.map(h => {
          const a = ACTIONS.find(x => x.id === h.actionId);
          if (!a) return '';
          const avg = h.evalCount > 0 ? (h.evalSum / h.evalCount) : null;
          const metaParts = [`最後: ${formatDate(h.lastDate)}`, `${h.count}回`];
          if (avg !== null) metaParts.push(`平均 ${ippoEvalAvgEmoji(avg)}`);
          return renderActionPickerCard(a, { ...cardOpts, meta: metaParts.join(' ・ ') });
        }).join('');
  } else if (tab === 'custom' && habitMode) {
    body = renderHabitCreateForm();
  }

  return `
    <div class="screen active ippo-screen ippo-picker-screen">
      <div class="page-header">

        <span style="width:36px;"></span>

        <div class="ippo-picker-habit-hint">続けたい行動を選んで「習慣に追加」を押すと、続けていることリストに加わります</div>

        ${habitMode ? `<button class="ippo-picker-tab ${tab === 'custom' ? 'active' : ''}" data-act="ippo-picker-tab" data-tab="custom" role="tab" aria-selected="${tab === 'custom'}">自分でつくる</button>` : ''}
      </div>

      <div class="ippo-picker-body">
        ${body}
      </div>
    </div>
  `;
}

function renderActionPickerCard(action, opts = {}) {
  const meta = opts.meta || action.technique || '';
  const habitMode = !!opts.habitMode;
  const habitIds = (state.user && state.user.habitActionIds) || [];
  const isHabit = habitIds.includes(action.id);
  if (habitMode) {
    return `
      <div class="ippo-picker-card ippo-picker-card-habit">
        <span class="ippo-picker-icon">${action.icon}</span>

          <div class="ippo-picker-title">${escapeHtml(action.title)}<span class="ippo-picker-time">（${action.time}）</span></div>
          <div class="ippo-picker-meta">${escapeHtml(meta)}</div>

        <button class="ippo-picker-habit-btn ${isHabit ? 'on' : ''}" data-act="ippo-toggle-habit" data-action-id="${action.id}">
          ${isHabit ? '✓ 習慣中' : '＋ 習慣に追加'}
        </button>
      </div>

  }
  return `
    <button class="ippo-picker-card" data-act="ippo-picker-pick" data-action-id="${action.id}">

        <div class="ippo-picker-meta">${escapeHtml(meta)}</div>
      </div>
      <span class="ippo-picker-cta">›</span>
    </button>
  `;
}

// 行動別の履歴集計 (履歴サブタブ用)
function getIppoActionHistory() {
  const sessions = (state.ippoSessions || []).filter(s => s.actionId && s.completedAt);
  const map = {};
  sessions.forEach(s => {
    if (!map[s.actionId]) {
      map[s.actionId] = { actionId: s.actionId, count: 0, lastDate: null, evalSum: 0, evalCount: 0 };
    }
    const m = map[s.actionId];
    m.count++;
    const dt = new Date(s.completedAt);
    if (!m.lastDate || dt > m.lastDate) m.lastDate = dt;
    let v = null;
    if (s.evaluation && typeof s.evaluation.value === 'number') v = s.evaluation.value;
    else if (typeof s.changeValue === 'number') v = s.changeValue;
    if (v !== null) { m.evalSum += v; m.evalCount++; }
  });
  return Object.values(map).sort((a, b) => (b.lastDate || 0) - (a.lastDate || 0));
}

// 平均評価 (-2 〜 +3) を 5択絵文字に丸める
function ippoEvalAvgEmoji(avg) {
  if (avg >= 2.5) return '😄';
  if (avg >= 1.5) return '😊';
  if (avg >= 0.5) return '🙂';
  if (avg >= -0.5) return '😐';
  return '😞';
}

function viewAllHabitsCalendar(hcv) {

  const today = new Date();
  const target = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const year = target.getFullYear();
  const month0 = target.getMonth();

  // getHabitItem で正規化 (preset / custom 双方対応)
  const habits = getAllHabitIds().map(id => getHabitItem(id)).filter(Boolean);

  return `
    <div class="screen active ippo-screen habits-cal-screen">
      <div class="page-header">
        <button class="back-btn" data-act="ippo-habits-cal-back" aria-label="戻る">‹</button>

        <div class="habit-cal-nav-label">${year}年${month0 + 1}月</div>
        <button class="btn-ghost habit-cal-nav-btn ${monthOffset >= 0 ? 'disabled' : ''}" data-act="ippo-habits-cal-next" aria-label="翌月" ${monthOffset >= 0 ? 'disabled' : ''}>›</button>
      </div>

      ${habits.length === 0 ? `
        <div class="ippo-base-soon-card" style="margin-top:16px;">
          <span class="ippo-base-soon-icon">🌱</span>
          <div>
            <div class="ippo-base-soon-h">習慣はまだありません</div>

          </div>
        </div>
      ` : habits.map(h => renderHabitsCalCard(h, year, month0, today)).join('')}
    </div>
  `;
}

function renderHabitsCalCard(habit, year, month0, today) {
  const first = new Date(year, month0, 1);
  const last = new Date(year, month0 + 1, 0);
  const startDay = first.getDay();
  const daysInMonth = last.getDate();
  const monthLogs = (state.habitLogs || []).filter(l => l.habitId === habit.id && l.date.startsWith(`${year}-${String(month0+1).padStart(2,'0')}`));
  const doneCount = monthLogs.length;
  const streak = getHabitStreak(habit.id);

  const cells = [];
  for (let i = 0; i < startDay; i++) cells.push(`<div class="habits-cal-mini-cell empty"></div>`);
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(year, month0, d);
    const done = isHabitDoneOn(habit.id, dt);
    const isFuture = dt > today;
    const isToday = dateKey(dt) === dateKey(today);
    cells.push(`
      <div class="habits-cal-mini-cell ${done ? 'done' : ''} ${isFuture ? 'future' : ''} ${isToday ? 'today' : ''}">
        <span class="habits-cal-mini-num">${d}</span>
        ${done ? '<span class="habits-cal-mini-mark">✓</span>' : ''}
      </div>
    `);
  }

  return `
    <div class="habits-cal-card">
      <div class="habits-cal-card-head">
        <span class="habits-cal-card-icon">${habit.icon}</span>
        <div class="habits-cal-card-title-wrap">
          <div class="habits-cal-card-title">${escapeHtml(habit.title)}</div>
          <div class="habits-cal-card-meta">${month0 + 1}月 ${doneCount} / ${daysInMonth}日　・　連続 ${streak}日</div>
        </div>
      </div>
      <div class="habits-cal-mini-weekhead">
        ${['日','月','火','水','木','金','土'].map((l, i) => `<div class="habits-cal-mini-weekday ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${l}</div>`).join('')}
      </div>
      <div class="habits-cal-mini-grid">
        ${cells.join('')}
      </div>
    </div>
  `;
}

function renderHabitCalendar(item, monthOffset) {
  const today = new Date();
  const target = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const year = target.getFullYear();
  const month0 = target.getMonth();
  const first = new Date(year, month0, 1);
  const last = new Date(year, month0 + 1, 0);
  const startDay = first.getDay(); // 0=Sun
  const daysInMonth = last.getDate();
  // 月のログ数
  const monthLogs = (state.habitLogs || []).filter(l => l.habitId === item.id && l.date.startsWith(`${year}-${String(month0+1).padStart(2,'0')}`));
  const doneCount = monthLogs.length;
  const achievementRate = daysInMonth > 0 ? Math.round((doneCount / daysInMonth) * 100) : 0;

  // セル構築
  const cells = [];
  for (let i = 0; i < startDay; i++) cells.push(`<div class="habit-cal-cell empty"></div>`);
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(year, month0, d);
    const done = isHabitDoneOn(item.id, dt);
    const isFuture = dt > today;
    const isToday = dateKey(dt) === dateKey(today);
    cells.push(`
      <div class="habit-cal-cell ${done ? 'done' : ''} ${isFuture ? 'future' : ''} ${isToday ? 'today' : ''}">
        <div class="habit-cal-num">${d}</div>
        ${done ? '<div class="habit-cal-mark">✓</div>' : ''}
      </div>
    `);
  }

  return `
    <div class="habit-cal-nav">
      <button class="btn-ghost habit-cal-nav-btn" data-act="ippo-habit-cal-prev" aria-label="前月">‹</button>
      <div class="habit-cal-nav-label">${year}年${month0 + 1}月</div>
      <button class="btn-ghost habit-cal-nav-btn ${monthOffset >= 0 ? 'disabled' : ''}" data-act="ippo-habit-cal-next" aria-label="翌月" ${monthOffset >= 0 ? 'disabled' : ''}>›</button>
    </div>

    <div class="habit-cal-stats">
      <div>${month0 + 1}月の記録：<strong>${doneCount}</strong> / ${daysInMonth}日</div>
      <div>達成率 <strong>${achievementRate}%</strong></div>
    </div>

    <div class="habit-cal-weekhead">
      ${['日','月','火','水','木','金','土'].map((l, i) => `<div class="habit-cal-weekday ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${l}</div>`).join('')}
    </div>
    <div class="habit-cal-grid">
      ${cells.join('')}
    </div>
  `;
}

// === §6: 進行中（取り組み中）判定ヘルパー（v0.9.92 P25）===
// 行動実験: status 'pending'（あとで実施予定）/ 'in-progress'（振り返り未完了）
function scBehaviorIsActive(s) { return s && (s.status === 'pending' || s.status === 'in-progress'); }
// 刺激統制: status 'active' かつ最終アクションから7日以内（8日以上は離脱とみなし除外）
function scStimulusIsActive(s) {
  if (!s || s.status !== 'active') return false;
  const last = s.lastActionAt || s.createdAt;
  if (!last) return false;
  const days = (Date.now() - new Date(last).getTime()) / 86400000;
  return days <= 7;
}

// 取り組み中ワークを収集（行動実験 + 刺激統制2系統）
function getKizukiActiveSessions() {
  const items = [];
  (state.behaviorExperiments || []).forEach(s => {
    if (scBehaviorIsActive(s)) items.push({ kind: 'behavior-experiment', t: s.lastActionAt || s.createdAt, data: s });
  });
  (state.stimulusControlSessions || []).forEach(s => {
    if (scStimulusIsActive(s)) items.push({ kind: 'stimulus-control', t: s.lastActionAt || s.createdAt, data: s });
  });
  items.sort((a, b) => new Date(b.t) - new Date(a.t));
  return items;
}

// === きづきタブ：最近のきろく（4ワーク横断・直近N件・進行中は除外）===
function getKizukiRecentRecords(limit = 3) {
  const items = [];
  (state.deepDiveSessions || []).forEach(s => {
    const t = s.completedAt || s.startedAt;
    if (t) items.push({ kind: 'downward-arrow', t, data: s });
  });
  (state.behaviorExperiments || []).forEach(s => {
    if (scBehaviorIsActive(s)) return; // 進行中は「取り組み中」セクションへ
    const t = s.createdAt || s.completedAt;
    if (t) items.push({ kind: 'behavior-experiment', t, data: s });
  });
  (state.moyamoyaRecords || []).forEach(r => {
    if (r.createdAt) items.push({ kind: 'column-method', t: r.createdAt, data: r });
  });
  (state.stimulusControlSessions || []).forEach(s => {
    if (scStimulusIsActive(s)) return; // 進行中は「取り組み中」セクションへ
    const t = s.completedAt || s.lastActionAt || s.createdAt;
    if (t) items.push({ kind: 'stimulus-control', t, data: s });
  });
  items.sort((a, b) => new Date(b.t) - new Date(a.t));
  return items.slice(0, limit);
}

function summarizeKizukiRecord(kind, data) {
  let line1 = '';
  let line2 = '';
  if (kind === 'downward-arrow') {
    line1 = (data.event || data.firstThought || '').trim();
    line2 = (data.newSchema || data.coreBelief || '').trim();
  } else if (kind === 'behavior-experiment') {
    line1 = ((data.hypothesis && data.hypothesis.what) || '').trim();
    if (data.status === 'pending') {
      line2 = '⏳ あとで実施する予定 — タップして続ける';
    } else {
      line2 = ((data.verify && data.verify.insight) || '').trim();
    }
  } else if (kind === 'column-method') {
    line1 = (data.eventText || data.letterTitle || '').trim();
    line2 = (data.alternativeView || '').trim();
  } else if (kind === 'stimulus-control') {
    if (data.track) {
      // 新モデル（2系統）
      const m = SC_TRACK_META[data.track] || {};
      const plan = (scPlans(data.track).find(p => p.id === data.selectedPlanId) || {});
      line1 = `${m.icon || ''} ${m.label || '刺激統制'}`.trim();
      const n = (data.checkins || []).length;
      line2 = plan.title ? `${plan.title}（記録${n}日）` : (n > 0 ? `記録 ${n}日` : '');
    } else {
      // 旧モデル互換
      line1 = ((data.goal && data.goal.text) || '').trim();
      const n = (data.checkins || []).length;
      line2 = n > 0 ? `チェックイン ${n} 回` : '';
    }
  }
  return { line1, line2 };
}

// === §6: 取り組み中ワークのカード（v0.9.92 P25）===
function scActiveMainLine(item) {
  if (item.kind === 'behavior-experiment') {
    return item.data.status === 'pending' ? '⏳ あとで実施する予定' : '🧪 実施したら振り返りへ';
  }
  // 刺激統制：直近のステップ状態から文言を決める
  const s = item.data;
  const m = SC_TRACK_META[s.track] || {};
  const n = (s.checkins || []).length;
  if (n === 0) return `${m.icon} 翌朝チェック待ち`;
  return `${m.icon} 今日のプラン確認`;
}
function scActiveSubLine(item) {
  const s = item.data;
  if (item.kind === 'behavior-experiment') {
    return ((s.hypothesis && s.hypothesis.what) || '').slice(0, 40);
  }
  const m = SC_TRACK_META[s.track] || {};
  return m.shortLabel || '刺激統制';
}
function renderKizukiActiveRow(item) {
  const isBe = item.kind === 'behavior-experiment';
  const id = (item.data && item.data.id) || '';
  const chipLabel = isBe ? '🧪 行動実験' : `${(SC_TRACK_META[item.data.track] || {}).icon || ''} ${(SC_TRACK_META[item.data.track] || {}).label || '刺激統制'}`;
  return `
    <button class="kizuki-recent-row" data-act="kizuki-active-row" data-kind="${item.kind}" data-id="${escapeHtml(id)}" style="border-left:3px solid #D77B5B;">
      <div class="kizuki-recent-content" style="padding-left:4px;">
        <span class="kizuki-recent-chip" style="background:#FBEFE9; color:#C05B30;">${escapeHtml(chipLabel)}</span>
        <div class="kizuki-recent-text">
          ${escapeHtml(scActiveMainLine(item))}

        </div>
      </div>
      <span class="kizuki-recent-arrow">›</span>
    </button>
  `;
}

function formatKizukiRecentDate(iso) {
  const d = new Date(iso);
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getMonth()+1}月${d.getDate()}日<br>(${days[d.getDay()]})`;
}

function renderKizukiRecentRow(item) {
  const w = KIZUKI_WORKS.find(x => x.id === item.kind);

  const sum = summarizeKizukiRecord(item.kind, item.data);

// ============================================================
// きづきワーク本体（v0.9.70 — 6種類のワーク共通）
//   - state: kizukiSession = { workId, step, answers, result, aiComment, loading }
//   - step1: 入力 / step2: 結果+AIコメント
//   - 結果は state.kizukiResults[workId] に保存（きろくから後で参照可）
// ============================================================
let kizukiSession = null;

function startKizukiWork(workId) {
  kizukiSession = {
    workId,
    step: 1,
    answers: workId === 'distortion'
      ? {}
      : { hypothesis:'', action:'', prediction:'', result:'' },
    result: null,
    aiComment: null,
    loading: false,
  };
  go('kizuki-work');
}

function cancelKizukiWork() {
  kizukiSession = null;
  go('kizuki');
}

// 結果集計（ワーク別）
function computeKizukiResult(workId, answers) {
  if (workId === 'distortion') {
    // 8つの歪みごとに 0-2 のスコア。1以上を「あてはまる傾向」として集計
    const applicable = DISTORTIONS
      .map(d => ({ id: d.id, name: d.name, desc: d.desc, counter: d.counter, score: answers[d.id] != null ? answers[d.id] : 0 }))
      .filter(x => x.score >= 1)
      .sort((a, b) => b.score - a.score);
    return { type: 'applicable', applicable, totalCount: applicable.length };
  }
  if (workId === 'behavior-experiment') {
    return { type: 'plan', ...answers };
  }
  return { type: 'unknown' };
}

// AI に渡すユーザーメッセージを組み立てる
function buildKizukiUserMessage(workId, result) {
  if (workId === 'distortion') {
    const apps = (result.applicable || []).slice(0, 3);
    return [
      '認知のゆがみワークの結果です。',
      `当てはまる項目: ${result.totalCount}/8`,
      ...apps.map((a, i) => `${i+1}位: ${a.name}（${a.score}/2）— ${a.desc}`),
      '',
      'すぷらんから、優しいひとことをお願いします。'
    ].join('\n');
  }
  if (workId === 'behavior-experiment') {
    return [
      '行動実験の計画です。',
      `仮説（確かめたい思い込み）: ${result.hypothesis}`,
      `小さな行動: ${result.action}`,
      `予想する結果: ${result.prediction}`,
      result.result ? `実際の結果: ${result.result}` : '',
      '',
      'すぷらんから、この計画について応援のひとことをお願いします。'
    ].filter(Boolean).join('\n');
  }
  return '';
}

async function finishKizukiWork() {
  if (!kizukiSession) return;
  const { workId, answers } = kizukiSession;
  const result = computeKizukiResult(workId, answers);
  kizukiSession.result = result;
  kizukiSession.step = 2;
  kizukiSession.loading = true;
  render();

  const promptKey = 'kizuki_' + workId.replace(/-/g, '_');
  const def = AI_PROMPTS[promptKey];
  let aiText = null;
  if (def && getInviteCode()) {
    const userMsg = buildKizukiUserMessage(workId, result);
    try {
      aiText = await callGemini(def.systemPrompt, [{ role: 'user', content: userMsg }], {
        temperature: def.temperature,
        maxTokens: def.maxTokens,
      });
    } catch (e) {
      console.warn('[kizuki AI]', e);
    }
  }
  if (!aiText) {
    aiText = '結果を見て、自分の傾向に気づけたら十分。「あ、自分こうなんだ」って気づくこと自体が、もう一歩前に進んでるよ。';
  }
  kizukiSession.aiComment = aiText;
  kizukiSession.loading = false;

  // 保存
  state.kizukiResults = state.kizukiResults || {};
  state.kizukiResults[workId] = {
    completedAt: new Date().toISOString(),
    answers,
    result,
    aiComment: aiText,
  };
  saveState();
  render();
}

// ============================================================
// 行動実験フロー（5ステップ + ホーム）— v0.9.78
//
// 画面遷移:
//   home(履歴+CTA) → hypothesis(1/5) → plan(2/5 AI) → execute(3/5)
//                  → verify(4/5)    → next-plan(5/5 AI) → complete
//
// state:
//   behaviorExpSession: in-memory（進行中の1サイクル）
//   state.behaviorExperiments[]: 完了済み履歴
//
// 画面: render() switch case 'behavior-exp'
// ============================================================
let behaviorExpSession = null;

function startBehaviorExp() {
  behaviorExpSession = { step: 'home' };
  go('behavior-exp');
}

function newBehaviorExp() {
  behaviorExpSession = {
    id: 'be-' + Date.now(),
    createdAt: new Date().toISOString(),
    step: 'hypothesis',
    hypothesis: { what: '', why: '' },
    plan: { candidates: [], selected: null, custom: '', loading: false },
    execute: { action: '', when: '', where: '', expected: '', anxiety: 5, started: false },
    verify: { result: '', score: 5, insight: '' },
    nextPlan: { candidates: [], selected: null, custom: '', loading: false },
  };
  render();
}

function backToBehaviorExpHome() {
  behaviorExpSession = { step: 'home' };
  render();
}

function cancelBehaviorExp() {
  behaviorExpSession = null;
  go('kizuki');
}

function completeBehaviorExp() {
  if (!behaviorExpSession || !behaviorExpSession.id) return;
  const completed = JSON.parse(JSON.stringify(behaviorExpSession));
  completed.completedAt = new Date().toISOString();
  completed.status = 'completed';
  delete completed.step;
  // 次の計画の選択を保存（あれば）
  const n = completed.nextPlan || {};
  if (n.selected != null && n.candidates && n.candidates[n.selected]) {
    completed.nextActionHint = n.candidates[n.selected];
  } else if ((n.custom || '').trim()) {
    completed.nextActionHint = { level: 'カスタム', title: n.custom, desc: '' };
  }
  state.behaviorExperiments = state.behaviorExperiments || [];
  const idx = state.behaviorExperiments.findIndex(e => e.id === completed.id);
  if (idx >= 0) state.behaviorExperiments[idx] = completed;
  else state.behaviorExperiments.unshift(completed);
  saveState();
  behaviorExpSession = { step: 'home' };
  render();
}

// ----- AI候補生成 -----
async function generateBehaviorPlanCandidates() {
  if (!behaviorExpSession) return;
  behaviorExpSession.plan.loading = true;
  render();

  const def = AI_PROMPTS.kizuki_behavior_plan_candidates;
  let candidates = null;
  if (def && getInviteCode()) {
    const userMsg = [
      '行動実験の仮説（思い込み）:',
      behaviorExpSession.hypothesis.what,
      behaviorExpSession.hypothesis.why ? '理由: ' + behaviorExpSession.hypothesis.why : '',
      '',
      '上記をふまえて、難易度別の行動候補を4つ JSON 配列で出力してください。',
    ].filter(Boolean).join('\n');
    try {
      const text = await callGemini(def.systemPrompt, [{ role: 'user', content: userMsg }], {
        temperature: def.temperature,
        maxTokens: def.maxTokens,
      });
      candidates = parseBehaviorCandidatesJson(text, 4);
    } catch (e) {
      console.warn('[behavior-plan]', e);
    }
  }
  if (!candidates || candidates.length === 0) {
    candidates = [
      { level: 'かんたん',   title: 'まずはイメージするだけ',     desc: '目を閉じて、その場面を想像してみる' },
      { level: 'やさしい',   title: 'とても短い時間やってみる', desc: '1分だけ、やってみる' },
      { level: 'ふつう',     title: '少しハードルを上げてみる', desc: '短い時間、実際にやってみる' },
      { level: 'チャレンジ', title: 'いつもより少し頑張ってみる', desc: '少し長い時間やってみる' },
    ];
  }
  if (behaviorExpSession && behaviorExpSession.plan) {
    behaviorExpSession.plan.candidates = candidates;
    behaviorExpSession.plan.loading = false;
    render();
  }
}

async function generateBehaviorNextCandidates() {
  if (!behaviorExpSession) return;
  behaviorExpSession.nextPlan.loading = true;
  render();

  const def = AI_PROMPTS.kizuki_behavior_next_candidates;
  let candidates = null;
  if (def && getInviteCode()) {
    const userMsg = [
      '直前に完了した行動実験:',
      `仮説: ${behaviorExpSession.hypothesis.what}`,
      `実験した行動: ${behaviorExpSession.execute.action}`,
      `予想: ${behaviorExpSession.execute.expected}`,
      `結果: ${behaviorExpSession.verify.result}`,
      `仮説の当てはまり度: ${behaviorExpSession.verify.score}/10`,
      `気づき: ${behaviorExpSession.verify.insight}`,
      '',
      '上記をふまえて、次の一歩の候補を3つ JSON 配列で出力してください。',
    ].join('\n');
    try {
      const text = await callGemini(def.systemPrompt, [{ role: 'user', content: userMsg }], {
        temperature: def.temperature,
        maxTokens: def.maxTokens,
      });
      candidates = parseBehaviorCandidatesJson(text, 3);
    } catch (e) {
      console.warn('[behavior-next]', e);
    }
  }
  if (!candidates || candidates.length === 0) {
    candidates = [
      { level: 'かんたん',   title: '同じ場面でもう一度試す',     desc: '今回と同じ状況で、もう一度同じ行動をやってみる' },
      { level: 'ふつう',     title: '少し条件を広げて試す',       desc: '時間や場所、相手を少し変えて、同じことをやってみる' },
      { level: 'チャレンジ', title: '一段ハードルを上げる',         desc: '人数・時間・難易度など条件を1つ難しくしてみる' },
    ];
  }
  if (behaviorExpSession && behaviorExpSession.nextPlan) {
    behaviorExpSession.nextPlan.candidates = candidates;
    behaviorExpSession.nextPlan.loading = false;
    render();
  }
}

function parseBehaviorCandidatesJson(text, expectN) {
  if (!text) return null;
  try {
    const m = text.match(/\[\s*\{[\s\S]*\}\s*\]/);
    const raw = m ? m[0] : text;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return null;
    return arr.slice(0, expectN).map(x => ({
      level: String(x.level || ''),
      title: String(x.title || ''),
      desc: String(x.desc || ''),
    })).filter(x => x.title);
  } catch (e) {
    return null;
  }
}

function planLevelColor(level) {
  if (level === 'かんたん')   return '#82B07F';
  if (level === 'やさしい')   return '#D78A6E';
  if (level === 'ふつう')     return '#7BA0C6';
  if (level === 'チャレンジ') return '#C77AB0';
  return '#888';
}

const SC_ALT_ACTIONS = {
