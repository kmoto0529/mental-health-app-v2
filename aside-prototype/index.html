  `;

  return html;
}

// ============================================================
// AI分析レポート: 気分グラフ用 ヘルパー関数群
// ============================================================
// moodScore (1-5) → 0-10 に変換
function moodScoreTo10(s) {
  if (s == null) return null;
  return ((s - 1) / 4) * 10;
}

// 日ごとのトピックスを生成（カテゴリ・コメントから推測）
function topicForMoodLog(m) {
  if (!m) return '-';
  if (m.comment && m.comment.length > 0) return m.comment.slice(0, 14);
  const cats = (m.categories || []).map(id => (CATEGORIES.find(c => c.id === id) || {}).name).filter(Boolean);
  if (cats.length > 0) return cats[0];
  if (m.moodScore >= 4) return 'いい感じ';
  if (m.moodScore <= 2) return 'モヤモヤした';
  return 'ふつうの日';
}

// 日付別: 直近 N 日（既定7日）の平均気分
function computeMoodByDate(logs, days = 7) {
  const points = [];
  const labels = [];
  const today = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const sameDay = logs.filter(m => {
      const md = new Date(m.createdAt);
      return md.getFullYear() === d.getFullYear() && md.getMonth() === d.getMonth() && md.getDate() === d.getDate();
    });
    const avg = sameDay.length > 0 ? sameDay.reduce((s, m) => s + moodScoreTo10(m.moodScore), 0) / sameDay.length : null;
    const moodScoreAvg = sameDay.length > 0 ? sameDay.reduce((s, m) => s + m.moodScore, 0) / sameDay.length : null;
    const last = sameDay[sameDay.length - 1];
    const wd = ['日','月','火','水','木','金','土'][d.getDay()];
    labels.push(`${d.getMonth()+1}/${d.getDate()}\n${wd}`);
    points.push({
      key,
      value: avg,
      moodScore: moodScoreAvg,
      mood: last ? last.moodScore : null,
      topic: last ? topicForMoodLog(last) : null,
      isToday: i === 0,
    });
  }
  return { points, labels };
}

// 時間帯別: 4時間刻み 6バケット
function computeMoodByHour(logs) {
  const buckets = [
    { id: 0, label: '深夜（0時〜3時）',   icon: '🌙', range: [0, 4],   note: '休息の時間帯です' },
    { id: 1, label: '朝（4時〜9時）',     icon: '🌅', range: [4, 10],  note: '気分が上がりやすい時間帯です' },
    { id: 2, label: '昼（10時〜15時）',   icon: '☀️', range: [10, 16], note: '気分が安定しやすい時間帯です' },
    { id: 3, label: '夕方（16時〜19時）', icon: '🌇', range: [16, 20], note: '少し気分が下がりやすい時間帯です' },
    { id: 4, label: '夜（20時〜23時）',   icon: '🌃', range: [20, 24], note: '気分が下がりやすい時間帯です' },
  ];
  buckets.forEach(b => { b.values = []; b.recent = null; });
  logs.forEach(m => {
    const h = new Date(m.createdAt).getHours();
    const b = buckets.find(x => h >= x.range[0] && h < x.range[1]);
    if (b) {
      b.values.push(moodScoreTo10(m.moodScore));
      if (!b.recent || new Date(m.createdAt) > new Date(b.recent.createdAt)) b.recent = m;
    }
  });
  buckets.forEach(b => {
    b.value = b.values.length > 0 ? b.values.reduce((s, v) => s + v, 0) / b.values.length : null;
    b.topic = b.recent ? topicForMoodLog(b.recent) : null;
  });
  // ラインチャート用
  const labels = ['0時','4時','8時','12時','16時','20時','24時'];
  const points = [];
  for (let i = 0; i < 7; i++) {
    if (i === 0) points.push({ value: buckets[0].value, topic: buckets[0].topic });
    else if (i === 6) points.push({ value: buckets[0].value, topic: buckets[0].topic });
    else points.push({ value: buckets[i-1].value, topic: buckets[i-1].topic });
  }
  return { points, labels, buckets };
}

// 曜日別: 月-日 7曜日の平均気分
function computeMoodByWeekday(logs) {
  // 月始まり: 月,火,水,木,金,土,日 (index 0..6)
  const labels = ['月','火','水','木','金','土','日'];
  const buckets = labels.map(() => ({ values: [], topics: {}, recent: null }));
  logs.forEach(m => {
    const d = new Date(m.createdAt);
    const idx = (d.getDay() + 6) % 7; // 月=0
    const b = buckets[idx];
    b.values.push(moodScoreTo10(m.moodScore));
    const t = topicForMoodLog(m);
    b.topics[t] = (b.topics[t] || 0) + 1;
    if (!b.recent || new Date(m.createdAt) > new Date(b.recent.createdAt)) b.recent = m;
  });
  const points = buckets.map(b => {
    const value = b.values.length > 0 ? b.values.reduce((s, v) => s + v, 0) / b.values.length : null;
    const topic = b.recent ? topicForMoodLog(b.recent) : null;
    return { value, topic };
  });
  return { points, labels };
}

// シンプル ライン折れ線チャート
function renderLineChart(points, labels) {
  const W = 320, H = 180, padX = 28, padY = 18;
  const innerW = W - padX * 2;
  const innerH = H - padY * 2;
  const N = points.length;
  const x = (i) => padX + (innerW * (i / Math.max(1, N - 1)));
  const y = (v) => padY + innerH - (innerH * (Math.max(0, Math.min(10, v)) / 10));

  // y軸グリッド (0,5,10)
  const gridLines = [0, 5, 10].map(v => `
    <line x1="${padX}" x2="${W - padX}" y1="${y(v)}" y2="${y(v)}" stroke="var(--divider)" stroke-width="1" stroke-dasharray="3 3" />
    <text x="${padX - 4}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="var(--text-muted)">${v}</text>
  `).join('');

  // パス（null は飛ばす）
  let pathD = '';
  let started = false;
  points.forEach((p, i) => {
    if (p.value == null) { started = false; return; }
    if (!started) { pathD += `M ${x(i)} ${y(p.value)}`; started = true; }
    else { pathD += ` L ${x(i)} ${y(p.value)}`; }
  });

  // ドット + 値ラベル
  const dots = points.map((p, i) => {
    if (p.value == null) return '';
    const cx = x(i), cy = y(p.value);
    const color = p.value >= 7 ? '#7BA876' : p.value >= 4 ? '#D4A867' : '#B57272';
    return `<circle cx="${cx}" cy="${cy}" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.5" />`;
  }).join('');

  // x軸ラベル
  const xLabels = labels.map((lab, i) => {
    const lines = String(lab).split('\n');
    return lines.map((l, li) => `
      <text x="${x(i)}" y="${H - padY + 12 + li * 10}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${escapeHtml(l)}</text>
    `).join('');
  }).join('');

  return `
    <div class="kr-graph-svg-wrap">
      <svg viewBox="0 0 ${W} ${H + 14}" preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto;">
        ${gridLines}
        <path d="${pathD}" fill="none" stroke="#7BA876" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        ${dots}
        ${xLabels}
      </svg>
    </div>
  `;
}

// シンプル 棒グラフ（曜日別）
function renderBarChart(points, labels) {
  const W = 320, H = 180, padX = 28, padY = 18;
  const innerW = W - padX * 2;
  const innerH = H - padY * 2;
  const N = points.length;
  const slot = innerW / N;
  const barW = Math.min(28, slot * 0.55);

  const yBase = padY + innerH;
  const y = (v) => padY + innerH - (innerH * (Math.max(0, Math.min(10, v)) / 10));

  const gridLines = [0, 5, 10].map(v => `
    <line x1="${padX}" x2="${W - padX}" y1="${y(v)}" y2="${y(v)}" stroke="var(--divider)" stroke-width="1" stroke-dasharray="3 3" />
    <text x="${padX - 4}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="var(--text-muted)">${v}</text>
  `).join('');

  const bars = points.map((p, i) => {
    if (p.value == null) return '';
    const cx = padX + slot * i + slot / 2;
    const top = y(p.value);
    const color = p.value >= 7 ? '#7BA876' : p.value >= 4 ? '#D4A867' : '#B57272';
    return `<rect x="${cx - barW/2}" y="${top}" width="${barW}" height="${yBase - top}" fill="${color}" rx="3" />`;
  }).join('');

  const xLabels = labels.map((lab, i) => `
    <text x="${padX + slot * i + slot / 2}" y="${H - padY + 12}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${escapeHtml(lab)}</text>
  `).join('');

  return `
    <div class="kr-graph-svg-wrap">
      <svg viewBox="0 0 ${W} ${H + 14}" preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto;">
        ${gridLines}
        ${bars}
        ${xLabels}
      </svg>
    </div>
  `;
}

function weekdayBg(i) {
  // 月-日
  const colors = ['#E8F0E2', '#F5E8C8', '#E2EFE8', '#E8E2F0', '#FCE8D6', '#DDE8F0', '#F0DDE8'];
  return colors[i] || '#EEE';
}
function weekdayFg(i) {
  const colors = ['#5C7E60', '#A37D2C', '#5C7E60', '#7B5CA0', '#B07F2F', '#5C7898', '#A0567C'];
  return colors[i] || '#444';
}

// すぷらん ひとこと（タブごと）
function generateGraphSuplanMessage(tab, data) {
  const valid = (data.points || []).filter(p => p.value != null);
  if (valid.length === 0) return '記録がたまってくると、ここにすぷらんからのひとことが表示されるよ。';
  const avg = valid.reduce((s, p) => s + p.value, 0) / valid.length;

  if (tab === 'date') {
    const lows = (data.points || []).filter(p => p.value != null && p.value < 4);
    const highs = (data.points || []).filter(p => p.value != null && p.value >= 7);
    if (lows.length >= 2 && highs.length === 0) {
      return 'ここ最近は気分が落ち込みやすい日が続いているみたい。\n小さなセルフケアを大切にしようね。';
    }
    if (highs.length >= 2 && lows.length === 0) {
      return 'いい感じの日が続いてるみたい。\nこのリズムを大切に、無理しない範囲で続けてみよう。';
    }
    return '気分には波があるのが自然なこと。\n上がる日も下がる日も、そっと書きとめておくのが大事だよ。';
  }
  if (tab === 'hour') {
    const sorted = (data.buckets || []).filter(b => b.value != null).sort((a, b) => b.value - a.value);
    if (sorted.length === 0) return '記録がたまってくると、時間帯ごとの傾向が見えてくるよ。';
    const top = sorted[0];
    const bottom = sorted[sorted.length - 1];
    return `あなたは${top.label.split('（')[0]}に気分が上がりやすくて、\n${bottom.label.split('（')[0]}は少し下がりやすいみたいだよ。`;
  }
  if (tab === 'weekday') {
    const wdLabels = ['月','火','水','木','金','土','日'];
    const valued = (data.points || []).map((p, i) => ({ ...p, label: wdLabels[i] })).filter(p => p.value != null);
    if (valued.length === 0) return '曜日ごとの記録がたまると、傾向が見えてくるよ。';
    const sorted = [...valued].sort((a, b) => b.value - a.value);
    const top = sorted[0], bottom = sorted[sorted.length - 1];
    return `あなたは${top.label}曜日に気分が上がりやすく、\n${bottom.label}曜日は少しゆっくり休む時間にしてみよう。`;
  }
  return '';
}

// 傾向まとめ メッセージ
function generateGraphTrendSummary(tab, logs) {
  if (!logs || logs.length < 3) return null;
  if (tab === 'date') {
    return '気分が上がった日は、好きな香りや音楽など\n「リラックスする行動」をしていることが多いよ';
  }
  if (tab === 'hour') {
    return '夜のモヤモヤ対策に、「お風呂に入る」「深呼吸する」などの\nリラックス行動が役立っているよ';
  }
  if (tab === 'weekday') {
    return '平日の中で調子が上がりやすい日と下がりやすい日があるみたい！\n下がる日は「休む日」として、自分をいたわってあげてね';
  }
  return null;
}

    '',
    `## 目的`,
    p.purpose,
    '',
    `## トリガー箇所`,

    `- model: ${p.model}`,
    `- temperature: ${p.temperature}`,
    `- maxTokens: ${p.maxTokens}`,
    `- 出力フォーマット: ${p.outputFormat}`,
    '',
    `## フォールバック挙動`,
    p.fallbackBehavior,
    '',
    `## セーフティチェック`,
    ...(p.safetyChecks || []).map(s => `- ${s}`),
    '',
    `## システムプロンプト`,
    '```',
    p.systemPrompt,
    '```',
  ];
  if (p.contextTemplate) {
    lines.push('', '## コンテキストテンプレート（動的挿入）', '```', p.contextTemplate, '```');
  }
  if (p.userTemplate) {
    lines.push('', '## ユーザーメッセージテンプレート', '```', p.userTemplate, '```');
  }
  lines.push('', `## 最終更新 / 変更履歴`, `${p.lastUpdated} — ${p.changeNote || '-'}`);
  lines.push('', `## 心理士レビュー状態`, `- 状態: ${p.psychologistReviewStatus || '未設定'}`);
  if (p.psychologistReviewNote) lines.push(`- ノート: ${p.psychologistReviewNote}`);
  return lines.join('\n');
}

// ============================================================
// アクションハンドラ（v3）
// ============================================================
function handleAction(act, el, ev) {
  // 共通: ナビ
  if (act === 'back-home')   { moodDraft = null; moodCatsExpanded = false; go('home'); return; }
  if (act === 'back-action') { go('action'); return; }
  if (act === 'back-record') { go('record'); return; }
  if (act === 'close-modal') { closeModal(); return; }

  // オンボーディング (v0.9.8: 5ステップ刷新)
  if (act === 'welcome-next') { go('consent'); return; }
  if (act === 'open-consent-details') { modal(viewConsentDetailsModal(), 'modal-card-tall'); return; }
  if (act === 'consent-agree' || act === 'consent-agree-from-details') {
    state.consent = { given: true, version: (window.ASIDE_CONFIG && window.ASIDE_CONFIG.consentVersion) || 'v1', at: Date.now() };
    saveState();
    if (window.MoyaLogger) MoyaLogger.recordConsent();
    closeModal();
    go('nickname');
    return;
  }
  if (act === 'nickname-save') {
    const v = (document.getElementById('nicknameInput')||{}).value || '';
    state.user.nickname = v.trim() || 'あなた';
    state.user.createdAt = Date.now();
    saveState();
    go('profile');
    return;
  }
  if (act === 'nickname-skip') {
    state.user.nickname = '';
    state.user.createdAt = Date.now();
    saveState();
    go('profile');
    return;
  }

  // プロフィール画面 (chip 選択)
  if (act === 'profile-pick') {
    const d = ensureProfileDraft();
    const type = el.dataset.type;
    const id = el.dataset.id;
    if (type === 'interests') {
      const i = d.interests.indexOf(id);
      if (i >= 0) d.interests.splice(i, 1);
      else d.interests.push(id);
    } else {
      d[type] = (d[type] === id) ? '' : id;  // 同じものを再タップで解除
    }
    render();
    return;
  }
  if (act === 'profile-save') {
    const d = ensureProfileDraft();
    if (!d.occupation || !d.ageRange || !d.gender) {
      toast('立場・年代・性別を選んでね'); return;
    }
    Object.assign(state.user, {
      occupation: d.occupation,
      ageRange: d.ageRange,
      gender: d.gender,
      interests: d.interests.slice(),
      profileDone: true,
    });
    saveState();
    profileDraft = null;
    go('guide');
    return;
  }

  // 使い方ガイド完了 → 招待コード入力へ
  if (act === 'guide-done') {
    state.guidedShown = true;
    saveState();
    // 既に招待コードが入っているなら invite-code 画面はスキップ
    if (getInviteCode()) {
      state.initialDone = true;
      saveState();
      go('home');
    } else {
      go('invite-code');
    }
    return;
  }

  // 招待コード（オンボーディング: guide → invite-code → home）
  if (act === 'invite-code-onboard-save') {
    (async () => {
      const v = (document.getElementById('onboardInviteInput')||{}).value || '';
      const trimmed = v.trim();
      if (!trimmed) { toast('招待コードを入力してください'); return; }
      const btn = document.querySelector('[data-act="invite-code-onboard-save"]');
      if (btn) { btn.disabled = true; btn.textContent = '確認中…'; }
      const ok = await validateInviteCode(trimmed);
      if (!ok) {
        if (btn) { btn.disabled = false; btn.textContent = '保存して始める'; }
        toast('招待コードが正しくないようです');
        return;
      }
      state.preferences = state.preferences || {};
      state.preferences.inviteCode = trimmed;
      delete state.preferences.geminiApiKey;
      state.initialDone = true;
      saveState();
      go('home');
    })();
    return;
  }

  // ホーム上での即時気分選択 → mood-full に遷移して気分プリセット
  if (act === 'quick-mood') {
    const score = Number(el.dataset.score);
    moodDraft = { moodScore: score, categories: [], comment: '' };
    go('mood-full');
    return;
  }
  // 気持ち入力フル
  if (act === 'open-mood-full') { moodDraft = null; go('mood-full'); return; }
  // すべての記録を見る → きろくタブのカレンダー > 「最近のきろく」位置へスクロール
  if (act === 'see-all-records') {
    state.ui.recordSubtab = 'calendar';
    go('record');
    setTimeout(() => {
      const headers = document.querySelectorAll('h3.section-title');
      const target = Array.from(headers).find(h => h.textContent.includes('最近のきろく'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
    return;
  }
  // 記録詳細
  if (act === 'open-record-detail') {
    const m = state.moodLogs.find(x => x.id === el.dataset.id);
    if (m) {
      const d = new Date(m.createdAt);
      viewParams.dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      go('day-detail');
    }
    return;
  }
  if (act === 'mood-score') { ensureMoodDraft().moodScore = Number(el.dataset.score); render(); return; }
  if (act === 'mood-cat') {
    const d = ensureMoodDraft();
    const cid = el.dataset.cat;
    if (d.categories.includes(cid)) d.categories = d.categories.filter(x => x !== cid);
    else d.categories.push(cid);
    render();
    return;
  }
  if (act === 'cats-expand')  { moodCatsExpanded = true;  render(); return; }
  if (act === 'cats-collapse'){ moodCatsExpanded = false; render(); return; }
  if (act === 'mood-save-end') {
    const log = saveMoodLog();
    moodDraft = null;
    if (log) toast('記録しました。今日の気持ちを残せただけでも十分です。');
    go('home');
    return;
  }
  if (act === 'mood-save-talk') {
    const log = saveMoodLog();
    moodDraft = null;
    if (log) startMoodChat(log);
    return;
  }
  if (act === 'mood-chat-send') { moodChatSend(); return; }
  if (act === 'mood-quick-reply') {
    const input = document.getElementById('moodChatInput');
    if (input) { input.value = el.dataset.text || ''; }
    moodChatSend();
    return;
  }
  if (act === 'end-mood-chat')  { endMoodChat(); return; }

  // もやもや整理
  if (act === 'moyamoya-start') { moyamoya = { step: 1 }; go('moyamoya'); return; }
  if (act === 'moya-cancel')    { moyamoya = null; go('home'); return; }
  if (act === 'moya-back-step') {
    // step1 では前のstepがないのでホームへ。それ以外は1つ前のstepへ。
    // step6 (レター) → step5 に戻ると「いま、気持ちの強さ」を選び直せる。
    // step4 (別の見方候補) に戻ると候補が再表示される（生成済みなら再生成しない）。
    if (!moyamoya || (moyamoya.step || 1) <= 1) { moyamoya = null; go('home'); return; }
    moyamoya.step = (moyamoya.step || 1) - 1;
    render();
    return;
  }
  if (act === 'moya-step1-next') {
    const v = (document.getElementById('moyaInput')||{}).value || '';
    if (!v.trim()) { toast('短くてOK。何があったか書いてみて'); return; }
    moyamoya.eventText = v.trim();
    const c = detectCrisis(v);
    if (c && c.sev >= 4) { showCrisisModal(c.sev); return; }
    moyamoya.step = 2;
    render();
    return;
  }
  if (act === 'moya-step2-pick') { moyamoya.emotion = el.dataset.emotion; render(); return; }
  if (act === 'moya-step2-show-all') { moyamoya.showAllEmotions = true; render(); return; }
  if (act === 'moya-step2-next') { if (moyamoya.emotion) { moyamoya.step = 3; render(); } return; }
  if (act === 'moya-set-score') {
    moyamoya.emotionScoreBefore = parseInt(el.dataset.score, 10);
    render();
    return;
  }
  if (act === 'moya-set-score-after') {
    moyamoya.emotionScoreAfter = parseInt(el.dataset.score, 10);
    render();
    return;
  }
  if (act === 'moya-step3-next') {
    if (moyamoya.emotionScoreBefore == null) moyamoya.emotionScoreBefore = 5;
    moyamoya.step = 4; render(); return;
  }
  // ── v0.9.80: Step 4 自動思考 ──
  if (act === 'moya-step4-next') {
    const v = (document.getElementById('moyaAutoThoughtInput') || {}).value || '';
    if (!v.trim()) { toast('頭に浮かんだ考えを書いてみて'); return; }
    moyamoya.automaticThought = v.trim();
    moyamoya.step = 5;
    render();
    return;
  }
  // ── v0.9.80: Step 5 根拠 ──
  if (act === 'moya-step5-next') {
    const v = (document.getElementById('moyaEvidenceInput') || {}).value || '';
    if (!v.trim()) { toast('「事実だと思う理由」を書いてみて'); return; }
    moyamoya.evidence = v.trim();
    moyamoya.step = 6;
    render();
    return;
  }
  // ── v0.9.80: Step 6 反証 + AIヒント ──
  if (act === 'moya-step6-hint') {
    if (!moyamoya || moyamoya.counterEvidenceHintsLoading) return;
    // 反証 textarea の現在値を退避（再描画でクリアされないように）
    const cur = (document.getElementById('moyaCounterEvidenceInput') || {}).value || '';
    moyamoya.counterEvidence = cur;
    moyamoya.counterEvidenceHintsLoading = true;
    const sessionRef = moyamoya;
    render();
    generateCounterEvidenceHintsAI(
      sessionRef.eventText,
      sessionRef.emotion,
      sessionRef.automaticThought,
      sessionRef.evidence
    ).then(hints => {
      if (moyamoya !== sessionRef) return;
      sessionRef.counterEvidenceHints = (hints && hints.length) ? hints : null;
      sessionRef.counterEvidenceHintsLoading = false;
      if (!sessionRef.counterEvidenceHints) toast('ヒントが取れなかったよ。自分の言葉で書いてみよう');
      render();
    }).catch(() => {
      if (moyamoya !== sessionRef) return;
      sessionRef.counterEvidenceHints = null;
      sessionRef.counterEvidenceHintsLoading = false;
      render();
    });
    return;
  }
  if (act === 'moya-step6-next') {
    const v = (document.getElementById('moyaCounterEvidenceInput') || {}).value || '';
    if (!v.trim()) { toast('反証を1つでもいいから書いてみて'); return; }
    moyamoya.counterEvidence = v.trim();
    moyamoya.step = 7;
    render();
    return;
  }
  // ── Step 7（旧 step4）：適応的思考 / 別の見方 ──
  if (act === 'moya-step7-more') {
    moyamoya.alternativeViewsRevealed = Math.min(6, (moyamoya.alternativeViewsRevealed || 3) + 3);
    render();
    return;
  }
  if (act === 'moya-step7-pick') {
    moyamoya.alternativeViewSelectedIndex = parseInt(el.dataset.index, 10);
    render();
    return;
  }
  if (act === 'moya-step7-next') {
    // 選択された1つの見方をレター用に保存（新形式 {label,text} / 旧形式 string 両対応）
    const idx = moyamoya.alternativeViewSelectedIndex;
    if (!Array.isArray(moyamoya.alternativeViews) || typeof idx !== 'number' || idx < 0 || idx >= (moyamoya.alternativeViewsRevealed || 0)) {
      toast('しっくりくる見方を1つ選んでね');
      return;
    }
    const picked = normalizeAltView(moyamoya.alternativeViews[idx]);
    moyamoya.alternativeView = picked.text;
    moyamoya.alternativeViewLabel = picked.label || '';
    moyamoya.step = 8;
    render();
    return;
  }
  // ── Step 8（旧 step5）：強さ再評価 → レター ──
  if (act === 'moya-step8-next') {
    if (moyamoya.emotionScoreAfter == null) moyamoya.emotionScoreAfter = 5;
    moyamoya.step = 9; render(); return;
  }
  if (act === 'moya-save') {
    const r = saveMoyamoyaRecord();
    moyamoya = null;
    if (r) toast('レターを保存しました');
    go('home');
    return;
  }
  if (act === 'letter-restart') {
    moyamoya = { step: 1 };
    render();
    return;
  }
  if (act === 'letter-share' || act === 'letter-send') {
    const s = moyamoya;
    if (!s) return;
    const text = (s.letterBody || '') + '\n\n— もやの森でもやもや整理しました';
    if (navigator.share) {
      navigator.share({ title: s.letterTitle || 'もやもや整理レター', text }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(
        () => toast('レターをコピーしました'),
        () => toast('共有に失敗しました')
      );
    } else {
      toast('共有がサポートされていません');
    }
    return;
  }
  if (act === 'letter-save-image') {
    toast('画像保存は近日公開予定です');
    return;
  }

  // FAB → もやもや整理
  if (act === 'open-dialog') { moyamoya = { step: 1 }; go('moyamoya'); return; }

  // (旧 Goal→Policy→Action 関連ハンドラ全削除 v0.9.58)

  // きろくサブタブ
  if (act === 'record-sub') {
    state.ui.recordSubtab = el.dataset.sub;
    if (el.dataset.sub === 'distortion') distortionView.tab = 'summary';
    saveState();
    render();
    return;
  }
  if (act === 'day-detail') { viewParams.dateKey = el.dataset.date; go('day-detail'); return; }
  if (act === 'kiroku-detail') { viewParams.recordId = el.dataset.recordId; go('kiroku-detail'); return; }
  if (act === 'kiroku-chat')   { viewParams.chatId = el.dataset.chatId;     go('kiroku-chat');   return; }
  if (act === 'view-kiroku-letter') { viewParams.recordId = el.dataset.recordId; go('kiroku-letter'); return; }
  if (act === 'kiroku-ippo')   { viewParams.ippoId  = el.dataset.ippoId;   go('kiroku-ippo');   return; }
  if (act === 'open-distortions') {
    // きろくタブ「思考のクセ分析」サブへ集約
    state.ui.recordSubtab = 'distortion';
    distortionView.tab = 'summary';
    saveState();
    go('record');
    return;
  }
  // 思考のクセ分析（新エンジン UI / v0.9.85）
  if (act === 'da-tab') { distortionView.tab = el.dataset.tab || 'summary'; render(); return; }
  if (act === 'da-detail-tab') {
    distortionView.tab = 'detail';
    distortionView.detailTab = el.dataset.dtab || 'overview';
    distortionView.basisExpanded = false;
    render();
    return;
  }
  if (act === 'da-basis-more') { distortionView.basisExpanded = true; render(); return; }
  if (act === 'da-open-works') { openDistortionWorksModal(); return; }
  if (act === 'da-start-work') {
    const w = el.dataset.work;
    closeModal();
    if (w === 'moyamoya') { moyamoya = { step: 1 }; go('moyamoya'); }
    else if (w === 'deep-dive') { deepDive = ddSessionInit({ from: 'record' }); go('deepdive'); }
    else if (w === 'distortion') { startKizukiWork('distortion'); }
    else if (w === 'behavior-experiment') { startBehaviorExp(); }
    else if (w === 'stimulus') { startStimulus(); }
    return;
  }
  // 旧スタンドアロン画面（superseded・直接遷移は残置）
  if (act === 'open-trend') { go('kiroku-trend'); return; }
  if (act === 'open-radar') { go('kiroku-radar'); return; }
  if (act === 'open-ai-analysis') { go('kiroku-ai-analysis'); return; }
  if (act === 'open-action') { go('action'); return; }
  if (act === 'record-filter') {
    state.ui.recordFilter = el.dataset.filter;
    saveState();
    render();
    return;
  }
  if (act === 'cal-prev-month') {
    state.ui.calendarMonthOffset = (state.ui.calendarMonthOffset || 0) - 1;
    saveState();
    render();
    return;
  }
  if (act === 'cal-next-month') {
    const next = (state.ui.calendarMonthOffset || 0) + 1;
    if (next > 0) return; // 未来の月は不可
    state.ui.calendarMonthOffset = next;
    saveState();
    render();
    return;
  }
  if (act === 'report-graph-tab') {
    state.ui.reportGraphTab = el.dataset.graphTab;
    saveState();
    render();
    return;
  }

  // 設定
  // きょうのいっぽ（v0.9.2 仕様書準拠 Steps 0-6）
  // P8 〜: キャンセル/戻るは いっぽタブ内のベース画面に戻る (旧: ホームへ)
  if (act === 'ippo-cancel') { stopIppoTimerLoop(); ippoToday = null; render(); return; }
  if (act === 'ippo-onboarding-start') {
    ippoToday = { step: 2, startedAt: new Date().toISOString() };
    render();
    return;
  }
  // 新しい1日画面 → 通常フロー開始 (v0.9.52 〜 step 2 直行)
  if (act === 'ippo-newday-start') {
    ippoToday = { step: 2, startedAt: new Date().toISOString() };
    render();
    return;
  }
  // 新しい1日画面のおすすめカード直接タップ (v0.9.53 〜 タイマー直行)
  if (act === 'ippo-newday-pick-rec') {
    ippoToday = { step: 35, startedAt: new Date().toISOString(), preselectedActionId: el.dataset.actionId };
    render();
    return;
  }
  // 「もう一歩やる」 (v0.9.52 〜 step 2 直行)
  if (act === 'ippo-do-another') {
    ippoToday = { step: 2, startedAt: new Date().toISOString() };
    render();
    return;
  }
  // 「行動を選ぶ」画面を開く (P7・v0.9.45 〜)
  if (act === 'ippo-open-picker') {
    ippoToday = { step: 99, pickerTab: 'recommend', startedAt: new Date().toISOString() };
    render();
    return;
  }
  // ベース画面: 最近よくやっているいっぽの「履歴を見る」 (P8)
  if (act === 'ippo-recent-history') {
    ippoToday = { step: 99, pickerTab: 'history', startedAt: new Date().toISOString() };
    render();
    return;
  }
  // ベース画面: 習慣を追加/編集 → ピッカーを習慣選択モードで開く (P8)
  if (act === 'ippo-base-add-habit') {
    ippoToday = { step: 99, pickerTab: 'recommend', startedAt: new Date().toISOString(), habitMode: true };
    render();
    return;
  }
  // 行動の習慣 ON/OFF トグル (P8)
  if (act === 'ippo-toggle-habit') {
    const actionId = el.dataset.actionId;
    if (!actionId) return;
    if (!Array.isArray(state.user.habitActionIds)) state.user.habitActionIds = [];
    const idx = state.user.habitActionIds.indexOf(actionId);
    if (idx >= 0) {
      state.user.habitActionIds.splice(idx, 1);
      // 関連ログも削除
      state.habitLogs = (state.habitLogs || []).filter(l => l.habitId !== actionId);
      toast('習慣から外しました');
    } else {
      state.user.habitActionIds.push(actionId);
      toast('習慣に追加しました 🌱');
    }
    saveState();
    render();
    return;
  }

  // ============================================================
  // 習慣詳細 (P8.1 v0.9.47 〜)
  // ============================================================
  // 習慣行タップの分岐 (v0.9.55 〜)
  // - 既定アクション (ACTIONS 定義あり) → タイマー画面へ直行 (v0.9.53 〜)
  // - カスタム習慣 (ユーザー作成) → タイマー定義がないので詳細「今日やった！」画面へ
  if (act === 'ippo-habit-tap') {
    const id = el.dataset.habitId;
    if (!id) return;
    const isPreset = !!ACTIONS.find(a => a.id === id);
    if (isPreset) {
      ippoToday = { step: 35, startedAt: new Date().toISOString(), preselectedActionId: id };
    } else {
      habitView = { habitId: id, mode: 'today', monthOffset: 0 };
    }
    render();
    return;
  }
  // 習慣詳細（カレンダー/編集）を開く専用アクション
  if (act === 'ippo-habit-detail') {
    const id = el.dataset.habitId;
    if (!id) return;
    habitView = { habitId: id, mode: 'today', monthOffset: 0 };
    render();
    return;
  }
  // 全習慣カレンダー画面 (v0.9.54 〜)
  if (act === 'ippo-habits-cal-open') {
    habitsCalView = { monthOffset: 0 };
    render();
    return;
  }
  if (act === 'ippo-habits-cal-back') {
    habitsCalView = null;
    render();
    return;
  }
  if (act === 'ippo-habits-cal-prev') {
    if (habitsCalView) { habitsCalView.monthOffset = (habitsCalView.monthOffset || 0) - 1; render(); }
    return;
  }
  if (act === 'ippo-habits-cal-next') {
    if (habitsCalView && (habitsCalView.monthOffset || 0) < 0) {
      habitsCalView.monthOffset = (habitsCalView.monthOffset || 0) + 1;
      render();
    }
    return;
  }
  if (act === 'ippo-habit-back') {
    habitView = null;
    render();
    return;
  }
  if (act === 'ippo-habit-mode') {
    if (!habitView) return;
    habitView.mode = el.dataset.mode || 'today';
    if (habitView.mode === 'calendar') habitView.monthOffset = 0;
    render();
    return;
  }
  if (act === 'ippo-habit-mark') {
    const id = el.dataset.habitId;
    if (!id) return;
    if (markHabitDoneToday(id)) {
      saveState();
      toast('今日のいっぽを記録しました 🌱');
    }
    render();
    return;
  }
  if (act === 'ippo-habit-unmark') {
    const id = el.dataset.habitId;
    if (!id) return;
    unmarkHabitToday(id);
    saveState();
    toast('チェックを取り消しました');
    render();
    return;
  }
  if (act === 'ippo-habit-cal-prev') {
    if (habitView) { habitView.monthOffset = (habitView.monthOffset || 0) - 1; render(); }
    return;
  }
  if (act === 'ippo-habit-cal-next') {
    if (habitView) {
      const cur = habitView.monthOffset || 0;
      if (cur < 0) { habitView.monthOffset = cur + 1; render(); }
    }
    return;
  }
  if (act === 'ippo-habit-edit-save') {
    const id = el.dataset.habitId;
    if (!id) return;
    const custom = (state.customHabits || []).find(h => h.id === id);
    if (!custom) return;
    const name = (document.getElementById('habit-edit-name') || {}).value || '';
    const duration = (document.getElementById('habit-edit-duration') || {}).value || '';
    const timing = (document.getElementById('habit-edit-timing') || {}).value || '';
    const icon = (document.getElementById('habit-edit-icon') || {}).value || '🌱';
    if (!name.trim()) { toast('行動名を入力してください'); return; }
    custom.name = name.trim();
    custom.duration = duration.trim();
    custom.timing = timing.trim();
    custom.icon = icon.trim() || '🌱';
    saveState();
    toast('保存しました');
    if (habitView) habitView.mode = 'today';
    render();
    return;
  }
  if (act === 'ippo-habit-delete') {
    const id = el.dataset.habitId;
    if (!id) return;
    if (!confirm('この習慣を削除しますか？\n（記録された達成ログも削除されます）')) return;
    deleteHabit(id);
    saveState();
    habitView = null;
    toast('削除しました');
    render();
    return;
  }
  if (act === 'ippo-habit-create-submit') {
    const name = (document.getElementById('habit-create-name') || {}).value || '';
    const duration = (document.getElementById('habit-create-duration') || {}).value || '';
    const timing = (document.getElementById('habit-create-timing') || {}).value || '';
    const icon = (document.getElementById('habit-create-icon') || {}).value || '🌱';
    if (!name.trim()) { toast('行動名を入力してください'); return; }
    if (!Array.isArray(state.customHabits)) state.customHabits = [];
    state.customHabits.push({
      id: 'ch_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      name: name.trim(),
      duration: duration.trim(),
      timing: timing.trim(),
      icon: icon.trim() || '🌱',
      createdAt: new Date().toISOString(),
    });
    saveState();
    toast('習慣を追加しました 🌱');
    ippoToday = null;
    render();
    return;
  }
  // ピッカーのサブタブ切替 (P7)
  if (act === 'ippo-picker-tab') {
    if (ippoToday) {
      ippoToday.pickerTab = el.dataset.tab || 'recommend';
      render();
    }
    return;
  }
  // ピッカーで行動選択 → タイマー直行 (v0.9.56 〜・base/newday と挙動統一)
  if (act === 'ippo-picker-pick') {
    const actionId = el.dataset.actionId;
    if (!actionId) return;
    ippoToday = { step: 35, preselectedActionId: actionId, startedAt: new Date().toISOString() };
    render();
    return;
  }
  // ピッカーから戻る → ベース画面 / NewDay へ (P7)
  if (act === 'ippo-picker-back') {
    ippoToday = null;
    render();
    return;
  }
  if (act === 'ippo-todaydone-share') {
    const last = ippoCompletedToday();
    if (!last) return;
    const action = ACTIONS.find(a => a.id === last.actionId);
    const text = `きょうのいっぽ\n${action?.title || ''}\n${last.beforeIntensity}/10 → ${last.afterIntensity}/10`;
    if (navigator.share) navigator.share({ title: 'きょうのいっぽ', text }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('コピーしました'));
    return;
  }
  if (act === 'ippo-back') {
    if (ippoToday) {
      const to = parseInt(el.dataset.to, 10) || 1;
      // step 35 (タイマー) → step 2 (推薦) で候補が単一 (preselect直行) の場合は
      // キャンセル相当でベース画面へ戻す (推薦リストに1件だけ表示されるのを避ける)
      if (ippoToday.step === 35 && to === 2 && (ippoToday.candidates || []).length <= 1) {
        stopIppoTimerLoop();
        ippoToday = null;
        render();
        return;
      }
      ippoToday.step = to;
    }
    render();
    return;
  }
  if (act === 'ippo-restart') {
    stopIppoTimerLoop();
    ippoToday = { step: 2, startedAt: new Date().toISOString() };
    render();
    return;
  }
  // (旧 Step 0 方向選択 / Step 1 気分+強さ ハンドラ全削除 v0.9.58)
  // Step 2: 推薦
  if (act === 'ippo-step2-pick') {

  // ベース画面: おすすめ/最近よくやっている を直接やる → タイマー直行 (v0.9.53 〜)

  // (旧 ippo-resume-pending 削除 v0.9.58 — 保留機能廃止)

  if (act === 'kizuki-recent-row') {

      // チェックインを確定保存
      const checkin = { date: new Date().toISOString(), result: d.result };
      if (track === 'sleep') checkin.ease = (d.ease == null ? 5 : d.ease);
      else { checkin.openCount = (d.openCount === '' ? null : d.openCount); checkin.usageTrend = d.usageTrend || ''; }
      stimulusSession.checkins = stimulusSession.checkins || [];
      stimulusSession.checkins.push(checkin);
      delete stimulusSession._draft;
      persistStimulusSession();
      if (from === 'morning') { stimulusSession.step = 'weekly'; render(); generateStimulusWeeklyComment(); return; }
      if (from === 'r-morning') { stimulusSession.step = 'r-plan'; render(); return; }
      if (from === 'r-morning2') { stimulusSession.step = 'r-review'; render(); generateStimulusWeeklyComment(); return; }
      return;
    }
    if (from === 'r-plan') {
      if (stimulusSession._revisitChoice === 'change') { stimulusSession.step = 'plan-select'; render(); return; }
      stimulusSession.step = 'r-do'; render(); return;
    }
    return;
  }

  // ───────── 下向き矢印法（9ステップ）ハンドラ ─────────
  if (act === 'dd-cancel') {
    const backTo = (deepDive && deepDive.from) || 'kizuki';
    deepDive = null;
    go(backTo);
    return;
  }
  if (act === 'dd-back') {
    if (!deepDive) return;
    ddPersistCurrent();
    deepDive.step = parseInt(el.dataset.to, 10) || 1;
    render();
    return;
  }
  if (act === 'dd-step1-start') {
    if (deepDive) { deepDive.step = 2; render(); }
    return;
  }
  if (act === 'dd-step2-cat') {
    if (deepDive) deepDive.eventCategory = el.dataset.cat || '';
    ddPersistCurrent();
    render();
    return;
  }
  if (act === 'dd-step2-next') {
    const v = ((document.getElementById('ddEventInput') || {}).value || '').trim();
    if (!v) { toast('気になる出来事を書いてみて'); return; }
    if (!deepDive) return;
    deepDive.event = v;
    const c = detectCrisis(v);
    if (c && c.sev >= 4) { showCrisisModal(c.sev); return; }
    deepDive.step = 3;
    render();
    return;
  }
  if (act === 'dd-step3-emo') {
    if (!deepDive) return;
    const id = el.dataset.emo;
    const arr = deepDive.emotionTags || (deepDive.emotionTags = []);
    const i = arr.indexOf(id);
    if (i >= 0) arr.splice(i, 1); else arr.push(id);
    ddPersistCurrent();
    render();
    return;
  }
  if (act === 'dd-step3-intensity') {
    if (deepDive) deepDive.emotionIntensity = parseInt(el.dataset.score, 10);
    ddPersistCurrent();
    render();
    return;
  }
  if (act === 'dd-step3-next') {
    const v = ((document.getElementById('ddAutoThoughtInput') || {}).value || '').trim();
    if (!v) { toast('その時の考えを書いてみて'); return; }
    if (!deepDive) return;
    deepDive.autoThought = v;
    deepDive.step = 4;
    render();
    return;
  }
  // v0.9.88 Step 4 ラウンド進行（3ラウンド分割 + 振り返り）
  if (act === 'dd-step4-round-next') {
    if (!deepDive) return;
    const round = deepDive.deeperRound || 1;
    const inp = document.getElementById('ddDeeperInput');
    const v = inp ? (inp.value || '').trim() : '';
    if (!v) { toast(`${round}回目の答えを書いてみよう`); return; }
    deepDive.deeper = deepDive.deeper || ['', '', ''];
    while (deepDive.deeper.length < round) deepDive.deeper.push('');
    deepDive.deeper[round - 1] = v;
    if (round >= 3) {
      // 3回完了 → 振り返り画面へ
      deepDive.deeperPhase = 'recap';
    } else {
      deepDive.deeperRound = round + 1;
      deepDive.deeperPhase = 'input';
    }
    render();
    return;
  }
  if (act === 'dd-step4-round-back') {
    if (!deepDive) return;
    const round = deepDive.deeperRound || 1;
    const inp = document.getElementById('ddDeeperInput');
    if (inp && deepDive.deeper) deepDive.deeper[round - 1] = (inp.value || '').trim();
    if (round <= 1) {
      deepDive.step = 3;
    } else {
      deepDive.deeperRound = round - 1;
      deepDive.deeperPhase = 'input';
    }
    render();
    return;
  }
  if (act === 'dd-step4-recap-next') {
    if (!deepDive) return;
    const filled = (deepDive.deeper || []).filter(t => (t || '').trim());
    if (filled.length === 0) { toast('深掘りの答えがまだ書かれていないよ'); return; }
    deepDive.step = 5;
    render();
    return;
  }
  if (act === 'dd-step4-recap-back') {
    if (!deepDive) return;
    // 直近の入力済みラウンドへ戻る
    const filled = (deepDive.deeper || []).filter(t => (t || '').trim()).length;
    deepDive.deeperRound = Math.max(1, filled);
    deepDive.deeperPhase = 'input';
    render();
    return;
  }
  if (act === 'dd-step4-more') {
    if (!deepDive) return;
    const filled = (deepDive.deeper || []).filter(t => (t || '').trim()).length;
    if (filled >= 5) { toast('深掘りは5回までだよ'); return; }
    deepDive.deeperRound = filled + 1;
    deepDive.deeperPhase = 'input';
    deepDive.deeper = deepDive.deeper || [];
    while (deepDive.deeper.length < deepDive.deeperRound) deepDive.deeper.push('');
    render();
    return;
  }
  if (act === 'dd-step5-pick') {
    if (!deepDive) return;
    deepDive.schemaSelected = el.dataset.val || '';
    if (deepDive.schemaSelected !== '__custom__') deepDive.schemaCustom = '';
    render();
    return;
  }
  if (act === 'dd-step5-next') {
    if (!deepDive) return;
    if (!deepDive.schemaSelected) { toast('スキーマを選んでね'); return; }
    if (deepDive.schemaSelected === '__custom__') {
      const v = ((document.getElementById('ddSchemaCustomInput') || {}).value || '').trim();
      if (!v) { toast('1行で書いてみよう'); return; }
      deepDive.schemaCustom = v;
    }
    deepDive.step = 6;
    deepDive.meritDemerit = null;  // スキーマが変わったら再生成
    deepDive.aiUsedMeritDemerit = false;
    render();
    return;
  }
  // v0.9.88 Step 6 チェックリスト
  if (act === 'dd-step6-toggle-protected') {
    if (!deepDive) return;
    const v = el.dataset.val || '';
    deepDive.protectedItems = deepDive.protectedItems || [];
    const i = deepDive.protectedItems.indexOf(v);
    if (i >= 0) deepDive.protectedItems.splice(i, 1); else deepDive.protectedItems.push(v);
    render();
    return;
  }
  if (act === 'dd-step6-toggle-troubled') {
    if (!deepDive) return;
    const v = el.dataset.val || '';
    deepDive.troubledItems = deepDive.troubledItems || [];
    const i = deepDive.troubledItems.indexOf(v);
    if (i >= 0) deepDive.troubledItems.splice(i, 1); else deepDive.troubledItems.push(v);
    render();
    return;
  }
  if (act === 'dd-step6-toggle-protected-other') {
    if (!deepDive) return;
    if (!el.checked) deepDive.protectedCustom = '';
    return;
  }
  if (act === 'dd-step6-toggle-troubled-other') {
    if (!deepDive) return;
    if (!el.checked) deepDive.troubledCustom = '';
    return;
  }
  if (act === 'dd-step6-next') {
    if (!deepDive) return;
    const pInp = document.getElementById('ddProtectedCustomInput');
    const tInp = document.getElementById('ddTroubledCustomInput');
    if (pInp) deepDive.protectedCustom = (pInp.value || '').trim();
    if (tInp) deepDive.troubledCustom = (tInp.value || '').trim();
    const hasP = (deepDive.protectedItems || []).length > 0 || (deepDive.protectedCustom || '').trim();
    const hasT = (deepDive.troubledItems || []).length > 0 || (deepDive.troubledCustom || '').trim();
    if (!hasP && !hasT) { toast('1つだけでも選んでみよう'); return; }
    deepDive.step = 7;
    render();
    return;
  }
  if (act === 'dd-step7-pick') {
    if (!deepDive) return;
    deepDive.newSchemaSelected = el.dataset.val || '';
    if (deepDive.newSchemaSelected !== '__custom__') deepDive.newSchemaCustom = '';
    render();
    return;
  }
  if (act === 'dd-step7-next') {
    if (!deepDive) return;
    if (!deepDive.newSchemaSelected) { toast('新しいスキーマを選んでね'); return; }
    if (deepDive.newSchemaSelected === '__custom__') {
      const v = ((document.getElementById('ddNewSchemaCustomInput') || {}).value || '').trim();
      if (!v) { toast('1行で書いてみよう'); return; }
      deepDive.newSchemaCustom = v;
    }
    deepDive.step = 8;
    render();
    return;
  }
  // v0.9.88 Step 8: 感情強度の再評価
  if (act === 'dd-step8-intensity') {
    if (deepDive) deepDive.emotionIntensityAfter = parseInt(el.dataset.score, 10);
    render();
    return;
  }
  if (act === 'dd-step8-next') {
    if (!deepDive) return;
    if (deepDive.emotionIntensityAfter == null) { toast('今の気持ちの強さを選んでね'); return; }
    deepDive.step = 9; // 内部: サマリー画面
    render();
    return;
  }
  // 旧: dd-step8-confirm / dd-step8-other は v0.9.88 で廃止
  if (act === 'dd-save' || act === 'dd-save-and-ippo' || act === 'dd-save-later') {
    if (!deepDive) return;
    const oldSchema = ddCurrentOldSchema(deepDive);
    const newSchema = ddCurrentNewSchema(deepDive);
    const tags = extractCoreBeliefRule(deepDive);
    // v0.9.88: protectedItems/troubledItems から meritDemerit 互換も詰める
    const protectedAll = [
      ...((deepDive.protectedItems || []).map(t => t)),
      ...(((deepDive.protectedCustom || '').trim()) ? [deepDive.protectedCustom.trim()] : []),
    ];
    const troubledAll = [
      ...((deepDive.troubledItems || []).map(t => t)),
      ...(((deepDive.troubledCustom || '').trim()) ? [deepDive.troubledCustom.trim()] : []),
    ];
    state.deepDiveSessions.push({
      id: uid(),
      // 新フィールド
      eventCategory: deepDive.eventCategory || '',
      emotionTags: deepDive.emotionTags || [],
      emotionIntensity: deepDive.emotionIntensity,
      emotionIntensityAfter: deepDive.emotionIntensityAfter,
      autoThought: deepDive.autoThought || '',
      oldSchema, newSchema,
      // v0.9.88 P22: 良い面/つらい面（チェックリスト方式）
      protectedItems: deepDive.protectedItems || [],
      protectedCustom: deepDive.protectedCustom || '',
      troubledItems: deepDive.troubledItems || [],
      troubledCustom: deepDive.troubledCustom || '',
      meritDemerit: { merits: protectedAll, demerits: troubledAll }, // 互換維持
      // 旧フィールド（互換維持）
      event: deepDive.event,
      firstThought: deepDive.autoThought,
      deeper: deepDive.deeper,
      coreBelief: oldSchema,
      extractedBelief: oldSchema,
      tags,
      gentleReflection: '',
      aiUsed: !!(deepDive.aiUsedSchema || deepDive.aiUsedNewSchema),
      startedAt: deepDive.startedAt,
      completedAt: new Date().toISOString(),
    });
    // タグ集計
    tags.forEach(tagCode => {
      const existing = state.coreBeliefTags.find(t => t.tagCode === tagCode);
      if (existing) {
        existing.confidence = Math.min(1, (existing.confidence || 0) + 0.15);
        existing.updatedAt = new Date().toISOString();
      } else {
        state.coreBeliefTags.push({
          id: uid(), tagCode, confidence: 0.4, updatedAt: new Date().toISOString(),
        });
      }
    });
    saveState();
    if (window.MoyaLogger) MoyaLogger.event('deepdive_saved', { tags, oldSchema, newSchema });
    const fromTab = deepDive.from || 'kizuki';
    deepDive = null;
    toast('深掘りを保存しました');
    go(act === 'dd-save-and-ippo' ? 'ippo' : (act === 'dd-save-later' ? 'record' : fromTab));
    return;
  }

  // 深掘り内部ヘルパは下向き矢印法のビュー定義側（モジュールスコープ）に
  // 移設したのでここでは何もしない（後方互換のためコメント残し）
  if (act === 'ippo-save-then-dd') {
    // 先に ippo を保存してから深掘りへ
    if (ippoToday) {
      const c = ippoToday.candidates?.find(x => x.action.id === ippoToday.selectedActionId);
      const sessionDirIds = (ippoToday.directionIds || getDirectionIds()).slice();
      state.ippoSessions.push({
        id: uid(),
        moodLabel: ippoToday.moodLabel,
        moodIntensity: ippoToday.moodIntensity,
        directionIds: sessionDirIds,
        directionId: sessionDirIds[0] || null,
        actionId: ippoToday.selectedActionId,
        score: c?.score.total || null,
        reasons: c?.reasons || [],
        beforeIntensity: ippoToday.beforeIntensity,
        afterIntensity: ippoToday.afterIntensity,
        changeValue: ippoToday.beforeIntensity - ippoToday.afterIntensity,
        startedAt: ippoToday.startedAt,
        completedAt: new Date().toISOString(),
      });
      saveState();
    }
    ippoToday = null;
    deepDive = { step: 1, deeper: ['', '', ''], depthLevel: 0, startedAt: new Date().toISOString() };
    go('deepdive');
    return;
  }

  if (act === 'ippo-save') {
    if (!ippoToday) return;
    const c = ippoToday.candidates?.find(x => x.action.id === ippoToday.selectedActionId);
    const sessionDirIds = (ippoToday.directionIds || getDirectionIds()).slice();
    state.ippoSessions.push({
      id: uid(),
      moodLabel: ippoToday.moodLabel,
      moodIntensity: ippoToday.moodIntensity,
      directionIds: sessionDirIds,
      directionId: sessionDirIds[0] || null,
      actionId: ippoToday.selectedActionId,
      score: c?.score.total || null,
      reasons: c?.reasons || [],
      beforeIntensity: ippoToday.beforeIntensity,
      afterIntensity: ippoToday.afterIntensity,
      changeValue: ippoToday.beforeIntensity - ippoToday.afterIntensity,
      startedAt: ippoToday.startedAt,
      completedAt: new Date().toISOString(),
    });
    saveState();
    if (window.MoyaLogger) MoyaLogger.event('ippo_completed', {
      moodLabel: ippoToday.moodLabel,
      changeValue: ippoToday.beforeIntensity - ippoToday.afterIntensity,
      actionId: ippoToday.selectedActionId,
      directionIds: sessionDirIds,
    });
    ippoToday = null;
    toast('いっぽを記録しました');
    go('home');
    return;
  }

  if (act === 'feature-help') {
    const key = el.dataset.feature;
    if (key && FEATURE_HELP[key]) modal(viewFeatureHelpModal(key), 'feature-help-modal');
    return;
  }
  if (act === 'mood-help') {
    modal(viewMoodCheckHelpModal(), 'feature-help-modal');
    return;
  }
  if (act === 'mood-help-goto-report') {
    closeModal();
    state.ui.recordSubtab = 'trend';
    saveState();
    go('record');
    return;
  }
  if (act === 'open-settings') { modal(viewSettingsModal()); return; }
  if (act === 'open-suplan-info') {
    modal(viewSuplanInfoModal(), 'suplan-info-modal-card');
    // × ボタンはモーダル外（modal-bg 直下）に注入してスクロールから切り離す
    const m = document.getElementById('modal');
    let outside = m.querySelector('.suplan-info-close-outside');
    if (!outside) {
      outside = document.createElement('button');
      outside.className = 'suplan-info-close-outside';
      outside.dataset.act = 'close-modal';
      outside.setAttribute('aria-label', '閉じる');
      outside.textContent = '×';
      m.appendChild(outside);
    }
    return;
  }
  if (act === 'open-ai-prompts') { modal(viewAIPromptsModal()); return; }
  if (act === 'open-feedback') {
    state.ui.feedbackCategory = state.ui.feedbackCategory || 'request';
    state.ui.feedbackDraft = '';
    modal(viewFeedbackModal(false));
    return;
  }
  if (act === 'feedback-cat') {
    // 入力中の文字列を退避してから再描画（textareaの内容を保持）
    const ta = document.getElementById('feedbackText');
    if (ta) state.ui.feedbackDraft = ta.value || '';
    state.ui.feedbackCategory = el.dataset.cat || 'request';
    modal(viewFeedbackModal(false));
    return;
  }
  if (act === 'feedback-submit') {
    const ta = document.getElementById('feedbackText');
    const text = ((ta && ta.value) || '').trim();
    if (!text) { toast('内容を入力してください'); return; }
    if (text.length > 4000) { toast('長すぎます（4000文字以内）'); return; }
    const catId = state.ui.feedbackCategory || 'request';
    const catLabel = (FEEDBACK_CATEGORIES.find(c => c.id === catId) || {}).label || catId;
    const userId = (function() {
      try { return localStorage.getItem('aside_user_id') || 'unknown'; } catch (e) { return 'unknown'; }
    })();
    const appVersion = (typeof window.MOYANOMORI_VERSION === 'string') ? window.MOYANOMORI_VERSION : 'v0.9.x-beta';

    // バックアップ: Supabase 側にも記録（既存運用）
    try {
      if (window.MoyaLogger && typeof window.MoyaLogger.event === 'function') {
        window.MoyaLogger.event('feedback', {
          category: catId,
          text: text,
          screen: 'settings',
          submitted_at: new Date().toISOString()
        });
      }
    } catch (e) {
      console.warn('feedback送信エラー(Supabase):', e);
    }

    // メイン: Vercel /api/feedback → Resend で社長メールに送信
    const btn = document.querySelector('[data-act="feedback-submit"]');
    if (btn) { btn.disabled = true; btn.textContent = '送信中…'; }
    (async () => {
      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            category: catLabel,
            text,
            userId,
            nickname: (state.user && state.user.nickname) || '',
            screen: 'settings',
            appVersion,
          }),
        });
        if (!res.ok) {
          const err = await res.text();
          console.warn('[feedback] failed', res.status, err);
          if (btn) { btn.disabled = false; btn.textContent = '送信する'; }
          toast('送信に失敗しました。時間をおいてもう一度お試しください');
          return;
        }
        state.ui.feedbackDraft = '';
        modal(viewFeedbackModal(true));
      } catch (e) {
        console.warn('[feedback] network', e);
        if (btn) { btn.disabled = false; btn.textContent = '送信する'; }
        toast('ネットワーク接続を確認してください');
      }
    })();
    return;
  }
  if (act === 'ai-prompt-expand') {
    modal(viewAIPromptsModal(el.dataset.promptId));
    return;
  }
  if (act === 'ai-prompt-collapse') {
    modal(viewAIPromptsModal());
    return;
  }
  if (act === 'ai-prompt-copy') {
    const p = AI_PROMPTS[el.dataset.promptId];
    if (!p) return;
    const text = aiPromptToCopyText(p);
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(
        () => toast(`「${p.title}」をコピーしました`),
        () => toast('コピーに失敗しました')
      );
    } else {
      toast('クリップボードAPIが使えません');
    }
    return;
  }
  if (act === 'ai-prompt-copy-all') {
    const all = Object.keys(AI_PROMPTS).map(id => aiPromptToCopyText(AI_PROMPTS[id])).join('\n\n---\n\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(all).then(
        () => toast('全プロンプトをコピーしました'),
        () => toast('コピーに失敗しました')
      );
    } else {
      toast('クリップボードAPIが使えません');
    }
    return;
  }
  if (act === 'invite-code-save-settings') {
    (async () => {
      const v = (document.getElementById('inviteCodeInputSettings')||{}).value || '';
      const trimmed = v.trim();
      if (!trimmed) { toast('招待コードを入力してください'); return; }
      const ok = await validateInviteCode(trimmed);
      if (!ok) { toast('招待コードが正しくないようです'); return; }
      state.preferences = state.preferences || {};
      state.preferences.inviteCode = trimmed;
      delete state.preferences.geminiApiKey; // 旧形式があれば破棄
      saveState();
      toast('招待コードを保存しました');
      closeModal();
      setTimeout(() => modal(viewSettingsModal()), 50);
    })();
    return;
  }
  if (act === 'invite-code-edit') {
    state.preferences = state.preferences || {};
    delete state.preferences.inviteCode;
    delete state.preferences.geminiApiKey;
    saveState();
    closeModal();
    setTimeout(() => modal(viewSettingsModal()), 50);
    return;
  }
  if (act === 'invite-code-clear') {
    if (!confirm('招待コードを削除しますか？AI応答はパターン応答に戻ります。')) return;
    state.preferences = state.preferences || {};
    delete state.preferences.inviteCode;
    delete state.preferences.geminiApiKey;
    saveState();
    toast('招待コードを削除しました');
    closeModal();
    setTimeout(() => modal(viewSettingsModal()), 50);
    return;
  }
  if (act === 'reset-data') {
    if (confirm('本当にすべてのデータを削除しますか？元に戻せません。')) {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(STORAGE_KEY_V2);
      localStorage.removeItem('aside_user_id');
      localStorage.removeItem('aside_session_id');
      localStorage.removeItem('aside_consent_version');
      localStorage.removeItem('aside_user_row_created');
      location.reload();
    }
    return;
  }

  // 互換用ダミー
  if (act === 'crisis-close') { closeModal(); return; }

  console.warn('未定義 act:', act);
}

// 互換用: 一部ロガーから呼ばれる可能性のため残置
function endDialog() { moodChatSession = null; go('home'); }

// ============================================================
// 起動
// ============================================================
document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-act]');
  if (target) {
    handleAction(target.dataset.act, target, e);
  }

  const tab = e.target.closest('[data-tab]');
  if (tab) {
    const t = tab.dataset.tab;
    if (t === 'home')   go('home');
    if (t === 'action') {
      // v0.9.56 〜 action タブをタップしたら習慣詳細・全習慣カレンダーをクリア
      // (進行中の ippoToday は維持してタイマーを切らない)
      habitView = null;
      habitsCalView = null;
      go('action');
    }
    if (t === 'kizuki') go('kizuki');
    if (t === 'record') go('record');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    const id = document.activeElement?.id;
    if (id === 'moodChatInput') { e.preventDefault(); moodChatSend(); }
    if (id === 'onboardInviteInput') { e.preventDefault(); handleAction('invite-code-onboard-save'); }
    if (id === 'inviteCodeInputSettings') { e.preventDefault(); handleAction('invite-code-save-settings'); }
  }
});

// 初期化
function init() {
  // 利用日数カウント
  if (state.user.createdAt) {
    state.user.daysUsed = Math.floor((Date.now() - state.user.createdAt) / 86400000) + 1;
    saveState();
  }

  // ビジュアルテーマ初期適用 + 定期チェック
  applyVisualTheme();
  setInterval(() => {
    const before = document.documentElement.getAttribute('data-theme');
    applyVisualTheme();
    const after = document.documentElement.getAttribute('data-theme');
    if (before !== after) render();   // 切替時に再描画（mood絵文字差替）
  }, 60_000);

  // ヒーロー画像の存在を確認（無ければ CSS フォールバック）
  probeHeroImage();
  probeConsentDecorDark();
  probeWelcomeDark();

  // MoyaLogger 初期化
  if (window.MoyaLogger) {
    MoyaLogger.init();
  }

  // ルーティング判定 (v0.9.8: 5ステップ刷新)
  if (!state.consent.given) {
    go('welcome');
  } else if (!state.user.createdAt) {
    go('nickname');
  } else if (!state.user.profileDone) {
    go('profile');
  } else if (!state.guidedShown) {
    go('guide');
  } else {
    go('home');
  }
}

// Service Worker 登録（PWA）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => {
      console.warn('[もやの森] SW registration failed:', err && err.message);
    });
  });
}

init();

</script>
</body>
</html>
