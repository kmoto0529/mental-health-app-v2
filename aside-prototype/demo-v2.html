<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>kokoni デモ｜初回体験</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* デザイン部トークン（redesign.html / design_system/design_tokens_v2 準拠） */
  --bg:#F4F0E5; --paper:#FFFFFF; --paper2:#FCFBF6;
  --teal:#7FA05F; --teal-deep:#5E7B49; --teal-soft:#EAF0E1; --teal-line:#DCE6CC;
  --g-pale-2:#EEF2E5; --g-pale-3:#F5F7EE;
  --ink:#3B4A38; --ink2:#5D6657; --muted:#8A9179; --sub2:#9AA089;
  --line:#ECE7D8; --line-input:#E1DCCB;
  --accent:#B08535; --accent-soft:#F5E9D4; --accent-line:#EBDCBE; --warn:#B4685A;
  --cta-grad:linear-gradient(160deg,#5C7A45,#455E33); --cta-ink:#FCFBF4;
  --link:#5E7B49; --link-hover:#445A34;
  --pro:#4a5d6e; --pro-bg:#eef2f5;
  --shadow:0 8px 22px -16px rgba(90,100,60,.45);
  --sh-lift:0 16px 34px -20px rgba(90,100,60,.45);
  --sh-cta:0 14px 26px -14px rgba(70,90,45,.8);
  --r:24px; --r-m:16px; --r-btn:17px; --r-chip:14px;
  --jp:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',system-ui,sans-serif;
  --num:'Nunito','Zen Maru Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--jp);background:var(--bg);color:var(--ink2);line-height:1.75;font-size:15px;
  -webkit-font-smoothing:antialiased}
b,strong{color:var(--ink)}

#demobar{position:fixed;top:0;left:0;right:0;z-index:200;background:#25332f;color:#e8ece9;
  font-size:11.5px;padding:6px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.2)}
#demobar b{font-size:10.5px;letter-spacing:.06em;opacity:.65;margin-right:2px;white-space:nowrap}
#demobar button{background:#3a4a45;color:#e8ece9;border:1px solid #50635d;border-radius:7px;
  padding:5px 9px;font-size:11.5px;cursor:pointer;white-space:nowrap;font-family:inherit}
#demobar button.on{background:var(--teal);border-color:var(--teal);color:#062520;font-weight:700}
#demobar .sp{flex:1}
#demobar .tog{background:none;border:none;font-size:15px;padding:2px 6px}
#demobar.min .hideable{display:none}
.pad{height:40px}

.phone{max-width:430px;margin:0 auto;padding-bottom:92px;min-height:100vh;position:relative}
.screen{display:none;animation:fade .3s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.pagehead{padding:20px 20px 2px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.pagehead .back{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;font-family:inherit}
.brandrow{display:flex;align-items:center;gap:8px;padding:14px 20px 0}
.brandrow .mark{width:26px;height:26px;border-radius:50%;background:linear-gradient(140deg,#A8C48A,#6E8A54);flex-shrink:0}
.brandrow b{font-size:17px;letter-spacing:.02em}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:14px 18px;padding:20px}
.card.tint{background:linear-gradient(160deg,#FBFBF4,#EEF4E2)}
.card.warm{background:linear-gradient(120deg,#F7EFDF,#F3E7D0);border-color:var(--accent-line)}
.card h2{margin:0 0 10px;font-size:19px;font-weight:800;line-height:1.55}
.card h3{margin:0 0 6px;font-size:15.5px;font-weight:800}
.card p{margin:0 0 14px;font-size:14px;color:var(--ink2);line-height:1.85}
.card p:last-child{margin-bottom:0}
.lede{font-size:13.5px;color:var(--muted);line-height:1.8}

.btn{display:block;width:100%;border:none;border-radius:var(--r-btn);padding:15px 18px;font-size:15.5px;font-weight:700;
  background:var(--cta-grad);color:var(--cta-ink);cursor:pointer;box-shadow:var(--sh-cta);
  letter-spacing:.02em;font-family:inherit;transition:transform .14s,opacity .2s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--link);border:1px solid var(--teal-line);box-shadow:var(--shadow);font-weight:700}
.btn.ghost:hover{color:var(--link-hover)}
.btn+.btn{margin-top:9px}

.fld{margin-bottom:18px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:7px}
input[type=text],select{width:100%;border:1px solid var(--line-input);border-radius:var(--r-chip);padding:13px 14px;
  font-size:16px;font-family:inherit;background:var(--paper2);color:var(--ink);appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--g-pale-2)}

.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios button{flex:1;min-width:76px;background:#fff;border:1.5px solid var(--line);border-radius:11px;
  padding:11px 6px;font-size:13.5px;cursor:pointer;color:var(--ink);font-family:inherit}
.radios button.sel{background:var(--teal-soft);border-color:var(--teal);font-weight:700;color:var(--teal-deep)}

.checks{display:flex;flex-direction:column;gap:11px;margin:4px 0 18px}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:13px;cursor:pointer;font-size:14px;line-height:1.6}
.chk.on{border-color:var(--teal);background:var(--teal-soft)}
.chk .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:#fff}
.chk.on .bx{background:var(--teal);border-color:var(--teal)}
.chk a{color:var(--teal-deep)}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--paper);border:1px solid var(--line-input);border-radius:var(--r-chip);padding:14px 15px;font-size:14.5px;
  text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;line-height:1.6;position:relative;display:block;width:100%}
.opt:active,.opt.sel{background:var(--teal-soft);border-color:var(--teal-line);font-weight:700;color:var(--ink)}
.opt.sel::after{content:"✓";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--teal-deep);font-weight:800}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opts.row .opt{flex:1;min-width:90px;text-align:center;padding:12px 8px;font-size:13.5px;width:auto}
.opts.row .opt.sel::after{display:none}

.steps{padding:16px 20px 0}
.steps .lab{font-size:11.5px;color:var(--teal-deep);font-weight:800;letter-spacing:.06em;margin-bottom:7px}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .35s ease}

.startcard{background:linear-gradient(160deg,#FBFBF4,#EEF4E2);border:1px solid var(--teal-line);
  border-radius:22px;margin:16px 18px;padding:24px 20px;box-shadow:var(--sh-lift);text-align:center;position:relative}
.startcard .ttl{font-size:21px;font-weight:800;margin-bottom:6px}
.startcard .leaf{font-size:34px;line-height:1;margin-bottom:10px}
.startcard ul{text-align:left;margin:14px 0 18px;padding-left:18px;font-size:13.5px;color:var(--ink2);line-height:1.9}
.qbtn{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--teal);background:#fff;color:var(--teal-deep);font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}

.modalbg{position:fixed;inset:0;background:rgba(30,45,42,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:18px;padding:22px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal h3{margin:0 0 12px;font-size:17px;font-weight:800}
.modal p{font-size:14px;color:var(--ink2);line-height:1.9;margin:0 0 10px}

.bubble{margin:11px 18px;max-width:86%}
.bubble .who{font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.bubble .who i{width:18px;height:18px;border-radius:50%;background:linear-gradient(140deg,#A8C48A,#6E8A54);display:block}
.bubble .txt{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:13px 15px;font-size:14.5px;box-shadow:var(--shadow);line-height:1.85}
.bubble.me{margin-left:auto}
.bubble.me .txt{background:var(--teal-soft);border-color:var(--teal-line);border-radius:16px 16px 5px 16px;display:inline-block}
.typing{display:inline-flex;gap:4px;padding:6px 0 0 18px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.tray{margin:16px 18px}

.aibadge{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal-deep);
  border:1px solid var(--teal-line);border-radius:99px;padding:5px 12px;font-size:11.5px;font-weight:800;margin-bottom:12px}
.aibadge .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(140deg,#A8C48A,#6E8A54);display:block}
.quoteline{background:var(--paper2);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;
  padding:11px 13px;font-size:13px;color:var(--ink2);line-height:1.8;margin-bottom:14px}
.reco{position:absolute;top:-9px;left:14px;background:var(--teal);color:#fff;font-size:10.5px;font-weight:800;
  border-radius:99px;padding:2px 10px}
.opt.hasreco{margin-top:14px;border-color:var(--teal);box-shadow:0 3px 12px rgba(47,158,143,.14)}

.recap{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px;display:flex;gap:12px}
.recap .ic{font-size:19px;line-height:1.3}
.recap .k{font-size:11.5px;color:var(--teal-deep);font-weight:800;margin-bottom:3px}
.recap .v{font-size:14.5px;line-height:1.65}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:800}
.recap .v.s{font-size:13px;color:var(--ink2)}

.hi{padding:18px 20px 4px}
.hi .g{font-size:12.5px;color:var(--muted)}
.hi b{font-size:20px;display:block;margin-top:2px}
.hrow{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);margin:10px 18px;padding:15px 16px;
  display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
.hrow .ic{font-size:18px;line-height:1.4}
.hrow .k{font-size:11.5px;color:var(--teal-deep);font-weight:800;margin-bottom:2px}
.hrow .v{font-size:14.5px;line-height:1.6}
.hrow.tap{cursor:pointer}
.hrow.letter{background:linear-gradient(120deg,#F7EFDF,#F3E7D0);border-color:var(--accent-line)}

/* ── Home ダッシュボード（今週の現在地） ── */
.hhead{display:flex;align-items:center;gap:12px;padding:20px 20px 6px}
.hhead .txt{flex:1;min-width:0}
.hhead .g{font-size:12.5px;color:var(--muted)}
.hhead b{font-size:21px;display:block;margin:1px 0 3px;color:var(--ink)}
.hhead .sub{font-size:12.5px;color:var(--ink2);line-height:1.6}
.hhead .sprout{width:52px;height:52px;border-radius:50%;background:var(--g-pale-2);border:1px solid var(--teal-line);
  display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
/* いちばん目立たせるカード */
.stepcard{background:linear-gradient(160deg,#FBFBF4,#E7F0DA);border:1.5px solid var(--teal-line);border-radius:var(--r);
  margin:12px 18px 16px;padding:20px 20px 16px;box-shadow:var(--sh-lift)}
.stepcard .lab{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--teal-deep);letter-spacing:.04em}
.stepcard h2{font-size:21px;line-height:1.6;margin:8px 0 4px;color:var(--ink)}
.stepcard .plan{font-size:13px;color:var(--ink2)}
.prog{background:rgba(255,255,255,.75);border:1px solid var(--teal-line);border-radius:var(--r-m);padding:12px 14px;margin:14px 0 16px}
.prog .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.prog .k{font-size:11.5px;font-weight:800;color:var(--teal-deep)}
.prog .n{font-family:var(--num);font-size:18px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.prog .n small{font-size:12px;color:var(--muted);font-weight:700;margin-left:2px}
.prog .note{font-size:12px;color:var(--muted);line-height:1.6}
.pips{display:flex;gap:6px}
.pips i{flex:1;height:9px;border-radius:99px;background:var(--line)}
.pips i.on{background:var(--teal)}
.linkbtn{display:block;width:100%;background:none;border:none;color:var(--teal-deep);font-size:13.5px;font-weight:700;
  padding:12px 0 2px;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--teal-line)}
.hcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);margin:10px 18px;padding:14px 16px;box-shadow:var(--shadow)}
.hcard.tap{cursor:pointer}
.hcard .k{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--teal-deep);font-weight:800;margin-bottom:4px}
.hcard .v{font-size:15px;line-height:1.65;color:var(--ink)}
.hcard .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.hcard .go{margin-left:auto;color:var(--muted);font-weight:700}
.mood{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.mood button{background:var(--paper2);border:1px solid var(--line-input);border-radius:99px;padding:8px 2px;font-size:12.5px;
  color:var(--ink2);cursor:pointer;font-family:inherit}
.mood button.sel{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-deep);font-weight:800}
.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 18px}
.subgrid .hcard{margin:0;padding:13px 14px;box-shadow:none;background:var(--paper2)}
.subgrid .v{font-size:13.5px;font-weight:700;line-height:1.5}
.hcard.quiet{background:transparent;box-shadow:none;border-style:dashed}
.recall .note{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

.layer{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin:0 18px 11px;box-shadow:var(--shadow)}
.layer h4{margin:0 0 3px;font-size:12.5px;color:var(--teal-deep);font-weight:800}
.layer .sub{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.layer ul{margin:0;padding-left:17px;font-size:14px;line-height:1.8}
.layer.locked{background:var(--paper2);border-style:dashed;color:var(--muted)}
/* ── 心の地図 8ブロック（すぷらん 1枚図 準拠） ── */
.mapsum{background:linear-gradient(160deg,#FBFBF4,#EEF4E2);border:1px solid var(--teal-line);
  border-radius:var(--r);margin:0 18px 14px;padding:18px 18px 16px;box-shadow:var(--sh-lift)}
.mapsum h3{margin:0 0 4px;font-size:16px;color:var(--ink)}
.mapsum .lede{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.mapsum .row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--teal-line)}
.mapsum .row:first-of-type{border-top:none}
.mapsum .k{flex:0 0 96px;font-size:11.5px;color:var(--teal-deep);font-weight:800;line-height:1.55}
.mapsum .v{font-size:13.5px;color:var(--ink);line-height:1.6}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 18px 11px}
.mgrid .layer{margin:0}
.layer.wide{grid-column:1 / -1}
.layer.loop{background:linear-gradient(160deg,#FFFDF6,#F7EFDF);border-color:var(--accent-line)}
.layer.loop h4{color:var(--accent)}
.layer.loop .flow{font-size:13.5px;line-height:1.9;color:var(--ink);font-weight:700}
.layer.good{background:#FBFDF7;border-color:var(--teal-line)}
.layer.res{background:#FFFDF6;border-color:var(--accent-line)}
.layer.res h4{color:var(--accent)}
.layer ul li{margin-bottom:2px}
.layer.tap{cursor:pointer}
.layer.dim{background:var(--paper2);box-shadow:none}
.layer.dim h4{color:var(--muted)}
/* 心の地図：芽のまわりに7つの視点 */
.mapart{flex:0 0 auto;display:block}
.mhero{display:flex;align-items:center;gap:14px}
.mhero h3{margin:0;font-size:17px;line-height:1.5}
.mpips{display:flex;gap:5px;margin-top:8px}
.mpips i{width:16px;height:6px;border-radius:99px;background:var(--teal-line)}
.mpips i.on{background:var(--teal)}
.sech{display:flex;align-items:baseline;gap:8px;margin:20px 22px 8px;font-size:12.5px;font-weight:800;color:var(--teal-deep);letter-spacing:.04em}
.sech span{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0}
.drow{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.drow:first-child{border-top:none;padding-top:0}
.drow .k{flex:0 0 92px;font-size:11.5px;font-weight:800;color:var(--teal-deep);line-height:1.6}
.drow .v{flex:1;min-width:0;font-size:14px;line-height:1.7;color:var(--ink)}
.found{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);margin:0 18px 9px;padding:12px 14px}
.found.tap{cursor:pointer}
.found .k{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--teal-deep)}
.found .k span{color:var(--muted);font-weight:700}
.found .v{font-size:14.5px;line-height:1.7;color:var(--ink);margin-top:3px}
.found .s{font-size:11px;color:var(--muted);margin-top:3px}
.mapcta{margin:16px 18px 4px}
.mapcard{background:linear-gradient(160deg,#FFFDF6,#F3F0E2);border:1px solid var(--accent-line);border-radius:var(--r-m);margin:12px 18px;padding:16px;box-shadow:var(--shadow)}
.mapcard .top{display:flex;align-items:center;gap:12px}
.mapcard .lab{font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.04em}
.mapcard h3{margin:3px 0 0;font-size:16.5px;line-height:1.55;color:var(--ink)}
.mapcard .cnt{font-size:12.5px;color:var(--ink2);margin-top:4px}
.mapcard .cnt b{font-size:16px;color:var(--teal-deep)}
.mapcard .draft{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mapcard .ex{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 8px;margin-left:6px}
.mapcard .why{font-size:13.5px;line-height:1.85;color:var(--ink2);margin:12px 0}
.mapcard .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mapcard .two .btn{margin:0;padding-left:8px;padding-right:8px;font-size:14px}
.mapcard .found{margin:0}
.card.draft{padding:14px 16px}
.stepcard .intro{font-size:12.5px;line-height:1.75;color:var(--ink2);margin-top:6px}
.stepcard .desc{font-size:13.5px;line-height:1.75;color:var(--ink2);margin-bottom:8px}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chips2 span{font-size:12px;font-weight:700;color:var(--teal-deep);background:var(--paper);border:1px solid var(--teal-line);border-radius:99px;padding:3px 10px}
/* きろく：プロフィール・心の地図・気持ちの記録 */
.pfcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);margin:12px 18px;padding:14px 16px}
.pfcard .top{display:flex;gap:12px;align-items:flex-start}
.pfcard h3{margin:0 0 4px;font-size:14px;color:var(--ink)}
.pfcard p{margin:0;font-size:12px;line-height:1.7;color:var(--ink2)}

nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:40}
nav[hidden],nav button[hidden]{display:none}   /* nav{display:flex} が hidden 属性を打ち消すため明示する */
nav button{background:none;border:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;flex:1;padding:2px;font-family:inherit;position:relative}
nav button .ic{font-size:18px;line-height:1}

nav.locked button{opacity:.3;pointer-events:none}
/* 初回の「一緒に決める」が終わるまで未開放のタブ。消さずに、鍵と薄い表示で「この先ある」ことを見せる */

<script>
const S = {
  nickname:"", age_range:"", gender:"", life_status:"", leave_duration:"", support_use:[], support_past:false, interests:[], agreed_at:null, confidant:"", time_slots:[], agree_terms:false, agree_privacy:false,
  current_status:"", current_concerns:[], safety_answer:"", ai_conversation_summary:"", ai_confirm:"",
  direction_goal:"", first_action:"", action_difficulty:"", action_adjusted_flag:false, plan_b_text:"",
  setup_status:"not_started", setup_completed_at:null, entered:false,
  act_id:"", act_duration:0, act_frequency:"", act_timing:"", act_adjusted:false,
  act_input:"", act_feeling:"", act_logs:[], iv_exclude:[], iv_scene:"", iv_offered:[], profileOpen:false,
  step:"a1", screen:"flow", side:"user",
  otayori:[],   // すぷらんからのおたより（AI）。大塚さんの手紙（reviews[].letter_*）とは別データ
  timerId:null, timer:0,
  /* 初回の「一緒に決める」で今週の行動を確定したら true。「一緒に決める」を押しただけでは true にしない */
  initial_plan_completed:false,
  /* 週次サイクル。Home の「週1回のふりかえり」カードと「ふりかえり」タブは、どちらもこの S.cycle だけを見る */
  cycle:null, cycles:[], reviews:[], rv:null, talk_logs:[],
  daily_states:[],   // 今日の状態（daily check）。1日 DS_MAX_PER_DAY 件まで。Action記録 act_logs とは別データ
  ds_ui:null,        // Home／きろくの記録UI：{mode:"add"|"note"|"edit", id, code, where}
  kiroku:"map",      // きろくタブ：map（心の地図）／mood（気持ちの記録）
  mini_sessions:[],   // AIミニセッション（任意）の構造化された要約。ふりかえりから参照する
  map:{}, map_log:[],   // 心の地図。本人が書いた言葉だけ（block_id → {text, at, history}）
  clock_offset:0   // デモ用の時計送り（ms）。日付計算はすべて nowMs() 経由
};
const STATUS_OPTS=["仕事は続けているけど少ししんどい","休んだ方がいいのか迷っている","いま休職している",
  "復職を控えている","復職したばかり","うまく言えない"];
const SAFE_OPTS=[{t:"ない",answer:"none"},{t:"少しある",answer:"some"},{t:"強くある",answer:"strong"}];
const CONCERN_OPTS=["仕事のプレッシャー","人間関係","将来への不安","気分の落ち込み","眠りや生活リズム","自分を責めてしまう"];

/* 初回の行動確定までは使えない画面。押されたら「一緒に決める」へ誘導する */
const LOCKED_BEFORE_PLAN=["talk","gate","act"];
/* 2026-10-03 ナビ再編：独立した自由チャット「はなす」は MVP から外す（コード・会話履歴は残す。true に戻すと再び使える）
   初回3問・ワーク中のガイド・ふりかえりの整理・心の地図の対話・仮説・おたより・安全対応は、このフラグと関係なく動く */
const FEATURE_FREE_TALK=false;
/* タブ：ホーム／心の地図（map）／きろく（rec）／ふりかえり／マイページ。心の地図ときろくは同じ画面枠（s-map）を使い分ける */
function go(id){
  if(id==="talk" && !FEATURE_FREE_TALK) id="home";
  if(id==="map" && (S.kiroku_next==="mood"||S.kiroku_next==="work")) id="rec";
  if(S.side!=="user") toggleSide();
  if(!S.initial_plan_completed && LOCKED_BEFORE_PLAN.indexOf(id)>=0) return showLock(id);
  S.screen=id;

/* 開発側の確認方法：console で __SAFETY_LOG、または localStorage の kokoni_safety_events（過去セッション分も残る）。
   ?debug=1 なら安全対応画面・相談先一覧の下にも表示する */
function logSafety(event,props){
  const e=Object.assign({event:event, timestamp:new Date().toISOString(), session_id:SESSION_ID}, props||{});
  SAFETY_LOG.push(e);
  try{
    const all=JSON.parse(localStorage.getItem(SAFETY_LOG_KEY)||"[]"); all.push(e);
    localStorage.setItem(SAFETY_LOG_KEY, JSON.stringify(all));
  }catch(_){}
  if(DEBUG) console.log("[safety]",e);
}

/* data/*.json を読む。file:// で開くと fetch が使えないので、生成済みの data/*.js を <script> で読む */
function loadDataScript(name,globalVar){
  return new Promise(function(ok,ng){
    const s=document.createElement("script");
    s.src="./data/"+name+".js";
    s.onload=function(){ window[globalVar] ? ok(window[globalVar]) : ng(new Error(globalVar+" が空")); };
    s.onerror=function(){ ng(new Error(name+".js を読めません")); };
    document.head.appendChild(s);
  });
}
function loadData(name,globalVar){
  return fetch("./data/"+name+".json",{cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .catch(function(e){
      console.warn(name+".json を fetch できないため .js で読み込みます:",e.message);
      return loadDataScript(name,globalVar);
    });
}
function loadActionMaster(){
  return loadData("action-master","ACTION_MASTER")
    .then(function(j){
      AM=j; AM_BY_ID={};
      j.actions.forEach(function(a){ AM_BY_ID[a.action_id]=a; });
      injectWorks();
      return j;
    })
    .catch(function(e){
      console.error("action-master の読み込みに失敗:",e);
      AM={actions:[],categories:[]}; injectWorks();
      return AM;
    });
}

  return WORKS.map(function(w,i){ const R=WORK_RULES[w.work_type]; let sc=0; const why=[];
    if(R.want.indexOf(wt)>=0){ sc+=WORK_W.want; why.push("Q3「"+wt+"」"); }

    return {id:w.action_id, a:act(w.action_id)||w, score:sc, why:why, order:i}; })

/* ── 候補の絞り込みと採点 ───────────────────────────────── */
function scoreActions(){
  const st=S.current_status, tp=(S.current_concerns||[])[0], wt=S.direction_goal, sc=S.iv_scene||"";
  return (AM.actions||[]).filter(function(a){ return a.status==="published"; }).map(function(a){
    const m=a.match||{}; let s=0; const why=[]; let ex=null;
    if((m.want||[]).indexOf(wt)>=0){ s+=4; why.push("Q3「"+wt+"」"); }
    if((m.topic||[]).indexOf(tp)>=0){ s+=2; why.push("Q2「"+tp+"」"); }
    if((m.state||[]).indexOf(st)>=0){ s+=2; why.push("Q1「"+st+"」"); }
    const hits=(m.keywords||[]).filter(function(k){ return sc.indexOf(k)>=0; });
    if(hits.length){ s+=Math.min(3,hits.length)*2; why.push("場面の言葉「"+hits.join("・")+"」"); }
    if(st==="かなりしんどい" && a.difficulty>=3){ s-=4; ex="かなりしんどい×難易度"+a.difficulty+" のため減点"; }
    if(S.confidant==="いるけれど、少し話しにくい" && (a.action_id==="ACTION_018"||a.action_id==="ACTION_019")){ s+=2; why.push("プロフィール「相談できる人：いるけれど、少し話しにくい」"); }
    return {id:a.action_id, a:a, score:s, why:why, ex:ex};
  }).sort(function(x,y){ return y.score-x.score || x.id.localeCompare(y.id); });
}

  const pool = cand.length>=3 ? cand : all.slice(0,8);
  const picked=[], perCat={};

    perCat[c]=(perCat[c]||0)+1; picked.push(r);
  });
  window.__AMDBG={all:all, cand:pool, picked:picked};
  return picked;
}

/* ── ワークの画面 ── */
let BR={timer:null, left:0, total:0};
function workHead(a){ return '<div class="pagehead"><button class="back" onclick="workClose()">‹</button><span class="lede">'+esc(a.title)+'</span></div>'; }
function workClose(){ brStop(); closeAction(); }
function renderWork(type,opt){
  const a=curAct(), body=document.getElementById("actBody"); let h=workHead(a);
  if(type==="journaling"){
    h+='<div class="card wk"><div class="spq rv"><img class="sp-m" src="assets/suplan/opt/thinking.png" alt="" width="56" height="56"><div class="bub2">頭に浮かんだことを、<br>そのまま書いてみよう</div></div>'
      +'<textarea id="jnIn" rows="9" maxlength="2000" placeholder="正解はないよ。整理しなくても大丈夫。" oninput="document.getElementById(\'jnSave\').disabled=!this.value.trim()"></textarea>'
      +'<p class="wknote">書いた内容を、すぷらんが添削したり評価したりすることはありません。</p>'
      +'<button class="btn" id="jnSave" disabled onclick="jnSave()">保存する</button></div>';
  } else if(type==="breathing"){
    h+='<div class="card wk" style="text-align:center"><div class="spq rv" style="justify-content:center"><img class="sp-m" src="assets/suplan/opt/relieved.png" alt="" width="56" height="56"><div class="bub2">何分にする？<br>苦しくなったら、いつでもやめてね</div></div>'
      +'<div class="brmins">'+[1,2,3].map(function(m){ return '<button class="rvchip'+(m===(opt||S.act_duration||3)?' on':'')+'" onclick="renderWork(\'breathing\','+m+')">'+m+'分</button>'; }).join("")+'</div>'
      +'<div class="brcirc" id="brCirc"><span id="brTxt">準備ができたら<br>はじめよう</span></div>'
      +'<div class="brclock" id="brClock">'+(opt||S.act_duration||3)+':00</div>'
      +'<button class="btn" id="brStart" onclick="brStart('+(opt||Math.min(3,S.act_duration||3))+')">はじめる</button>'
      +'<button class="btn ghost" id="brEnd" style="margin-top:8px;display:none" onclick="brFinish(true)">ここでやめる</button>'
      +'<p class="wknote">呼吸を深くしたり、止めたりしなくて大丈夫。自然なペースでいいよ。</p></div>';
  } else if(type==="activity_log_v2"||type==="activity_log"){
    openAL(opt); return;   // 1日の行動と気持ち：時間帯ごとに保存する画面（下の AL）
  }
  body.innerHTML=h; window.scrollTo(0,0);
}
/* 実施記録（act_logs）は保存したときだけ1件。内容は各ワークのデータに別に持つ */
function workLog(extra){
  const a=curAct();
  const l=Object.assign({log_id:"ACTLOG_"+Date.now().toString(36), action_id:S.act_id, cycle_id:S.cycle?S.cycle.weekly_cycle_id:"", app_type:a.app_type, title:a.title,
    work_type:a.work_type||"other", duration_minutes:S.act_duration, frequency:S.act_frequency, input:"", feeling:"", at:nowIso(), status:"saved"}, extra||{});
  S.act_logs.push(l); return l;
}
function workDone(msg){
  document.getElementById("actBody").innerHTML='<div class="card tint" style="text-align:center;margin-top:24px">'
    +'<img class="sp-m" src="assets/suplan/opt/happy.png" alt="" width="80" height="80" style="display:block;margin:0 auto 6px">'
    +'<h2 style="font-size:18px;margin-bottom:8px">'+msg+'</h2><p class="lede" style="margin-bottom:16px">記録しました。</p>'
    +'<button class="btn" onclick="closeAction()">ホームへ</button></div>';
  saveState(); window.scrollTo(0,0);
}
function jnSave(){
  const t=(document.getElementById("jnIn")||{}).value||""; if(!t.trim()) return;
  S.journals=S.journals||[];
  const j={journal_id:"JN-"+Date.now().toString(36), user_id:DS_USER, created_at:nowIso(), content:t, cycle_id:S.cycle?S.cycle.weekly_cycle_id:""};
  S.journals.push(j); workLog({journal_id:j.journal_id});
  if(RISK_RE.test(t)){ openSafety("free_text","unspecified"); return; }   // 書いた内容でも安全対応を優先（記録は残す）
  workDone("書き出してみたね");
}
function brStart(min){
  brStop(); BR.total=min*60; BR.left=BR.total; BR.min=min;
  document.getElementById("brStart").style.display="none"; document.getElementById("brEnd").style.display="block";
  document.querySelectorAll(".brmins button").forEach(function(b){ b.disabled=true; });
  const c=document.getElementById("brCirc"); c.classList.add("go");
  let t=0;
  BR.timer=setInterval(function(){
    BR.left--; t++;
    const ph=Math.floor(t/4)%2;   // 4秒ずつ、吸う・吐く（深さや止める指示はしない）
    const tx=document.getElementById("brTxt"); if(tx) tx.innerHTML= ph===0 ? "すって" : "はいて";
    const ck=document.getElementById("brClock"); if(ck) ck.textContent=fmtSec(Math.max(0,BR.left));
    if(BR.left<=0) brFinish(false);
  },1000);
}
function brStop(){ if(BR.timer){ clearInterval(BR.timer); BR.timer=null; } }
function brFinish(early){
  brStop(); const done=BR.total-Math.max(0,BR.left);
  if(early && done<10){ renderWork("breathing",BR.min); return; }   // すぐやめたときは記録しない
  workLog({breath_seconds:done, breath_planned_minutes:BR.min, ended_early:!!early});
  workDone(early?"ここまで、おつかれさま":"呼吸に意識を向けられたね");
}
/* ══════════════════════════════════════════════════════════════
   1日の行動と気持ち（2026-10-03 活動記録UX改善）
   - 朝・昼・夕方・夜は目安。時間帯ごとに保存する。1つ保存しても、1日のワークの完了にはしない
   - 同じ日・同じ時間帯は1件。あとから編集できる（前の内容は edit_history に残す）。書きかけは下書きとして残す
   - 1日のふりかえり（夜が目安・翌日以降も可）を保存したときだけ「ふりかえり済み」。実施記録（act_logs）はこのとき1件
   - 1日の状態：not_started ／ recording ／ reflected ／ paused。現在時刻だけで「未達成」にはしない
   - 今日の気持ち（daily_states）とは別データ。活動記録の気持ちを今日の気持ちへ登録しない（source / data_type で区別）
   ══════════════════════════════════════════════════════════════ */
const AL_P=["朝","昼","夕方","夜"], AL_LBL={"朝":"朝","昼":"お昼","夕方":"夕方","夜":"夜"};
const AL_NEXT={"朝":"お昼","昼":"夕方","夕方":"夜","夜":""}, AL_SAY={"朝":"お昼や夕方も","昼":"夕方や夜も","夕方":"夜も","夜":""};
let AL={date:"", open:null, mood:"", msg:"", view:"log", pick:null};
function alHour(){ return new Date(nowMs()).getHours(); }
function alToday(){ return isoDate(nowMs()); }
function alRecs(date){ return (S.activity_logs||[]).filter(function(r){ return r.recorded_date===date && !r.deleted; }); }
function alSlotRec(date,p){ return alRecs(date).filter(function(r){ return r.time_period===p; }).slice(-1)[0]||null; }
function alDayInfo(date){ return (S.al_days||[]).filter(function(d){ return d.date===date; })[0]||null; }
function alDayState(date){
  date=date||alToday();
  const info=alDayInfo(date);
  if(info && info.status==="reflected") return "reflected";
  if(S.action_status==="paused" && date===alToday()) return "paused";
  return alRecs(date).length ? "recording" : "not_started";
}
function alIsWork(){ return workType(S.act_id)==="activity_log"; }
function alDayName(date){ if(date===alToday()) return "今日"; if(date===isoDate(nowMs()-DAY)) return "昨日"; const d=new Date(dateMs(date)); return (d.getMonth()+1)+"/"+d.getDate(); }
/* その日を含むサイクル（今のサイクルの期間外なら、同じ日の記録が持つ cycle_id を使う） */
function alCycleId(date){
  const c=S.cycle;
  if(c){ const from=dayStart(Date.parse(c.cycle_started_at)), m=dateMs(date); if(m>=from && m<from+c.cycle_length_days*DAY) return c.weekly_cycle_id; }
  const r=alRecs(date).filter(function(x){ return x.cycle_id; })[0]; return r ? r.cycle_id : (c?c.weekly_cycle_id:"");
}
/* 今、記録しやすい時間帯（目安）。記録済みなら、まだの時間帯へ */
function alSuggest(date){
  const done=function(p){ return !!alSlotRec(date,p); };
  if(date!==alToday()) return AL_P.filter(function(p){ return !done(p); })[0]||"夜";
  const h=alHour(), cur= h<11?0:(h<15?1:(h<19?2:3));
  for(let k=cur;k<4;k++) if(!done(AL_P[k])) return AL_P[k];
  for(let k=cur-1;k>=0;k--) if(!done(AL_P[k])) return AL_P[k];
  return AL_P[cur];
}
function alOrder(r){ if(r.time_period!=="時刻") return AL_P.indexOf(r.time_period)*100;
  const t=(r.time||"12:00").split(":"), h=+t[0]; return (h<11?0:(h<15?1:(h<19?2:3)))*100+50+(+t[1]||0)/100; }
/* サイクル内の集計（心理士画面・ふりかえりで使う。実施記録数と1日のふりかえり完了数を分ける） */
function alStats(c){
  c=c||S.cycle; if(!c) return {days:0, slots:0, reflected:0};
  const from=dayStart(Date.parse(c.cycle_started_at)), to=from+c.cycle_length_days*DAY;
  const inC=function(date){ const m=dateMs(date); return m>=from && m<to; };
  const R=(S.activity_logs||[]).filter(function(r){ return !r.deleted && inC(r.recorded_date); });
  return {days:new Set(R.map(function(r){ return r.recorded_date; })).size, slots:R.length,
    reflected:(S.al_days||[]).filter(function(d){ return d.status==="reflected" && inC(d.date); }).length};
}
function alStatsText(s,sep){ return ["活動記録があった日："+s.days+"日","記録した時間帯："+s.slots+"件","1日のふりかえり完了："+s.reflected+"日"].join(sep||" ／ "); }

/* ── 下書き（入力の途中で閉じても消えない）── */
function alDraft(date,p){ return (S.al_draft||{})[date+"|"+p]; }
function alDraftSet(){
  if(!AL.open) return; const el=document.getElementById("alW");
  S.al_draft=S.al_draft||{}; S.al_draft[AL.date+"|"+AL.open]={what:el?el.value:"", mood:AL.mood, at:nowIso()};
  saveState(); alCheck();
}
function alCheck(){ const el=document.getElementById("alW"), b=document.getElementById("alSave"); if(b) b.disabled=!((el&&el.value.trim())||AL.mood); }
function alMood(code){ AL.mood = AL.mood===code ? "" : code;
  document.querySelectorAll('.alrow.open .dsb').forEach(function(b){ b.classList.toggle("sel", b.dataset.code===AL.mood); }); alDraftSet(); }

/* ── 画面 ── */
function openAL(opt){
  opt=(opt && typeof opt==="object") ? opt : {};
  AL={date:opt.date||alToday(), open:null, mood:"", msg:"", view:opt.view||"log", pick:null};
  if(AL.view==="log"){ const s=alSuggest(AL.date); if(!alSlotRec(AL.date,s) && alDayState(AL.date)!=="reflected") alOpenSlot(s,true); }
  renderAL(); window.scrollTo(0,0);
}
function alGo(view,date){ go("act"); openAL({view:view, date:date}); }
function alOpenSlot(p,quiet){
  AL.open=p; const r=alSlotRec(AL.date,p), d=alDraft(AL.date,p);
  AL.mood = d ? d.mood : (r ? r.associated_mood : "");
  if(!quiet){ AL.msg=""; renderAL(); const e=document.querySelector(".alrow.open"); if(e) e.scrollIntoView({block:"center"}); }
}
function alCloseSlot(){ AL.open=null; AL.mood=""; renderAL(); }
function alRow(p){
  const r=alSlotRec(AL.date,p), d=alDraft(AL.date,p);
  if(AL.open===p){
    const v = d ? d.what : (r ? r.activity_content : "");
    return '<div class="alrow open" data-p="'+p+'"><div class="alh">'+p+(r?' <small>記録あり・編集中</small>':'')+'</div>'
      +'<input type="text" id="alW" maxlength="60" placeholder="何をしていた？" value="'+esc(v)+'" oninput="alDraftSet()">'
      +'<div class="alm">'+DAILY.map(function(x){ return '<button class="dsb'+(AL.mood===x.code?' sel':'')+'" style="--c:'+x.c+'" data-code="'+x.code+'" onclick="alMood(\''+x.code+'\')">'+face(x.lv,20)+'<span>'+x.v+'</span></button>'; }).join("")+'</div>'
      +'<button class="btn" id="alSave" '+((v.trim()||AL.mood)?'':'disabled')+' onclick="alSaveSlot()">'+p+'の記録を'+(r?'直す':'残す')+'</button>'
      +(r||alRecs(AL.date).length?'<button class="dslink al-cancel" onclick="alCloseSlot()">とじる</button>':'')
      +'</div>';
  }
  if(r) return '<div class="alrow done" data-p="'+p+'"><div class="alh">'+p+' <span class="al-ck" aria-label="記録あり">✓</span></div>'
    +'<div class="al-v">'+esc(r.activity_content||"（行動は書いていません）")+(r.associated_mood?'<span class="wlm">'+face(dsLevel(r.associated_mood),16)+dsLabel(r.associated_mood)+'</span>':'')+'</div>'
    +'<button class="dslink" onclick="alOpenSlot(\''+p+'\')">編集</button></div>';
  return '<div class="alrow todo" data-p="'+p+'"><div class="alh">'+p+'</div><button class="dslink" onclick="alOpenSlot(\''+p+'\')">'+(d&&(d.what||d.mood)?'書きかけの続きを書く':'＋ '+p+'の記録を残す')+'</button></div>';
}
function renderAL(){
  if(AL.view==="reflect") return renderALReflect();
  const a=curAct(), body=document.getElementById("actBody"), dn=alDayName(AL.date), st=alDayState(AL.date), recs=alRecs(AL.date), today=AL.date===alToday();
  const ex=recs.filter(function(r){ return r.time_period==="時刻"; });
  let h=workHead(a)+'<div class="card wk al2">'
    +'<h2 class="al-h">'+dn+'の行動と気持ち</h2>'
    +'<div class="spq rv"><img class="sp-m" src="assets/suplan/opt/watering.png" alt="" width="56" height="56"><div class="bub2">何をして、どんな気持ちだった？<br>思い出せるところだけで大丈夫だよ。</div></div>'
    +(AL.msg?'<div class="al-msg" role="status">'+AL.msg+'</div>':'')
    +'<div class="al-stat" aria-label="時間帯ごとの記録">'+AL_P.map(function(p){ const r=alSlotRec(AL.date,p);
      return '<button class="al-s'+(r?' on':'')+(AL.open===p?' cur':'')+'" onclick="alOpenSlot(\''+p+'\')"><b>'+p+'</b><span>'+(r?'✓ 記録あり':'これから')+'</span></button>'; }).join("")+'</div>'
    +'<p class="wknote al-note">時間帯は目安です。あとからまとめて書いても大丈夫。</p>'
    +AL_P.map(alRow).join("")
    +(ex.length?'<div class="alrow done">'+ex.map(function(r){ return '<div class="al-v"><b>'+esc(r.time||"時刻")+'</b> '+esc(r.activity_content)+'</div>'; }).join("")+'</div>':'')
    +'<details class="alx"><summary>＋ 時刻をくわしく残す（任意）</summary><div class="alrow"><input type="time" id="alTime"><input type="text" id="alXWhat" maxlength="60" placeholder="何をしていた？">'
    +'<button class="btn ghost sm" onclick="alSaveExtra()">この記録を残す</button></div></details>'
    +'</div>';
  if(recs.length){
    const night = !today || alHour()>=19;
    h+= st==="reflected"
      ? '<div class="card al-rf done"><div class="sc-done"><span class="ck">✓</span>'+dn+'の記録をふりかえりました</div><p class="wknote" style="margin:0 0 6px;text-align:center">あとから書き足しても大丈夫です。</p><button class="btn ghost" onclick="AL.view=\'reflect\';renderAL()">ふりかえりを見直す</button></div>'
      : '<div class="card al-rf"><div class="al-rfh">1日の終わりに</div><p>'+dn+'の行動と気持ちを、少しふりかえってみよう。全部うまっていなくても大丈夫。</p>'
        +'<button class="btn'+(night?'':' ghost')+'" onclick="AL.view=\'reflect\';AL.pick=null;renderAL();window.scrollTo(0,0)">'+dn+'の記録をふりかえる</button></div>';
  }
  /* 前の日の記録も見る・書き足せる */
  const y=isoDate(dateMs(AL.date)-DAY+12*3600000);
  h+='<div class="al-days">'+(today
      ? (alRecs(y).length?'<button class="dslink" onclick="openAL({date:\''+y+'\'})">昨日の記録を見る'+(alDayState(y)!=="reflected"?'・ふりかえる':'')+'</button>':'')
      : '<button class="dslink" onclick="openAL({})">今日の記録にもどる</button>')+'</div>';
  h+=alReminderUI();
  body.innerHTML=h;
}
function alSaveSlot(){
  const p=AL.open; if(!p) return; const el=document.getElementById("alW"), w=(el?el.value:"").trim();
  if(!w && !AL.mood) return;
  S.activity_logs=S.activity_logs||[];
  let r=alSlotRec(AL.date,p); const edit=!!r;
  if(r){ (r.edit_history=r.edit_history||[]).push({activity_content:r.activity_content, associated_mood:r.associated_mood, at:r.updated_at||r.created_at});
    r.activity_content=w; r.associated_mood=AL.mood; r.updated_at=nowIso(); }
  else { r={activity_log_id:"AL-"+Date.now().toString(36)+"-"+AL_P.indexOf(p), user_id:DS_USER, recorded_date:AL.date, time_period:p, activity_content:w, associated_mood:AL.mood,
      created_at:nowIso(), updated_at:nowIso(), cycle_id:alCycleId(AL.date), source:"activity_log", data_type:"activity_slot"};
    S.activity_logs.push(r); }
  if(S.al_draft) delete S.al_draft[AL.date+"|"+p];
  const info=alDayInfo(AL.date); if(info && info.status==="reflected") info.updated_after_reflect=nowIso();
  AL.msg = edit ? AL_LBL[p]+"の記録を直したよ。"
    : (p==="夜" ? "夜の記録を残せたね。よかったら、"+alDayName(AL.date)+"の記録を少しふりかえってみよう。"
                : AL_LBL[p]+"の記録を残せたね。"+AL_SAY[p]+"、気づいたときに少しずつ残してみよう。");
  AL.open=null; AL.mood="";
  saveState();
  if(RISK_RE.test(w)){ openSafety("free_text","unspecified"); return; }   // 書いた内容でも安全対応を優先（記録は残す）
  renderAL(); window.scrollTo(0,0);
}
function alSaveExtra(){
  const xt=(document.getElementById("alTime")||{}).value||"", xw=((document.getElementById("alXWhat")||{}).value||"").trim(); if(!xw) return;
  S.activity_logs=S.activity_logs||[];
  S.activity_logs.push({activity_log_id:"AL-"+Date.now().toString(36)+"-x", user_id:DS_USER, recorded_date:AL.date, time_period:"時刻", time:xt, activity_content:xw, associated_mood:"",
    created_at:nowIso(), updated_at:nowIso(), cycle_id:alCycleId(AL.date), source:"activity_log", data_type:"activity_slot"});
  AL.msg=(xt||"その時刻")+"の記録を残せたね。"; saveState();
  if(RISK_RE.test(xw)){ openSafety("free_text","unspecified"); return; }
  renderAL(); window.scrollTo(0,0);
}

/* ── 1日のふりかえり（本人が記録した内容だけを並べる。未入力の時間帯は作らない）── */
function renderALReflect(){
  const a=curAct(), body=document.getElementById("actBody"), dn=alDayName(AL.date), info=alDayInfo(AL.date);
  const recs=alRecs(AL.date).slice().sort(function(x,y){ return alOrder(x)-alOrder(y); });
  if(!recs.length){ AL.view="log"; return renderAL(); }
  if(AL.pick==null) AL.pick = info ? (info.easiest||"") : "";
  const acts=[]; recs.forEach(function(r){ const t=(r.activity_content||"").trim(); if(t && acts.indexOf(t)<0) acts.push(t); });
  const opts=acts.concat(["よく分からない","特になかった"]); window.__ALO=opts;
  body.innerHTML=workHead(a)+'<div class="card wk al2">'
    +'<h2 class="al-h">'+dn+'の記録をふりかえる</h2>'
    +'<div class="spq rv"><img class="sp-m" src="assets/suplan/opt/base.png" alt="" width="56" height="56"><div class="bub2">'+dn+'の行動と気持ちを、<br>一緒に見てみよう。</div></div>'
    +'<div class="wdlog al-tl">'+recs.map(function(r){ return '<div class="wdl"><b>'+esc(r.time_period==="時刻"?(r.time||"時刻"):r.time_period)+'</b><span>'+esc(r.activity_content||"—")+'</span><em>'+(r.associated_mood?face(dsLevel(r.associated_mood),16)+dsLabel(r.associated_mood):'')+'</em></div>'; }).join("")+'</div>'
    +'<div class="rvq"><div class="qh">'+(dn==="今日"?'今日':'この日')+'、少しでも気持ちが楽だったのはどんなとき？</div><p class="rvhint" style="margin-top:0">答えなくても大丈夫。</p>'
    +'<div class="rvchips">'+opts.map(function(o,k){ const on=AL.pick===o; return '<button class="rvchip'+(on?' on':'')+'" aria-pressed="'+on+'" onclick="alPick('+k+')">'+esc(o)+'</button>'; }).join("")+'</div></div>'
    +'<button class="btn" onclick="alFinish()">'+dn+'の記録を終える</button>'
    +'<button class="dslink" style="display:block;margin:10px auto 0" onclick="AL.view=\'log\';renderAL()">記録にもどる</button></div>';
}
function alPick(k){ const o=(window.__ALO||[])[k]; AL.pick = AL.pick===o ? "" : o; renderALReflect(); }
function alFinish(){
  const recs=alRecs(AL.date); if(!recs.length) return;
  S.al_days=S.al_days||[];
  let info=alDayInfo(AL.date); const first=!info || info.status!=="reflected";
  if(!info){ info={al_day_id:"ALD-"+Date.now().toString(36), user_id:DS_USER, date:AL.date, created_at:nowIso()}; S.al_days.push(info); }
  Object.assign(info,{status:"reflected", easiest:AL.pick||"", reflected_at:info.reflected_at||nowIso(), updated_at:nowIso(), slot_count:recs.length,
    activity_log_ids:recs.map(function(r){ return r.activity_log_id; }), cycle_id:alCycleId(AL.date), source:"activity_log", data_type:"activity_day_reflection"});
  /* 実施記録は「1日のふりかえり」1回につき1件（同じ日を見直しても増やさない） */

/* ── お知らせ（オプトイン・1日2回まで）。実際の通知は未実装：将来の通知処理が alReminderDue() を見て出す ── */
const AL_REM_TEXT={noon:"お昼になったね。ここまでの行動を、少し残してみる？", night:"今日もおつかれさま。思い出せるところだけ、振り返ってみよう。"};
function alRem(){ S.al_reminder=S.al_reminder||{enabled:false, noon:"12:30", night:"21:00", updated_at:""}; return S.al_reminder; }
function alReminderDue(kind){
  const R=alRem(), d=alToday();
  if(!R.enabled || !R[kind]) return false;
  if(!alIsWork() || S.action_status==="paused") return false;                 // お休み中は止める
  if(kind==="noon") return !alSlotRec(d,"昼");                                  // すでに残していれば出さない
  if(kind==="night") return alDayState(d)!=="reflected";
  return false;
}
function alReminderUI(){
  const R=alRem();
  return '<details class="alx al-remx"'+(R.enabled?' open':'')+'><summary>お知らせを受け取る（任意）</summary><div class="al-rem">'
    +'<label class="al-remon"><input type="checkbox" id="alRemOn" '+(R.enabled?'checked':'')+' onchange="alRemSet()"> 1日2回まで、記録のお知らせを受け取る</label>'
    +'<div class="al-remt"><label>昼 <input type="time" id="alRemNoon" value="'+esc(R.noon)+'" onchange="alRemSet()"></label><label>夜 <input type="time" id="alRemNight" value="'+esc(R.night)+'" onchange="alRemSet()"></label></div>'
    +'<p class="wknote" style="margin:6px 0 0">お知らせを見逃しても、できなかったことにはなりません。お休み中や、すでに記録しているときは届きません。<br>※ このデモでは、実際の通知はまだ届きません。</p></div></details>';
}
function alRemSet(){
  const R=alRem(), g=function(id){ return document.getElementById(id); };
  R.enabled=!!(g("alRemOn")&&g("alRemOn").checked); if(g("alRemNoon")) R.noon=g("alRemNoon").value||R.noon; if(g("alRemNight")) R.night=g("alRemNight").value||R.night; R.updated_at=nowIso();
  saveState();
}

function fmtSec(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

}
function stopActTimer(){ if(actTimerId){ clearInterval(actTimerId); actTimerId=null; } }

function ivRender(){
  const tray=document.getElementById("ivTray"); if(!tray) return;

  /* ② Q1 いまのこころの状態 */

  /* ②' 安全確認（Q1のあと）。下2つを選ぶと通常フローを中断して安全対応へ */
  case 3:
    ivSay("ひとつだけ、大事なことを<br>おうかがいさせてください。<br><br>いま、ご自身を傷つけたい<br>気持ちはありますか。",function(){

  case 5:

  /* ⑤ 自分のことを知る：心の地図とは何かを先に短く説明 → 3つの答えから見えた最初の下書き（言い切らない）
       → この地図をもとに今週の一歩へ。内部状態は draft。ここで AIミニセッションには入らない */
  /* ⑤ 3問の答えは心の地図の初期データとして内部に残す（画面には出さない）→ そのまま一歩の候補へ */
  case 6:
    S.ai_conversation_summary = S.iv_scene || (IV_TOPIC_P[S.current_concerns[0]]+"について、"+IV_WANT_P[S.direction_goal]+"ところから始める");
    S.iv=8; ivRender();

  /* ⑥ 最近の場面をひとつだけ（自由記述は原則ここだけ・深掘りしない） */
  case 7:

      window.scrollTo(0,document.body.scrollHeight);

  /* ⑦ 今週の一歩を提案。候補は必ず行動マスターの中から選ぶ（新規生成はしない）
       「他も見てみる」は置き換えではなく追加。前の候補も選べるまま残す */
  /* ⑦ 「おすすめ」ではなく「まず3日だけ試す方法を選ぶ」。3日後に見直せること・ふりかえりを大塚さんに共有することを先に見せる */

  case 9:

      +(function(){ const r=S.iv_offered.filter(function(x){ return x.id===S.act_id; })[0]; return r?'<p style="font-size:12px;line-height:1.75;color:var(--muted);margin:8px 0 0">'+actReason(r)+'</p>':''; })()
      +'</div>');
    ivSay("これなら、<br>3日間の中で、どのくらいできそうですか？",function(){ ivOpts(["難しそう","たぶんできそう","できそう"],"ivFeas"); });
    break;

  /* ⑩ 確定。ここで初回体験は終了。年代・性別は聞かずにホームへ戻す */
  case 10:
    ivSay("ありがとう。<br>まずはこの方法を、3日間の中で<br>無理のない範囲で試してみましょう。",function(){
      const a=curAct();

function ivQ1(i){ S.current_status=IV_STATE[i]; ivMe(IV_STATE[i]); ivNext(); }
function ivQ2(i){ S.current_concerns=[IV_TOPIC[i]]; ivMe(IV_TOPIC[i]); ivNext(); }

/* 既存の危機対応条件に触れる記述があれば、行動提案より安全対応を優先する */
const RISK_RE=/死に|しにたい|死にたい|消えたい|いなくなりたい|自殺|リストカット|傷つけ|終わりに/;
function ivScene(skip){
  const el=document.getElementById("ivScene");
  S.iv_scene = skip ? "" : (el?el.value.trim():"");
  ivMe((skip||!S.iv_scene) ? "今は思いつかない" : S.iv_scene);
  S.iv_scene_asked=true;
  if(S.iv_scene && RISK_RE.test(S.iv_scene)){ S.iv=5; openSafety("free_text","unspecified"); return; }   // 戻ったら仮の地図から
  S.iv=6; ivRender();   // 仮の心の地図に戻る（場面が書き足される）
}
function ivToStep(){ ivMe("今週の一歩を考える"); S.iv=8; ivRender(); }
function ivMoreMap(){ ivMe("もう少し地図をつくる"); S.iv=7; ivRender(); }
/* ── 提案候補は「置き換え」ではなく「追加」していく ─────────────
   S.iv_offered に提示済みを積み、最大6件まで。重複は出さない。 */
const OFFER_MAX=6;
function addOffers(){
  if(!S.iv_offered.length){   // 初回は3つのワークだけ（2026-10-03）
    const W=scoreWorks(); S.iv_offered=W.map(function(r){ r.batch="first"; return r; }); S.iv_no_rank = W[0].score<=WORK_W.state || W[0].score===W[1].score;   // 判断材料が少ない（今の状態だけ一致・同点）ときは順位をつけない
    if(S.iv_no_rank) S.iv_sel=null;
    window.__IVP=S.iv_offered; return W.length;
  }
  if(S.iv_offered.every(function(r){ return r.a && r.a.initial_work; })) return 0;
  const have=S.iv_offered.map(function(r){ return r.id; });
  S.iv_exclude=have.slice();
  const more=selectActions().filter(function(r){ return have.indexOf(r.id)<0; });
  const room=OFFER_MAX-S.iv_offered.length;
  const add=more.slice(0,Math.min(3,room));
  add.forEach(function(r){ r.batch = S.iv_offered.length ? "other" : "first"; });
  S.iv_offered=S.iv_offered.concat(add);
  window.__IVP=S.iv_offered;
  return add.length;
}
/* 難易度は表示ラベルだけ変える（データは行動マスターの difficulty のまま） */
function diffLabel(d){ return d<=1 ? "やさしめ" : (d===2 ? "ふつう" : "しっかり"); }
/* おすすめ理由の短いタグ。初回3問・場面で実際に答えたことからだけ作る（推測しない・断定しない） */
const TAG_TOPIC={"仕事・学校":"仕事のことが気になっている","人間関係":"人との関わりが気になっている","将来・お金":"これからのことが気になっている",
  "自分自身のこと":"自分のことを知りたい","生活・体調":"生活や体調が気になっている"};
const TAG_STATE={"かなりしんどい":"まずは休息から","少ししんどい":"負担の少ないものから","波がある":"気持ちが大きく動いたときに"};
function reasonTags(r){
  const m=r.a.match||{}, t=[], tp=(S.current_concerns||[])[0];
  if((m.want||[]).indexOf(S.direction_goal)>=0) t.push(S.direction_goal);
  if((m.topic||[]).indexOf(tp)>=0 && TAG_TOPIC[tp]) t.push(TAG_TOPIC[tp]);
  if((r.why||[]).some(function(w){ return w.indexOf("場面の言葉")===0; })) t.push("話してくれた場面に近い");
  if((m.state||[]).indexOf(S.current_status)>=0 && TAG_STATE[S.current_status]) t.push(TAG_STATE[S.current_status]);
  return t;
}
/* 表示順に、前のカードと同じ理由は出さない */
function offerTag(r,used){ const t=reasonTags(r).filter(function(x){ return used.indexOf(x)<0; })[0]; if(t) used.push(t); return t||""; }
function offerCard(r,tag,main){
  const a=r.a, i=S.iv_offered.indexOf(r), on=S.iv_sel===i, D=workDetail(a);
  if(D){
    /* 初回の3つのワーク：名前／どんなことをするか1行／頻度／時間・取り組み方／理由（おすすめのみ）／詳しく見る */
    return '<div class="ofc wd'+(main?' main':'')+(on?' on':'')+'" role="button" tabindex="0" aria-pressed="'+on+'" data-work="'+a.work_type+'" onclick="ivSel('+i+')">'
      +(on?'<span class="ofc-ck" aria-hidden="true">✓</span>':'')
      +'<div class="ofc-t">'+esc(D.name)+'</div>'
      +'<div class="ofc-d1">'+esc(D.line)+'</div>'
      +'<div class="ofc-meta"><span><i>頻度</i>'+esc(D.freq)+'</span><span><i>時間</i>'+esc(D.time)+'</span></div>'
      +(D.multi?'<div class="ofc-multi">1日に数回、書き足すワークです</div>':'')
      +(main && !S.iv_no_rank && workReason(r) ? '<div class="ofc-why">'+workReason(r)+'</div>' : '')
      +'<button class="ofc-more" onclick="event.stopPropagation();openWorkDetail('+i+')">詳しく見る</button>'
      +'</div>';
  }
  const freq = isTrigger(a) ? "必要なときに" : a.default_frequency;
  return '<button class="ofc'+(main?' main':'')+(on?' on':'')+'" aria-pressed="'+on+'" onclick="ivSel('+i+')">'
    +(on?'<span class="ofc-ck" aria-hidden="true">✓</span>':'')
    +'<div class="ofc-cat">'+esc(a.category_name)+'</div>'
    +'<div class="ofc-t">'+esc(a.title)+'</div>'
    +'<div class="ofc-chips"><span>'+a.default_duration+'分</span><span>'+esc(freq)+'</span><span>'+diffLabel(a.difficulty)+'</span></div>'
    +'<div class="ofc-d">'+esc(a.short_description)+'</div>'
    +(tag?'<div class="ofc-tag">'+esc(tag)+'</div>':'')
    +'</button>';
}
function renderOffers(tray){
  /* 候補が1件も無い＝マスターを読めていない。黙って「他も見てみる」だけ出さない */
  if(!S.iv_offered.length){
    tray.innerHTML='<div class="card" style="margin:0"><p style="font-size:14px;line-height:1.85;margin:0 0 12px">'
      +'行動の候補を読み込めませんでした。<br>ページを再読み込みしてください。</p>'
      +'<button class="btn" onclick="location.reload()">再読み込み</button></div>'+debugPanel();
    window.scrollTo(0,document.body.scrollHeight);
    return;
  }
  /* おすすめ（いちばん点の高い候補）は最初から選択状態。ほかを選べる自由は残す */
  if(S.iv_no_rank){
    const used0=[];
    let h0='<div class="ofh">3つの中から、やってみたいものを選んでね</div><p class="ofnote">「詳しく見る」で、内容と負担を確かめられます。合わなくても、あとで大塚さんと相談できます。</p>'
      +S.iv_offered.map(function(r){ return offerCard(r,"",false); }).join("")
      +'<button class="btn ofcta" '+(S.iv_sel==null?'disabled':'')+' onclick="ivPick(S.iv_sel)">このワークを試してみる</button>';
    tray.innerHTML=h0+debugPanel();
    if(!S.iv_more_scrolled){ S.iv_more_scrolled=true; const f=document.getElementById("ivFlow"), c=f&&f.querySelector(".trycard.v2"); if(c) c.scrollIntoView({block:"start"}); }
    return;
  }
  if(S.iv_sel==null || !S.iv_offered[S.iv_sel]) S.iv_sel=0;
  const used=[], rest=S.iv_offered.slice(1);
  let h='<div class="ofh">すぷらんのおすすめ</div>'+offerCard(S.iv_offered[0],offerTag(S.iv_offered[0],used),true);
  if(!S.iv_more) h+='<button class="ofmore" onclick="S.iv_more=true;renderOffers(document.getElementById(\'ivTray\'))">'+(rest.length && rest.every(function(r){ return r.a && r.a.initial_work; }) ? 'ほかの'+rest.length+'つのワークを見る' : 'ほかの候補を見る ＋')+'</button>';
  else {
    h+='<div class="ofh sub">ほかの候補</div><div class="ofrest">'+rest.map(function(r){ return offerCard(r,offerTag(r,used),false); }).join("")+'</div>';
    if(S.iv_offered.length<OFFER_MAX && !S.iv_offered.every(function(r){ return r.a && r.a.initial_work; })) h+='<button class="ofmore" onclick="ivAlt()">さらにほかも見る ＋</button>';
  }
  h+='<button class="btn ofcta" onclick="ivPick(S.iv_sel)">'+(S.iv_offered[S.iv_sel]&&S.iv_offered[S.iv_sel].a.initial_work?'このワークを試してみる':'この一歩を選ぶ')+'</button>';
  tray.innerHTML = h + debugPanel();
  if(!S.iv_more_scrolled){ S.iv_more_scrolled=true; const f=document.getElementById("ivFlow"), c=f&&f.querySelector(".trycard.v2"); if(c) c.scrollIntoView({block:"start"}); }
}

/* おすすめの理由（1〜2行）。本人が答えたことだけを引く（推測しない・断定しない） */
function workReason(r){
  const m=r.a.match||{}, tp=(S.current_concerns||[])[0];
  if((m.want||[]).indexOf(S.direction_goal)>=0) return "「"+esc(S.direction_goal)+"」と話してくれたから、ここから始めやすいと思ったよ。";
  if((m.topic||[]).indexOf(tp)>=0) return "「"+esc(tp)+"」が気になっていると話してくれたから、ここから始めやすいと思ったよ。";
  if((m.state||[]).indexOf(S.current_status)>=0) return "今は「"+esc(S.current_status)+"」と話してくれたから、負担の少ないものを選んだよ。";

/* ── 「難しそう」のときの調整 ─────────────────────────────
   順番：① 時間を短く ② 回数を減らす ③ やり方を簡単に ④ 同じ目的のより簡単な行動へ
   ①②が両方できるときは本人に選んでもらう。同じ調整・同じ文言は繰り返さない。
   すべてマスターの範囲内（minimum_* / adjustable_fields / simpler_version / easier_action_id）。 */
const FREQ_RANK={"毎日":4,"週3回":3,"週2回":2,"週1回":1,"今週1回":1};
const FREQ_NEXT={"毎日":"週3回","週3回":"週1回","週2回":"週1回"};
function adjustOptions(){
  const a=act(S.act_id), af=a.adjustable_fields||[], o={freq:null,dur:null,content:false,swap:null};
  const nf=FREQ_NEXT[S.act_frequency];
  if(af.indexOf("frequency")>=0 && nf && FREQ_RANK[nf]>=(FREQ_RANK[a.minimum_frequency]||1)) o.freq={f:nf,d:S.act_duration};
  if(af.indexOf("duration")>=0 && S.act_duration>a.minimum_duration) o.dur={f:S.act_frequency,d:a.minimum_duration};
  if(af.indexOf("content")>=0 && a.simpler_version && S.act_simpler!==S.act_id) o.content=true;
  const e=a.easier_action_id && act(a.easier_action_id);
  if(e && e.status==="published" && (S.adj_seen||[]).indexOf(e.action_id)<0) o.swap=e.action_id;
  return o;
}
function adjDone(kind){ S.adj_log.push(kind); S.act_adjusted=true; S.action_adjusted_flag=true; }
function shortPlan(f,d){ return f+"・"+d+"分"; }
function ivAdjust(){
  const o=adjustOptions();
  if(o.freq && o.dur){
    S.adj_choice=o;
    ivSay((S.adj_round>1 ? "まだ少し負担がありそうですね。<br>" : shortPlan(S.act_frequency,S.act_duration)+"だと少し大変そうですね。<br>")
      +"どちらならやれそうですか？",function(){
      ivOpts([shortPlan(o.freq.f,o.freq.d)+"にする", shortPlan(o.dur.f,o.dur.d)+"にする", "別の方法を見てみる"],"ivAdjPick");
    });
    return;
  }
  if(o.dur) return applyDur(o.dur,false);
  if(o.freq) return applyFreq(o.freq,false);
  ivOther();
}
function ivAdjPick(i){
  const o=S.adj_choice, t=document.querySelectorAll("#ivTray .opt")[i];
  ivMe(t?t.textContent:"");
  if(i===0) return applyFreq(o.freq,true);
  if(i===1) return applyDur(o.dur,true);
  ivOther();
}
/* ③ やり方を簡単に → ④ より簡単な行動 → 候補の選び直し の順で次の手を出す */
function ivOther(){
  const o=adjustOptions();
  if(o.content) return applyContent();
  if(o.swap) return offerSwap(o.swap);
  if(!S.adj_log.length) return ivReselect(false);
  adjustEnd();
}
function backToCard(){ S.iv=9; ivRender(); }
function applyFreq(p,chosen){
  const a=curAct(), prev=S.act_frequency, once=p.f==="週1回";
  S.act_frequency=p.f; adjDone("frequency");
  let m;
  if(chosen) m="では、"+(once?"今週は1回だけ":p.f)+"にしてみましょう。<br>1回"+p.d+"分はそのままです。";
  else if(S.adj_round>1) m="まだ少し大変そうですね。<br>回数をもう少し減らして、"+(once?"今週1回だけ":p.f+"で")+"試してみましょうか。";
  else if(prev==="毎日") m="毎日続けるのは少し大変そうですね。<br>まずは"+p.f+"から試してみましょうか。";
  else if(once) m=prev+"だと少し負担がありそうですね。<br>まずは今週1回だけ、<br>「"+a.title+"」をやってみましょうか。";
  else m=prev+"だと少し負担がありそうですね。<br>まずは"+p.f+"くらいから試してみましょうか。";
  ivSay(m,backToCard);
}
function applyDur(p,chosen){
  const a=act(S.act_id), prev=S.act_duration;
  S.act_duration=p.d; adjDone("duration");
  let m;
  if(chosen) m="では、"+S.act_frequency+"はそのままで、<br>1回"+p.d+"分だけにしてみましょう。";
  else if(S.adj_round>1) m="まだ少し大変そうですね。<br>1回の時間を"+p.d+"分に短くしてみましょう。";
  else if(isTrigger(a)) m=prev+"分だと少し負担がありそうですね。<br>"+freqText(S.act_frequency,a)+"、"+p.d+"分だけやってみるのはどうでしょう。";
  else m=prev+"分だと少し負担がありそうですね。<br>まずは"+p.d+"分だけやってみるのはどうでしょう。";
  ivSay(m,backToCard);
}
function applyContent(){
  const before=curAct().title;
  S.act_simpler=S.act_id; adjDone("content");
  S.first_action=curAct().title;
  ivSay("もう少し取り組みやすいやり方に<br>変えてみましょう。<br><br>「"+before+"」の代わりに、<br>「"+curAct().title+"」はどうでしょう。",backToCard);

   - 説明文は短く、すぷらんの一言と絵に置きかえる。詳しい説明は実施画面・きろくへ

   - 画像は assets/suplan/opt（透過PNG・420px）だけを使う
   ══════════════════════════════════════════════════════════════ */

/* 一歩の種類に合う絵（該当がなければ通常のすぷらん） */

/* このサイクルの実施記録（cycle_id で結びつける。以前の記録は期間で判定） */
function cycleActLogs(c){
  c=c||S.cycle; if(!c) return [];
  const from=dayStart(Date.parse(c.cycle_started_at)), to=from+c.cycle_length_days*DAY;
  return S.act_logs.filter(function(l){ if(l.status && l.status!=="saved") return false;
    if(l.cycle_id) return l.cycle_id===c.weekly_cycle_id;
    const t=Date.parse(l.at); return t>=from && t<to; });
}
function todayActLogs(){ const d=isoDate(nowMs()); return cycleActLogs().filter(function(l){ return l.action_id===S.act_id && isoDate(Date.parse(l.at))===d; }); }
/* サイクルの各日：done（実施記録あり）／today／past（記録なし。失敗扱いしない）／future */
function cycleDays(){
  const c=S.cycle; if(!c) return [];
  const start=dayStart(Date.parse(c.cycle_started_at)), today=isoDate(nowMs()), logs=cycleActLogs(c), isAL=alIsWork();
  const out=[];
  for(let i=0;i<c.cycle_length_days;i++){
    const ms=start+i*DAY+12*3600000, date=isoDate(ms);
    /* 活動記録：1日のふりかえり済み＝done、時間帯の記録だけ＝rec（記録あり）。ほかのワーク：実施記録があれば done */
    const n = isAL ? ((alDayInfo(date)||{}).status==="reflected"?1:0) : logs.filter(function(l){ return isoDate(Date.parse(l.at))===date; }).length;
    out.push({i:i, ms:ms, date:date, n:n, al:isAL?alRecs(date).length:0, today:date===today, future:dayStart(ms)>dayStart(nowMs())});
  }
  return out;
}

  const isAL=alIsWork(), stt=isAL?alStats(c):null;
  const st=function(d){ return d.n>0?"done":(d.al>0?"rec":(d.today?"today":(d.future?"future":"past"))); };
  const cls=function(d){ const k=st(d); return k+(d.today&&k!=="today"?' today':''); };
  let h='<div class="cprog'+(first?' cp-first':' cp-week')+'"><div class="cp-h">'+(first?'最初の3日間':'今週の記録')+'</div>';
  if(first) h+='<div class="cp-tiles">'+days.map(function(d){ const k=st(d);
      return '<div class="cp-t '+cls(d)+'"><b>'+(d.i+1)+'日目</b><span>'+(k==="rec"?'記録あり':k==="done"?(isAL?'✓ ふりかえり':'✓ 記録あり'):(k==="today"?'今日':(k==="future"?'これから':'—')))+'</span></div>'; }).join("")+'</div>';
  else h+='<div class="cp-dots">'+days.map(function(d){ const k=st(d), w=DOW[new Date(d.ms).getDay()];

            : '<button class="dslink memo" onclick="S.ds_ui={mode:\'pre_note\'};renderHome()">✏️ メモを残す（任意）</button>')
      +'</div>';
  }
  if(u && u.mode==="add") return '<div class="dsv2"><div class="dq">今はどんな感じ？</div>'+faces("setDaily")
    +'<button class="dslink" onclick="dsCancel()">やめる</button></div>';
  if(u && u.mode==="edit" && (u.where||"home")==="home"){ const er=dsById(u.id); if(er) return '<div class="dsv2">'+dsEditForm(er,"home")+'</div>'; }
  /* 最新の1件だけを大きく。ほかは「今日の記録 n件を見る」で開く。編集＝その記録を更新／＋＝新しい記録 */
  const row=function(x,main){ return '<div class="dsrowc'+(main?'':' sub')+'">'+face(dsLevel(x.daily_state),main?24:20)
    +'<span class="now">'+dsLabel(x.daily_state)+'</span><span class="at">✓ '+hm(x.recorded_at)+'</span>'
    +'<button class="dslink" onclick="dsStartEdit(\''+x.record_id+'\')">編集</button></div>'
    +(x.optional_note && !(u && u.mode==="note" && u.id===x.record_id) ? '<div class="dsnote c1">'+esc(x.optional_note)+'</div>' : ''); };
  let h='<div class="dsv2 done"><div class="dq">今日の気持ち</div>'+row(r,true);
  if(u && u.mode==="note" && u.id===r.record_id)
    h+=dsNoteBox(r.optional_note,"")+'<div class="dsrow"><button class="btn sm" onclick="dsSave()">メモを残す</button><button class="dslink" onclick="dsCancel()">やめる</button></div>';
  if(n>1 && u && u.mode==="list") h+='<div class="dslist">'+recs.slice(0,-1).reverse().map(function(x){ return row(x,false); }).join("")+'</div>';
  h+='<div class="dsacts">'
    +(!r.optional_note && !(u && u.mode==="note") ? '<button class="dslink" onclick="S.ds_ui={mode:\'note\',id:\''+r.record_id+'\'};renderHome()">✏️ メモを残す</button>' : '')
    +(n>1 ? '<button class="dslink" onclick="S.ds_ui=(S.ds_ui&&S.ds_ui.mode===\'list\')?null:{mode:\'list\'};renderHome()">'+((u&&u.mode==="list")?'とじる':'今日の記録 '+n+'件を見る')+'</button>' : '')
    +(n<DS_MAX_PER_DAY ? '<button class="dslink" onclick="dsStartAdd()">＋ 今の気持ちも残す</button>' : '')
    +'</div>';
  return h+'</div>';
}

/* ══════════════════════════════════════════════════════════════
   今日の状態（daily check）
   - その時点の全体的な気分を、10秒で残す。日々の波や傾向を見るためのベースデータ
   - 基本は1日1回を目安。気持ちが変わったときだけ任意で追加（1日 DS_MAX_PER_DAY 件まで）。追加の催促はしない
   - 「編集する」＝既存の記録を更新（record_id・recorded_at は保持、edited_at を残す）
     「＋ 今の気持ちも残す」＝新しい記録を作る（前の記録は上書きしない）
   - Action記録（act_logs：行動をやってどうだったか）とは別データ。行動の実施で件数は増えない。date で後からつなげられる
   - 日付はユーザーのローカル日付（isoDate）
   - S.daily_states: [{record_id, user_id, date, daily_state(code), optional_note, recorded_at, edited_at}]
   ══════════════════════════════════════════════════════════════ */
const DS_MAX_PER_DAY=3;   // プロトタイプの仮上限
const DS_USER="USER_DEMO";
const DAILY=[{code:"distressed",v:"しんどい",lv:0,c:"var(--ds0)"},{code:"somewhat_distressed",v:"少ししんどい",lv:1,c:"var(--ds1)"},
  {code:"neutral",v:"ふつう",lv:2,c:"var(--ds2)"},{code:"somewhat_better",v:"少し楽",lv:3,c:"var(--ds3)"}];
const MOODS=DAILY.map(function(d){ return d.v; });
function dayKey(ms){ const d=new Date(ms); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function isoDate(ms){ const d=new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dateMs(iso){ const p=iso.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).getTime(); }
function mdW(ms){ const d=new Date(ms); return (d.getMonth()+1)+"/"+d.getDate()+"（"+DOW[d.getDay()]+"）"; }
function hm(iso){ const d=new Date(Date.parse(iso)); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
/* code・日本語ラベルのどちらでも受ける（以前の記録との互換） */
function dsDef(v){ return DAILY.filter(function(d){ return d.code===v || d.v===v; })[0]||null; }
function dsLevel(v){ const d=dsDef(v); return d?d.lv:-1; }
function dsLabel(v){ const d=dsDef(v); return d?d.v:""; }
function dsCode(v){ const d=dsDef(v); return d?d.code:""; }
let DS_SEQ=0;
function dsNewId(){ DS_SEQ++; return "MOOD_"+Date.now().toString(36)+"_"+String(DS_SEQ).padStart(3,"0"); }
/* 以前の形式（日本語ラベル・record_id なし）を読み替える */
function dsAll(){
  S.daily_states=S.daily_states||[];
  S.daily_states.forEach(function(r){
    if(!r.record_id) r.record_id=dsNewId();
    if(!r.user_id) r.user_id=DS_USER;
    const c=dsCode(r.daily_state); if(c) r.daily_state=c;
  });
  return S.daily_states;
}
function dsDay(date){ return dsAll().filter(function(r){ return r.date===date; }).sort(function(a,b){ return Date.parse(a.recorded_at)-Date.parse(b.recorded_at); }); }
function dsById(id){ return dsAll().filter(function(r){ return r.record_id===id; })[0]||null; }
function todayRecs(){ return dsDay(isoDate(nowMs())); }
function todayDs(){ const a=todayRecs(); return a.length ? a[a.length-1] : null; }   // Home は最新の1件を表示
function todayMood(){ const r=todayDs(); return r?dsLabel(r.daily_state):""; }
function dsCount(date){ return dsDay(date).length; }

/* やさしい表情のアイコン（4段階） */
function face(lv,s,x,y){
  s=s||28; const c=DAILY[lv].c;
  const m=["M9 20 Q14 15.5 19 20","M9.5 19.2 Q14 17.4 18.5 19.2","M10 18.6 L18 18.6","M9 17 Q14 21.6 19 17"][lv];
  return '<svg class="face" '+(x!=null?'x="'+x+'" y="'+y+'" ':'')+'width="'+s+'" height="'+s+'" viewBox="0 0 28 28" aria-hidden="true">'
    +'<circle cx="14" cy="14" r="12.5" style="fill:'+c+';opacity:.22"></circle>'
    +'<circle cx="14" cy="14" r="12.5" style="fill:none;stroke:'+c+';stroke-width:1.6"></circle>'
    +'<circle cx="10" cy="12" r="1.4" style="fill:var(--ink)"></circle><circle cx="18" cy="12" r="1.4" style="fill:var(--ink)"></circle>'
    +'<path d="'+m+'" style="fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round"></path></svg>';
}
function dsButtons(selCode,fn){
  return '<div class="dsbtns">'+DAILY.map(function(d){
    const on=selCode===d.code;
    return '<button class="dsb'+(on?' sel':'')+'" style="--c:'+d.c+'" aria-pressed="'+(on?'true':'false')+'" onclick="'+fn+'(\''+d.code+'\')">'+face(d.lv,30)+'<span>'+d.v+'</span></button>'; }).join("")+'</div>';

/* ── 記録の作成・更新 ───────────────────────────────── */
function dsCreate(code){
  const date=isoDate(nowMs());
  if(dsCount(date)>=DS_MAX_PER_DAY) return null;
  const id=dsNewId();
  const r={record_id:id, mood_id:id, user_id:DS_USER, date:date, daily_state:code, optional_note:"", recorded_at:nowIso(), edited_at:null, updated_at:null};
  dsAll().push(r); return r;
}
/* 未回答時の4択／「＋ 今の気持ちも残す」の4択。押した時点で記録完了 → 任意のメモ欄 */

function dsStartEdit(id,where){ const r=dsById(id); if(!r) return; S.ds_ui={mode:"edit", id:id, code:r.daily_state, where:where||"home"}; dsRerender(where); }
function dsCancel(where){ S.ds_ui=null; dsRerender(where); }
function dsPickEdit(code){ if(S.ds_ui) S.ds_ui.code=code; const y=window.scrollY; dsRerender(S.ds_ui&&S.ds_ui.where); window.scrollTo(0,y); }
function dsRerender(where){ if(where==="log") renderMap(); else renderHome(); }
/* メモの保存（新規直後）／編集の保存。編集は既存レコードを更新し、新しいレコードは作らない */
function dsSave(){
  const u=S.ds_ui; if(!u) return;
  const r=dsById(u.id); if(!r){ S.ds_ui=null; return renderHome(); }
  const el=document.getElementById("dsNote"), t=el?el.value.trim():r.optional_note;
  const changed = (u.mode==="edit" && u.code && u.code!==r.daily_state) || t!==r.optional_note;
  if(u.mode==="edit" && u.code) r.daily_state=u.code;
  if(t!==r.optional_note) r.optional_note=t;
  if(changed && u.mode==="edit"){ r.edited_at=nowIso(); r.updated_at=r.edited_at; }   // 記録直後のメモ追加は「編集」に数えない
  const where=u.where; S.ds_ui=null;
  if(t && RISK_RE.test(t)){ openSafety("free_text","unspecified"); return; }   // メモでも安全対応を優先
  dsRerender(where);
}

   未回答＝答える意味と軽さ／回答後＝最新1件・時刻・メモ・編集・追加・きろくへ（縦に長くしない） */

/* ── きろく ／ 気持ちの記録 ───────────────────────────── */

}
function weekStart(ms){ const d0=dayStart(ms), w=(new Date(d0).getDay()+6)%7; return d0-w*DAY; }   // 月曜はじまり
function weekDays(off){
  const ws=weekStart(nowMs())+off*7*DAY;
  return [0,1,2,3,4,5,6].map(function(i){ const ms=ws+i*DAY+12*3600000, date=isoDate(ms); return {ms:ms, date:date, recs:dsDay(date)}; });
}
/* 1週間の推移。同じ日に複数あれば、その日の中に時刻順で点を並べる（1件に代表させない）。記録のない日は線を切る */
function moodChart(days){
  const W=340, X0=46, X1=326, CW=(X1-X0)/6, Y=function(lv){ return 22+(3-lv)*38; }, X=function(i){ return X0+i*CW; };
  const today=isoDate(nowMs()), sel=S.mood_day;
  let g='';
  DAILY.forEach(function(d){ g+='<line x1="'+(X0-14)+'" y1="'+Y(d.lv)+'" x2="'+(X1+12)+'" y2="'+Y(d.lv)+'" style="stroke:var(--line);stroke-width:1"></line>'+face(d.lv,22,4,Y(d.lv)-11); });
  days.forEach(function(d,i){
    if(d.date===sel) g+='<rect x="'+(X(i)-CW/2+2)+'" y="6" width="'+(CW-4)+'" height="172" rx="10" style="fill:var(--accent-soft)"></rect>';
    else if(d.date===today) g+='<rect x="'+(X(i)-CW/2+2)+'" y="6" width="'+(CW-4)+'" height="172" rx="10" style="fill:var(--g-pale-2)"></rect>';
  });
  /* 点の位置：その日の中で時刻順に左から（1件なら中央） */
  const pts=[];
  days.forEach(function(d,i){
    const k=d.recs.length;
    d.recs.forEach(function(r,j){ const dx = k===1 ? 0 : (j-(k-1)/2)*Math.min(12,(CW-14)/k); pts.push({i:i, x:X(i)+dx, y:Y(dsLevel(r.daily_state)), r:r}); });
  });
  let seg=[], lastI=-2;
  const flush=function(){ if(seg.length>1) g+='<polyline points="'+seg.join(" ")+'" style="fill:none;stroke:var(--teal);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.7"></polyline>'; seg=[]; };
  pts.forEach(function(p){ if(p.i>lastI+1) flush(); seg.push(p.x.toFixed(1)+","+p.y); lastI=p.i; }); flush();
  pts.forEach(function(p){ const lv=dsLevel(p.r.daily_state);
    g+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y+'" r="6" style="fill:'+DAILY[lv].c+';stroke:var(--paper);stroke-width:2.2"><title>'+mdW(dateMs(p.r.date))+' '+hm(p.r.recorded_at)+' '+dsLabel(p.r.daily_state)+'</title></circle>';
    if(p.r.optional_note) g+='<circle cx="'+(p.x+6).toFixed(1)+'" cy="'+(p.y-6)+'" r="2.4" style="fill:var(--accent)"></circle>';
  });
  days.forEach(function(d,i){
    const dt=new Date(d.ms);
    g+='<text x="'+X(i)+'" y="188" text-anchor="middle" style="font-size:11px;font-weight:700;fill:'+(d.date===today?'var(--teal-deep)':'var(--ink2)')+'">'+DOW[dt.getDay()]+'</text>'
      +'<text x="'+X(i)+'" y="202" text-anchor="middle" style="font-size:10px;fill:var(--muted)">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</text>'
      +'<rect class="daycol" x="'+(X(i)-CW/2)+'" y="0" width="'+CW+'" height="208" style="fill:transparent;cursor:pointer" onclick="S.mood_day=\''+d.date+'\';S.ds_ui=null;renderMap()"><title>'+mdW(d.ms)+'の記録を見る</title></rect>';
  });
  return '<svg class="moodchart" viewBox="0 0 '+W+' 208" role="img" aria-label="気持ちの変化（日付を押すとその日の記録）">'+g+'</svg>';
}
/* 時間帯の言葉（事実の言い換えだけ） */
function partOfDay(iso){ const h=new Date(Date.parse(iso)).getHours(); return h<5?"夜":h<11?"朝":h<17?"昼":h<20?"夕方":"夜"; }
/* その日の変化：記録した事実だけをつなぐ（因果は言わない） */
function dayChangeText(recs){
  if(recs.length<2) return "";
  const a=recs[0], z=recs[recs.length-1];
  const pa=partOfDay(a.recorded_at), pz=partOfDay(z.recorded_at);
  const la=dsLabel(a.daily_state), lz=dsLabel(z.daily_state);
  if(la===lz) return pa+"も"+pz+"も、「"+la+"」と記録しています。";
  return (pa===pz?hm(a.recorded_at):pa)+"は「"+la+"」、"+(pa===pz?hm(z.recorded_at):pz)+"には「"+lz+"」と記録しています。";
}
/* 今週のふりかえり：事実ベースの短い要約。1日の最後の記録や単純平均で「その日の気分」を決めない */
function weekSummary(days,off){
  const rd=days.filter(function(d){ return d.recs.length; }), n=rd.length;
  if(n<3) return '<div class="dsai muted">これから記録が増えると、少しずつ気持ちの変化を見返せるようになります。</div>';
  const low=function(d){ return d.recs.some(function(r){ return dsLevel(r.daily_state)<=1; }); };
  const easy=function(d){ return d.recs.some(function(r){ return dsLevel(r.daily_state)>=2; }); };
  const half=Math.floor(n/2), A=rd.slice(0,half), B=rd.slice(n-half);
  const lowA=A.filter(low).length/A.length, lowB=B.filter(low).length/B.length;
  const multi=rd.filter(function(d){ return d.recs.length>1; });
  const rose=multi.filter(function(d){ return dsLevel(d.recs[d.recs.length-1].daily_state)>dsLevel(d.recs[0].daily_state); }).length;
  const total=rd.reduce(function(s,d){ return s+d.recs.length; },0);
  let t=(off?"この週は":"今週は")+n+"日・"+total+"回、気持ちを残してくれました。<br>";
  if(lowA-lowB>=0.4) t+="前半は「しんどい」「少ししんどい」と記録した日が多く、後半は少し落ち着いた記録が増えていたようです。";
  else if(lowB-lowA>=0.4) t+="後半にかけて、しんどさを感じる記録が少し増えていたようです。<br>無理のないペースで大丈夫です。";
  else if(!rd.some(low)) t+="「ふつう」「少し楽」の記録が多い週だったようです。";
  else if(!rd.some(easy)) t+="しんどさを感じる記録が続いた週だったようです。<br>無理のないペースで大丈夫です。";
  else t+="日によって、気分に波があったようです。";
  if(rose) t+="<br>1日の中で、あとから少し楽になったと記録した日が"+rose+"日ありました。";
  return '<div class="dsai"><div class="lab">🌱 '+(off?'この週':'今週')+'見えてきたこと</div><div class="v">'+t+'</div>'
    +'<div class="s">記録した内容から、事実をまとめています。</div></div>';
}
function avg(a){ return a.length ? a.reduce(function(x,y){ return x+y; },0)/a.length : 0; }

/* 最近見えてきたこと：記録が重なって見えてきた傾向（仮説）。心の地図には自動で入れない
   1) メモに人との予定・仕事のやりとりがあった記録 2) 今の一歩をやった日とそうでない日 3) 曜日。記録1件ずつで見る */
const DS_PEOPLE=/会議|面談|上司|同僚|打ち合わせ|予定|飲み会|人と会|人と話|職場の人|取引先/;
function dsInsights(){
  const all=dsAll().slice().sort(function(a,b){ return Date.parse(a.recorded_at)-Date.parse(b.recorded_at); }), out=[];
  const nDays=new Set(all.map(function(r){ return r.date; })).size;
  if(nDays<5) return {n:nDays, items:out};
  const L=function(r){ return dsLevel(r.daily_state); };
  const ppl=all.filter(function(r){ return r.optional_note && DS_PEOPLE.test(r.optional_note); }), oth=all.filter(function(r){ return ppl.indexOf(r)<0; });
  if(ppl.length>=2){
    const ap=avg(ppl.map(L)), ao=avg(oth.map(L)), lowN=ppl.filter(function(r){ return L(r)<=1; }).length;
    if(ap<=1.4 && ao-ap>=0.5) out.push({t:"人と関わる予定があったときに、疲れが出やすいかもしれません。",
      d:"会議や面談、人と会う予定について書いた記録では、「少ししんどい」「しんどい」が多いようです。",
      ev:["メモに人との予定ややりとりがあった記録："+ppl.length+"回（うち"+lowN+"回が「少ししんどい」「しんどい」）","そうでない記録は、「ふつう」「少し楽」が比較的多い"]});
    else if(ap>=2 && ap-ao>=0.5) out.push({t:"人と話したときは、少し楽に感じることがあるようです。",
      d:"人とのやりとりを書いた記録では、「ふつう」「少し楽」が多いようです。", ev:["メモに人とのやりとりがあった記録："+ppl.length+"回"]});
  }
  const cur=curAct();
  if(cur){
    const done={}; S.act_logs.filter(function(l){ return l.action_id===S.act_id; }).forEach(function(l){ done[isoDate(Date.parse(l.at))]=1; });
    const dd=all.filter(function(r){ return done[r.date]; }), nd=all.filter(function(r){ return !done[r.date]; });
    if(new Set(dd.map(function(r){ return r.date; })).size>=2 && nd.length>=2 && avg(dd.map(L))-avg(nd.map(L))>=0.5)
      out.push({t:"「"+cur.title+"」をやった日は、少し楽な記録が多いようです。", d:"今の一歩が、あなたに合っているのかもしれません。",
        ev:["「"+cur.title+"」をやった日："+new Set(dd.map(function(r){ return r.date; })).size+"日","やった日の記録は、やらなかった日より少し楽な傾向"]});
  }
  if(nDays>=8){
    const by={}; all.forEach(function(r){ const w=new Date(dateMs(r.date)).getDay(); (by[w]=by[w]||[]).push(L(r)); });
    const tot=avg(all.map(L)), worst=Object.keys(by).filter(function(w){ return by[w].length>=2; }).sort(function(a,b){ return avg(by[a])-avg(by[b]); })[0];
    if(worst!=null && tot-avg(by[worst])>=0.7) out.push({t:DOW[worst]+"曜日は、しんどさを感じやすいかもしれません。",
      d:DOW[worst]+"曜日の記録は、ほかの日より「しんどい」寄りのことが多いようです。", ev:[DOW[worst]+"曜日の記録："+by[worst].length+"回"]});
  }
  return {n:nDays, items:out};
}

/* 今週の進捗。cadence_type と今の頻度に合わせて出し方を変える（すべて「◯/3回」にはしない） */
function weekProgress(){
  const p=weekProgress0(); if(!p || !isFirst()) return p;
  const f=function(t){ return typeof t==="string" ? t.replace(/今週の分/g,"この3日の分").replace(/今週やった日/g,"この3日でやった日").replace(/今週(?=\d)/g,"この3日で").replace(/今週/g,"この3日").replace("/ 7日","/ 3日") : t; };
  const q=Object.assign({},p,{k:f(p.k), n:f(p.n), note:f(p.note)});
  if(p.pips && p.pips.length===7) q.pips=p.pips.slice(0,3);   // 毎日の行動は3日分で見せる
  return q;
}
function weekProgress0(){
  const a=act(S.act_id); if(!a) return null;
  const from=S.cycle?Date.parse(S.cycle.cycle_started_at):0;
  const logs=S.act_logs.filter(function(l){ return l.action_id===S.act_id && Date.parse(l.at)>=from; });
  const n=logs.length, f=S.act_frequency;
  if(isTrigger(a)) return {k:"今週の記録", n: n ? "今週"+n+"回試しました" : "まだ試していません", pips:null,
    note: freqText(f,a)+"、思い出したら開いてみてください。"};
  if(f==="今週1回") return {k:"今週の記録", n: n ? "完了" : "未実施", pips:[n>0],
    note: n ? "今週の分はできました。" : "今週のどこかで、1回だけ。"};
  if(f==="毎日"){
    const days=new Set(logs.map(function(l){ return dayKey(Date.parse(l.at)); })).size;
    return {k:"今週やった日", n: days+'<small>/ 7日</small>', pips:[...Array(7)].map(function(_,i){ return i<days; }),
      note: days ? "できた日を、少しずつ重ねています。" : "できる日だけで大丈夫です。"};
  }
  const m=/週(\d+)回/.exec(f), target=m?+m[1]:1;
  return {k:"今週", n: n+'<small>/ '+target+'回</small>', pips:[...Array(target)].map(function(_,i){ return i<n; }),
    note: n>=target ? "今週の目安に届きました。" : "できる日だけで大丈夫です。"};
}

/* ══════════════════════════════════════════════════════════════
   サイクルの状態とロック ──「まずは一つ決めて、3日間試す。振り返ってから、次の一歩を考える。」
   - 1サイクル1つの一歩。サイクルの途中では変えない（自動でも、手動でも）。変えられるのはふりかえりのあとだけ
   - 心の地図（詳細・更新・深めるミニセッション・地図からの再提案）は、最初のふりかえりが終わるまでロック
     解放条件はふりかえりの完了だけ（心理士への共有は関係ない）
   - 例外：負担やつらさがあるときは、いつでも「少しお休みする」を選べる（サイクルはやり直さない）
   - ロックの判定は表示ではなく状態（appPhase）から。状態はこの端末に保存し、再読み込みしても戻らない
   ══════════════════════════════════════════════════════════════ */
function appPhase(){
  if(!S.initial_plan_completed) return "onboarding";
  const c=refreshCycle(); if(!c) return "onboarding";
  const st=c.weekly_review_status, first=c.cycle_type==="first";
  if(st==="locked") return first ? "first_cycle_active" : "regular_cycle_active";
  if(st==="available") return first ? "first_review_available" : "regular_review_available";
  return "next_action_selection";   // ふりかえり完了 → 次の一歩を決める
}
/* 一歩を変えられるのは、ふりかえりが終わって次の一歩を決めるときだけ */
function canChangeAction(){ return appPhase()==="next_action_selection"; }
/* 心の地図は、最初のふりかえりが終わったら使える（共有したかどうかは関係ない） */
function mapUnlocked(){
  return S.reviews.some(function(r){ return r.cycle_type==="first"; })
      || (S.cycles||[]).some(function(c){ return c.cycle_type==="first"; })      // 以前の形式：すでに通常サイクルにいる
      || (S.cycle && S.cycle.cycle_type==="regular");
}
function actionLocked(){ return !!S.initial_plan_completed && !canChangeAction(); }

/* サイクルの途中で見えてきた「次に試すとよさそうなこと」は、次のふりかえりの候補として残すだけ */

    .concat([{kind:kind, action_id:id||S.act_id, source:source, at:nowIso(), cycle_id:S.cycle?S.cycle.weekly_cycle_id:null}]);

/* ── 状態の保存（この端末のブラウザ）。再読み込み・タブ移動・再訪でロックや一歩が戻らないように ── */
const STATE_KEY="kokoni_demo_state_v1";
const STATE_SKIP=["timerId","timer","pf","safe_ctx","screen","step"];
function saveState(){
  if(!S.entered) return;
  try{ const o={}; Object.keys(S).forEach(function(k){ if(STATE_SKIP.indexOf(k)<0) o[k]=S[k]; });
    localStorage.setItem(STATE_KEY, JSON.stringify({v:1, saved_at:new Date().toISOString(), S:o})); }catch(_){}
}
function loadState(){
  try{ const raw=localStorage.getItem(STATE_KEY); if(!raw) return false;
    const j=JSON.parse(raw); if(!j || !j.S || !j.S.entered) return false;
    Object.keys(j.S).forEach(function(k){ S[k]=j.S[k]; });
    /* 新しく増えた項目を補う（以前の保存データとの互換） */
    S.action_status=S.action_status||"active"; S.next_candidates=S.next_candidates||[];
    return true; }catch(_){ return false; }
}
/* 「最初から」：この端末の保存も消してから始め直す（消したことと実際の状態を一致させる） */
function resetDemo(){ try{ localStorage.removeItem(STATE_KEY); }catch(_){} window.__kokoniReset=true; location.reload(); }
window.addEventListener("pagehide", function(){ if(!window.__kokoniReset) saveState(); });
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden" && !window.__kokoniReset) saveState(); });

/* ── ふりかえりのあと：次の1週間の一歩を決める（初回・通常で共通） ── */
function nextCard(r){
  const ans=(r.answers||{}), near={"このまま続けたい":"keep","少し調整したい":"adjust","別のやり方を見てみたい":"change","別の一歩を試したい":"change"}[ans.next]
    || {"このまま続けてみたい":"keep","少し調整したい":"adjust","別のやり方も見てみたい":"change"}[(r.first_answers||{}).fit];
  const tag=function(k){ return near===k?' <span class="tag">ふりかえりの答えに近いもの</span>':''; };
  const cand=(S.next_candidates||[]).filter(function(c){ return r.weekly_cycle_id ? c.cycle_id===r.weekly_cycle_id : true; });
  const cTag=function(kind){ return cand.some(function(c){ return c.kind===kind || (kind==="adjust" && (c.kind==="freq"||c.kind==="dur")); }) ? ' <span class="tag">途中で残した候補あり</span>' : ''; };
  const m=miniInCycle(), pr=canChangeAction()?pendingRec():null, pa=pr&&act(pr.action_master_id);
