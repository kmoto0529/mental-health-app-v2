function proAiApply(id){
  const ws=proWs(id); if(!ws.ai) return;
  if((ws.draft||"").trim() && ws.draft!==ws.ai.text && !confirm("いま書いているお返事を、AIの下書きに置きかえます。よろしいですか？")) return;
  ws.draft=ws.ai.text; ws.ai_applied=ws.ai.text; proLog("ai_draft_apply",id); proRe();
}
function proFind(id){ return id==="live" ? liveClient() : proClients().filter(function(x){ return x.id===id; })[0]; }
function proRe(){ const y=window.scrollY, r=document.querySelector(".pright"), ry=r?r.scrollTop:0; renderPro(); window.scrollTo(0,y); const r2=document.querySelector(".pright"); if(r2) r2.scrollTop=ry; }
function proEdit(id,el){
  const ws=proWs(id); if(!ws.edited){ ws.edited=true; proLog("reply_edit",id); } ws.draft=el.value;
  const cnt=document.getElementById("ltCnt"); if(cnt) cnt.textContent=el.value.length+" / 1,000文字";
  const s=document.getElementById("ltSend"); if(s) s.disabled=!el.value.trim();
}
/* ── 次の一歩を提案する（Action Master から最大1件） ── */
function proRecBox(c){
  const ws=proWs(c.id), r=ws.rec, a=r&&act(r.id), cur=act(c.action.id);
  let h='<div class="pcard prec"><h3>次の一歩を提案する（任意）</h3>';
  if(!a) return h+'<p class="note">今の取り組みを見直したい場合は、別のActionを選べます。</p><button class="pbtn ghost" onclick="proAmOpen(\''+c.id+'\')">＋ Actionを選ぶ</button></div>';
  return h+'<div class="precsel"><span class="k">今回おすすめする一歩</span><b>'+esc(a.title)+'</b>'
      +'<div class="pm">'+a.default_duration+'分程度／'+esc(isTrigger(a)?a.default_frequency+"に":a.default_frequency)+'</div>'
      +'<div class="pd">'+esc(a.short_description)+'</div></div>'
    +'<div class="pcmp"><div><span class="k">現在</span>'+esc(cur?cur.title:c.action.title)+'</div><div class="ar">›</div><div><span class="k">提案</span>'+esc(a.title)+'</div></div>'
    +'<label class="pl">この一歩をおすすめする理由（任意）</label>'
    +'<textarea id="pxReason" maxlength="100" rows="2" placeholder="例：まずは相手に話すことよりも、伝えたいことを整理するところから始めてみるのもよさそうです。" oninput="proWs(\''+c.id+'\').rec.reason=this.value;document.getElementById(\'rsCnt\').textContent=this.value.length+\' / 100\'">'+esc(r.reason||"")+'</textarea>'
    +'<div class="pcnt" id="rsCnt">'+(r.reason||"").length+' / 100</div>'
    +'<div class="prow2"><button class="plink" onclick="proAmOpen(\''+c.id+'\')">別のActionに変える</button><button class="plink" onclick="proWs(\''+c.id+'\').rec=null;proRe()">提案をやめる</button></div></div>';
}
function proAmOpen(id){ PRO_AM={id:id, q:"", cat:"", dur:"", ease:"", open:null}; proLog("action_master_open",id); proAmRender(); }
function proAmRender(){
  const F=PRO_AM, cats=[]; (AM.actions||[]).forEach(function(a){ if(cats.indexOf(a.category_name)<0) cats.push(a.category_name); });
  const list=(AM.actions||[]).filter(function(a){ return a.status==="published"
    && (!F.q || (a.title+a.short_description+a.category_name).indexOf(F.q)>=0)
    && (!F.cat || a.category_name===F.cat)
    && (!F.dur || (F.dur==="5" ? a.default_duration<=5 : F.dur==="10" ? a.default_duration<=10 : a.default_duration>10))
    && (!F.ease || diffLabel(a.difficulty)===F.ease); });
  const sel=function(k,opts){ return '<select onchange="PRO_AM.'+k+'=this.value;proAmRender()">'+opts.map(function(o){ return '<option value="'+o[0]+'"'+(F[k]===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join("")+'</select>'; };
  document.getElementById("modalRoot").innerHTML='<div class="modalbg" onclick="closeWhy()"><div class="modal pammodal" onclick="event.stopPropagation()">'
    +'<h3>Actionを選ぶ</h3><p style="font-size:12px;margin:0 0 8px">kokoniのAction（'+(AM.actions||[]).filter(function(a){ return a.status==="published"; }).length+'件）から1つ選べます。</p>'
    +'<div class="pamf"><input type="text" id="amQ" placeholder="キーワード" value="'+esc(F.q)+'" onchange="PRO_AM.q=this.value;proAmRender()">'
    +sel("cat",[["","カテゴリ：すべて"]].concat(cats.map(function(c){ return [c,c]; })))
    +sel("dur",[["","時間：すべて"],["5","5分以内"],["10","10分以内"],["11","10分より長い"]])
    +sel("ease",[["","取り組みやすさ：すべて"],["やさしめ","やさしめ"],["ふつう","ふつう"],["しっかり","しっかり"]])+'</div>'
    +'<div class="pamlist">'+(list.length?list.map(function(a){ const op=F.open===a.action_id;
      return '<div class="pam"><div class="pam-h" onclick="PRO_AM.open=PRO_AM.open===\''+a.action_id+'\'?null:\''+a.action_id+'\';proAmRender()"><div style="min-width:0"><span class="pc">'+esc(a.category_name)+'</span><b>'+esc(a.title)+'</b>'
        +'<div class="pd">'+esc(a.short_description)+'</div><div class="pm">'+a.default_duration+'分／'+esc(isTrigger(a)?a.default_frequency+"に":a.default_frequency)+'／'+diffLabel(a.difficulty)+'</div></div><span class="chev">'+(op?'▴':'▾')+'</span></div>'
        +(op?'<div class="pam-d">'+esc(a.instruction||"")+'</div>':'')
        +'<button class="pbtn sm" onclick="proAmPick(\''+a.action_id+'\')">この一歩を提案する</button></div>'; }).join("") : '<p class="note">条件に合うActionがありません。</p>')+'</div>'
    +'<button class="pbtn ghost" onclick="closeWhy()">提案しない</button></div></div>';
}
function proAmPick(aid){
  const ws=proWs(PRO_AM.id), keep=ws.rec&&ws.rec.reason; ws.rec={id:aid, reason:keep||""};
  proLog("action_select",PRO_AM.id,{action_id:aid}); closeWhy(); proRe();
}
function proSaveDraft(id){
  const ws=proWs(id), el=document.getElementById("ltIn"); if(el) ws.draft=el.value;
  const d=document.getElementById("pxDir"); if(d) ws.dir=d.value;
  ws.saved_at=nowIso(); proLog("draft_save",id); saveState(); proRe();
}
function proRight(c){
  const ws=proWs(c.id);
  if(!c.letter) return '<div class="pcard"><h3>お返事を書く</h3><p class="note">本人から共有が届くと書けるようになります。</p></div>';
  if(c.sent){ const rec=(S.recommendations||[]).filter(function(x){ return x.letter_id===c.letter_id; })[0];
    return '<div class="pcard"><h3>送った手紙</h3><p class="note">'+(c.sent.at?fmtRecv(c.sent.at)+' に送信':'送信済み')+'</p><div class="pitem" style="white-space:pre-wrap">'+esc(c.sent.text)+'</div>'
      +(rec?'<div class="pitem"><span class="k">提案したAction</span>'+esc(act(rec.action_master_id).title)+' <span class="pst">'+({proposed:"未読",viewed:"本人が閲覧",accepted:"次の一歩として選択",declined:"今回は見送り",applied:"サイクルに適用"}[rec.status]||"")+'</span></div>':'')+'</div>'; }
  return '<div class="pcard pai"><h3>お返事のAIアシスト <span class="aitag">AI・下書き</span></h3>'
      +'<label class="pl">返信で伝えたいこと（任意）</label><textarea id="pxDir" rows="2" placeholder="例：まずは本人ができていることを伝えたい。ワークはしばらく継続してもらいたい。" oninput="proWs(\''+c.id+'\').dir=this.value">'+esc(ws.dir||"")+'</textarea>'
      +'<button class="pbtn ghost sm" onclick="proAiMake(\''+c.id+'\')">✨ AIに下書きを作ってもらう</button>'
      +proAiRefs(c)
      +(ws.ai?'<div class="paid"><span class="k">AIによる下書き・未送信</span><div style="white-space:pre-wrap">'+esc(ws.ai.text)+'</div>'
        +'<div class="prow2"><button class="pbtn sm" onclick="proAiApply(\''+c.id+'\')">編集欄に反映する</button><button class="plink" onclick="proAiMake(\''+c.id+'\')">もう一度作る</button></div></div>':'')
      +'<p class="note" style="margin:6px 0 0">AIの文はそのまま送られません。診断や休職の要否などは書きません。</p></div>'
    +'<div class="pcard"><h3>大塚さんからのお返事</h3>'
      +'<textarea id="ltIn" maxlength="'+LETTER_MAX+'" style="min-height:360px" placeholder="本人に伝えたいことを書いてください" oninput="proEdit(\''+c.id+'\',this)">'+esc(ws.draft||"")+'</textarea>'
      +'<div style="display:flex;justify-content:flex-end;font-size:12px;color:#6b7a85;margin-top:4px"><span id="ltCnt">'+(ws.draft||"").length+' / 1,000文字</span></div></div>'
    +proRecBox(c)
    +'<div class="pacts"><button class="pbtn ghost" onclick="proSaveDraft(\''+c.id+'\')">下書き保存</button>'
      +'<button class="pbtn" id="ltSend" '+((ws.draft||"").trim()?'':'disabled')+' onclick="proConfirm(\''+c.id+'\')">送信内容を確認する</button></div>'
    +(ws.saved_at?'<p class="note" style="text-align:right">'+fmtRecv(ws.saved_at)+' 下書き保存</p>':'');
}
function renderProDetail(b,c){
  b.innerHTML='<button class="pbtn ghost" style="width:auto;padding:8px 14px;margin:0 0 12px" onclick="proView=\'list\';renderPro()">← 一覧へ</button>'
    +'<div class="pname">'+esc(c.nickname)+' さん <small>'+(c.ctype==="first"?'初回3日':'通常7日')+(c.received_at?' ／ 共有 '+fmtRecv(c.received_at):'')+'</small></div>'
    +'<div class="pcols2"><div class="pleft">'+proLetterLeft(c)+proExtra(c)+'</div><div class="pright">'+proRight(c)+'</div></div>';
}
/* 送信前の確認 → 送信（手紙本文と Action 提案は別データ） */
function proConfirm(id){
  const c=proFind(id), ws=proWs(id), el=document.getElementById("ltIn"); if(el) ws.draft=el.value;
  const t=(ws.draft||"").trim(); if(!t) return; const a=ws.rec&&act(ws.rec.id);
  document.getElementById("modalRoot").innerHTML='<div class="modalbg" onclick="closeWhy()"><div class="modal pconf" onclick="event.stopPropagation()">'
    +'<h3>送信内容の確認</h3>'
    +'<div class="pitem"><span class="k">送信先</span>'+esc(c.nickname)+'さん</div>'
    +'<div class="pitem"><span class="k">大塚さんからの手紙</span><div style="white-space:pre-wrap">'+esc(t)+'</div></div>'
    +(a?'<div class="pitem"><span class="k">提案するAction</span><b>'+esc(a.title)+'</b><br>'+a.default_duration+'分程度／'+esc(isTrigger(a)?a.default_frequency+"に":a.default_frequency)+'</div>'
       +((ws.rec.reason||"").trim()?'<div class="pitem"><span class="k">おすすめする理由</span>'+esc(ws.rec.reason.trim())+'</div>':''):'<div class="pitem"><span class="k">提案するAction</span><span class="na">なし（手紙のみ）</span></div>')
    +'<p class="note">送ったあとは直せません。本人の一歩は、本人が選んだときだけ変わります。</p>'
    +'<button class="pbtn" id="ltConfirm" onclick="proSend(\''+id+'\')">この内容で送信する</button><button class="pbtn ghost" onclick="closeWhy()">戻って直す</button></div></div>';
}
function proSend(id){
  const c=proFind(id), ws=proWs(id), t=(ws.draft||"").trim().slice(0,LETTER_MAX); if(!t || c.sent || ws.sending) return;
  ws.sending=true; const bt=document.getElementById("ltConfirm"); if(bt){ bt.disabled=true; bt.textContent="送信しています…"; }
  const a=ws.rec&&act(ws.rec.id); let recId=null;
  if(a){ recId="REC-"+Date.now().toString(36);
    S.recommendations=(S.recommendations||[]).concat([{recommendation_id:recId, user_id: id==="live"?DS_USER:"USER_"+id, psychologist_id:PSY_ID, letter_id:c.letter_id,
      action_master_id:a.action_id, recommended_frequency:a.default_frequency, recommended_duration:a.default_duration,
      recommendation_reason:(ws.rec.reason||"").trim(), created_at:nowIso(), status:"proposed", selected_at:null, applied_cycle_id:null, history:[{status:"proposed", at:nowIso(), by:PSY_ID}]}]); }
  const start=(S.pro_events||[]).filter(function(e){ return e.client===id && e.type==="view_start"; }).slice(-1)[0];
  const aiUsed=!!ws.ai_applied, diff=aiUsed ? editRatio(ws.ai_applied,t) : null;
  proLog("send",id,{with_action:!!a, ai_used:aiUsed, ai_edit_ratio:diff, chars:t.length, seconds: start?Math.round((Date.now()-start.ms)/1000):null});
  if(id==="live"){ const r=liveReview(); r.letter_text=t; r.letter_status="arrived"; r.letter_read=false; r.letter_sent_at=nowIso(); r.letter_rec_id=recId;
    r.letter_minutes = start ? Math.round((Date.now()-start.ms)/6000)/10 : null; }
  else ws.sent={text:t, at:nowIso(), rec_id:recId};
  S.psy_letters=(S.psy_letters||[]).concat([{psychologist_letter_id:"PL-"+Date.now().toString(36), user_id: id==="live"?DS_USER:"USER_"+id, review_id:c.letter_id, psychologist_id:PSY_ID,
    content:t, ai_draft_used:aiUsed, created_at:ws.saved_at||nowIso(), sent_at:nowIso(), recommended_action_id:a?a.action_id:null, client:id}]);
  ws.draft=""; ws.ai=null; ws.rec=null; ws.edited=false; ws.ai_applied=null; ws.sending=false;
  closeWhy(); saveState(); renderPro();
}
/* AI下書きからどれだけ直したか（0=そのまま〜1=全部書き直し）。文字の一致でざっくり見る */
function editRatio(a,b){ a=String(a); b=String(b); if(!a.length) return 1; let same=0; const n=Math.min(a.length,b.length); for(let i=0;i<n;i++) if(a[i]===b[i]) same++; return Math.round((1-same/Math.max(a.length,b.length))*100)/100; }
/* 業務ログの集計（検証用。画面には小さく出すだけ） */
function proMetrics(){
  const E=S.pro_events||[], sends=E.filter(function(e){ return e.type==="send"; });
  if(!sends.length) return '<p class="pfoot">業務ログ：まだ送信はありません。</p>';
  const avg=Math.round(sends.reduce(function(s,e){ return s+(e.meta.seconds||0); },0)/sends.length);
  const ai=sends.filter(function(e){ return e.meta.ai_used; }).length, ac=sends.filter(function(e){ return e.meta.with_action; }).length;
  const recs=S.recommendations||[], adopted=recs.filter(function(r){ return r.status==="accepted"||r.status==="applied"; }).length;
  return '<p class="pfoot">業務ログ：送信 '+sends.length+'件 ／ 平均対応 '+Math.floor(avg/60)+'分'+(avg%60)+'秒 ／ AI下書き利用 '+ai+'件 ／ Action提案 '+ac+'件'+(recs.length?'（本人が採用 '+adopted+'件）':'')+'</p>';
}
const LETTER_MAX=1000;   // 2026-10-03 最大1,000字（毎回書く必要はない）
/* 互換：以前の呼び名 */
function proLetterCard(){ return ""; }
function sendLetter(){ proSend("live"); }
function startTimer(){ stopTimer(); S.timer=0;
  S.timerId=setInterval(()=>{ S.timer++; const el=document.getElementById("tm");
    if(el) el.textContent=Math.floor(S.timer/60)+":"+String(S.timer%60).padStart(2,"0"); },1000); }
function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId=null; } }

/* 行動マスターを読み込んでから起動する */
Promise.all([loadActionMaster(),loadSupportResources()]).then(function(){
  aiBtnSync();
  if(DEBUG) console.log("action-master:", (AM.actions||[]).length, "actions loaded");
  /* この端末に保存した状態があれば、そこから再開する（ロック・一歩・記録は戻らない） */
  if(loadState()){ go("home"); return; }
  renderFlow();
  document.getElementById("nav").hidden=true;
});
</script>
