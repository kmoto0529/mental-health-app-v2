/* ══════════════════════════════════════════════════════════════
   すぷらんからのおたより（AIが書く短い便り。大塚さんからの手紙とは別のもの・別のデータ）
   - 届く日：初回3日サイクル＝Day2（Day0＝一歩を決めた日）／通常サイクル＝Day2・Day5（Day1＝開始日）
     ふりかえりの日以降の枠は出さない（skipped）。日付はローカル日付・サイクル開始日が基準
   - 同じサイクル・同じ枠は1通だけ。何日か開かなくても、届くのは最新の1枠だけ（古い枠は skipped）
   - 文面は TYPE A（以前話したこと）／B（小さな気づき）／C（一歩への再訪）。本文は OTAYORI_LIMIT 字まで
   - 文面をつくる（otCompose）と表示（otCard / openOtayori）は分ける。AI生成に差し替えるときは otCompose を置き換える
   - 読んだだけで、行動の実施や心の地図の更新にはしない。危険語を含む記録は参照せず、その枠は出さない
   ══════════════════════════════════════════════════════════════ */
const OTAYORI_LIMIT=200;
function otAll(){ S.otayori=S.otayori||[]; return S.otayori; }
function otSlots(c){
  const d0=dayStart(Date.parse(c.cycle_started_at)), rev=dayStart(Date.parse(c.review_available_at));
  const defs = c.cycle_type==="first" ? [["D2",2]] : [["D2",1],["D5",4]];   // 通常は開始日が Day1
  return defs.map(function(x){ const day=d0+x[1]*DAY; return {slot:x[0], day:day, skip: day>=rev}; });
}
/* 届く日になった枠を確かめる。最新の1枠だけ作り、それより前の未作成の枠は skipped にする */
function otCheck(){
  const c=S.cycle; if(!c || !S.initial_plan_completed) return null;
  const today=dayStart(nowMs()), have=function(slot){ return otAll().some(function(o){ return o.cycle_id===c.weekly_cycle_id && o.slot===slot; }); };
  const due=otSlots(c).filter(function(s){ return s.day<=today && !have(s.slot); });
  if(!due.length) return null;
  const latest=due[due.length-1];
  due.slice(0,-1).forEach(function(s){ otAll().push({letter_id:otId(), user_id:DS_USER, cycle_id:c.weekly_cycle_id, slot:s.slot, status:"skipped", reason:"newer_slot", scheduled_at:new Date(s.day+8*3600000).toISOString()}); });
  if(latest.skip){ otAll().push({letter_id:otId(), user_id:DS_USER, cycle_id:c.weekly_cycle_id, slot:latest.slot, status:"skipped", reason:"after_review", scheduled_at:new Date(latest.day+8*3600000).toISOString()}); return null; }
  const ref=otRef(c);
  if(ref.risk){ otAll().push({letter_id:otId(), user_id:DS_USER, cycle_id:c.weekly_cycle_id, slot:latest.slot, status:"skipped", reason:"risk_in_records", scheduled_at:new Date(latest.day+8*3600000).toISOString()}); return null; }
  const out=otCompose(otType(c,ref), ref, c);
  const rec={letter_id:otId(), user_id:DS_USER, cycle_id:c.weekly_cycle_id, cycle_type:c.cycle_type, slot:latest.slot, letter_type:out.type,
    scheduled_at:new Date(latest.day+8*3600000).toISOString(), generated_at:nowIso(), content:out.content, title:out.title,
    reference_data:out.used, cta_type:out.cta, read_at:null, status:"generated", source:"rule"};
  otAll().push(rec); return rec;
}
let OT_SEQ=0; function otId(){ OT_SEQ++; return "OT_"+Date.now().toString(36)+"_"+OT_SEQ; }
/* 参照するのは実在する記録だけ */
function otRef(c){
  const from=Date.parse(c.cycle_started_at);
  const recs=dsAll().filter(function(r){ return Date.parse(r.recorded_at)>=from; }).sort(function(a,b){ return Date.parse(a.recorded_at)-Date.parse(b.recorded_at); });
  const logs=S.act_logs.filter(function(l){ return l.action_id===S.act_id && Date.parse(l.at)>=from; });
  const notes=recs.filter(function(r){ return r.optional_note; });
  const risk = recs.some(function(r){ return r.optional_note && RISK_RE.test(r.optional_note); });
  const last3=recs.slice(-3), heavy = last3.length>=2 && last3.filter(function(r){ return dsLevel(r.daily_state)===0; }).length>=2;
  return {recs:recs, logs:logs, notes:notes, risk:risk, heavy:heavy, action:curAct(), scene:S.iv_scene||"",
    topic:(S.current_concerns||[])[0]||"", prev:otAll().filter(function(o){ return o.status!=="skipped"; }).slice(-1)[0]||null};
}
function otType(c,ref){
  if(c.cycle_type==="first") return "A";
  if(ref.heavy) return "B";                                   // つらい記録が続くときは、行動を促さない
  const want = !ref.logs.length ? "C" : (ref.recs.length>=2 ? "B" : "A");
  if(ref.prev && ref.prev.letter_type===want && want!=="C") return want==="B" ? (ref.logs.length?"A":"C") : "B";   // 同じ型が続かないように
  return want;
}
function otCut(t,n){ t=String(t||""); return t.length>n ? t.slice(0,n)+"…" : t; }
function otyPick(list,prev){ const used=(prev&&prev.content)||""; return list.filter(function(x){ return used.indexOf(x)<0; })[0] || list[0]; }
/* 文面（ルール）。①以前の話・今の取り組み ②実際の記録の事実 ③小さな気づき・見方 ④次につながる言葉 */
function otCompose(type,ref,c){
  const a=ref.action, title=a?a.title:"", used={}, L=[];
  let cta="home";
  if(type==="A"){
    if(ref.scene){ L.push("最初に「"+otCut(ref.scene,30)+"」と話してくれましたね。"); used.first_scene=true; }
    else if(ref.topic && IV_TOPIC_P[ref.topic] && ref.topic!=="まだわからない"){ L.push("最初に、"+IV_TOPIC_P[ref.topic]+"が気になっていると話してくれましたね。"); used.intake_topic=ref.topic; }
    if(title){ L.push((c.cycle_type==="first"?"この3日は":"今週は")+"「"+otCut(title,20)+"」を試してみることにしました。"); used.action=title; }
    const left=Math.round((dayStart(Date.parse(c.review_available_at))-dayStart(nowMs()))/DAY);
    L.push((left<=1?"明日は":left+"日後は")+(c.cycle_type==="first"?"最初の":"")+"ふりかえりです。やってみてどうだったか、まだ試せていなくても、そのまま教えてくださいね。");
    cta="review";
  } else if(type==="B"){
    const r=ref.recs, f=r[0], z=r[r.length-1];
    if(ref.heavy){
      L.push("この数日、「しんどい」と残してくれた記録が続いていますね。");
      L.push("無理に何かをしなくても大丈夫です。ここに気持ちを残してくれるだけでも、十分だと思います。");
      used.recent_states=r.slice(-3).map(function(x){ return dsLabel(x.daily_state); });
    } else {
      if(f && z && f!==z && dsLabel(f.daily_state)!==dsLabel(z.daily_state)) L.push("この数日の気持ちの記録を見ると、はじめは「"+dsLabel(f.daily_state)+"」、"+(isoDate(Date.parse(z.recorded_at))===isoDate(nowMs()-DAY)?"昨日":"最近")+"は「"+dsLabel(z.daily_state)+"」と残してくれていました。");
      else if(z) L.push("この数日、「"+dsLabel(z.daily_state)+"」と残してくれていましたね。");
      used.states=r.map(function(x){ return dsLabel(x.daily_state); });
      const n=ref.notes.slice(-1)[0];
      if(n){ L.push("メモには「"+otCut(n.optional_note,30)+"」ともありましたね。"); used.note=n.record_id; }
      L.push(otyPick(["自分にとって、どんな時間が少し助けになっているのか。そんなことも、一緒に見つけていけたらと思います。",
        "記録を残してくれたことで、少しずつ自分の波が見えてきています。","気持ちの動きを、また一緒に見ていけたらと思います。"],ref.prev));
    }
    cta="mood";
  } else {
    if(title){ L.push((c.cycle_type==="first"?"この3日は":"今週は")+"「"+otCut(title,20)+"」を試してみることにしましたね。"); used.action=title; }
    L.push("この期間の記録は、まだありません。");
    const m=a && a.minimum_duration ? a.minimum_duration : 1;
    L.push("もし少し余裕があれば、今日は"+m+"分だけでも試してみませんか。まとまらなくても大丈夫です。今のやり方が難しければ、次のふりかえりで一緒に見直せます。");
    used.log_count=0; cta="step";
  }
  let body=spTone(L.join(""));
  if(Array.from(body).length>OTAYORI_LIMIT) body=Array.from(body).slice(0,OTAYORI_LIMIT-1).join("")+"…";
  const titles={A:"以前話してくれたこと", B:"この数日の気持ちのこと", C:"今週の一歩のこと"};
  return {type:type, content:body, title:titles[type], cta:cta, used:used};
}

   words:["少し楽になる","変わらない日もある","朝のほうがやりやすい","短いほうが続く"]},

   words:["記録をつけた","休めた","人に頼れた","外に出た","自分にやさしくできた"]},
  {id:"support",  k:"自分を支えるもの・大切なこと", cls:"res wide",
   q:"しんどいとき、少しでも支えになっているものはありますか？<br>人・場所・時間・もの、なんでも大丈夫です。", stem:"わたしを支えてくれているのは、＿＿＿。",
   words:["家族","友人","散歩","音楽","眠ること","ペット"]}
];
const MAP_N=MAP_BLOCKS.length;
function mapBlock(id){ return MAP_BLOCKS.filter(function(b){ return b.id===id; })[0]; }
function fmtMD(iso){ const d=new Date(Date.parse(iso)); return (d.getMonth()+1)+"/"+d.getDate(); }
/* 本人が話した・記録した言葉を集める。src は出どころ、at は見えてきた日 */
function mapMaterials(id){
  const out=[], add=function(t,src,at){ t=(t||"").trim(); if(t && !out.some(function(o){ return o.t===t; })) out.push({t:t,src:src,at:at||null}); };
  const miniKey={scene:"scene",thought:"thought",feeling:"feeling",behavior:"behavior",support:"coping"}[id];
  if(id==="scene") add(S.iv_scene,"最初に話した場面",S.setup_completed_at);
  S.mini_sessions.forEach(function(m){ if(miniKey) add(m[miniKey],"少し話したこと（"+fmtMD(m.at)+"）",m.at); });
  if(id==="thought") S.act_logs.forEach(function(l){ if(l.input && UI_FAMILY[l.app_type]==="write") add(l.input,"「"+l.title+"」で書いたこと（"+fmtMD(l.at)+"）",l.at); });
  if(id==="feeling"){
    const sh=dsAll().filter(function(r){ return dsLevel(r.daily_state)===0; }), shd=new Set(sh.map(function(r){ return r.date; })).size;
    if(sh.length) add("「しんどい」と記録した日が"+shd+"日あります","今日の状態",sh[sh.length-1].recorded_at);
  }
  if(id==="pattern"){
    /* 本人が「近い」と確かめた流れ、または本人が自分の言葉で直した流れだけ。確かめ中の見方は入れない */
    insights().confirmed.filter(function(c){ return c.type==="pattern"; }).forEach(function(c){
      add(c.text, c.own?"あなたが直した見方（"+fmtMD(c.at)+"）":"一緒に確かめた流れ（"+fmtMD(c.at)+"）", c.at); });
  }
  if(id==="tried"){
    const by={}, last={};
    S.act_logs.forEach(function(l){ (by[l.title]=by[l.title]||[]).push(l.feeling); last[l.title]=l.at; });
    Object.keys(by).forEach(function(t){ add("「"+t+"」のあと："+countText(by[t]),"やってみた記録",last[t]); });
    S.mini_sessions.forEach(function(m){ if((m.coping_all||[]).length && m.coping_effect && m.coping_effect!=="よくわからない")
      add("「"+m.coping_all.join("・")+"」をすると："+m.coping_effect,"少し話したこと（"+fmtMD(m.at)+"）",m.at); });
  }
  return out;
}
function mapEntry(id){ return (S.map||{})[id]; }
function mapSeen(id){ return !!mapEntry(id) || mapMaterials(id).length>0; }
function mapCount(){ return MAP_BLOCKS.filter(function(b){ return mapSeen(b.id); }).length; }
/* 心の地図を「つくり始めた」か。初回3問だけ（＋場面）の段階はまだ下書き */
function mapStarted(){
  return Object.keys(S.map||{}).length>0
    || S.mini_sessions.some(function(m){ return m.scene || m.thought || m.feeling || m.behavior; });
}
/* 最近見えてきたこと（新しい順）。本人が書いた言葉を優先して1視点1件 */
function mapFeed(n){
  const rows=[];
  MAP_BLOCKS.forEach(function(b){
    const e=mapEntry(b.id);
    if(e) return rows.push({id:b.id,k:b.k,text:e.text,at:e.at,mine:true});
    const m=mapMaterials(b.id).filter(function(x){ return x.at; }).slice(-1)[0];
    if(m) rows.push({id:b.id,k:b.k,text:m.t,at:m.at,mine:false});
  });
  insights().confirmed.filter(function(c){ return c.type==="talk"; }).forEach(function(c){ rows.push({id:null,k:"話して残したこと",text:c.text,at:c.at,mine:true}); });
  insights().confirmed.filter(function(c){ return c.type==="daily"; }).forEach(function(c){ rows.push({id:null,k:"記録から確かめたこと",text:c.text,at:c.at,mine:true}); });
  return rows.sort(function(a,b){ return Date.parse(b.at)-Date.parse(a.at); }).slice(0,n||3);
}
function mapRecent(){ return mapFeed(2).filter(function(r){ return r.mine; }); }

/* 3問の答えから作る最初の心の地図（内部では draft）。日常の言葉で、言い切らず「〜ようです」で置く */
const IV_WANT_D={"気持ちを少し軽くしたい":"気持ちの重さを、少しずつ軽くしていきたいようです",

/* 7つの視点を芽のまわりに置いた小さな図。見えてきた視点ほど葉がひろがる */
function mapArt(size){
  const s=size||88, c=s/2, R=s*0.36, r=s*0.105;
  let h='<svg class="mapart" width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'" aria-hidden="true">'
    +'<circle cx="'+c+'" cy="'+c+'" r="'+(R+r+2)+'" fill="var(--g-pale-2)" stroke="var(--teal-line)" stroke-dasharray="3 4"></circle>';
  MAP_BLOCKS.forEach(function(b,i){
    const a=-Math.PI/2+i*2*Math.PI/MAP_N, x=c+R*Math.cos(a), y=c+R*Math.sin(a), on=mapSeen(b.id);
    h+='<line x1="'+c+'" y1="'+c+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+(on?'var(--teal)':'var(--teal-line)')+'" stroke-width="1.4"></line>'
      +'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(on?'var(--teal)':'var(--paper)')+'" stroke="'+(on?'var(--teal-deep)':'var(--teal-line)')+'" stroke-width="1.2"></circle>';
  });
  return h+'<circle cx="'+c+'" cy="'+c+'" r="'+(r*1.25).toFixed(1)+'" fill="var(--accent-soft)" stroke="var(--accent-line)"></circle>'
    +'<text x="'+c+'" y="'+(c+r*0.55).toFixed(1)+'" text-anchor="middle" font-size="'+(r*1.5).toFixed(1)+'">🌱</text></svg>';
}
function mapPips(){
  return '<div class="mpips">'+MAP_BLOCKS.map(function(b){ return '<i class="'+(mapSeen(b.id)?'on':'')+'"></i>'; }).join("")+'</div>';
}
/* 進み具合の言葉。7/7でも「完成」とは言わない */
function mapStatusText(n){
  if(n>=MAP_N) return {h:"7つの視点が見えてきました", s:"ここからは、少しずつ深めていきます。<br>見えてきたことは、これからも増えていきます。"};
  if(n===0) return {h:"これから、少しずつ見えてきます", s:"話したことや、やってみたことから<br>地図がひろがっていきます。"};
  return {h:"見えてきたこと "+n+"/"+MAP_N, s:"話したことや、やってみたことから<br>少しずつ見えてきています。"};
}

/* ══════════════════════════════════════════════════════════════
   プロフィール（心の地図の補助情報）
   - マイページと同じデータ（S.nickname / age_range / gender / life_status / support_use）を参照する。二重管理しない
   - 入力率は心の地図の進捗とは別。「回答しない」も回答済みとして数える。100%でなくても全機能が使える
   - 通院・カウンセリングの状況は、提案の内容やペースを考えるためだけに使う。プロフィールは提案の参考として心理士にも共有する（2026-10-02 社長決定）
   ══════════════════════════════════════════════════════════════ */
/* 基本8項目（入力状況の分母。2026-10-02 「気になること」を追加）。g＝表示グループ。ex＝ほかと同時に選べない選択肢
   サポート利用状況は「今」（support_use）と「過去の利用歴」（support_past）を別フィールドで持つ */
const PF_FIELDS=[
  {id:"nickname",   g:"basic", k:"ニックネーム"},
  {id:"age_range",  g:"basic", k:"年代",   o:["10代","20代","30代","40代","50代","60代以上","回答しない"]},
  {id:"gender",     g:"basic", k:"性別",   o:["女性","男性","その他","回答しない"]},

  {id:"interests",  g:"life",  k:"気になること", multi:true, o:["仕事・学業","人間関係","恋愛","将来","お金","健康","その他"]},
  {id:"support_use",g:"life",  k:"サポートの利用状況", multi:true, ex:["現在は利用していない","回答しない"],
   o:["現在、医療機関に通院している","現在、カウンセリングを利用している","現在は利用していない","回答しない"]},
  {id:"confidant",  g:"life",  k:"相談できる人", q:"困ったときに、相談できる人はいますか？",
   o:["いる","いるけれど、少し話しにくい","いない","よくわからない","回答しない"]},
  {id:"time_slots", g:"life",  k:"取り組みやすい時間帯", q:"自分のための時間を取りやすいのは、いつ頃ですか？", multi:true, ex:["日によって違う","まだわからない","回答しない"],
   o:["朝","昼","夕方","夜","日によって違う","まだわからない","回答しない"]}
];
/* 条件つきの補足（入力状況には数えない） */
const PF_LEAVE={id:"leave_duration", k:"休職してからの期間", q:"休職してから、どのくらい経ちますか？", o:["1か月未満","1〜3か月未満","3〜6か月未満","6か月以上","回答しない"]};
const PF_GROUPS=[["basic","あなたの基本情報"],["life","今の生活・サポートについて"]];
/* 以前の形式（support_use に「過去に利用したことがある」）を読み替える */
function pfMigrate(){
  if(Array.isArray(S.support_use) && S.support_use.indexOf("過去に利用したことがある")>=0){
    S.support_use=S.support_use.filter(function(x){ return x!=="過去に利用したことがある"; }); S.support_past=true; }
  if(!Array.isArray(S.support_use)) S.support_use=[];
  if(!Array.isArray(S.time_slots)) S.time_slots=[];
  if(!Array.isArray(S.interests)) S.interests=[];
  if(S.life_status==="就業中") S.life_status="社会人";   // 以前の選択肢名
}
function pfVal(id){ pfMigrate(); const v=S[id]; return Array.isArray(v) ? v : (v||""); }
function pfDone(id){ const v=pfVal(id); if(id==="support_use") return v.length>0 || !!S.support_past; return Array.isArray(v) ? v.length>0 : !!v; }
function pfPct(){ return Math.round(PF_FIELDS.filter(function(f){ return pfDone(f.id); }).length/PF_FIELDS.length*100); }
function pfText(id){ const v=pfVal(id); return Array.isArray(v) ? v.join("・") : v; }
function profileMini(){
  const pct=pfPct(), done=PF_FIELDS.filter(function(f){ return pfDone(f.id); }), todo=PF_FIELDS.filter(function(f){ return !pfDone(f.id); });
  return '<div class="pfcard"><div class="top"><div style="min-width:0"><h3>あなたのことをもう少し教える</h3>'
    +'<p>今の生活や状況を少し教えてもらうと、すぷらんもあなたに合った提案を考えやすくなります。</p></div>'
    +'<div class="pct"><span class="pl">プロフィール入力状況</span><b>'+pct+'</b>%</div></div>'
    +'<div class="pfbar"><i style="width:'+pct+'%"></i></div>'
    +'<div class="pfchips">'+done.map(function(f){ return '<span class="on">✓ '+f.k+'</span>'; }).join("")
      +todo.map(function(f){ return '<span>'+f.k+'</span>'; }).join("")+'</div>'
    +'<button class="btn ghost sm2" onclick="openProfile()">'+(done.length>1?'プロフィールを確認・編集する':'プロフィールを追加する')+'</button></div>';
}
/* 編集はマイページ・心の地図の共通モーダル。保存するまでは下書き（S.pf） */
function openProfile(){
  pfMigrate(); S.pf={support_past:!!S.support_past, leave_duration:S.leave_duration||""};
  PF_FIELDS.forEach(function(f){ const v=pfVal(f.id); S.pf[f.id]=Array.isArray(v)?v.slice():v; });
  renderProfile();
}
function pfChips(f,P){
  return '<div class="chips">'+f.o.map(function(o){ const on = f.multi ? P[f.id].indexOf(o)>=0 : P[f.id]===o;
    return '<button class="chip'+(on?' on':'')+'" aria-pressed="'+on+'" onclick="pfPick(\''+f.id+'\',\''+o+'\')">'+o+'</button>'; }).join("")+'</div>';
}
function renderProfile(){
  const P=S.pf;
  const field=function(f){
    let h='<div class="msgrp"><h4>'+(f.q||f.k)+(f.multi?'<span class="pfmulti">いくつでも</span>':'')+'</h4>';
    if(f.id==="nickname") return h+'<input type="text" id="pfNick" maxlength="12" value="'+esc(P.nickname)+'"></div>';
    h+=pfChips(f,P);
    if(f.id==="life_status" && P.life_status==="休職中")
      h+='<div class="pfsub"><h4>'+PF_LEAVE.q+'<span class="pfmulti">任意</span></h4>'+pfChips(PF_LEAVE,P)+'</div>';
    if(f.id==="support_use"){
      const past=P.support_past, noAns=P.support_use.indexOf("回答しない")>=0;
      h+='<div class="chips" style="margin-top:6px"><button class="chip'+(past?' on':'')+(noAns?' off':'')+'" aria-pressed="'+!!past+'" '+(noAns?'disabled':'onclick="pfPast()"')+'>過去に利用したことがある</button></div>'
        +'<div class="pfwhy">通院やカウンセリングの状況は、提案の内容やペースを考えるためだけに使います。診断や判断には使いません。今後の提案に役立てるため、大塚さんにも共有されます。</div>';
    }
    if(f.id==="confidant") h+='<div class="pfwhy">一歩を考えるときに、まわりのサポートの様子を参考にします。</div>';
    if(f.id==="time_slots") h+='<div class="pfwhy">一歩に取り組むタイミングを考える参考にします。</div>';
    return h+'</div>';
  };
  document.getElementById("modalRoot").innerHTML='<div class="modalbg" onclick="closeWhy()"><div class="modal pfmodal" onclick="event.stopPropagation()">'
    +'<h3>あなたのことをもう少し教える</h3><p style="font-size:12.5px;margin-bottom:6px">どれも任意です。答えたくないものは「回答しない」を選べます。</p>'
    +PF_GROUPS.map(function(g){ return '<div class="pfgroup"><div class="pfgh">'+g[1]+'</div>'+PF_FIELDS.filter(function(f){ return f.g===g[0]; }).map(field).join("")+'</div>'; }).join("")
    +'<button class="btn" onclick="pfSave()">保存する</button><button class="linkbtn" onclick="closeWhy()">やめる</button></div></div>';
}
function pfKeepNick(){ const n=document.getElementById("pfNick"); if(n) S.pf.nickname=n.value; }
function pfRerender(){ const box=document.querySelector(".pfmodal"), y=box?box.scrollTop:0; renderProfile(); const b2=document.querySelector(".pfmodal"); if(b2) b2.scrollTop=y; }
function pfPast(){ pfKeepNick(); S.pf.support_past=!S.pf.support_past; pfRerender(); }
function pfPick(id,o){
  pfKeepNick();
  const P=S.pf, f=id===PF_LEAVE.id ? PF_LEAVE : PF_FIELDS.filter(function(x){ return x.id===id; })[0];
  if(f.multi){
    const a=P[id], k=a.indexOf(o), ex=f.ex||[];
    if(k>=0) a.splice(k,1);
    else if(ex.indexOf(o)>=0){ a.length=0; a.push(o); }                       // 排他：ほかを外す
    else { for(let i=a.length-1;i>=0;i--) if(ex.indexOf(a[i])>=0) a.splice(i,1); a.push(o); }
    if(id==="support_use" && a.indexOf("回答しない")>=0) P.support_past=false;   // 回答しない は過去の利用歴とも排他
  } else P[id] = P[id]===o ? "" : o;
  if(id==="life_status" && P.life_status!=="休職中") P.leave_duration="";        // 休職中以外は聞かない
  pfRerender();
}
function pfSave(){
  pfKeepNick(); S.pf.nickname=(S.pf.nickname||"").trim();
  PF_FIELDS.forEach(function(f){ if(f.id==="nickname" && !S.pf.nickname) return; S[f.id]=S.pf[f.id]; });   // ニックネームは空にしない
  S.support_past=!!S.pf.support_past; S.leave_duration=S.pf.life_status==="休職中" ? (S.pf.leave_duration||"") : "";
  S.pf=null; closeWhy();
  if(S.screen==="log") renderLog(); else if(S.screen==="map"||S.screen==="rec") renderMap();
}
/* AIに渡すプロフィール。「回答しない」と未回答の項目は渡さない（推測・補完させない）。性別・年代は渡さない */
function pfForAI(){
  pfMigrate();
  const keep=function(v){ return v && v!=="回答しない" ? v : undefined; };
  const arr=function(a){ a=(a||[]).filter(function(x){ return x!=="回答しない"; }); return a.length?a:undefined; };
  const o={life_status:keep(S.life_status), leave_duration: S.life_status==="休職中" ? keep(S.leave_duration) : undefined,
    support_now:arr(S.support_use), support_past: S.support_use.indexOf("回答しない")<0 && S.support_past ? true : undefined,
    confidant:keep(S.confidant), time_slots:arr(S.time_slots), interests:arr(S.interests)};
  Object.keys(o).forEach(function(k){ if(o[k]===undefined) delete o[k]; });
  return o;
}

/* ── 仮説エンジン（ルール）。HYPO_RULES は監修で直せるよう画面から分ける ──
   A 思考・感情のパターン／B 行動と状態の関係／C 本人の強み・工夫
   1つの出来事だけでパターンと言わない：A・B は「別の日の記録が2つ以上」のときだけ。反する記録があれば「ほかの可能性」に入れる */
const HYPO_RULES=[
  {key:"A-blame", type:"A", views:["thought","pattern"], kw:/自分のせい|迷惑|申し訳|嫌われ|評価|怒られ|ちゃんとしなきゃ|失敗/,
   text:"相手の反応や評価が気になると、自分に原因があると考えやすい場面があるのかもしれないね。",
   alt:["そのときの忙しさや疲れが、考え方に影響していた可能性もあるね。","相手の側に、別の事情があった場面もあるかもしれないね。"]},
  {key:"A-future", type:"A", views:["thought","scene","pattern"], kw:/明日|この先|どうなる|将来|ずっと考え|考えてしまう|眠れ/,
   text:"先のことを考え始めると、頭の中で考えが続きやすい時間があるのかもしれないね。",
   alt:["実際に予定が立て込んでいた時期だった可能性もあるね。"]},
  {key:"A-compare", type:"A", views:["thought"], kw:/比べ|自分だけ|遅れ|どうせ/,
   text:"まわりと比べると、自分を低く見積もりやすい場面があるのかもしれないね。", alt:["比べる場面が多い環境にいた可能性もあるね。"]},
  {key:"B-calm", type:"B", views:["behavior","tried"], kw:/散歩|歩|外に|風呂|音楽|寝|休|ひとりの時間|一人/, needGood:true,
   text:"{x}の時間が、気持ちを少し落ち着ける助けになっているのかもしれないね。", alt:["その日はもともと調子がよかった可能性もあるね。"]},
  {key:"B-work", type:"B", views:["tried"], work:true,
   text:"「{x}」のあとは、少し楽になることがあるみたいだね。", alt:["やった日の体調や時間帯が影響していた可能性もあるね。"]},
  {key:"C-hardday", type:"C", views:["strength","tried"], hardDay:true, min:1,
   text:"しんどいと感じた日にも、「{x}」をする時間をつくっていたね。自分が少し落ち着ける方法を探そうとしているのかもしれないね。", alt:[]},
  {key:"C-coping", type:"C", views:["strength","support"], coping:true, min:1,
   text:"つらいときに「{x}」を試していたね。自分を助ける工夫を、もう持っているのかもしれないね。", alt:[]}
];
const HYPO_ENGINE={
  version:"rule-2026-10-03",
  generate:function(recs){
    const out=[], days=function(list){ return new Set(list.map(function(r){ return r.day; })).size; };
    HYPO_RULES.forEach(function(rule){
      let ev=[], x="";
      if(rule.kw){ ev=recs.filter(function(r){ return ["note","reframe"].indexOf(r.type)<0 || r.type==="note" ? rule.kw.test(r.text) : false; });
        if(rule.needGood){ ev=ev.filter(function(r){ return r.good || r.mood==="somewhat_better" || r.mood==="neutral"; }); const m=ev.length?rule.kw.exec(ev[0].text):null; x=m?m[0]:""; } }
      if(rule.work){ const by={}; recs.filter(function(r){ return r.type==="work" && r.good; }).forEach(function(r){ const t=r.text.split("（")[0]; (by[t]=by[t]||[]).push(r); });
        const k=Object.keys(by).sort(function(a,b){ return by[b].length-by[a].length; })[0]; if(k){ ev=by[k]; x=k; } }
      if(rule.hardDay){ ev=recs.filter(function(r){ return r.type==="work" && r.hard_day; }).slice(-3); x=ev.length?ev[0].text.split("（")[0]:""; }
      if(rule.coping){ ev=recs.filter(function(r){ return r.type==="talk" && r.views.indexOf("strength")>=0 && r.good; }).slice(-3); x=ev.length?ev[0].text.split("（")[0]:""; }
      const need=rule.min||2;
      if(ev.length<need || (need>=2 && days(ev)<2)) return;   // 1つの出来事だけでは言わない
      /* 反する記録：同じ視点で、逆の気持ち（楽・安心）が書かれているもの */
      const contra = rule.type==="A" ? recs.filter(function(r){ return r.views.some(function(v){ return rule.views.indexOf(v)>=0; }) && /安心|なんとかなる|大丈夫|ほっと/.test(r.text); }).slice(0,1) : [];
      out.push({key:rule.key, type:rule.type, views:rule.views, text:rule.text.replace("{x}",x), evidence:ev.slice(-4),
        alt:rule.alt.concat(contra.length?["一方で「"+contra[0].text.slice(0,24)+"」と書いていた日もあるね。いつもそうとは限らないのかもしれないね。"]:[]),
        confidence:Math.min(0.9, 0.3+0.15*ev.length+(days(ev)>=3?0.15:0))});
    });
    return out;
  }
};

  let x='<div class="hycard t'+h.hypothesis_type+'"><div class="hyh">すぷらんが見つけた、ひとつの仮説<span>'+lab+'</span></div>'

    +(h.status==="revised"?'<div class="hys">あなたが直した見方（もとの仮説：'+esc(h.hypothesis_text)+'）</div>':'<div class="hys">これまでのいくつかのお話から、そんな共通点が少し見えてきたよ。</div>')
    +'<button class="whybtn" onclick="hypoWhy(\''+h.hypothesis_id+'\')">どうしてそう考えたの？</button>';
  if(h.status==="proposed" || h.status==="pending"){
    x+='<div class="hyq">自分でも、そんな感じがする？</div><div class="rvchips">'+HYPO_FB.map(function(f,i){ return '<button class="rvchip'+(h.user_feedback===f[0]?' on':'')+'" onclick="hypoAnswer(\''+h.hypothesis_id+'\','+i+')">'+f[0]+'</button>'; }).join("")+'</div>';

/* ── 視点ごとの手がかり・深まり（本人の確認・具体性・つながり・ワークによる発見から。会話の回数では増やさない） ── */
function viewClues(id){
  const c=[], e=mapEntry(id);
  if(e) c.push({t:e.text, src:"あなたが書いたこと", at:e.at, own:true});
  mapMaterials(id).forEach(function(m){ c.push({t:m.t, src:m.src, at:m.at}); });
  (S.map_notes||[]).filter(function(n){ return n.view===id; }).forEach(function(n){ c.push({t:n.text, src:(n.mode==="deep"?"すぷらんと深めたこと":"1分ふりかえり")+"（"+fmtMD(n.at)+"）", at:n.at, own:true, deep:n.mode==="deep"}); });
  /* 書き出し・行動の記録・気持ちのメモ・ふりかえりも、その視点の手がかりにする（本人の言葉そのまま） */
  mapRecords().filter(function(r){ return r.views.indexOf(id)>=0 && ["journal","activity","mood","review"].indexOf(r.type)>=0; })
    .forEach(function(r){ c.push({t:String(r.text).slice(0,60), src:r.label, at:r.at}); });
  insights().confirmed.filter(function(x){ return (x.type==="talk" && id==="scene") || (x.type==="daily" && id==="feeling"); })
    .forEach(function(x){ c.push({t:x.text, src:(x.type==="talk"?"話して残したこと":"記録から確かめたこと")+"（"+fmtMD(x.at)+"）", at:x.at, own:true}); });
  if(id==="strength") strengthFacts().forEach(function(f){ c.push({t:f.t, src:f.src, at:f.at, fact:true}); });
  return c;
}
function viewHyps(id){ return hyps().filter(function(h){ return h.related_perspective_ids.indexOf(id)>=0; }); }
function viewDepth(id){
  const c=viewClues(id), H=viewHyps(id);
  const conf=H.some(function(h){ return h.status==="user_confirmed"||h.status==="revised"; });
  const tried=(S.reframes||[]).some(function(f){ return (f.related_views||[]).indexOf(id)>=0; }) || H.some(function(h){ return h.status==="revised"; })
    || (id==="tried" && (S.map_notes||[]).some(function(n){ return n.view==="tried" && n.mode==="deep"; }));
  if(conf && tried) return 4; if(conf) return 3;
  if(c.length>=2 || c.some(function(x){ return x.deep; })) return 2;
  return c.length ? 1 : 0;
}
/* 本人の具体的な行動から見つけた工夫（評価の言葉ではなく、実際にしたこと） */
function strengthFacts(){
  const F=[], by={};
  (S.act_logs||[]).forEach(function(l){ by[l.title]=(by[l.title]||0)+1; });
  Object.keys(by).forEach(function(t){ if(by[t]>=2) F.push({t:"「"+t+"」を"+by[t]+"回、続けて記録していたね", src:"ワークの記録", at:(S.act_logs.filter(function(l){ return l.title===t; }).slice(-1)[0]||{}).at}); });
  (S.mini_sessions||[]).forEach(function(m){ if((m.coping_all||[]).length && /楽/.test(m.coping_effect||"")) F.push({t:"つらいときに「"+m.coping_all.join("・")+"」を試していたね", src:"すぷらんとの会話（"+fmtMD(m.at)+"）", at:m.at}); });
  (S.reviews||[]).forEach(function(r){ const o=(r.answers||{}).outside; if(o) F.push({t:"アプリの外でも「"+o.slice(0,24)+"」と工夫していたね", src:fmtMD(r.completed_at)+"のふりかえり", at:r.completed_at}); });
  return F.filter(function(f){ return (S.map_hidden||[]).indexOf(f.t)<0; });
}
function mapCounts(){
  const clues=MAP_BLOCKS.reduce(function(a,b){ return a+viewClues(b.id).length; },0);
  const links=hyps().filter(function(h){ return h.status==="user_confirmed"||h.status==="revised"; }).length;
  const views=(S.reframes||[]).filter(function(f){ return f.chosen_text; }).length;
  return {clues:clues, links:links, views:views};
}

/* ── TOP：今のあなた（2〜3文）→ できていること → 最近分かったこと → 8つの視点 ── */
function mapSummary(){
  const out=[], ev=[];
  /* 1文目：よく起きる場面・気になっていること（本人の言葉から） */
  const sc=viewClues("scene").filter(function(c){ return !c.fact; }).slice(-1)[0];
  if(sc){ out.push("「"+sc.t.slice(0,30)+(sc.t.length>30?"…":"")+"」のような場面で、気持ちが動くことがあるようです。"); ev.push(sc.src+"：「"+sc.t.slice(0,40)+"」"); }
  else if(S.current_concerns && S.current_concerns[0] && S.current_concerns[0]!=="まだわからない"){ out.push((IV_TOPIC_P[S.current_concerns[0]]||S.current_concerns[0])+"が、いま気になっているようです。"); ev.push("最初に話したこと："+S.current_concerns[0]); }
  /* 2文目：本人が確かめた（なければ確認待ちの）A・B の仮説。根拠が足りなければ出さない */
  const h=hyps().filter(function(x){ return (x.hypothesis_type==="A"||x.hypothesis_type==="B") && x.status!=="needs_revision"; })
    .sort(function(a,b){ return (b.status==="user_confirmed"||b.status==="revised")-(a.status==="user_confirmed"||a.status==="revised"); })[0];
  if(h){ out.push(h.status==="revised"&&h.user_revision ? "「"+h.user_revision.replace(/[。.]$/,"")+"」と感じているようです。" : h.hypothesis_text.replace(/ね。$/,"。")); h.evidence_summary.forEach(function(e){ ev.push(e.label+"：「"+e.text+"」"); }); }
  /* 3文目：できていること・支え */
  const st=strengthFacts()[0], sp=mapEntry("support");
  if(st){ out.push("一方で、"+st.t.replace(/ね$/,"")+"。"); ev.push(st.src+"："+st.t); }
  else if(sp){ out.push("「"+sp.text.slice(0,24)+"」が、支えになっているようです。"); ev.push("あなたが書いたこと："+sp.text); }
  return {lines:out.map(spTone), ev:ev};
}

/* ══ すぷらんと、別の見方を探す（認知再構成法の考え方。前向きに変えることが目的ではない）══
   STEP1 今の考え（保存済みの会話・地図から再利用）→ STEP2 別の見方 2〜3案（中立的なものを必ず含む）→ STEP3 本人が選ぶ（選ばなくてよい）
   → STEP4 気持ち（任意）→ STEP5 本人が残すと決めたときだけ保存。毎日のワークは変えない */
const REFRAME_RULES=[
  {kw:/嫌われ|怒って|きつい|冷た|無視|返事/, alts:["相手も、そのとき何か余裕がなかったのかもしれない。","伝えたいことがあったけれど、言い方がきつくなってしまったのかもしれない。"]},
  {kw:/失敗|どうせ|無理|できない|だめ/, alts:["うまくいかなかったのは一部で、全部ではないのかもしれない。","疲れているときは、実際より悪く見えやすいのかもしれない。"]},

function reframeAlts(ev,th){

}

function tlItems(filter){

  if(filter!=="mood") S.act_logs.forEach(function(l){ a.push({kind:"act", at:l.at, date:isoDate(Date.parse(l.at)), l:l}); });
  return a.sort(function(x,y){ return Date.parse(y.at)-Date.parse(x.at); });

function tlRow(it){

function saveMapEntry(){
  const ta=document.getElementById("mapIn"), v=(ta?ta.value:MAPED.draft).trim();

  if(RISK_RE.test(v)){ MAPED=null; openSafety("free_text","unspecified"); return; }
  mapPut(MAPED.id,{text:v});
}
function saveMapPattern(){
  const sl=MAPED.slots.map(function(s){ return (s||"").trim(); }), filled=sl.filter(Boolean);
  if(filled.length<2){ alert("2つ以上埋めると、流れとして残せます。"); return; }

  mapPut("pattern",{text:filled.join(" → "), slots:sl});
}
function mapPut(id,v){
  S.map=S.map||{};

  S.map[id]=Object.assign({at:nowIso(), history:prev?(prev.history||[]).concat([{text:prev.text,at:prev.at}]):[]},v);
  S.map_log.push({block:id, at:S.map[id].at});
  MAPED=null; renderMap(); window.scrollTo(0,0);
}

/* ══════════════════════════════════════════════════════════════
   週次サイクル・週次ふりかえり・ふりかえりタブ
   - 初回の行動確定で first サイクル（3日）を開始。初回ふりかえり後、次の一歩を決めたら regular（7日）へ
     初回の3日間は「効果」ではなく「今のやり方が合っていそうか・続けやすそうか」を確かめる期間
   - review_available_at＝開始＋cycle_length_days
   - weekly_review_status：locked → available（期間経過）→ completed（ふりかえり完了）
   - Home の「週1回のふりかえり」カードと「ふりかえり」タブは同じ S.cycle・同じふりかえりデータを使う
   - 大塚さんへの共有：2026-10-02 午前に必須→同日午後の仕様書で任意に（SHARE_REQUIRED で切り替え）。送らず保存でもふりかえりは完了
   - 共有できるのは 1 weekly_cycle につき 1 回まで
   ══════════════════════════════════════════════════════════════ */
const DAY=86400000;
function nowMs(){ return Date.now()+S.clock_offset; }
function nowIso(){ return new Date(nowMs()).toISOString(); }
const CYCLE_DAYS={first:3, regular:7};
/* 9/22 決定：本人がまとめを送るのは火曜、心理士が読んで返すのは水・木。「2日ほどで届きます」
   通常サイクルのふりかえりは火曜の朝に開く。最初のサイクル（3日）は曜日にそろえない（10/2 確認事項）
   火曜までが近すぎるときは翌週の火曜にする（最短 REVIEW_MIN_DAYS 日） */
const REVIEW_DOW=2, REVIEW_MIN_DAYS=4, LETTER_DAYS=2;
const DOW=["日","月","火","水","木","金","土"];
function dayStart(ms){ const d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
function nextReviewDay(t){
  let d=dayStart(t)+DAY;
  while(new Date(d).getDay()!==REVIEW_DOW || (d-dayStart(t))/DAY<REVIEW_MIN_DAYS) d+=DAY;
  return d;
}
function mdw(ms){ const d=new Date(ms); return (d.getMonth()+1)+"/"+d.getDate()+"（"+DOW[d.getDay()]+"）"; }
function startCycle(type){
  type=type||"regular";
  const t=nowMs();
  const rev = type==="regular" ? nextReviewDay(t) : t+CYCLE_DAYS[type]*DAY;
  const len = Math.round((dayStart(rev)-dayStart(t))/DAY);
  if(S.cycle){ S.cycle.cycle_ends_at=new Date(t).toISOString(); S.cycles.push(S.cycle); }
  const n=S.cycles.length+1;
  S.cycle={
    weekly_cycle_id:"WC-"+String(n).padStart(3,"0"),
    cycle_type:type, cycle_length_days:len,
    cycle_started_at:new Date(t).toISOString(),
    review_available_at:new Date(rev).toISOString(),
    cycle_ends_at:new Date(rev).toISOString(),   // 予定。実際は次のサイクルを始めた時刻で確定する
    weekly_review_status:"locked",
    action_id:S.act_id
  };
  S.rv={step:"form", ans:{}, self:"", ask:"", sel:{state:true, action:true, reflection:true, note:false}, fq:{}};
}
function isFirst(){ return !!S.cycle && S.cycle.cycle_type==="first"; }
function refreshCycle(){
  if(S.pending_work) applyPendingWork();
  const c=S.cycle;
  if(c && c.weekly_review_status==="locked" && nowMs()>=Date.parse(c.review_available_at)) c.weekly_review_status="available";
  return c;
}
function daysLeft(){ return Math.max(0,Math.ceil((Date.parse(S.cycle.review_available_at)-nowMs())/DAY)); }
function reviewOf(id){ return S.reviews.filter(function(r){ return r.weekly_cycle_id===id; })[0]||null; }
function curReview(){ return S.cycle ? reviewOf(S.cycle.weekly_cycle_id) : null; }
/* 手紙は共有したふりかえりにだけ届く。次のサイクルに進んだあとでも、未読なら知らせる */

/* ══════════════════════════════════════════════════════════════
   ふりかえり（2026-10-02 再設計：1画面で完結）
   上：自分のふりかえり（今回の一歩と実施記録＋任意の補足／① やってみてどうだった？／② 次はどうしたい？／③ 大塚さんに聞きたいこと 150字）

   下：大塚さんに見てもらう内容（淡いグリーンの枠。この枠の中だけを送る。回答に合わせて自動で更新・編集と除外ができる）
   - 3つの情報は別々に持つ：今回のふりかえり（200字）／相談（150字・本人の文のまま）／最初の3問（初回・選んだものだけ）
   - 送信は1回。「この内容を大塚さんに送る」を押したときだけ共有。「今回は送らず、ふりかえりを保存」でも完了（SHARE_REQUIRED=false のとき）
   - レターは回答と実施記録だけから組み立てる（架空の内容を足さない）。本人が書いた相談は意味を変えず・切らない
   - 共有するもの：レター＋プロフィール（2026-10-02〜）／共有しないもの：AIとの会話全文・毎日のメモ全文・心の地図の詳細・未確認の仮説
   - 送るのはプレビューに表示した文だけ。1サイクル1回まで
   ══════════════════════════════════════════════════════════════ */
const LETTER_LIMIT=200, ASK_LIMIT=150;   // 今回のふりかえり200字／相談150字（別々に数える）
/* 大塚さんへの共有を必須にするか。2026-10-02 午後の仕様書で「任意」に戻ったため false。true にすると「送らず保存」を出さない */
const SHARE_REQUIRED=false;
const RV_FEEL=["やりやすかった","少し難しかった","難しかった","まだ分からない"];
const RV_NEXT=["このまま続けたい","少し調整したい","別の一歩を相談したい","まだ分からない"];   // 選んでもワークは変えない（本人の希望として大塚さんへ）
const RV_STATE=["しんどい","少ししんどい","ふつう","少し楽"];   // 今の調子（ワークの感想とは別に保存。今日の気持ちには入れない）
const RV_FACTORS=["睡眠","仕事・学業","人間関係","体調","楽しかったこと","よく分からない","その他"];
const ASK_EX=["今の取り組みが自分に合っているか、どう判断すればいいですか？",
  "やろうと思っても行動できない日があります。どうしたら無理なく取り組めますか？",
  "気持ちが落ち込む理由がよく分かりません。何から整理していけばいいですか？"];
const RV_Q=[
  {id:"tried", k:"どのくらい試せたか", q:"どのくらい試せましたか？", o:["まだできていない","1回やってみた","何回かやってみた","思ったよりできた"]},
  {id:"feel",  k:"やってみてどうだったか", q:"やってみてどうでしたか？", o:["やりやすかった","少し負担があった","かなり負担があった","まだよくわからない"]},
  {id:"next",  k:"次はどうしてみたいか", q:"次はどうしてみたいですか？", o:["このまま続けたい","少し調整したい","別のやり方を見てみたい","まだよくわからない"]}
];
const LT_ITEMS=[{id:"state",k:"今の状態"},{id:"action",k:"試したこと"},{id:"reflection",k:"振り返り"},{id:"note",k:"気づいたこと"}];
function lcount(t){ return Array.from(String(t||"").replace(/\r?\n/g,"")).length; }   // 改行は数えない
function rvInit(){
  const rv=S.rv=S.rv||{};
  rv.step=rv.step||"form"; rv.ans=rv.ans||{}; rv.self=rv.self||""; rv.ask=rv.ask||"";
  rv.sel=rv.sel||{state:true, action:true, reflection:true, note:false};

function ltState(){

  const st = moods.length ? "「"+modeOf(moods)+"」の記録が多い" : (IV_STATE_P[S.current_status]||"");
  return {full:topic+st+"。", short:(st||topic.replace(/、$/,""))+"。"};
}
function modeOf(a){ const m={}; a.forEach(function(v){ m[v]=(m[v]||0)+1; }); return Object.keys(m).sort(function(x,y){ return m[y]-m[x]; })[0]; }

/* 見出しつきの本文。収まらなければ要約側だけを短くする（本人の相談・気づきは触らない） */
function buildLetter(){
  const rv=rvInit(), a=rv.ans, sel=rv.sel;
  const ask=(rv.ask||"").trim() || ({"少し調整したい":"今のやり方を、少し調整してもよいか相談したいです。","別のやり方を見てみたい":"別のやり方に変えてもよいか相談したいです。"}[a.next]||"");
  const S1=ltState(), A1=ltAction(), R1=ltReflection(a), note=(rv.self||"").trim();
  const make=function(lv){
    const L=[];
    if(sel.state && (lv<2?S1.full:S1.short)) L.push("今の状態："+(lv<2?S1.full:S1.short));
    if(sel.action) L.push("試したこと："+(lv<1?A1.full:A1.short));
    if(sel.reflection && R1.full!=="。") L.push("振り返り："+(lv<3?R1.full:R1.short));
    if(sel.note && note) L.push("気づいたこと："+note);
    if(ask) L.push("相談したいこと："+ask);
    return L.join("\n");
  };
  let t=make(0); for(let lv=1; lv<=3 && lcount(t)>LETTER_LIMIT; lv++) t=make(lv);
  return {text:t, ask_generated: !(rv.ask||"").trim() && !!ask, sections:{state:S1.full, action:A1.full, reflection:R1.full, note:note, ask:ask}};
}

function gateReviewFlow(){

  const from=S.act_id; setPlan(P.action_id); S.act_frequency=P.frequency; S.act_duration=P.duration;

function parseLetter(t){
  const map={"今の状態":"state","試したこと":"action","振り返り":"reflection","気づいたこと":"note","相談したいこと":"ask"}, out={state:"",action:"",reflection:"",note:"",ask:"",other:""};
  String(t).split(/\r?\n/).forEach(function(line){ const m=/^(今の状態|試したこと|振り返り|気づいたこと|相談したいこと)[：:]\s*(.*)$/.exec(line.trim());

  return out;
}

  const x=recOf(r); if(!x) return "";

    /* ① 場面。初回 Q2 と、すでに聞いている場面を使う（ゼロから聞き直さない） */
    const tp=msTopic();
    const opts=(MS_SCENES[tp]||MS_SCENES._).slice(), vals=opts.slice(), sub={};
    const cut=function(x){ return x.length>24 ? x.slice(0,24)+"…" : x; };
    if(S.iv_scene){ opts.unshift(cut(S.iv_scene)); vals.unshift(S.iv_scene); sub[0]="前に話してくれた場面"; }
    if(MINI.carry){ opts.unshift(cut(MINI.carry)); vals.unshift(MINI.carry.length>40?MINI.carry.slice(0,40)+"…":MINI.carry);
      Object.keys(sub).forEach(function(k){ sub[+k+1]=sub[k]; delete sub[k]; }); sub[0]="今話してくれたこと"; }
    MINI.sceneOpts=opts; MINI.sceneVals=vals; MINI.sceneSub=sub;
    msSay((MINI.carry ? "今話してくれたことも、場面のひとつとして選べます。<br>" : "")
      +(tp ? "前に、"+IV_TOPIC_P[tp]+"が気になっていると話してくれました。<br>" : "")
      +(S.iv_scene ? "最初に「"+esc(S.iv_scene)+"」という場面のことも教えてくれましたね。<br><br>" : "<br>")
      +"最近だと、どんな時に<br>特に気持ちが動きましたか？",function(){
      msTray('<div class="opts">'+opts.map(function(o,i){ return '<button class="opt" onclick="msScene('+i+')">'+esc(o)+(sub[i]?'<div style="font-size:11px;color:var(--muted);font-weight:400">'+sub[i]+'</div>':'')+'</button>'; }).join("")
        +'<button class="opt" onclick="msScene(-1)">どれとも少し違う</button></div>');
    });
    return;
  }
  if(st==="feel"){
    msSay("「"+esc(d.situation)+"」のとき、<br>近かったものはありますか？<br>いくつ選んでも大丈夫です。",function(){ msFeelForm(); });
    return;
  }
  if(st==="confirm"){ msShowHyp(); return; }
  if(st==="cope"){
    const prev=S.mini_sessions.filter(function(m){ return m.coping && m.id!==MINI.id; }).slice(-1)[0];
    msSay((prev ? "前に「"+esc(prev.coping)+"」で少し楽になると話してくれたこともありました。<br><br>" : "")
      +"そんな時、少しでも楽になるために<br>していることはありますか？",function(){ msCopeForm(); });
    return;
  }
  if(st==="edu"){ msEdu(); return; }
  if(st==="act"){ msActions(); return; }
  if(st==="done"){ msDone(); return; }
}

function msScene(i){
  if(i<0){
    msMe("どれとも少し違う");
    msSay("よかったら、一言で教えてください。",function(){
      msTray('<div class="card" style="margin:0"><input type="text" id="msSceneIn" maxlength="60" placeholder="例）休みの日の夕方">'
        +'<button class="btn" style="margin-top:10px" onclick="msSceneOther()">これにする</button>'
        +'<button class="btn ghost" style="margin-top:8px" onclick="msSceneOther(true)">うまく言えない</button></div>');
    });
    return;
  }
  const v = (MINI.sceneVals||MINI.sceneOpts)[i];
  msMe(MINI.sceneOpts[i]); MINI.d.situation=v; MINI.stage="feel"; msRun();
}
function msSceneOther(skip){
  const v=skip?"":(document.getElementById("msSceneIn").value||"").trim();
  msMe(v||"うまく言えない");
  if(msRisk(v)) return;
  MINI.d.situation = v || "最近、気持ちが動いた時"; MINI.stage="feel"; msRun();
}

/* ② 考え・気持ち/身体・そのあと を1画面で。「近いものがない」のときだけ自由入力 */
function msFeelForm(){
  MINI.sel=MINI.sel||{th:[],fe:[],be:[]};
  const grp=function(key,title,list){
    const sel=MINI.sel[key];
    return '<div class="msgrp"><h4>'+title+'</h4><div class="chips">'
      +list.map(function(o,i){ return '<button class="chip'+(sel.indexOf(i)>=0?' on':'')+'" onclick="msTog(\''+key+'\','+i+')">'+o.t+'</button>'; }).join("")
      +'<button class="chip'+(sel.indexOf(-1)>=0?' on':'')+'" onclick="msTog(\''+key+'\',-1)">近いものがない</button></div>'
      +(sel.indexOf(-1)>=0?'<input type="text" class="msOther" id="msO_'+key+'" maxlength="40" placeholder="よかったら一言で（空けてもOK）" value="'+esc(MINI.d.other[key]||"")+'" oninput="MINI.d.other[\''+key+'\']=this.value">':'')
      +'</div>';
  };
  msTray('<div class="card msform" style="margin:0">'
    +grp("th","頭に浮かんだこと",MS_THOUGHT)+grp("fe","気持ち・身体",MS_FEEL)+grp("be","そのあと",MS_BEH)
    +'<button class="btn" style="margin-top:12px" onclick="msFeelDone()">これで伝える</button></div>');
}
function msTog(key,i){
  const a=MINI.sel[key], k=a.indexOf(i);
  if(k>=0) a.splice(k,1); else a.push(i);
  const y=window.scrollY; msFeelForm(); window.scrollTo(0,y);
}
function msFeelDone(){
  const s=MINI.sel, d=MINI.d, o=d.other;
  for(const k of ["th","fe","be"]){ if(msRisk(o[k])) return; }
  d.thought=s.th.filter(function(i){ return i>=0 && MS_THOUGHT[i].k!=="none"; }).map(function(i){ return MS_THOUGHT[i].t; });
  if(s.th.indexOf(-1)>=0 && (o.th||"").trim()) d.thought.push(o.th.trim());
  d.emotion=s.fe.filter(function(i){ return i>=0 && MS_FEEL[i].k==="emo"; }).map(function(i){ return MS_FEEL[i].t; });
  d.body=s.fe.filter(function(i){ return i>=0 && MS_FEEL[i].k==="body"; }).map(function(i){ return MS_FEEL[i].t; });
  if(s.fe.indexOf(-1)>=0 && (o.fe||"").trim()) d.emotion.push(o.fe.trim());
  d.behavior=s.be.filter(function(i){ return i>=0; }).map(function(i){ return MS_BEH[i].v; });
  d.behKeys=s.be.filter(function(i){ return i>=0; }).map(function(i){ return MS_BEH[i].k; });
  d.thKeys=s.th.filter(function(i){ return i>=0; }).map(function(i){ return MS_THOUGHT[i].k; });
  if(s.be.indexOf(-1)>=0 && (o.be||"").trim()) d.behavior.push(o.be.trim());
  const said=[].concat(d.thought.map(function(t){ return "『"+t+"』"; }),d.emotion,d.body,d.behavior);
  msMe(said.length ? said.join("・") : "うまく選べなかった");
  const rule=msBuildHyp();
  if(!aiOn()){ MINI.hyp=rule; MINI.stage="confirm"; msSave("partial", true); msRun(); return; }
  /* Gemini で仮説をつくる。失敗・タイムアウト・検証NGならルールの仮説に戻す */
  const sid=MINI.id;
  document.getElementById("miniTray").innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
  msAiHyp(rule).then(function(h){
    if(!MINI || MINI.id!==sid) return;   // 途中でやめた・安全対応に移った
    MINI.hyp=h; MINI.stage="confirm"; msSave("partial", true); msRun();
  });
}

/* ── Gemini 連携（デモ） ─────────────────────────────────
   /api/gemini-proxy（招待コード必須・キーはサーバー側）。js/kokoni-mini-ai.js のプロンプトと検証を使う */
const AI_KEY="kokoni_demo_ai", DEMO_URL="https://mental-health-app-v2-51bc.vercel.app/demo-v2.html";
let AI_CFG=(function(){ try{ return JSON.parse(localStorage.getItem(AI_KEY)||"{}"); }catch(_){ return {}; } })();
if(new URLSearchParams(location.search).get("ai")==="1") AI_CFG.on=true;
function aiOn(){ return !!(AI_CFG.on && AI_CFG.code && window.KokoniMiniAI); }
function aiSaveCfg(){ try{ localStorage.setItem(AI_KEY, JSON.stringify(AI_CFG)); }catch(_){} }
function aiBtnSync(){ const b=document.getElementById("aiBtn"); if(!b) return;
  b.textContent = aiOn() ? "AI: ON" : "AI: OFF"; b.classList.toggle("on", aiOn()); }
function toggleAi(){
  if(!aiOn()){
    /* ファイルを直接開いているとAPI（/api/gemini-proxy）に届かない。公開URLへ案内する */
    if(location.protocol==="file:"){
      if(confirm("AIは公開URLで開いたときだけ動きます。\n（いまはファイルを直接開いているため、ルールで動いています）\n\n公開URLで開きますか？"))
        location.href=DEMO_URL+"?ai=1";
      return;
    }
    if(!AI_CFG.code){ const c=prompt("AIを使うには、β版の招待コードを入力してください。"); if(!c) return; AI_CFG.code=c.trim(); }
    AI_CFG.on=true;
  } else AI_CFG.on=false;
  aiSaveCfg(); aiBtnSync();
}
/* AIに渡すのは、アプリが実際に持っている情報だけ */
function msCtx(){
  const d=MINI.d, I=insights(), cur=curAct();
  return {
    nickname:S.nickname||"",
    intake:{state:S.current_status||"", topic:(S.current_concerns||[])[0]||"", want:S.direction_goal||""},
    today_mood:todayMood()||"",
    profile:pfForAI(),   // 提案の内容やペースを考える参考。これだけで性格・状態・方針を決めない。回答しないは渡さない
    current_action: cur ? {title:cur.title, plan:planLabel()} : null,
    past:{
      first_scene:S.iv_scene||"",
      confirmed_patterns:I.confirmed.filter(function(c){ return c.type==="pattern" && c.session_id!==MINI.id; }).slice(-3).map(function(c){ return c.text; }),
      action_logs:S.act_logs.slice(-5).map(function(l){ return {title:l.title, feeling:l.feeling}; }),
      past_coping:S.mini_sessions.filter(function(m){ return m.id!==MINI.id && m.coping; }).slice(-2).map(function(m){ return m.coping; })
    },
    session:{situation:d.situation, thought:d.thought, emotion:d.emotion, body:d.body, behavior:d.behavior}
  };
}
function msAiHyp(rule){
  const A=window.KokoniMiniAI, ctx=msCtx(), pr=A.buildPrompt(ctx), t0=Date.now();
  const ctl=window.AbortController ? new AbortController() : null;
  const timer=setTimeout(function(){ if(ctl) ctl.abort(); }, 15000);
  const fallback=function(reason){ rule.source="rule"; rule.ai_fallback=reason; if(DEBUG) console.warn("[mini-ai] fallback:",reason); return rule; };
  return fetch("/api/gemini-proxy",{method:"POST", signal:ctl?ctl.signal:undefined,
      headers:{"Content-Type":"application/json","X-Invite-Code":AI_CFG.code},
      body:JSON.stringify({model:A.model, systemPrompt:pr.systemPrompt, messages:[{role:"user",content:pr.user}],
        temperature:A.gen.temperature, maxTokens:A.gen.maxTokens, thinkingBudget:A.gen.thinkingBudget, responseMimeType:A.gen.responseMimeType})})
    .then(function(res){
      if(res.status===401||res.status===403){ AI_CFG.code=""; AI_CFG.on=false; aiSaveCfg(); aiBtnSync(); throw new Error("invite_code_rejected"); }
      if(!res.ok) throw new Error("http_"+res.status);
      return res.json();
    })
    .then(function(j){
      clearTimeout(timer);
      const v=A.validate(j.text||"", ctx);
      if(!v.ok) return fallback(v.reason);
      const o=v.out;
      /* つなぎ（過去情報）はAIが書かないことがある。そのときはルールのつなぎ（実在データから作る）を使う */
      const ruleLink = !o.link && rule.link;
      const ev = ruleLink ? o.evidence.concat(rule.evidence.filter(function(e){ return /^前に|^「.*」のあと「|^最初に/.test(e); })).slice(0,6) : o.evidence;
      return Object.assign({}, rule, {
        mech:o.mechanism, said:esc(o.said), link: ruleLink ? rule.link : esc(o.link),
        text:o.hypothesis.replace(/^もしかすると[、,]?s*/,""), flow:o.flow.join(" → "), ai_flow:o.flow,
        evidence:ev, ai_policy:o.policy,
        confidence:Math.round(Math.min(0.9,(o.confidence+rule.confidence)/2)*100)/100,
        repeated: rule.repeated && rule.mech===o.mechanism,
        source:"gemini", ai:{model:A.model, ms:Date.now()-t0, link_source: ruleLink ? "rule" : o.link_source}
      });
    })
    .catch(function(e){ clearTimeout(timer); return fallback(e && e.name==="AbortError" ? "timeout" : String(e && e.message || e)); });
}

/* ── 仮説をつくる（デモはルール。本番は LLM が同じ構造を返す） ──────────────
   返すもの：本人の具体的な言葉／つなぐ情報（実在するものだけ）／仮説／流れ／根拠／確度／方針 */
function msAfter(d){ return d.body.indexOf("疲れ")>=0 ? "疲れ" : (d.emotion[0] || d.body[0] || "しんどさ"); }
function msPickMech(d){
  const sc={push:0,ruminate:0,blame:0,avoid:0,stuck:0,fear:0,tense:0,general:0.5};
  (d.thKeys||[]).forEach(function(k){ if(k==="must") sc.push+=2; if(k==="blame") sc.blame+=2; if(k==="fear") sc.fear+=3; if(k==="stuck") sc.stuck+=3; });
  (d.behKeys||[]).forEach(function(k){ if(k==="push") sc.push+=2; if(k==="ruminate") sc.ruminate+=3; if(k==="avoid"||k==="freeze") sc.avoid+=3; });
  if(d.body.indexOf("身体に力が入る")>=0) sc.tense+=2;
  if(d.emotion.indexOf("焦り")>=0) sc.tense+=1;
  const prev=insights().confirmed.filter(function(c){ return c.type==="pattern" && c.mech; }).slice(-1)[0];
  if(prev) sc[prev.mech]=(sc[prev.mech]||0)+1;
  const best=Object.keys(sc).sort(function(a,b){ return sc[b]-sc[a]; })[0];
  return {key:best, score:sc[best], prev:prev||null};
}
function msBuildHyp(){
  const d=MINI.d, m=msPickMech(d), M=MS_MECH[m.key], a=msAfter(d), th=d.thought[0]||"";
  /* ① 本人の具体的な言葉 */
  let said="「"+esc(d.situation)+"」のとき、";
  if(th) said+="『"+esc(th)+"』と浮かんで、";
  if(d.behavior.length) said+=esc(d.behavior[0])+"ことが多いんですね。";
  else if(d.emotion.length||d.body.length) said+=esc([].concat(d.emotion,d.body).slice(0,2).join("や"))+"を感じやすいんですね。";
  else said+="気持ちが動きやすいんですね。";
  /* ② つなぐ情報（実際に持っているものだけ・最大1つ） */
  const ev=["「"+d.situation+"」の場面を選んでくれた"];
  if(th) ev.push("そのとき『"+th+"』と浮かんだ");
  if(d.emotion.length||d.body.length) ev.push([].concat(d.emotion,d.body).join("・")+"を感じた");
  if(d.behavior.length) ev.push("そのあと「"+d.behavior.join("・")+"」ことが多い");
  let link="";
  if(m.prev){ link="前に、『"+esc(m.prev.text)+"』という流れを一緒に確かめましたね。"; ev.push("前に『"+m.prev.text+"』という流れを確かめた"); }
  else {
    const al=S.act_logs.filter(function(l){ return l.action_id===S.act_id; }).slice(-1)[0];
    if(al){ link="今週の「"+esc(al.title)+"」は、やってみたあと「"+esc(al.feeling)+"」と記録していました。"; ev.push("「"+al.title+"」のあと「"+al.feeling+"」と記録した"); }
    else if(S.direction_goal && S.direction_goal!=="まだわからない"){ link="最初に「"+esc(S.direction_goal)+"」と話してくれていたこととも、つながりがありそうです。"; ev.push("最初に「"+S.direction_goal+"」と話してくれた"); }
  }
  /* ③ 仮説と流れ ④ 確度 */
  const conf=Math.min(0.9, 0.35+(th?0.1:0)+((d.emotion.length||d.body.length)?0.1:0)+(d.behavior.length?0.1:0)
    +Math.min(0.15,0.05*m.score)+(m.prev && m.prev.mech===m.key?0.15:0));
  const flow=[d.situation, th?"『"+th+"』":"", d.behavior[0]||"", "あとから"+a].filter(Boolean);
  return {id:MINI.id+"-H1", mech:m.key, said:said, link:link,
    text:M.hyp.replace("{s}",d.situation).replace("{a}",a), flow:flow.join(" → "), evidence:ev,
    confidence:Math.round(conf*100)/100, repeated: !!(m.prev && m.prev.mech===m.key),
    answer:null, user_text:"", user_confirmed:false, status:"working", at:nowIso()};
}
function msShowHyp(){
  const h=MINI.hyp;
  const high = h.repeated && h.confidence>=0.7;
  msSay(h.said+(h.link?"<br>"+h.link:"")+"<br><br>"
    +(high ? "ここまでのお話では、この流れが何度か見えてきています。<br>" : "もしかすると、")
    +esc(h.text)+"<br><br>"
    +(h.confidence<0.5 ? "少し確認してみてもいいですか？<br>" : "")+"この見方は近そうですか？",function(){
    document.getElementById("miniFlow").insertAdjacentHTML("beforeend",
      '<div style="margin:-4px 18px 6px;display:flex;gap:10px;align-items:center"><button class="whybtn" onclick="msWhy()">どうしてそう考えたの？</button>'
      +(AI_CFG.on ? '<span class="tag" style="margin:0">'+(h.source==="gemini" ? "AI（Gemini）" : "ルール"+(h.ai_fallback?"（"+esc(h.ai_fallback)+"）":""))+'</span>' : '')+'</div>');
    msTray('<div class="opts row">'+MS_CONFIRM.map(function(o,i){ return '<button class="opt" onclick="msConfirm('+i+')">'+o+'</button>'; }).join("")+'</div>');
  });
}
function msWhy(hyp){
  const h=hyp||MINI.hyp; if(!h) return;
  document.getElementById("modalRoot").innerHTML='<div class="modalbg" onclick="closeWhy()"><div class="modal" onclick="event.stopPropagation()">'
    +'<h3>こう考えた理由</h3><p style="margin-bottom:8px">あなたが話してくれたことを、つなげて考えました。</p>'
    +'<ul style="font-size:14px;line-height:1.85;padding-left:20px;margin:0 0 12px">'+h.evidence.map(function(e){ return '<li>'+esc(e)+'</li>'; }).join("")+'</ul>'
    +'<p style="font-size:12.5px;color:var(--muted)">これは診断ではなく、仮の見方です。違っていたら、いつでも直せます。</p>'
    +'<button class="btn" onclick="closeWhy()">閉じる</button></div></div>';
}
function msConfirm(i){
  const h=MINI.hyp, ans=MS_CONFIRM[i]; msMe(ans); h.answer=ans;
  if(ans==="少し違う"){
    MINI.stage="revise";
    msSay("どのあたりが少し違いそうですか？<br>一言でも大丈夫です。",function(){
      msTray('<div class="card" style="margin:0"><input type="text" id="msRevIn" maxlength="80" placeholder="例）頑張るより、気をつかいすぎている感じ">'
        +'<button class="btn" style="margin-top:10px" onclick="msRevise()">伝える</button>'
        +'<button class="btn ghost" style="margin-top:8px" onclick="msRevise(true)">うまく言えない</button></div>');
    });
    return;
  }
  if(ans==="かなり近い"||ans==="少し近い"){
    h.user_confirmed=true; h.status="confirmed"; h.confidence=Math.min(0.95,h.confidence+(ans==="かなり近い"?0.15:0.05));
    MINI.stage="cope"; msSave("partial",true);
    msSay(ans==="かなり近い" ? "ありがとうございます。<br>この見方を、心の地図に残しておきますね。" : "ありがとうございます。<br>近いところを残しておいて、また一緒に確かめていきましょう。",msRun);
    return;
  }
  /* よくわからない：仮のまま置く（地図では「確かめ中」として分ける） */
  MINI.stage="cope"; msSave("partial",true);
  msSay("無理に決めなくて大丈夫です。<br>仮の見方として置いておいて、また確かめていきましょう。",msRun);
}
/* 否定された仮説はそのまま地図に入れない。本人の言葉を残し、AIの見方は取り下げる */
function msRevise(skip){
  const h=MINI.hyp, v=skip?"":(document.getElementById("msRevIn").value||"").trim();
  msMe(v||"うまく言えない");
  if(msRisk(v)) return;
  h.status="rejected"; h.user_confirmed=false; h.confidence=Math.max(0.2,h.confidence-0.3);
  if(v){
    h.user_text=v;
    h.revised={text:v, flow:MINI.d.situation+" → "+v, evidence:["「"+MINI.d.situation+"」の場面を選んでくれた","「"+v+"」と自分の言葉で教えてくれた"]};
    msSay("教えてくれてありがとうございます。<br>「"+esc(v)+"」というところが大事そうですね。<br><br>"
      +"さっきの見方ではなく、いまの言葉のほうを心の地図に残しておきます。",function(){ MINI.stage="cope"; msSave("partial",true); msRun(); });
  } else {
    msSay("大丈夫です。さっきの見方は、いったん取り下げておきますね。",function(){ MINI.stage="cope"; msSave("partial",true); msRun(); });
  }
}

/* ③ これまでの工夫。選択式＋「それをすると、どうなりますか？」を同じ画面で */
function msCopeForm(){
  MINI.csel=MINI.csel||[];
  const sel=MINI.csel, none=sel.indexOf(MS_COPE.indexOf("特にない"))>=0, other=sel.indexOf(MS_COPE.indexOf("その他"))>=0;
  msTray('<div class="card msform" style="margin:0"><div class="msgrp"><h4>していること</h4><div class="chips">'
    +MS_COPE.map(function(o,i){ return '<button class="chip'+(sel.indexOf(i)>=0?' on':'')+'" onclick="msCTog('+i+')">'+o+'</button>'; }).join("")+'</div>'
    +(other?'<input type="text" class="msOther" id="msCopeIn" maxlength="40" placeholder="よかったら一言で" value="'+esc(MINI.d.other.cope||"")+'" oninput="MINI.d.other.cope=this.value">':'')+'</div>'
    +(sel.length && !none ? '<div class="msgrp"><h4>それをすると、どうなりますか？</h4><div class="chips">'
      +MS_EFFECT.map(function(o,i){ return '<button class="chip'+(MINI.d.effect===o?' on':'')+'" onclick="MINI.d.effect=\''+o+'\';msCopeForm()">'+o+'</button>'; }).join("")+'</div></div>' : '')
    +'<button class="btn" style="margin-top:12px" '+(sel.length?'':'disabled')+' onclick="msCopeDone()">これで伝える</button>'
    +'<button class="linkbtn" onclick="MINI.csel=[];msCopeDone(true)">とばす</button></div>');
}
function msCTog(i){
  const a=MINI.csel, k=a.indexOf(i), noneI=MS_COPE.indexOf("特にない");
  if(k>=0) a.splice(k,1); else { if(i===noneI) a.length=0; else { const n=a.indexOf(noneI); if(n>=0) a.splice(n,1); } a.push(i); }
  msCopeForm();
}
function msCopeDone(skip){
  const d=MINI.d, sel=MINI.csel||[];
  if(msRisk(d.other.cope)) return;
  d.coping=sel.map(function(i){ return MS_COPE[i]; }).filter(function(t){ return t!=="その他" && t!=="特にない"; });
  if(sel.indexOf(MS_COPE.indexOf("その他"))>=0 && (d.other.cope||"").trim()) d.coping.push(d.other.cope.trim());
  d.coping_none = sel.indexOf(MS_COPE.indexOf("特にない"))>=0;
  if(!d.coping.length) d.effect="";
  msMe(skip ? "とばす" : (d.coping.length ? d.coping.join("・")+(d.effect?"／"+d.effect:"") : "特にない"));
  /* 工夫を仮説につなげて返す */
  const h=MINI.hyp, c=d.coping[0], base=h.status==="rejected" ? (h.revised?h.revised.flow:"") : h.flow;
  let m;
  if(skip) m="大丈夫です。";
  else if(!c) m="まだ「これ」という工夫がないのは、めずらしいことではありません。<br>ここから一緒に見つけていきましょう。";
  else if(d.effect==="少し楽になる"){
    m="「"+esc(c)+"」で、少し戻れるんですね。";
    if(base){ m+="<br><br>『"+esc(base)+" → "+esc(c)+"で少し戻る』<br>という流れがあるのかもしれません。"; h.evidence.push("「"+c+"」をすると少し楽になる"); }
  } else if(d.effect==="一時的には楽になる"){
    m="「"+esc(c)+"」は、その場では助けになっているんですね。<br>ただ、時間がたつと、また同じ流れが起きやすいのかもしれません。";
    h.evidence.push("「"+c+"」をすると一時的には楽になる");
  } else if(d.effect==="あまり変わらない"||d.effect==="むしろしんどくなる"){
    m="「"+esc(c)+"」は、今はあまり助けになっていないのかもしれません。<br>別のやり方を、一緒に探してみる価値がありそうです。";
    h.evidence.push("「"+c+"」をしても"+d.effect);
  } else m="教えてくれてありがとうございます。";
  MINI.stage="edu"; msSave("partial",true);
  msSay(m,msRun);
}

/* 短い心理教育（3〜5行）と、今週の方針。専門用語は出さない */
function msEdu(){
  const h=MINI.hyp, M=MS_MECH[h.mech], d=MINI.d;
  const flow = h.status==="rejected" ? (h.revised?h.revised.flow:"") : h.flow;
  MINI.policy = h.status==="rejected" ? (h.revised ? M.policy.replace("{s}",d.situation) : MS_MECH.general.policy)
              : (h.ai_policy || M.policy.replace("{s}",d.situation));
  msSay("ひとつ、知っておいてほしいことがあります。<br><br>"
    +"しんどさが続く時は、出来事そのものだけではなく、<br>そのときの「考え」や「行動」がくり返されることで、<br>つらさが続くことがあります。"
    +(flow ? "<br><br>今のお話では、<br>『"+esc(flow)+"』<br>という流れを、少し見直してみるのがよさそうです。" : ""),function(){
    msSay("なので今週は、<br><b>"+esc(MINI.policy)+"</b><br>ことから、試してみるのがよさそうです。",function(){
      MINI.stage="act"; msSave("partial",true);
      msTray('<button class="btn" onclick="msRun()">'+(WORK_PSY_ONLY?'心の地図に残す':'試してみることを見る')+'</button>');
    });
  });
}

/* ④ 方針 → Action Master から最大2つ。今の一歩とは本人が比べて選ぶ（勝手に置き換えない） */
function msPickActions(){
  const cats=(MS_MECH[MINI.hyp.mech]||MS_MECH.general).cat, scored=scoreActions(), out=[];
  cats.forEach(function(c){
    const r=scored.filter(function(r){ return r.a.category_id===c && r.id!==S.act_id && out.indexOf(r.id)<0; })[0];
    if(r) out.push(r.id);
  });
  return out.slice(0,2);
}
function msActions(){
  if(WORK_PSY_ONLY){ MINI.proposals=[]; MINI.kept=S.act_id; MINI.stage="done"; return msRun(); }   // 別の一歩は提案しない
  const h=MINI.hyp, d=MINI.d;
  MINI.proposals=msPickActions();
  const seen = h.status==="rejected" ? (h.revised ? "「"+esc(d.situation)+"」のとき、"+esc(h.revised.text) : "「"+esc(d.situation)+"」のとき、気持ちが動きやすい")
             : "「"+esc(d.situation)+"」のとき、"+(d.thought[0]?"『"+esc(d.thought[0])+"』と":"")+(d.behavior[0]?esc(d.behavior[0])+"ことがあり、":"")+"あとから"+esc(msAfter(d))+"が出やすい";
  const cur=curAct();
  document.getElementById("miniFlow").insertAdjacentHTML("beforeend",'<div class="mscard">'
    +'<div class="mslab">今のお話から見えてきたこと</div><div class="msv">'+seen+'</div>'
    +'<div class="msarrow">↓</div>'
    +'<div class="mslab">今週変えてみたいこと</div><div class="msv">'+esc(MINI.policy)+'</div>'
    +'<div class="msarrow">↓</div>'
    +'<div class="mslab">すぷらんからの提案</div>'
    +MINI.proposals.map(function(id,i){ const a=act(id);
      return '<button class="opt" style="text-align:left;margin-top:8px" onclick="msChoose('+i+')">'
        +'<div style="font-size:11px;color:var(--teal-deep);font-weight:800">'+a.category_name+'</div>'
        +'<div style="font-size:15px;font-weight:800;line-height:1.6">'+a.title+'</div>'
        +'<div style="font-size:12px;color:var(--ink2);font-weight:400;line-height:1.7">'+a.short_description+'</div>'
        +'<div style="font-size:11.5px;color:var(--muted);font-weight:400;margin-top:4px">'+defaultPlanLabel(a)+'</div></button>'; }).join("")
    +'<button class="whybtn" style="margin-top:10px" onclick="msWhy()">どうしてそう考えたの？</button></div>');
  msTray(cur ? '<button class="btn ghost" onclick="msKeep()">今の一歩「'+cur.title+'」を続ける</button>' : '');
  window.scrollTo(0,document.body.scrollHeight);
}
function msChoose(i){
  const id=MINI.proposals[i], a=act(id), cur=curAct();
  msMe(a.title);
  if(!cur){ MINI.chosen=id; changeActionSilently(id); MINI.stage="done"; return msRun(); }
  MINI.stage="compare"; msSteps();
  msSay("今の一歩は「"+esc(cur.title)+"」です。<br>今回のお話から、「"+esc(a.title)+"」も合いそうです。<br><br>どちらにしますか？",function(){
    msTray('<div class="opts"><button class="opt" onclick="msKeep()">今の一歩を続ける</button>'
      +(canChangeAction() ? '<button class="opt" onclick="msSwitch(\''+id+'\')">新しい一歩に変える</button>'
                          : '<button class="opt" onclick="msCandidate(\''+id+'\')">次のふりかえりの候補に残す</button>')+'</div>'
      +(canChangeAction()?'':'<p class="lede" style="margin-top:8px">今は、この一歩を試している期間です。変えるかどうかは、次のふりかえりで一緒に考えましょう。</p>'));
  });
}
function changeActionSilently(id){
  if(!canChangeAction()) return false;   // サイクルの途中では変えない
  setPlan(id); S.first_action=act(id).title; S.action_adjusted_flag=false;
  if(S.cycle) S.cycle.action_id=id;
}
function msKeep(){ msMe("今の一歩を続ける"); MINI.kept=S.act_id; MINI.chosen=null; MINI.stage="done"; msRun(); }
function msCandidate(id){ msMe("次のふりかえりの候補に残す"); saveCandidate("change",id,"explore"); MINI.candidate=id; MINI.kept=S.act_id; MINI.stage="done"; msRun(); }
function msSwitch(id){ msMe("新しい一歩に変える"); MINI.chosen=id; changeActionSilently(id); MINI.stage="done"; msRun(); }

/* ── 保存 ─────────────────────────────────────────
   同じセッションは id で上書き（途中保存→再開→完了でも1件）。
   confirmed：本人が選んだ事実・本人が確かめた見方・本人の言葉／working：確かめ中のAIの見方 */
function msSave(status,keepDraft){
  if(!MINI || !MINI.d) return;
  const d=MINI.d, h=MINI.hyp;
  if(!d.situation && !d.thought.length) return;   // まだ何も聞いていない
  const pos = d.effect==="少し楽になる"||d.effect==="一時的には楽になる";
  const rec={
    session_id:MINI.id, id:MINI.id, at:MINI.started_at, source:MINI.from, status:status,
    scene:d.situation, thought:d.thought.join("・"), feeling:[].concat(d.emotion,d.body).join("・"), behavior:d.behavior.join("・"),
    coping: pos ? d.coping.join("・") : "", coping_all:d.coping, coping_effect:d.effect,
    case:{ situation:d.situation, thought:d.thought, emotion:d.emotion, body:d.body, behavior:d.behavior,
      consequence: (d.emotion.length||d.body.length) ? "あとから"+msAfter(d)+"が出やすい" : "",
      coping:d.coping, coping_effect:d.effect, goal:S.direction_goal||"", support: pos ? d.coping : [],
      pattern_hypothesis: h ? (h.status==="rejected" ? (h.revised?h.revised.flow:"") : h.flow) : "",
      confidence: h ? h.confidence : 0, evidence: h ? h.evidence : [], user_confirmed: h ? h.user_confirmed : false },
    hypothesis: h ? {text:h.text, flow:h.flow, mech:h.mech, evidence:h.evidence, confidence:h.confidence, answer:h.answer, status:h.status, user_text:h.user_text,
      source:h.source||"rule", ai:h.ai||null, ai_fallback:h.ai_fallback||null} : null,
    policy:MINI.policy||"", proposed_actions:MINI.proposals||[], chosen_action:MINI.chosen||null, kept_action:MINI.kept||null
  };
  rec.summary=[["場面",rec.scene],["浮かんだこと",rec.thought],["気持ち・身体",rec.feeling],["そのあと",rec.behavior],
    ["工夫",d.coping.join("・")+(d.effect?"（"+d.effect+"）":"")],["見えてきた流れ",rec.case.pattern_hypothesis]]
    .filter(function(r){ return r[1]; }).map(function(r){ return r[0]+"："+esc(r[1]); }).join("<br>");
  S.mini_sessions=S.mini_sessions.filter(function(m){ return m.id!==MINI.id; }).concat([rec]);
  S.case=rec.case;
  /* 事実と仮説を分けて保存（このセッション分は上書き） */
  const I=insights(), sid=MINI.id;
  I.confirmed=I.confirmed.filter(function(c){ return c.session_id!==sid; });
  I.working=I.working.filter(function(c){ return c.session_id!==sid; });
  if(d.situation && (d.emotion.length||d.body.length))
    I.confirmed.push({session_id:sid, type:"fact", text:"「"+d.situation+"」のあと、"+[].concat(d.emotion,d.body).join("・")+"が出やすい", at:nowIso()});
  if(h){
    if(h.status==="confirmed") I.confirmed.push({session_id:sid, type:"pattern", mech:h.mech, text:h.flow, hyp:h.text, evidence:h.evidence, confidence:h.confidence, at:nowIso()});
    else if(h.status==="rejected" && h.revised) I.confirmed.push({session_id:sid, type:"pattern", mech:null, text:h.revised.flow, evidence:h.revised.evidence, confidence:0.6, own:true, at:nowIso()});
    else if(h.status==="working") I.working.push({session_id:sid, type:"pattern", mech:h.mech, text:h.flow, hyp:h.text, evidence:h.evidence, confidence:h.confidence, at:nowIso()});
  }
  if(status==="partial" && keepDraft) S.mini_draft=MINI;
  if(status==="completed") S.mini_draft=null;
}
/* ══════════════════════════════════════════════════════════════
   はなす ── AIと一緒に、自分への理解を深める場所（自由チャットではない）
   入口は3つ。中身は共通のミニセッションエンジン（openMini）で、mode だけを切り替える
     explore       最近のことを整理する（場面→そのときのこと→仮説→確認→心の地図→一歩）
     action_review 今週の一歩を見直す（今のActionの記録から。変更は本人が選んだときだけ）
     open_talk     今の気持ちを少し話す（仮説や提案まで進めなくてよい。話すだけで終われる）
   どの入口でも：安全対応は共通（msRisk）／記録は S.mini_sessions に mode つきで残る／途中でやめられる
   ══════════════════════════════════════════════════════════════ */
function renderTalk(){

  document.getElementById("talkBody").innerHTML=
    '<div class="talkhead"><div class="spk"><img class="sp-m" src="assets/suplan/opt/base.png" alt="すぷらん" width="72" height="72">'

    +talkCard("📗","最近のことを整理する","最近あったことや気持ちを振り返って、自分のパターンを少し見つけていきます。","5分くらい","一緒に整理する","explore",
      draft?"前回の続きから始められます":"")
    /* 「今週の一歩を見直す」は出さない（2026-10-03：ワークの変更は心理士の提案だけ） */
    +talkCard("💬","今の気持ちを少し話す","何から話したらいいかわからなくても大丈夫。今の気持ちから、ゆっくり始めましょう。","決めなくてOK","少し話してみる","open_talk","");
}
function talkCard(ic,t,d,time,cta,mode,note){
  const lockMap = mode==="explore" && !mapUnlocked();
  if(lockMap) return '<div class="tcard locked"><div class="top"><span class="ic">🔒</span><div style="min-width:0"><h3>'+t+'</h3>'
    +'<div class="time">最初のふりかえりのあとに使えるようになります</div></div></div><p>'+d+'</p>'
    +'<button class="btn" disabled>'+cta+'</button></div>';
  if(mode==="action_review" && actionLocked()) note=(note?note+'<br>':'')+'<span style="color:var(--muted);font-weight:400">一歩を変えるのは、次のふりかえりのときです</span>';
  return '<div class="tcard"><div class="top"><span class="ic">'+ic+'</span><div style="min-width:0"><h3>'+t+'</h3>'
    +'<div class="time">⏱ '+time+'</div></div></div><p>'+d+'</p>'
    +(note?'<div class="note">'+note+'</div>':'')
    +'<button class="btn'+(mode==="open_talk"?' ghost':'')+'" onclick="openMini(\'talk\',\''+mode+'\')">'+cta+'</button></div>';
}

/* ── action_review：今週の一歩を見直す ───────────────────────────
   AIに渡すもの＝今のAction・頻度/時間・実施回数・実施後の記録・今日の状態・心の地図（MINI.ar に保持）
   出口＝続ける／頻度を減らす／1回の時間を短くする／別のActionを試す（Action Master から）。本人の同意なく上書きしない */
const AR_Q=["自分に合っていそう","少し負担が大きい","別の方法がよさそう","まだよくわからない"];
const AR_BURDEN=["回数が多い","1回の時間が長い","やり方が難しい","気持ちの余裕がない"];
function arContext(){
  const a=curAct(), from=S.cycle?Date.parse(S.cycle.cycle_started_at):0;
  const logs=S.act_logs.filter(function(l){ return l.action_id===S.act_id && Date.parse(l.at)>=from; });
  return {action_id:S.act_id, title:a?a.title:"", plan:a?planLabel():"", count:logs.length, profile:pfForAI(),
    feelings:logs.map(function(l){ return l.feeling; }).filter(Boolean), today:todayMood(), map_seen:mapCount(), period: isFirst()?"この3日":"今週"};
}
function arStart(){
  const a=curAct();
  if(!a){ msSay("今週の一歩は、まだ決まっていないようです。",function(){ msTray(arBackBtns()); }); return; }
  const c=MINI.ar=arContext();
  let m="今週は「"+esc(c.title)+"」を試していますね。<br><span style=\"font-size:12.5px;color:var(--muted)\">目安："+esc(c.plan)+"</span><br><br>";
  m += c.count ? "記録では、"+c.period+"で"+c.count+"回やってみています。"+(c.feelings.length?"<br>やってみたあとの記録：「"+esc(countText(c.feelings))+"」":"")
               : "記録では、まだやってみた回はないようです。<br>それでも大丈夫です。";
  if(c.today) m+="<br>今日は「"+esc(c.today)+"」と記録しています。";
  msSay(m,function(){ msSay("実際にやってみて、どんな感じですか？",function(){
    msTray('<div class="opts">'+AR_Q.map(function(o,i){ return '<button class="opt" onclick="arAns('+i+')">'+o+'</button>'; }).join("")+'</div>'); }); });
}
function arAns(i){
  MINI.ar.answer=AR_Q[i]; msMe(AR_Q[i]);
  if(i===0) return msSay("続けやすそうなんですね。"+(MINI.ar.count?"<br>記録を見ても、試してこられています。":"")+"<br>このまま続けてみましょうか。",function(){ arExit("keep"); });
  if(i===1) return msSay("どのあたりが負担になっていそうですか？",function(){
    msTray('<div class="opts">'+AR_BURDEN.map(function(o,j){ return '<button class="opt" onclick="arBurden('+j+')">'+o+'</button>'; }).join("")+'</div>'); });
  if(i===2) return msSay(actionLocked() ? "別のやり方が合いそうなんですね。" : "別のやり方も見てみましょう。<br>今の心の地図から、試しやすそうなものを選びます。",function(){ arExit("change"); });
  msSay("まだ判断しなくて大丈夫です。<br>数回やってみてから、ふりかえりで一緒に見てみましょう。",function(){ arExit("keep"); });
}
function arBurden(j){
  MINI.ar.burden=AR_BURDEN[j]; msMe(AR_BURDEN[j]);
  const o=adjustOptions();
  const rec = j===0 ? (o.freq?"freq":"change") : j===1 ? (o.dur?"dur":"change") : j===2 ? "change" : (o.freq?"freq":(o.dur?"dur":"change"));
  const m = j===3 ? "気持ちの余裕がない時は、小さくしても、休んでも大丈夫です。"
          : "「"+AR_BURDEN[j]+"」と感じているんですね。";
  msSay(m+"<br>どうするか、選んでみてください。",function(){ arExit(rec); });
}
/* 出口：4つの選び方。おすすめは目印だけ（決めるのは本人） */
function arExit(rec){
  if(canChangeAction()){
    MINI.ar.rec=rec;
    return msSay("ふりかえりが終わっているので、次の一歩は「ふりかえり」で決められます。",function(){
      msTray('<button class="btn" onclick="go(\'gate\')">次の一歩を決めに行く</button><button class="btn ghost" style="margin-top:9px" onclick="arApply(\'keep\')">今の一歩のまま続ける</button>'); });
  }
  if(actionLocked()) return arExitLocked(rec);
  const o=adjustOptions(), a=curAct(), tag=function(k){ return rec===k?' <span class="tag">今の話に近いもの</span>':''; };
  MINI.ar.rec=rec;
  let h='<div class="opts">'
    +'<button class="opt" style="text-align:left" onclick="arApply(\'keep\')">今の一歩を続ける'+tag("keep")+'</button>';
  if(o.freq) h+='<button class="opt" style="text-align:left" onclick="arApply(\'freq\')">頻度を減らす<div class="sub2">'+esc(planText(S.act_frequency,S.act_duration,a))+' → '+esc(planText(o.freq.f,o.freq.d,a))+'</div>'+tag("freq")+'</button>';
  if(o.dur)  h+='<button class="opt" style="text-align:left" onclick="arApply(\'dur\')">1回の時間を短くする<div class="sub2">1回'+S.act_duration+'分 → '+o.dur.d+'分</div>'+tag("dur")+'</button>';
  h+='<button class="opt" style="text-align:left" onclick="arApply(\'change\')">別の一歩を試す'+tag("change")+'</button></div>';
  msTray(h);
}
/* サイクルの途中：見直したいことは次のふりかえりの候補に残す。いまの一歩は変えない */
function arExitLocked(rec){
  MINI.ar.rec=rec;
  const lab={freq:"頻度を減らす",dur:"1回の時間を短くする",change:"別の一歩を試す",keep:"やり方を見直す"}[rec]||"やり方を見直す";
  msSay("今は、この一歩を試している期間です。<br>次のふりかえりで、続けるか、別の方法にするかを一緒に考えましょう。",function(){
    msTray('<div class="opts">'
      +'<button class="opt" style="text-align:left" onclick="arApply(\'keep\')">今の一歩を続ける</button>'
      +'<button class="opt" style="text-align:left" onclick="arCandidate(\''+(rec==="keep"?"change":rec)+'\')">次のふりかえりで「'+lab+'」を考える<div class="sub2">候補として残します</div></button>'
      +'<button class="opt" style="text-align:left" onclick="openPause()">少しお休みする</button></div>');
  });
}
function arCandidate(kind){
  const before={action_id:S.act_id, title:(curAct()||{}).title, frequency:S.act_frequency, duration:S.act_duration};
  msMe("次のふりかえりで考える"); saveCandidate(kind, kind==="change"?null:S.act_id, "action_review"); arDone("candidate",before);
}
function arApply(k){
  if(k!=="keep" && !canChangeAction()) return arExitLocked(k);
  const o=adjustOptions(), before={action_id:S.act_id, title:(curAct()||{}).title, frequency:S.act_frequency, duration:S.act_duration};
  if(k==="keep"){ msMe("今の一歩を続ける"); return arDone("keep",before); }
  if(k==="freq" && o.freq){ msMe("頻度を減らす"); S.act_frequency=o.freq.f; adjDone("frequency"); return arDone("freq",before); }
  if(k==="dur" && o.dur){ msMe("1回の時間を短くする"); S.act_duration=o.dur.d; adjDone("duration"); return arDone("dur",before); }
  msMe("別の一歩を試す");
  const cur=act(S.act_id), ids=[];

/* ── open_talk：今の気持ちを少し話す ───────────────────────────
   最初からCBTの質問を続けない。受け止めて、過去情報と重なれば少しだけつなぐ。仮説や提案まで進めなくてよい */
const OT_Q=["少し聞いてほしいことがある","なんとなくモヤモヤしている","今日あったことを話したい","うまく言葉にならない"];
const OT_ASK=["聞かせてください。<br>話せるところからで大丈夫です。","モヤモヤしているんですね。<br>いま、どんなことが頭に浮かんでいますか？",
  "今日は、どんなことがありましたか？","大丈夫です。言葉にならないままでも、ここにいて大丈夫です。<br>よかったら、浮かんだ言葉をひとつだけでも。"];
const OT_MAX_TURNS=3;
function otStart(){
  MINI.ot={topic:"", turns:[]};
  msSay("今日は、どんなことを話したい気分ですか？<br><span style=\"font-size:12.5px;color:var(--muted)\">選んでも、そのまま書いても大丈夫です。</span>",function(){
    msTray('<div class="opts">'+OT_Q.map(function(o,i){ return '<button class="opt" onclick="otPick('+i+')">'+o+'</button>'; }).join("")+'</div>'
      +otInput("そのまま書いてもOK"));

function otInput(ph){
  return '<div class="card" style="margin:10px 0 0"><textarea id="otIn" rows="3" maxlength="400" placeholder="'+ph+'"></textarea>'
    +'<button class="btn" style="margin-top:10px" onclick="otSend()">送る</button></div>';
}
function otPick(i){
  MINI.ot.topic=OT_Q[i]; msMe(OT_Q[i]);
  msSay(OT_ASK[i],function(){ msTray(otInput("うまく書けなくて大丈夫です。")+'<button class="linkbtn" onclick="otSkip()">書かずに進む</button>'); });
}
function otSkip(){
  msMe("書かずに進む");

}
function otSend(){
  const el=document.getElementById("otIn"), v=el?el.value.trim():"";
  if(!v) return;
  msMe(v);
  if(msRisk(v)) return;          // 安全対応を優先（どのモードでも）
  MINI.ot.turns.push({role:"user", text:v, at:nowIso()});
  otReply(v);
}
/* 返答：まず受け止める。過去の情報（実在するもの）と言葉が重なれば、無理のない範囲で一言つなぐ */
const OT_WORDS=["仕事","会議","上司","同僚","職場","夜","眠","朝","家族","友達","人","疲れ","不安","焦","落ち込","体","休み","お金","将来"];
function otPastLink(v){
  const past=[].concat(insights().confirmed.filter(function(c){ return c.type==="pattern"; }).map(function(c){ return c.text; }),
    S.iv_scene?[S.iv_scene]:[], dsAll().filter(function(r){ return r.optional_note; }).slice(-5).map(function(r){ return r.optional_note; }));
  for(const w of OT_WORDS){ if(v.indexOf(w)>=0){ const hit=past.filter(function(p){ return p.indexOf(w)>=0; })[0]; if(hit) return hit; } }
  return "";
}
function otRuleReply(v){
  const q=v.length>40?v.slice(0,40)+"…":v, link=otPastLink(v);
  return "話してくれてありがとうございます。<br>「"+esc(q)+"」<br>そう感じていたんですね。"
    +(link?"<br><br>前に残してくれた「"+esc(link.length>30?link.slice(0,30)+"…":link)+"」とも、少しつながっているのかもしれません。":"");
}
function otReply(v){
  const done=function(html,src){
    MINI.ot.turns.push({role:"kokoni", text:html, at:nowIso(), source:src});
    msSay(html,function(){
      const more = MINI.ot.turns.filter(function(t){ return t.role==="user"; }).length < OT_MAX_TURNS;
      msTray((more?otInput("続けて話してもOK"):'')+'<button class="'+(more?'linkbtn':'btn')+'" onclick="otEndAsk()">今日はここまでにする／整理する</button>');
    });
  };
  if(!aiOn() || !window.KokoniMiniAI || !KokoniMiniAI.buildTalkPrompt) return done(otRuleReply(v),"rule");
  document.getElementById("miniTray").innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
  const sid=MINI.id;
  aiTalk(v).then(function(r){ if(!MINI || MINI.id!==sid) return; done(r?esc(r.reply).replace(/\n/g,"<br>"):otRuleReply(v), r?"gemini":"rule"); });
}
function aiTalk(v){
  const A=window.KokoniMiniAI, ctx={nickname:S.nickname||"", topic:MINI.ot.topic, profile:pfForAI(),
    turns:MINI.ot.turns.map(function(t){ return {role:t.role, text:t.role==="user"?t.text:t.text.replace(/<[^>]+>/g," ")}; }),
    past:{confirmed_patterns:insights().confirmed.filter(function(c){ return c.type==="pattern"; }).slice(-3).map(function(c){ return c.text; }),
      first_scene:S.iv_scene||"", recent_notes:dsAll().filter(function(r){ return r.optional_note; }).slice(-3).map(function(r){ return r.optional_note; })}};
  const pr=A.buildTalkPrompt(ctx), ctl=window.AbortController?new AbortController():null, timer=setTimeout(function(){ if(ctl) ctl.abort(); },15000);
  return fetch("/api/gemini-proxy",{method:"POST",signal:ctl?ctl.signal:undefined,headers:{"Content-Type":"application/json","X-Invite-Code":AI_CFG.code},
      body:JSON.stringify({model:A.model, systemPrompt:pr.systemPrompt, messages:[{role:"user",content:pr.user}], temperature:0.5, maxTokens:600, thinkingBudget:0, responseMimeType:"application/json"})})
    .then(function(res){ if(!res.ok) throw new Error("http_"+res.status); return res.json(); })
    .then(function(j){ clearTimeout(timer); const v2=A.validateTalk(j.text||"",ctx); if(!v2.ok){ if(DEBUG) console.warn("[talk-ai]",v2.reason); return null; }
      MINI.ot.ai_summary=v2.out.summary; return v2.out; })
    .catch(function(){ clearTimeout(timer); return null; });

/* 一区切り：今日はここまで／今の話を少し整理する（→ explore）／心の地図に残す（本人が確認してから） */

/* 今日はここまで：聞いた分は保存し、次回は続きから。確かめていない見方は confirmed にしない */
function msStop(){
  if(MINI && MINI.stage!=="done"){
    if(MINI.mode==="open_talk") otSave("partial");                         // 話した分は残す
    else if(MINI.mode==="action_review"){}                                  // 選ぶまで何も変えない
    else if(MINI.d){ msSave("partial"); S.mini_draft=MINI; }
  }
  miniBack();
}

/* 終了：心の地図が更新されたことを見せる */
function msDone(){
  msSave("completed");
  const after=mapCount(), grew=after-MINI.before, d=MINI.d, h=MINI.hyp, items=[];
  /* items は [見出し, 表示用HTML]。本人の言葉は必ず esc してから入れる */
  if(d.situation) items.push(["心が動きやすい場面",esc(d.situation)]);
  if(d.thought.length) items.push(["浮かびやすい考え","『"+d.thought.map(esc).join("』『")+"』"]);
  if(d.emotion.length||d.body.length) items.push(["気持ち・身体の反応",esc([].concat(d.emotion,d.body).join("・"))]);
  if(d.behavior.length) items.push(["取りやすい行動",esc(d.behavior.join("・"))]);
  if(h.status==="confirmed") items.push(["繰り返しやすい流れ",h.flow.split(" → ").map(esc).join("<br>↓<br>")]);
  else if(h.status==="rejected" && h.revised) items.push(["繰り返しやすい流れ",h.revised.flow.split(" → ").map(esc).join("<br>↓<br>")]);
  if(d.coping.length && d.effect && d.effect!=="よくわからない") items.push([d.effect.indexOf("楽")>=0?"自分を支えてくれるもの":"試して分かったこと",esc("「"+d.coping.join("・")+"」→ "+d.effect)]);
  const working = h.status==="working";
  msSay("話してくれてありがとうございました。",function(){
    document.getElementById("miniFlow").insertAdjacentHTML("beforeend",'<div class="mscard done">'
      +'<div style="display:flex;align-items:center;gap:12px">'+mapArt(64)+'<div><div class="mslab">心の地図</div>'
      +'<div style="font-size:17px;font-weight:800;line-height:1.5;color:var(--ink)">'+(grew>0?'心の地図に、<br>'+grew+'つ新しく見えてきました':'心の地図が、<br>少し深まりました')+'</div></div></div>'
      +'<ol class="msnew">'+items.map(function(it){ return '<li><div class="k">'+it[0]+'</div><div class="v">'+it[1]+'</div></li>'; }).join("")+'</ol>'
      +(working?'<div class="lede" style="margin-top:6px">「'+esc(h.text)+'」という見方は、まだ確かめ中として地図に置いておきます。</div>':'')
      +(MINI.chosen?'<div class="lede" style="margin-top:8px">今週の一歩を「'+esc(act(MINI.chosen).title)+'」に変えました。</div>'
        :(MINI.candidate?'<div class="lede" style="margin-top:8px">「'+esc(act(MINI.candidate).title)+'」は、次のふりかえりの候補として残しました。今の一歩はそのまま続けます。</div>'
        :(MINI.kept?'<div class="lede" style="margin-top:8px">今週の一歩は、そのまま続けます。</div>':'')))
      +'</div>');
    msTray('<button class="btn" onclick="go(\'map\')">更新した地図を見る</button>'
      +'<button class="btn ghost" style="margin-top:9px" onclick="miniBack()">'+(MINI.from==="gate"?"次の一歩を決めに戻る":"ホームに戻る")+'</button>');
  });
}
